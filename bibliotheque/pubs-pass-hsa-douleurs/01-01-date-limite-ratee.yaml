texte: 'Tu tombes sur une bourse parfaite… et tu vois que la date limite est passée depuis hier. 😩

  Ce n''est pas un manque de niveau. C''est un manque d''information.

  Avec le Pass HSA, les bourses et appels à candidatures arrivent chaque semaine, avec le lien pour candidater, avant qu''il soit trop tard.

