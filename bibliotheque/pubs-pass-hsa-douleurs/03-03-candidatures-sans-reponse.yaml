texte: 'Tu envoies candidature sur candidature. Pas de réponse.

  Le problème n''est pas ton CV : personne ne connaît ta recherche.

  Le Pass HSA te rend visible et te met en relation avec des entreprises, des ONG et des institutions qui cherchent des profils comme le tien.

  2 000 FCFA pour toute l''année 👇'
