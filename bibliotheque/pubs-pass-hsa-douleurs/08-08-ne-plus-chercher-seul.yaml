texte: 'Masterant, doctorant, jeune chercheur : arrête de chercher seul.

  Avec le Pass HSA :

  ✅ Toutes les bourses et opportunités, avec les liens

  ✅ Ta recherche publiée et visible

  ✅ Des mises en relation avec entreprises, ONG et institutions

  ✅ Un accompagnement pour vulgariser et valoriser tes résultats

  ✅ Le HSA Magazine complet en PDF

  2 000 FCFA pour toute l''année, paiement mobile money 👇


  ---


  ## Comment les tester avec un petit budget

  1. Une seule campagne « Messages WhatsApp », un seul ensemble de pubs, avec 4 pubs au départ : 01, 03, 06 et 07 (4 douleurs très différentes).

  2. Après 3 jours, on garde les 2 pubs qui ont le coût par conversation le plus bas et on remplace les 2 autres par 02, 04, 05 ou 08.

  3. On coupe toute pub dont la conversation WhatsApp coûte plus de 200 FCFA.'
