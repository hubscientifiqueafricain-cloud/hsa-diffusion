texte: 'Tu reconnais cette slide ? 👀


  ❌ À ÉVITER :

  Un titre. Puis 12 lignes de texte en taille 14. Un tableau de 8 colonnes. Trois logos. Une citation en bas. Le tout en jaune sur fond blanc.


  Résultat : le public lit au lieu de t''écouter. Ou pire, il décroche.


  ✅ À FAIRE :

  • UNE phrase qui dit l''idée de la slide, comme un titre de journal : « Les pertes doublent pendant la saison des pluies »

  • UN visuel qui la prouve : un graphique simple, une photo de terrain

  • De l''espace vide. Beaucoup.

  • Un texte assez grand pour être lu du fond de la salle


  La règle : si on comprend ta slide en 5 secondes, elle est bonne. Sinon, coupe.


  Ta slide n''est pas ton texte. Ton texte, c''est toi. 🎙️


  Enregistre ce post 📌 pour ta prochaine présentation.'
textes:
  linkedin: 'Une diapositive efficace se comprend en cinq secondes.


    À éviter : texte dense, tableaux complexes, éléments décoratifs superflus.


    À privilégier :

    → un titre qui énonce l''idée, comme une phrase complète (« Les pertes doublent pendant la saison des pluies »)

    → un visuel qui la démontre

    → de l''espace vide

    → une taille de texte lisible depuis le fond de la salle


    La diapositive soutient le discours ; elle ne le remplace pas.


    #PriseDeParole #Présentation #Recherche'
