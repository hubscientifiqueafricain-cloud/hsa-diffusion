texte: 'On entend souvent que l''Afrique manque de chercheurs.

  C''est faux. 🙅🏾‍♂️


  Dans nos universités, il y a des masterants qui ont passé des mois sur le terrain. Des doctorants qui connaissent leur sujet mieux que personne. Des jeunes docteurs qui ont des solutions.


  Ce qui manque, ce n''est pas le talent. C''est le MICRO. 🎤


  La scène pour en parler. Les mots pour être compris. Les ponts vers ceux qui ont besoin de ces résultats. Les gens qui t''écoutent.


  Le micro, il ne viendra pas tout seul. Il faut le prendre. Un post, une vidéo, un article, une intervention à la fois.


  Et c''est pour ça que HSA existe : te donner la scène, la méthode et la communauté.


  Tague en commentaire un chercheur ou une chercheuse qui mérite d''être entendu(e). 👇'
textes:
  linkedin: 'Le continent ne manque pas de chercheurs talentueux. Il manque d''espaces pour qu''ils soient entendus.


    Les compétences existent : enquêtes de terrain approfondies, expertises sectorielles, solutions concrètes. Ce qui fait défaut, ce sont les scènes, les formats accessibles et les passerelles vers les utilisateurs de la recherche.


    Le Hub Scientifique Africain veut être cet espace : une scène, une méthode et une communauté pour les chercheurs africains.


    Quel chercheur ou quelle chercheuse mériterait selon vous d''être davantage entendu(e) ?


    #RechercheAfricaine #Science #Afrique'
