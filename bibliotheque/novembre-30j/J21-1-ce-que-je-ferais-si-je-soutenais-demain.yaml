texte: 'Si je soutenais mon mémoire demain, voici exactement ce que je ferais dans les 7 jours suivants. 📅


  JOUR 1 : je fête. Vraiment. Tu l''as mérité. 🎉


  JOUR 2 : j''écris mon résultat principal en une phrase simple, que ma maman comprend.


  JOUR 3 : je publie mon post de soutenance. Pas « Heureux d''annoncer… ». Un post qui raconte ce que j''ai découvert.


  JOUR 4 : je mets à jour ma bio sur Facebook et LinkedIn avec le problème que je connais.


  JOUR 5 : je crée mon profil de chercheur en ligne et j''y dépose mon mémoire.


  JOUR 6 : je liste 10 organisations qui travaillent sur mon sujet.


  JOUR 7 : j''envoie un premier message à 3 d''entre elles.


  7 jours. Moins d''une heure par jour. Et ta recherche commence à vivre.


  Enregistre ce post 📌. Et si tu as soutenu il y a longtemps, commence au Jour 2 aujourd''hui.

  👉 Pour savoir quelle voie te correspond, fais la Boussole HSA (lien en commentaire).'
textes:
  linkedin: 'Si je soutenais demain, voici le plan que je suivrais pendant les sept jours suivants :


    1. Célébrer.

    2. Formuler mon résultat principal en une phrase accessible.

    3. Publier un post qui raconte la découverte, pas seulement le diplôme.

    4. Actualiser ma biographie autour du problème que je connais.

    5. Créer un profil de chercheur et y déposer mon travail.

    6. Identifier dix organisations concernées.

    7. Contacter les trois premières.


    Moins d''une heure par jour pendant une semaine.


    #Soutenance #Master #ValorisationDeLaRecherche'
