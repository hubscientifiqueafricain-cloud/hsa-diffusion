texte: '« Ma recherche peut intéresser tout le monde. »

  Si c''est ce que tu penses, tu as un problème. 😬


  Parce que « tout le monde », c''est personne.


  Quand tu parles à tout le monde :

  ❌ ton message est flou

  ❌ personne ne se sent concerné

  ❌ personne ne te contacte


  Quand tu choisis UN public précis :

  ✅ tu utilises ses mots

  ✅ tu parles de SES problèmes

  ✅ il se dit « c''est exactement pour moi »


  Exemple. Ta recherche porte sur la nutrition des enfants.

  Flou : « La nutrition infantile est un enjeu majeur. »

  Précis : « Aux mamans d''enfants de moins de 2 ans à [ville] : voici l''erreur de sevrage que j''ai vue le plus souvent sur le terrain. »


  Tu peux avoir plusieurs publics. Mais un seul à la fois.


  👉 Tu ne sais pas encore quel public choisir ? La Boussole de valorisation HSA t''aide à le trouver : 14 questions, 5 minutes, gratuit. Lien en commentaire.'
textes:
  linkedin: '« Mes travaux peuvent intéresser tout le monde. »


    C''est souvent vrai sur le fond, et presque toujours inefficace en communication. Un message adressé à tous n''est reçu par personne.


    Choisir un public précis permet d''utiliser son vocabulaire, de partir de ses préoccupations et de lui donner une raison claire d''agir.


    Comparez :

    → « La nutrition infantile est un enjeu majeur. »

    → « Aux mères d''enfants de moins de 2 ans à [ville] : voici l''erreur de sevrage la plus fréquente observée sur le terrain. »


    Plusieurs publics sont possibles. Un seul par message.


    La Boussole de valorisation HSA aide à identifier les publics prioritaires de vos travaux (5 minutes, gratuit). Lien en commentaire.


    #CommunicationScientifique #ValorisationDeLaRecherche #Marketing'
