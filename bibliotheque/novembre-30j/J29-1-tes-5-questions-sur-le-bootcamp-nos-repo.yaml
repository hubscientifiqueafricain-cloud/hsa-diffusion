texte: 'Tu hésites pour le bootcamp ? Voici les 5 questions qu''on reçoit le plus, et nos réponses franches. 💬


  ❓ « Je n''ai pas encore soutenu, je peux participer ? »

  Oui. Si tu connais déjà tes résultats principaux, le bootcamp t''aidera même à mieux les présenter le jour de ta soutenance.


  ❓ « Je suis en droit / lettres / sciences sociales. Ça marche pour moi ? »

  Oui. Toutes les disciplines ont des résultats valorisables. La méthode est la même.


  ❓ « Et si je rate une séance ? »

  Chaque séance est enregistrée. Tu la rattrapes en replay.


  ❓ « J''ai besoin d''un ordinateur ? »

  Un smartphone et une connexion suffisent pour suivre. Un ordinateur aide pour certains livrables.


  ❓ « Comment je paie ? »

  Par mobile money, via un lien de paiement sécurisé. Tu reçois ton reçu officiel par e-mail.


  Et si tu suis les 3 jours, que tu rends les exercices et que tu ne reçois pas tes livrables : on te rembourse.


  Une autre question ? Pose-la en commentaire. 👇 Le lien pour réserver est en commentaire.'
textes:
  linkedin: 'Les questions les plus fréquentes sur le Bootcamp de valorisation HSA :


    Peut-on participer avant la soutenance ? Oui, dès lors que les principaux résultats sont connus.

    Toutes les disciplines sont-elles concernées ? Oui, des sciences sociales au droit, des lettres à la santé.

    Et en cas d''absence ? Chaque séance est disponible en replay.

    Faut-il un ordinateur ? Un smartphone suffit pour suivre.

    Comment payer ? Par mobile money, avec reçu officiel.


    Garantie : remboursement si les livrables ne sont pas remis aux participants assidus.


    Lien d''inscription en commentaire.


    #Formation #ValorisationDeLaRecherche #FAQ'
