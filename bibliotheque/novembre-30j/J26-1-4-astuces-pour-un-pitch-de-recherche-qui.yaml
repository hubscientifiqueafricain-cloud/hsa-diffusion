texte: 'Tu as 3 minutes devant un jury, un investisseur ou un partenaire. Voici 4 astuces pour que ton pitch convainque. 🎤


  1. Commence par une personne, pas par ta recherche.

  « Aminata a 28 ans. Chaque mois, elle perd… » Le jury retient les histoires.


  2. Donne UN chiffre fort, pas dix.

  Un chiffre qui fait réagir vaut mieux qu''un tableau entier.


  3. Dis clairement ce que tu demandes.

  Un partenariat ? Un financement ? Un terrain de test ? Si tu ne le dis pas, personne ne le devinera.


  4. Termine par ta phrase d''impact.

  « Si on réussit, [qui] pourra [quoi]. » C''est la dernière chose qu''ils entendent. C''est celle qu''ils retiennent.


  Et entraîne-toi devant quelqu''un qui te pose des questions difficiles.


  C''est exactement ce qu''on fait au Bootcamp de valorisation HSA : tu construis ton Research Impact Pitch, tu es coaché, et tu le présentes au Demo Day à la fin des 3 jours.

  3 jours · 12 livrables · 10 000 FCFA.

  👉 Commente BOOTCAMP.'
textes:
  linkedin: 'Quatre principes pour un pitch de recherche convaincant :


    1. Ouvrir sur une situation humaine plutôt que sur la méthode.

    2. Retenir un chiffre fort plutôt qu''une accumulation de données.

    3. Formuler explicitement la demande : partenariat, financement, terrain.

    4. Conclure sur une phrase d''impact claire.


    Les participants du Bootcamp de valorisation HSA construisent leur Research Impact Pitch, sont coachés, puis le présentent lors du Demo Day. 3 jours en ligne, 10 000 FCFA. Lien en commentaire.


    #Pitch #ValorisationDeLaRecherche #Innovation'
