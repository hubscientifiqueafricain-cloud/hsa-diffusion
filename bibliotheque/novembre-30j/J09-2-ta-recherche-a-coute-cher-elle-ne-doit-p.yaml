texte: 'Fais le calcul. 🧮


  Les frais d''inscription. Le transport pour le terrain. Les impressions. Les données internet. Les nuits blanches. Le soutien de ta famille. Les bourses, parfois l''argent public.


  Ta recherche a coûté cher. À toi, à ta famille, parfois à ton pays.


  Et après tout ça… elle dort sur une étagère ?


  Ce n''est pas seulement dommage pour toi. C''est une perte pour tout le monde. Parce que pendant ce temps, des questions restent sans réponse, alors que la réponse est peut-être dans ton document.


  Valoriser ta recherche, ce n''est pas de la vanité. C''est rendre ce qu''on t''a donné. Et c''est te payer, enfin, pour tout ce que tu as investi.


  Si ce post te parle, partage-le. Quelqu''un de ta promo a besoin de le lire. 🙏🏾'
textes:
  linkedin: 'Une recherche représente un investissement considérable : frais d''études, travail de terrain, temps, soutien familial, parfois bourses et financements publics.


    Lorsqu''elle n''est pas diffusée ni utilisée, cet investissement ne produit qu''une partie de sa valeur.


    Valoriser sa recherche, c''est permettre à cet investissement de bénéficier à d''autres, et permettre au chercheur d''en tirer une juste reconnaissance.


    C''est la conviction qui guide le Hub Scientifique Africain.


    #RechercheAfricaine #ValorisationDeLaRecherche #Impact'
