texte: 'Quelqu''un te demande sur quoi porte ton mémoire.

  Et toi tu réponds : « Alors… dans le cadre de mes travaux, j''ai adopté une approche mixte, quantitative et qualitative… »


  Stop. Tu viens de perdre la personne en face. 😅


  C''est l''erreur que font presque tous les masterants et doctorants : on présente sa recherche par la MÉTHODE, alors que les gens veulent entendre le PROBLÈME.


  Ta méthode, c''est pour ton jury.

  Le problème, c''est pour tout le monde.


  ❌ « J''ai fait une étude sur les déterminants de l''abandon scolaire. »

  ✅ « J''ai cherché à comprendre pourquoi tant de filles quittent l''école en 4e à [ville]. Et j''ai trouvé 3 raisons sur lesquelles on peut agir. »


  Tu sens la différence ? La deuxième phrase donne envie de poser une question. Et une question, c''est le début d''une opportunité.


  👉 Exercice : écris ton sujet en commentaire, en commençant par « J''ai cherché à comprendre pourquoi… ». Je réponds à chacun.


  Abonne-toi à la page : chaque semaine, une astuce pour que ta recherche serve enfin à quelque chose.


  #HSA #ValoriseTaRecherche'
textes:
  linkedin: '« Dans le cadre de mes travaux, j''ai adopté une approche mixte… »


    C''est souvent la première phrase d''un chercheur à qui l''on demande sur quoi il travaille. Et c''est souvent là que la conversation s''arrête.


    L''erreur est fréquente : présenter sa recherche par sa méthode, alors que votre interlocuteur (un recruteur, un bailleur, une ONG) veut d''abord savoir quel problème vous éclairez.


    La méthode rassure le jury. Le problème intéresse tout le monde.


    Comparez :

    → « J''ai mené une étude sur les déterminants de l''abandon scolaire. »

    → « J''ai cherché à comprendre pourquoi tant de filles quittent l''école en 4e à [ville], et j''ai identifié 3 causes sur lesquelles on peut agir. »


    La seconde version ouvre une discussion. Et chaque discussion est une occasion de faire exister vos résultats hors de l''université.


    Votre sujet, en une phrase qui commence par « J''ai cherché à comprendre pourquoi… » ? Partagez-la en commentaire.


    #ValorisationDeLaRecherche #Doctorat #RechercheAfricaine'
