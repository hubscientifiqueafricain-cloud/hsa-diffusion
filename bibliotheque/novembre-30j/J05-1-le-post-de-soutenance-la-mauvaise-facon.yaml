texte: 'Tu viens de soutenir. Bravo ! 🎓

  Maintenant, regarde bien ces deux posts.


  ❌ À ÉVITER :

  « Heureux d''annoncer que j''ai soutenu mon mémoire avec la mention Très bien. Merci à mon directeur, à ma famille et à tous ceux qui m''ont soutenu. »


  C''est gentil. Tes proches vont liker. Et dans 2 jours, tout le monde aura oublié.


  ✅ À FAIRE :

  « Pendant 8 mois, j''ai suivi [qui] à [où].

  Je voulais comprendre pourquoi [problème].

  Voici ce que j''ai découvert : [ton résultat principal, en une phrase simple].

  Ce que ça change : [à quoi ça sert].

  Hier, je l''ai défendu devant mon jury. Et aujourd''hui, je veux que ça serve au-delà de l''université. Si vous travaillez sur ce sujet, écrivez-moi. »


  Le premier annonce une fête. Le second annonce un expert.

  Et devine lequel des deux reçoit des messages d''organisations ? 😉


  Tu as déjà fait ton post de soutenance ? Refais-le avec le modèle ✅. Et si tu soutiens bientôt, enregistre ce post.'
textes:
  linkedin: 'Deux façons d''annoncer sa soutenance sur LinkedIn.


    La plus courante :

    « Heureux d''annoncer que j''ai soutenu mon mémoire avec la mention Très bien. Merci à mon directeur et à ma famille. »


    Celle qui crée des opportunités :

    « Pendant 8 mois, j''ai étudié [sujet] auprès de [public] à [lieu].

    Je cherchais à comprendre [problème].

    Principal résultat : [résultat en une phrase].

    Ce que cela peut changer : [utilité].

    Je l''ai défendu hier devant mon jury. Si vous travaillez sur cette question, échangeons. »


    La première célèbre un diplôme. La seconde présente une expertise et invite à la collaboration.


    Le jour de la soutenance est le moment où votre réseau vous regarde le plus. C''est le meilleur moment pour montrer ce que vous savez.


    #Soutenance #Doctorat #PersonalBranding'
