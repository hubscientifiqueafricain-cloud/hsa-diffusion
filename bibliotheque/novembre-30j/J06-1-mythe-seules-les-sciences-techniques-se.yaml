texte: 'MYTHE : « La valorisation, c''est pour les ingénieurs et les médecins. Moi je suis en lettres / en droit / en sociologie… »


  RÉALITÉ : toutes les disciplines ont des résultats qui peuvent servir. TOUTES. 💡


  👉 Droit : un guide simple des droits des locataires, un atelier pour une association de commerçants.

  👉 Sociologie : une enquête pour une ONG avant son projet.

  👉 Lettres et langues : de la traduction, des contenus éducatifs en langues locales.

  👉 Histoire : des contenus pour le tourisme, les musées, les médias.

  👉 Économie : une étude de marché pour une PME.

  👉 Géographie : de la cartographie pour une commune.

  👉 Sciences de l''éducation : des formations pour enseignants.


  Ce qui change d''une discipline à l''autre, ce n''est pas la possibilité de valoriser. C''est la FORME.


  Écris ta discipline en commentaire. Je te réponds avec une idée de valorisation. 👇'
textes:
  linkedin: 'Une idée reçue : la valorisation de la recherche serait réservée aux sciences techniques, à la santé ou à l''ingénierie.


    En réalité, chaque discipline produit des connaissances utiles à des acteurs précis :

    → le droit, pour des guides pratiques et des formations

    → la sociologie, pour des études préalables aux projets

    → les lettres et langues, pour la traduction et les contenus éducatifs

    → l''histoire, pour le patrimoine, le tourisme et les médias

    → l''économie, pour les études de marché

    → la géographie, pour l''aménagement et la cartographie

    → les sciences de l''éducation, pour la formation des enseignants


    Ce qui varie, c''est la forme de la valorisation, pas sa possibilité.


    Dans quelle discipline travaillez-vous ?


    #SciencesSociales #ValorisationDeLaRecherche #Humanités'
