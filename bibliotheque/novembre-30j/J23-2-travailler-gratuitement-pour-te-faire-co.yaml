texte: '« Je vais le faire gratuitement. Comme ça, ils vont me connaître. » 🙃


  Une ONG te demande une petite enquête. Une entreprise veut ton avis d''expert. Une structure veut que tu animes un atelier.

  Et toi, tu dis : « Pas de souci, c''est gratuit. »


  Voilà ce qui se passe ensuite :

  ❌ on ne te prend pas au sérieux (ce qui est gratuit n''a pas de valeur)

  ❌ on te redemande, toujours gratuitement

  ❌ tu t''épuises et tu finis par abandonner


  Attention : aider gratuitement, ce n''est pas interdit. Une première intervention offerte, ça peut être un bon investissement. Mais à 3 conditions :

  1. c''est TOI qui le décides, à l''avance

  2. tu annonces la valeur : « Normalement, ce diagnostic coûte [X] FCFA. Je vous l''offre cette fois. »

  3. tu dis ce qui vient après : « Pour la suite, voici mon offre. »


  Ta recherche t''a coûté des mois de travail. Elle a un prix.


  Le problème, c''est que personne ne t''a appris à le fixer. Au Bootcamp de valorisation HSA, le Jour 3 est entièrement consacré à ça : ton offre, tes clients, ton prix, ton mini business plan.

  3 jours en ligne · 12 livrables · 10 000 FCFA.


  Commente BOOTCAMP et je t''envoie les détails. 💬'
textes:
  linkedin: 'Une erreur coûteuse chez les jeunes experts : accepter systématiquement de travailler gratuitement « pour se faire connaître ».


    Ce qui est gratuit est rarement perçu comme précieux. Les sollicitations gratuites se répètent, et la motivation s''épuise.


    Une intervention offerte peut être un investissement pertinent, à trois conditions :

    → la décider à l''avance

    → en annoncer la valeur réelle (« ce diagnostic est habituellement facturé X »)

    → présenter clairement l''offre qui suit


    Fixer un prix ne s''improvise pas. C''est l''objet du troisième jour du Bootcamp de valorisation HSA : offre, clients, tarification, mini business plan. 3 jours en ligne, 12 livrables, 10 000 FCFA. Lien en commentaire.


    #Consulting #ValorisationDeLaRecherche #Entrepreneuriat'
