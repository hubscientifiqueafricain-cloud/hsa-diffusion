texte: 'Tu as 2 minutes pour présenter ta recherche. À un jury, un recruteur, un journaliste. Tu fais comment ?

  Utilise la règle 1-3-1. 👇


  1 PROBLÈME

  Commence par le problème. Concret, humain, local.

  « Chaque saison, les producteurs de mangue de [région] perdent une partie de leur récolte. »


  3 RÉSULTATS

  Pas 10. Trois. Ceux qui comptent le plus.

  « J''ai trouvé que… », « J''ai aussi observé que… », « Et surtout… »


  1 ACTION

  Termine par ce que ça change, ou ce que tu proposes.

  « Avec une simple technique de séchage, ces pertes peuvent baisser. Je cherche une coopérative pour la tester. »


  C''est tout. Facile à retenir pour toi. Facile à retenir pour eux.


  Essaie : écris ton 1-3-1 en commentaire. Les meilleurs, je les partage en story. ⭐'
textes:
  linkedin: 'Comment présenter une recherche en deux minutes, devant un jury, un recruteur ou un journaliste ? La règle 1-3-1.


    1 problème : concret, situé, humain.

    3 résultats : les plus importants, et seulement eux.

    1 action : ce que ces résultats permettent, ou ce que vous proposez.


    Cette structure est facile à mémoriser pour l''orateur, et facile à retenir pour l''auditoire.


    Quel serait votre 1-3-1 ?


    #PriseDeParole #Pitch #Doctorat'
