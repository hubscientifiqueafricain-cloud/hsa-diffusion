texte: '[Année]. Je soutiens mon [mémoire / ma thèse] sur [sujet].

  [Nombre] mois de travail. Des nuits entières. [Un détail vrai : le terrain, les trajets, l''argent dépensé].


  Le jury me félicite. Et quelques semaines plus tard…

  [Ce qui s''est passé : rien, personne ne l''a lu, tu cherchais du travail, tu as vu une organisation payer un cabinet étranger pour une étude sur ton propre sujet…]


  Ce jour-là, j''ai compris une chose : le problème n''était pas ma recherche. Le problème, c''est que personne ne savait qu''elle existait. Et moi, je ne savais pas comment la faire sortir.


  Autour de moi, c''était pareil. [Un camarade, un exemple vrai.]

  Des milliers de jeunes chercheurs africains, du talent partout, et presque aucun pont entre nos universités et ceux qui ont besoin de nos résultats.


  C''est pour ça que j''ai créé le Hub Scientifique Africain.

  Pour que ta recherche produise de l''impact, du revenu et de la notoriété. Pas seulement une note.


  Si tu te reconnais dans cette histoire, écris « MOI AUSSI » en commentaire. Je lis tout. 🤝🏾'
textes:
  linkedin: '[Année]. Je soutiens mon [mémoire / ma thèse] sur [sujet], après [nombre] mois de travail.


    Quelques semaines plus tard, [ce qui s''est passé].


    J''ai alors compris que le problème n''était pas la qualité de la recherche, mais l''absence de pont entre l''université et ceux qui ont besoin de ses résultats.


    Autour de moi, le constat était le même. Beaucoup de talents, beaucoup de travaux de qualité, et très peu de circulation de ces connaissances vers les organisations, les décideurs et le grand public.


    C''est l''origine du Hub Scientifique Africain : un espace pour produire, vulgariser et valoriser la recherche africaine, afin qu''elle génère de l''impact, du revenu et de la notoriété pour ceux qui la font.


    Vous avez vécu une situation similaire ? Je serais heureux d''en discuter.


    #RechercheAfricaine #Entrepreneuriat #HSA'
