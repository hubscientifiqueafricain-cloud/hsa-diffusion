texte: 'On m''a dit : « 2 000 FCFA pour un an ? Tu es fou. Mets au moins 10 000. » 😅

  Voici pourquoi j''ai refusé.


  Quand j''étais étudiant, chaque franc comptait. Le transport, les photocopies, la connexion. [Ajoute un souvenir vrai.]


  Je ne voulais pas qu''un jeune chercheur soit exclu de HSA parce qu''il n''a pas 10 000 FCFA ce mois-ci.


  Alors on a choisi un prix que presque tout le monde peut payer. Le prix d''un plat au maquis. Moins de 6 FCFA par jour.


  Mais attention : petit prix ne veut pas dire petit contenu. Avec le Pass, pendant 12 mois :

  ✅ le programme certifiant « Initiation à la valorisation » (5 modules + attestation)

  ✅ le guide « 10 façons de gagner de l''argent avec ton mémoire ou ta thèse »

  ✅ ton profil de chercheur visible par les entreprises, ONG et institutions

  ✅ les opportunités de la semaine : financements, prix, concours

  ✅ le groupe d''entraide et les lives mensuels

  ✅ la priorité sur les places du Bootcamp


  Si 2 000 FCFA te séparent de tout ça, la décision est simple. 😉

  👉 Lien en commentaire. Paiement par mobile money.'
textes:
  linkedin: 'Pourquoi le Pass Valorisation HSA coûte-t-il 2 000 FCFA par an ?


    Parce que nous ne voulions pas que le prix soit un obstacle pour les jeunes chercheurs, dont beaucoup financent eux-mêmes leurs études.


    Ce tarif volontairement accessible donne accès, pendant douze mois, à un programme certifiant de cinq modules, au guide « 10 façons de gagner de l''argent avec son mémoire ou sa thèse », à un profil de chercheur visible par les organisations, à une veille hebdomadaire des opportunités, à un groupe d''entraide et à des lives mensuels.


    Lien en commentaire.


    #Accessibilité #RechercheAfricaine #JeunesChercheurs'
