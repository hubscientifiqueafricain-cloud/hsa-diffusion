texte: '« Et si je paie et que je ne reçois rien ? » 😟

  C''est la peur numéro 1 quand on s''inscrit à une formation en ligne. Alors on a décidé de prendre le risque à ta place.


  Voici la garantie livrables du Bootcamp de valorisation HSA :

  1️⃣ Tu suis les 3 jours, en direct ou en replay.

  2️⃣ Tu rends les exercices.

  3️⃣ Si tu ne reçois pas tes livrables, on te rembourse.


  C''est simple. Si on ne tient pas notre promesse, tu ne paies pas.


  Et notre promesse, c''est 12 livrables concrets :

  ✅ ton pitch de 60 secondes et ta bio

  ✅ ton article publié dans le magazine HSA

  ✅ ta matrice des résultats et ton content pack

  ✅ ton offre, ton prix, ton mini business plan

  ✅ ton Research Impact Pitch au Demo Day

  ✅ ton certificat HSA


  10 000 FCFA. Paiement par mobile money. Reçu officiel par e-mail.

  Le seul risque qui reste, c''est de laisser ta recherche où elle est.


  Commente BOOTCAMP et je te réserve ta place. 🚀'
textes:
  linkedin: 'Pour lever le principal frein à l''inscription, le Bootcamp de valorisation HSA est assorti d''une garantie livrables.


    Les participants qui suivent les trois jours (en direct ou en replay) et rendent leurs exercices, sans recevoir leurs livrables, sont remboursés.


    Ces livrables sont au nombre de douze : pitch, biographie, article publié dans le magazine HSA, matrice des résultats valorisables, content pack, Business Model Canvas, mini business plan, Research Impact Pitch, certificat, entre autres.


    10 000 FCFA, paiement par mobile money. Lien en commentaire.


    #Formation #ValorisationDeLaRecherche #Garantie'
