texte: 'Change UNE phrase dans ta tête, et beaucoup de choses changent.


  Avant : « Je suis un diplômé en géographie qui cherche du travail. »

  Après : « Je connais mieux que presque personne les inondations à Abobo. »


  Dans la première phrase, tu attends qu''on te choisisse.

  Dans la seconde, tu as quelque chose à proposer.


  Sur ton sujet précis, tu as passé plus d''heures que la plupart des gens qui prendront des décisions dessus. Tu as lu, mesuré, interrogé, comparé.

  Ça a un nom : une EXPERTISE. 💪🏾


  Elle n''est pas encore reconnue ? C''est normal. Une expertise se construit en la montrant.


  Alors à partir d''aujourd''hui, quand on te demande ce que tu fais, ne dis plus ton diplôme. Dis le problème que tu connais.


  Dis-moi en commentaire : tu es l''expert de quel problème ? 👇'
textes:
  linkedin: 'Une distinction qui change la manière de se présenter :


    « Je suis diplômé en géographie et je recherche un poste. »

    « Je connais en profondeur les dynamiques d''inondation à Abobo. »


    La première phrase place la personne en attente d''être choisie. La seconde la place en position d''apporter une compétence.


    Sur un sujet précis, un jeune chercheur a souvent passé plus de temps que la plupart des décideurs qui en ont la charge. Il a lu, mesuré, interrogé, comparé. C''est une expertise, même si elle n''est pas encore reconnue.


    Et une expertise se fait reconnaître en se montrant : par des publications accessibles, des interventions, des collaborations.


    De quel problème êtes-vous l''expert ?


    #JeunesChercheurs #Expertise #Carrière'
