texte: 'Tous tes résultats de recherche n''ont pas le même rôle. Certains vont changer des vies. D''autres vont te rapporter de l''argent. D''autres vont te faire connaître.

  Voici comment les trier : la matrice I.R.N. 🧭


  Prends chaque résultat de ton mémoire et pose-lui 3 questions :


  IMPACT 🌍

  Est-ce qu''il peut améliorer la vie de quelqu''un ? Santé, revenu, éducation, environnement ?

  → Valorisation : atelier, note aux décideurs, partenariat avec une ONG.


  REVENU 💰

  Est-ce que quelqu''un serait prêt à PAYER pour en profiter ?

  → Valorisation : étude, prestation, formation, produit.


  NOTORIÉTÉ ⭐

  Est-ce qu''il est surprenant, nouveau, facile à raconter ?

  → Valorisation : post, vidéo, article, interview, conférence.


  Un même résultat peut cocher 2 ou 3 cases. Ceux-là, ce sont tes pépites. 💎


  C''est ce que HSA défend : une recherche qui produit de l''impact, du revenu ET de la notoriété.


  👉 Pour savoir sur quelle case tu es le plus fort, fais la Boussole HSA (5 min, gratuit). Lien en commentaire.'
textes:
  linkedin: 'Tous les résultats d''une recherche ne se valorisent pas de la même façon. Une grille simple permet de les classer : la matrice Impact, Revenu, Notoriété.


    Impact : le résultat peut-il améliorer une situation (santé, éducation, revenu, environnement) ? Valorisation par l''action publique, les ONG, la formation.


    Revenu : un acteur serait-il prêt à payer pour en bénéficier ? Valorisation par la prestation, l''étude, le produit.


    Notoriété : le résultat est-il nouveau, surprenant, racontable ? Valorisation par les médias, les publications, les conférences.


    Les résultats qui cochent plusieurs cases méritent la priorité.


    La Boussole de valorisation HSA identifie vos points forts sur ces dimensions (5 minutes, gratuit). Lien en commentaire.


    #ValorisationDeLaRecherche #Impact #Stratégie'
