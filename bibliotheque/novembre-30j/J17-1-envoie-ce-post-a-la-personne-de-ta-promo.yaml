texte: 'Envoie ce post à la personne de ta promo qui… 👇


  ☑️ a passé 6 mois sur le terrain et n''en parle jamais

  ☑️ a les meilleures notes mais ne sait pas quoi faire après

  ☑️ dit « ma recherche n''intéresse personne »

  ☑️ a créé un questionnaire génial qui dort sur son ordinateur

  ☑️ soutient bientôt et stresse déjà pour la suite


  Cette personne a besoin d''entendre une chose : sa recherche peut produire de l''impact, du revenu et de la notoriété. Elle ne le sait juste pas encore.


  Tague 2 camarades en commentaire. Tu leur rends un vrai service. 🤝🏾


  Et abonne-toi à la page pour recevoir chaque semaine des conseils pour valoriser ta recherche.'
textes:
  linkedin: 'Nous connaissons tous, dans nos promotions ou nos laboratoires, un jeune chercheur qui :


    → a mené un travail de terrain remarquable dont personne n''a entendu parler

    → obtient d''excellents résultats mais ne sait pas comment les faire valoir

    → pense que sa recherche n''intéresse personne en dehors de son jury

    → a conçu un outil ou une méthode qui pourrait servir à d''autres


    Si un nom vous vient à l''esprit, mentionnez cette personne en commentaire ou transmettez-lui ce post. Au Hub Scientifique Africain, nous partageons chaque semaine des méthodes concrètes pour valoriser la recherche.


    #RechercheAfricaine #Mentorat #ValorisationDeLaRecherche'
