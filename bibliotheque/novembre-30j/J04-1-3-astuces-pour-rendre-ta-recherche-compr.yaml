texte: '3 astuces pour rendre ta recherche compréhensible… sans la trahir. 🧠


  1. Transforme tes pourcentages en images.

  « 38 % des ménages » ➡️ « près de 4 familles sur 10 ».

  Le chiffre est le même. Mais le second, on le voit.


  2. Utilise une comparaison du quotidien.

  La résistance aux antibiotiques ? « C''est comme un voleur qui apprend tes codes. Chaque fois que tu prends mal un antibiotique, tu lui donnes un indice. »


  3. Raconte UNE personne.

  « Awa, 34 ans, vend au marché depuis 12 ans. Chaque soir, elle jette une partie de ses légumes… »

  Une histoire vaut 10 tableaux. (Change le prénom pour protéger l''anonymat.)


  Vulgariser, ce n''est pas simplifier à l''excès. C''est traduire.

  Ta rigueur reste la même. Seule la langue change.


  Enregistre ce post 📌 et envoie-le à ce camarade qui écrit des phrases de 6 lignes. 😄'
textes:
  linkedin: 'Vulgariser sans trahir : 3 techniques simples.


    1. Traduire les pourcentages en proportions concrètes. « 38 % des ménages » devient « près de 4 familles sur 10 ». La donnée est identique ; elle devient visible.


    2. Recourir à l''analogie. La résistance aux antibiotiques peut s''expliquer comme un cambrioleur qui apprend progressivement vos codes à chaque mauvaise utilisation du traitement.


    3. Incarner le résultat. Le parcours d''une personne (anonymisée) fait comprendre en quelques lignes ce qu''un tableau peine à montrer.


    Vulgariser n''est pas appauvrir. C''est traduire : la rigueur reste, le registre change.


    Quelle technique utilisez-vous pour présenter vos travaux à un public non spécialiste ?


    #Vulgarisation #CommunicationScientifique #Recherche'
