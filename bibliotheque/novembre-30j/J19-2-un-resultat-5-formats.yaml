texte: 'Tu n''as pas besoin de 50 idées pour publier régulièrement. Il t''en faut UNE. Et 5 formats. ♻️


  Prends UN résultat de ta recherche. Puis décline-le :


  1️⃣ LE POST : le résultat raconté en 10 lignes, avec une accroche.


  2️⃣ LE CARROUSEL : 5 images. Le problème, ce que tu as trouvé, 3 chiffres clés, ce que ça change, une question.


  3️⃣ LA VIDÉO : 60 secondes face caméra pour l''expliquer à voix haute.


  4️⃣ L''INFOGRAPHIE : une seule image qui résume tout, faite pour être partagée.


  5️⃣ L''ARTICLE : 800 mots de vulgarisation, publié sur un blog ou un magazine.


  1 résultat × 5 formats = 5 publications. Avec 4 résultats, tu as un mois de contenu. 📅


  Au Bootcamp de valorisation HSA, le Jour 2 te fait repartir avec ton content pack (visuels et textes sur ta recherche) et ton article publié dans le magazine HSA.

  👉 Commente CONTENU pour avoir les détails.'
textes:
  linkedin: 'Publier régulièrement sur sa recherche ne demande pas une idée nouvelle chaque semaine. Une méthode : un résultat, cinq formats.


    → Un post qui raconte le résultat

    → Un carrousel qui le décompose

    → Une vidéo courte qui l''explique

    → Une infographie qui le résume

    → Un article de vulgarisation qui le développe


    Quatre résultats suffisent pour un mois de publications.


    C''est l''approche du deuxième jour du Bootcamp de valorisation HSA, dont les participants repartent avec un content pack et un article publié dans le magazine HSA. Lien en commentaire.


    #ContentMarketing #CommunicationScientifique #Vulgarisation'
