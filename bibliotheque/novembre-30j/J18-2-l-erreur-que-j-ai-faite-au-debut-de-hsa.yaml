texte: 'Je vais te raconter une erreur que j''ai faite au début de HSA.


  Au départ, je pensais que les jeunes chercheurs avaient surtout besoin de visibilité. Alors on a construit des outils pour publier, pour vulgariser, pour se montrer.


  Et puis j''ai écouté. Vraiment écouté. Des masterants, des doctorants, des jeunes docteurs.

  Et presque tous me disaient la même chose :

  « La visibilité, c''est bien. Mais moi, je veux que ma recherche me fasse VIVRE. »


  J''avais construit ce que JE croyais utile. Pas ce qu''ILS demandaient. 😬


  Alors on a changé. Aujourd''hui, HSA ne vend pas de la vulgarisation. On t''aide à construire une recherche qui produit de l''impact, du revenu ET de la notoriété. Les trois ensemble.


  Leçon pour toi aussi : avant de valoriser ta recherche, écoute ceux à qui elle doit servir. Ils te diront ce qui a de la valeur pour eux.


  Et toi, qu''est-ce que tu attends le plus de ta recherche ?

  1️⃣ l''impact

  2️⃣ le revenu

  3️⃣ la notoriété

  Réponds avec un chiffre. Je lis tout. 👇'
textes:
  linkedin: 'Une erreur de fondateur, partagée en toute transparence.


    À la création du Hub Scientifique Africain, nous pensions que le principal besoin des jeunes chercheurs était la visibilité. Nous avons donc d''abord construit des outils de publication et de vulgarisation.


    En écoutant attentivement masterants, doctorants et jeunes docteurs, un autre besoin est apparu, exprimé presque toujours dans les mêmes termes : « La visibilité, c''est bien. Mais je veux que ma recherche me fasse vivre. »


    Nous avions construit ce qui nous semblait utile, pas ce qui était demandé.


    Nous avons donc repositionné HSA : accompagner une recherche qui produit de l''impact, du revenu et de la notoriété.


    La leçon vaut aussi pour la valorisation de la recherche : partir du besoin de ceux à qui elle doit servir.


    Qu''attendez-vous en priorité de votre recherche : l''impact, le revenu ou la notoriété ?


    #Entrepreneuriat #RechercheAfricaine #Leçons'
