texte: 'Depuis quelques semaines, tu as appris ici à :

  ✔️ présenter ta recherche en une phrase

  ✔️ repérer tes résultats valorisables

  ✔️ trouver qui a besoin de toi avec les 3Q

  ✔️ écrire à une organisation


  Mais entre savoir et FAIRE, il y a un fossé. Et seul, on remet toujours à demain. 😮‍💨


  Alors on le fait ensemble.


  🎓 BOOTCAMP DE VALORISATION HSA

  3 jours en direct, 100 % en ligne, depuis ton téléphone.


  JOUR 1 · Identité et visibilité : ton pitch de 60 secondes, ta bio, ta présence en ligne.

  JOUR 2 · Vulgariser et valoriser : ton article publié dans le magazine HSA, ton content pack, ta matrice des résultats valorisables.

  JOUR 3 · Monétiser et convaincre : ton offre, ton prix, ton mini business plan, ton pitch au Demo Day.


  Tu repars avec 12 livrables prêts à utiliser et un certificat HSA.

  Valeur des livrables : 205 000 FCFA.

  Ton prix : 10 000 FCFA. Paiement par mobile money.


  Prochaine cohorte : [date]. [nombre] places seulement.


  👉 Le lien pour réserver est en commentaire. Ou écris BOOTCAMP et je t''aide à t''inscrire.'
textes:
  linkedin: 'Le Bootcamp de valorisation HSA ouvre une nouvelle cohorte.


    Le principe : transformer un mémoire ou une thèse en revenus et en impact, en trois jours, avec des livrables concrets.


    Jour 1 · Identité et visibilité : pitch de 60 secondes, bio professionnelle, présence numérique.

    Jour 2 · Vulgariser et valoriser : article publié dans le magazine HSA, contenus prêts à diffuser, matrice des résultats valorisables, Research Valorization Canvas.

    Jour 3 · Monétiser et convaincre : Business Model Canvas, mini business plan, Research Impact Pitch présenté lors du Demo Day.


    12 livrables, un certificat HSA, 100 % en ligne.

    10 000 FCFA (valeur estimée des livrables : 205 000 FCFA).


    Prochaine cohorte : [date], [nombre] places. Inscription par le lien en commentaire.


    Si vous encadrez des étudiants de master ou de doctorat, n''hésitez pas à leur transmettre.


    #ValorisationDeLaRecherche #Formation #Doctorat'
