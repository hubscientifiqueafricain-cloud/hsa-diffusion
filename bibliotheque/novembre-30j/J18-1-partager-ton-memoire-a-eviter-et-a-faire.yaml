texte: 'Tu veux partager ton mémoire. Bonne idée ! Mais pas comme ça. 🙈


  ❌ À ÉVITER :

  Envoyer le PDF de 120 pages dans le groupe WhatsApp de la promo, avec « Mon mémoire pour ceux que ça intéresse 🙏 ».


  Personne ne va l''ouvrir. Et ceux qui l''ouvrent ne dépasseront pas la page 3.


  ✅ À FAIRE :

  1. Écris un résumé de 5 lignes, en langage simple : le problème, ce que tu as trouvé, à qui ça sert.

  2. Ajoute UNE image : un graphique clé, une photo de terrain.

  3. Mets ton mémoire en ligne sur ton profil de chercheur, avec ton nom et tes mots-clés.

  4. Partage le résumé + l''image + le lien. Pas le PDF.


  Le PDF, c''est pour ceux qui veulent aller plus loin. Le résumé, c''est pour donner envie.


  👉 Ton espace HSA te permet de déposer ton mémoire ou ta thèse, avec ton profil de chercheur visible par les organisations. Le lien est en commentaire.'
textes:
  linkedin: 'Diffuser un mémoire en envoyant un PDF de 120 pages produit rarement l''effet attendu.


    Une diffusion plus efficace :

    1. Un résumé de quelques lignes, accessible.

    2. Un visuel clé.

    3. Le document complet hébergé sur un profil de chercheur public.

    4. Le partage du résumé et du lien, plutôt que du fichier.


    Le document complet sert ceux qui veulent approfondir ; le résumé sert à donner envie.


    Le Hub Scientifique Africain permet de déposer mémoires, thèses et articles sur un profil visible par les organisations. Lien en commentaire.


    #ScienceOuverte #Diffusion #RechercheAfricaine'
