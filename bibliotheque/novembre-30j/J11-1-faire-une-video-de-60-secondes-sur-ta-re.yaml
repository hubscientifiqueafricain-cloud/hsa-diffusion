texte: 'Tu n''as pas de caméra, pas de micro, pas de monteur ? Pas grave. Ton téléphone suffit. 📱

  Voici comment faire une vidéo de 60 secondes sur ta recherche.


  1️⃣ Le lieu : face à une fenêtre (la lumière du jour, c''est gratuit et c''est la meilleure). Pas de bruit derrière toi.


  2️⃣ Le cadrage : téléphone à hauteur des yeux, posé sur une pile de livres. Format vertical.


  3️⃣ Le script en 4 temps :

  • 0 à 5 s : une question qui accroche. « Tu savais que… ? »

  • 5 à 35 s : ce que tu as trouvé, en 2 ou 3 phrases simples

  • 35 à 50 s : pourquoi ça compte, pour qui

  • 50 à 60 s : « Abonne-toi pour la suite » ou « Écris-moi si ça te concerne »


  4️⃣ Le tournage : ne lis pas. Garde 3 mots-clés sur un papier et parle comme à un ami. Fais 3 prises, garde la meilleure.


  5️⃣ Le montage : coupe les silences et ajoute des sous-titres (CapCut le fait automatiquement). La plupart des gens regardent sans le son.


  Ta première vidéo ne sera pas parfaite. La 10e sera bien meilleure. Mais il faut faire la première. 🎬


  Tu publies la tienne ? Tague-nous, on la partage.'
textes:
  linkedin: 'Une vidéo courte reste l''un des formats les plus efficaces pour faire connaître une recherche. Un smartphone suffit.


    → Lumière : face à une fenêtre, dans un endroit calme.

    → Cadrage : téléphone stable, à hauteur des yeux.

    → Structure en 60 secondes : une question d''accroche (5 s), le résultat principal (30 s), son utilité (15 s), un appel à l''action (10 s).

    → Tournage : parler à partir de mots-clés plutôt que lire un texte.

    → Montage : couper les silences et ajouter des sous-titres, car beaucoup de vidéos sont regardées sans le son.


    La première vidéo est rarement parfaite. Elle reste indispensable.


    #CommunicationScientifique #Vidéo #Vulgarisation'
