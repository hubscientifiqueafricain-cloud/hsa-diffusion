texte: 'Tu écris à une ONG ou à une entreprise… et on ne te répond jamais ? Regarde ton message. 👀


  ❌ À ÉVITER :

  « Bonjour Monsieur, je suis titulaire d''un Master en sociologie et je suis à la recherche d''un emploi. Vous trouverez ci-joint mon CV. Dans l''attente d''une suite favorable… »


  ✅ À FAIRE :

  « Bonjour Madame [nom], j''ai vu que votre ONG lance un projet sur l''accès à l''eau à [quartier]. J''ai consacré mon mémoire à ce sujet, avec une enquête auprès des ménages du quartier. Trois de mes résultats peuvent vous aider à cibler vos actions. Puis-je vous les présenter en 15 minutes cette semaine ? »


  La différence ?

  Le premier parle de TOI. Le second parle d''EUX.

  Le premier demande. Le second apporte.


  Mais pour écrire le bon message, il faut savoir À QUI l''écrire, et au bon moment.


  C''est pour ça qu''on a créé le Pass Valorisation HSA :

  ✅ chaque semaine, les financements, prix, concours et opportunités

  ✅ ton profil de chercheur visible par les entreprises, ONG et institutions

  ✅ le programme certifiant « Initiation à la valorisation » en 5 modules

  ✅ le groupe d''entraide et les lives mensuels


  2 000 FCFA pour toute l''année. Moins de 6 FCFA par jour.

  👉 Le lien est en commentaire. Paiement par mobile money.'
textes:
  linkedin: 'Pourquoi tant de candidatures spontanées restent sans réponse ?


    Message type n°1 :

    « Je suis titulaire d''un Master en sociologie et à la recherche d''un emploi. Vous trouverez ci-joint mon CV. »


    Message type n°2 :

    « J''ai vu que votre organisation lance un projet sur l''accès à l''eau à [quartier]. Mon mémoire porte sur ce sujet, avec une enquête de terrain auprès des ménages. Trois de mes résultats peuvent vous aider à cibler vos actions. Puis-je vous les présenter en 15 minutes ? »


    Le premier parle du candidat. Le second parle du besoin de l''organisation, et apporte quelque chose avant de demander.


    Pour écrire ce second message, encore faut-il savoir quelles organisations lancent quels projets. C''est l''un des services du Pass Valorisation HSA : les opportunités, financements et appels de la semaine, un profil visible par les organisations et un programme certifiant de 5 modules, pour 2 000 FCFA par an. Lien en commentaire.


    #ValorisationDeLaRecherche #Emploi #JeunesDiplômés'
