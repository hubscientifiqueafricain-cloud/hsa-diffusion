texte: 'On m''a déjà demandé : « HSA, c''est une arnaque ? » 🤔

  Franchement, je comprends la question. Il y a trop de promesses en ligne. Alors je te réponds sans détour.


  Qui on est : le Hub Scientifique Africain, une plateforme pour produire, vulgariser et valoriser la recherche africaine. Tu peux voir le site, les profils, les publications : hubscientifiqueafricain.com.


  Ce qu''on vend, et à quel prix :

  • le Pass Valorisation : 2 000 FCFA pour un an

  • le Bootcamp de valorisation : 10 000 FCFA pour 3 jours en direct


  Ce qu''on ne promet pas : de l''argent facile. Valoriser ta recherche demande du travail. On te donne la méthode, les outils et l''accompagnement. Le travail, c''est toi.


  Ce qu''on garantit : au bootcamp, si tu suis les 3 jours, que tu rends les exercices et que tu ne reçois pas tes livrables, on te rembourse.


  Comment tu paies : mobile money, avec un reçu officiel par e-mail.


  Tu as encore un doute ? Pose ta question en commentaire ou écris-nous sur WhatsApp. Je préfère une question franche à une hésitation silencieuse. 🤝🏾'
textes:
  linkedin: '« Est-ce une arnaque ? » C''est une question légitime face à toute offre en ligne. Voici une réponse transparente.


    Le Hub Scientifique Africain est une plateforme dédiée à la production, à la vulgarisation et à la valorisation de la recherche africaine (hubscientifiqueafricain.com).


    Nos offres : le Pass Valorisation (2 000 FCFA par an) et le Bootcamp de valorisation (10 000 FCFA, 3 jours en direct).


    Ce que nous ne promettons pas : un revenu sans effort. Ce que nous garantissons : le remboursement des participants au bootcamp qui suivent les trois jours, rendent les exercices et ne reçoivent pas leurs livrables.


    Paiement par mobile money, reçu officiel. Vos questions sont les bienvenues en commentaire.


    #Transparence #RechercheAfricaine #Formation'
