texte: 'On me pose souvent cette question : « Est-ce que je dois faire un doctorat ? » 🎓

  Voici ce que je réponds, honnêtement.


  Ne fais pas un doctorat pour fuir le chômage. 3 à 5 ans, c''est long, et le chômage t''attendra peut-être à la sortie.


  Ne fais pas un doctorat juste pour le titre de « Docteur ». Le titre impressionne ta famille, pas forcément les employeurs.


  Fais un doctorat si :

  ✅ une question te passionne au point d''y penser le soir

  ✅ tu sais à qui ta recherche pourra servir

  ✅ tu es prêt à la faire connaître, pas seulement à l''écrire


  Et quoi que tu choisisses : commence à valoriser ce que tu as DÉJÀ. Ton master a de la valeur. N''attends pas un autre diplôme pour la montrer.


  Et toi, tu hésites ? Raconte-moi en commentaire. 👇'
textes:
  linkedin: 'Une question fréquente : faut-il s''engager dans un doctorat ?


    Mon avis : ni pour éviter le marché de l''emploi, ni pour le seul prestige du titre. Le doctorat prend du sens lorsqu''une question vous anime durablement, que vous savez à qui votre recherche pourra servir, et que vous êtes prêt à la faire connaître.


    Dans tous les cas, valoriser dès maintenant les acquis du master reste une excellente décision.


    Quelle a été votre réflexion avant de vous engager, ou non, dans un doctorat ?


    #Doctorat #Carrière #Orientation'
