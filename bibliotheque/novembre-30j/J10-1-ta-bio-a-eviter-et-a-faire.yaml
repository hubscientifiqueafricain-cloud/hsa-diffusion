texte: 'Ta bio, c''est la 1re chose qu''on lit sur toi. Et souvent… elle ne dit rien. 😶


  ❌ À ÉVITER :

  « Étudiant 🎓 | Passionné | Dieu d''abord 🙏 | UFHB »


  On ne sait pas ce que tu fais. On ne sait pas pourquoi te contacter.


  ❌ À ÉVITER AUSSI :

  « Doctorant en sciences économiques, spécialité économie du développement, laboratoire d''analyse et de modélisation… »


  Trop long. Trop académique. On décroche.


  ✅ À FAIRE :

  « Je travaille sur l''accès des jeunes au crédit en [pays] 📊 | Doctorant en économie | J''aide les institutions de microfinance à mieux comprendre leurs jeunes clients »


  La formule :

  [Ce sur quoi tu travailles] + [ton statut] + [qui tu aides et comment]


  Ta bio doit répondre à une question : « Pourquoi je devrais suivre ou contacter cette personne ? »


  Change ta bio aujourd''hui et colle-la en commentaire. On te fait un retour. ✍🏾'
textes:
  linkedin: 'La biographie professionnelle est souvent négligée, alors qu''elle est la première information lue.


    À éviter : une bio générique (« Passionné | Étudiant ») ou une énumération académique trop longue.


    À privilégier, une structure en trois éléments :

    [Votre sujet] + [votre statut] + [qui vous aidez et comment]


    Exemple : « Je travaille sur l''accès des jeunes au crédit | Doctorant en économie | J''aide les institutions de microfinance à mieux comprendre leurs jeunes clients. »


    Une bio réussie répond à une question : pourquoi suivre ou contacter cette personne ?


    #PersonalBranding #LinkedIn #JeunesChercheurs'
