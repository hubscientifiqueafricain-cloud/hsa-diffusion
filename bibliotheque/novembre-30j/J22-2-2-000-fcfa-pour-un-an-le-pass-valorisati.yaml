texte: '2 000 FCFA.

  C''est le prix d''un plat au maquis. 🍛

  C''est aussi le prix d''une année entière pour faire avancer ta recherche.


  Avec le Pass Valorisation HSA, pendant 12 mois :

  ✅ le programme certifiant « Initiation à la valorisation » (5 modules + attestation)

  ✅ le guide « 10 façons de gagner de l''argent avec ton mémoire ou ta thèse »

  ✅ ton profil de chercheur visible par les entreprises, ONG et institutions

  ✅ chaque semaine, les financements, prix, concours et opportunités

  ✅ le groupe d''entraide des membres et les lives mensuels

  ✅ la priorité sur les places du Bootcamp


  Moins de 6 FCFA par jour.


  Imagine dans un an. Soit ton mémoire est toujours rangé quelque part. Soit tu as un profil visible, une attestation, des opportunités chaque semaine et une communauté qui avance avec toi.


  La différence, c''est 2 000 FCFA et une décision. Aujourd''hui.


  👉 Le lien est en commentaire. Paiement par mobile money.'
textes:
  linkedin: 'Le Pass Valorisation HSA est ouvert : 2 000 FCFA pour une année d''accompagnement.


    Il comprend :

    → le programme certifiant « Initiation à la valorisation » (5 modules, attestation)

    → le guide « 10 façons de gagner de l''argent avec son mémoire ou sa thèse »

    → un profil de chercheur visible par les entreprises, ONG et institutions

    → une veille hebdomadaire des financements, prix, concours et opportunités

    → un groupe d''entraide et des lives mensuels

    → un accès prioritaire au Bootcamp de valorisation


    Nous avons volontairement fixé un prix accessible (moins de 6 FCFA par jour) pour qu''aucun jeune chercheur ne soit exclu pour une question de moyens.


    Lien d''inscription en commentaire.


    #RechercheAfricaine #ValorisationDeLaRecherche #JeunesChercheurs'
