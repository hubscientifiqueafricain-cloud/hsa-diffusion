texte: 'MYTHE : « Pour faire quelque chose de ma recherche, il me faut un financement. Des millions. Un local. Une équipe. » 💸


  RÉALITÉ : les premières étapes ne coûtent presque rien. Juste du temps et de la méthode.


  Regarde ce que tu peux faire avec 0 FCFA :

  ✅ écrire un post sur ton résultat principal

  ✅ créer ton profil de chercheur en ligne

  ✅ rédiger une fiche d''une page sur ce que tu proposes

  ✅ écrire à 10 organisations concernées

  ✅ proposer un atelier gratuit dans ton ancienne fac


  Et avec ton téléphone :

  ✅ une vidéo de 60 secondes sur ta recherche

  ✅ un live avec un camarade


  Le financement, il viendra plus tard. Et il viendra plus facilement si tu as déjà montré ton travail, parce que les bailleurs aussi cherchent sur Google. 😉


  👉 Le guide gratuit « 10 façons de gagner de l''argent avec ton mémoire ou ta thèse » te donne, pour chaque façon, un premier pas à faire dès cette semaine. Sans budget.

  Commente GUIDE et je te l''envoie.'
textes:
  linkedin: 'On associe souvent la valorisation de la recherche à des investissements importants : financement, structure, équipe.


    C''est vrai pour certaines voies (création d''entreprise, développement de produit). Mais les premières étapes ne demandent presque aucun moyen :

    → publier une synthèse de ses résultats

    → créer un profil de chercheur public

    → rédiger une fiche d''offre d''une page

    → contacter les organisations concernées

    → proposer une intervention dans son université


    Ces actions construisent aussi la crédibilité qui facilitera, plus tard, l''accès aux financements.


    Le guide gratuit HSA « 10 façons de gagner de l''argent avec son mémoire ou sa thèse » propose pour chaque voie un premier pas sans budget. Lien en commentaire.


    #ValorisationDeLaRecherche #Entrepreneuriat #Financement'
