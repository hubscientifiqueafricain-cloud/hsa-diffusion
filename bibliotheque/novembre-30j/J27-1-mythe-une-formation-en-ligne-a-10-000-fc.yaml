texte: 'MYTHE : « Une formation en ligne pas chère ? C''est des vidéos théoriques, ou c''est une arnaque. » 🤨


  Tu as raison de te méfier. Il y a beaucoup de promesses en ligne.

  Alors voilà comment fonctionne VRAIMENT le Bootcamp de valorisation HSA :


  ✅ Des séances EN DIRECT, en visio, pendant 3 jours. Pas des vidéos enregistrées il y a 2 ans.

  ✅ Chaque jour, une masterclass puis des ateliers pratiques. Tu travailles sur TA recherche.

  ✅ Tu repars chaque soir avec tes livrables du jour. 12 au total.

  ✅ Ton article est publié dans le magazine HSA.

  ✅ Tu rates une séance ? Elle est enregistrée, tu la rattrapes en replay.

  ✅ Un smartphone et une connexion suffisent.

  ✅ Paiement par mobile money, reçu officiel par e-mail.


  Et la garantie : si tu suis les 3 jours (en direct ou en replay), que tu rends les exercices et que tu ne reçois pas tes livrables, on te rembourse.


  10 000 FCFA, pour 205 000 FCFA de livrables estimés.


  👉 Tu as encore une question ? Pose-la en commentaire, je réponds à tout. Le lien pour réserver est en commentaire.'
textes:
  linkedin: 'Une méfiance légitime entoure les formations en ligne à petit prix. Voici, en toute transparence, le fonctionnement du Bootcamp de valorisation HSA :


    → 3 jours de séances en direct, en visioconférence

    → une masterclass puis des ateliers appliqués à la recherche de chaque participant

    → 12 livrables concrets, dont un article publié dans le magazine HSA

    → des replays pour chaque séance

    → un smartphone et une connexion suffisent

    → paiement par mobile money et reçu officiel


    Une garantie : les participants qui suivent les 3 jours et rendent les exercices sans recevoir leurs livrables sont remboursés.


    10 000 FCFA. Lien d''inscription en commentaire.


    #Formation #ValorisationDeLaRecherche #Doctorat'
