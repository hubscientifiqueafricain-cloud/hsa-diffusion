texte: 'Prends ton mémoire et 3 surligneurs. Dans 30 minutes, tu sauras ce qui, dans ton travail, peut te rapporter. 🖍️


  Étape 1 : ouvre ta conclusion générale et tes recommandations. C''est là que se cache l''essentiel de ta valeur.


  Étape 2 : surligne avec 3 couleurs.

  🟡 JAUNE : chaque chiffre ou résultat qui surprend.

  🟢 VERT : chaque outil que tu as créé ou adapté (questionnaire, grille d''analyse, carte, protocole, modèle).

  🔵 BLEU : chaque recommandation qui peut aider quelqu''un à décider.


  Étape 3 : à côté de chaque passage surligné, écris QUI pourrait en avoir besoin : une ONG, un ministère, une entreprise, des enseignants, des parents…


  Résultat :

  • le jaune devient un article ou un post,

  • le vert devient un service ou un produit,

  • le bleu devient une note pour les décideurs ou un atelier.


  Au bootcamp HSA, on va beaucoup plus loin avec la « matrice des résultats valorisables ». Mais tu peux commencer ce soir, seul, avec 3 surligneurs.


  👉 Pour savoir quelle voie de valorisation te correspond le mieux, fais la Boussole HSA : gratuit, 5 minutes. Le lien est en commentaire.'
textes:
  linkedin: 'Un exercice simple pour identifier ce qui est valorisable dans un mémoire ou une thèse. Il prend 30 minutes et 3 surligneurs.


    1. Reprenez votre conclusion générale et vos recommandations.


    2. Surlignez :

    → en jaune, les résultats chiffrés ou surprenants ;

    → en vert, les outils que vous avez conçus ou adaptés (questionnaire, protocole, carte, modèle) ;

    → en bleu, les recommandations utiles à un décideur.


    3. En marge, notez pour chaque passage l''acteur qui pourrait en avoir besoin.


    Le jaune nourrit vos articles et publications grand public. Le vert peut devenir un service ou un produit. Le bleu, une note de politique ou une formation.


    C''est la première version de ce que nous appelons, au Hub Scientifique Africain, la matrice des résultats valorisables.


    Pour aller plus loin, la Boussole de valorisation HSA vous indique la voie la plus adaptée à votre profil (5 minutes, gratuit). Lien en commentaire.


    #ValorisationDeLaRecherche #TransfertDeConnaissances #Méthodologie'
