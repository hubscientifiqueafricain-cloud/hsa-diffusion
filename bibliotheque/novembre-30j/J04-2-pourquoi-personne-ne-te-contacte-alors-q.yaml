texte: 'Tu as un CV propre. Un profil Facebook, peut-être LinkedIn.

  Et pourtant, personne ne t''écrit jamais pour te proposer quelque chose.


  Je vais te dire pourquoi : ton profil dit ce que tu as ÉTUDIÉ. Pas ce que tu sais RÉSOUDRE.


  « Titulaire d''un Master en économie du développement. »

  OK… et ? 🤷🏾‍♂️


  Une ONG, une entreprise ou une mairie ne cherche pas un diplôme. Elle cherche quelqu''un qui peut l''aider sur un problème précis.


  ❌ « Doctorant en sciences de l''environnement »

  ✅ « J''aide les communes à réduire les inondations grâce à la cartographie des zones à risque »


  Même diplôme. Mais la deuxième personne, on sait pourquoi l''appeler.


  Le vrai souci, c''est que beaucoup ne savent pas encore quel problème leur recherche résout. C''est normal : à l''université, personne ne nous l''apprend.


  👉 Pour le trouver, fais la Boussole de valorisation HSA : 14 questions, 5 minutes, gratuit. Tu sauras ce qui est valorisable dans ton travail et à qui ça peut servir.


  Commente BOUSSOLE et je t''envoie le lien en privé.'
textes:
  linkedin: 'Pourquoi tant de jeunes diplômés brillants ne sont jamais sollicités ?


    Parce que leur profil dit ce qu''ils ont étudié, pas ce qu''ils savent résoudre.


    « Titulaire d''un Master en économie du développement » ne dit rien à une organisation qui a un problème à régler. Elle ne cherche pas un diplôme. Elle cherche une compétence appliquée à sa situation.


    → « Doctorant en sciences de l''environnement »

    → « J''aide les communes à réduire les inondations grâce à la cartographie des zones à risque »


    Même parcours. Mais dans le second cas, on sait immédiatement pourquoi vous contacter.


    La difficulté, c''est que l''université nous apprend à produire des résultats, rarement à identifier à qui ils servent.


    C''est précisément l''objet de la Boussole de valorisation HSA : 14 questions, 5 minutes, gratuit, pour savoir ce qui est valorisable dans votre travail et auprès de qui. Le lien est en commentaire.


    #ValorisationDeLaRecherche #JeunesChercheurs #Carrière'
