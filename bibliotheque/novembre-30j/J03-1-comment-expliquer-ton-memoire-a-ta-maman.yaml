texte: 'Comment expliquer ton mémoire à ta maman en UNE seule phrase.

  (Oui, c''est possible. Même en biochimie. 😄)


  Étape 1 : trouve QUI est concerné.

  Pas « la population », pas « les acteurs ». Des vraies personnes : les vendeuses de poisson fumé, les élèves de CM2, les petits producteurs d''anacarde.


  Étape 2 : dis ce que tu as TROUVÉ, pas ce que tu as fait.

  Pas « j''ai analysé… », mais « j''ai découvert que… ».


  Étape 3 : dis à quoi ça SERT.

  Qu''est-ce qui peut changer grâce à ton résultat ?


  Assemble avec cette formule :

  « J''ai découvert que [ton résultat] chez [qui], ce qui permet de [à quoi ça sert]. »


  Exemple (inventé pour l''exercice) :

  « J''ai découvert que la fumée des fours traditionnels abîme les poumons des vendeuses de poisson fumé, ce qui permet de justifier le passage à des fours améliorés. »


  Le test : dis ta phrase à quelqu''un qui n''est pas de ta filière. S''il te pose une question, c''est gagné. S''il change de sujet, recommence. 😅


  Je poste un tuto comme celui-ci chaque semaine. Abonne-toi pour ne pas rater le prochain, et enregistre ce post pour ta prochaine fête de famille.'
textes:
  linkedin: 'Comment résumer un mémoire ou une thèse en une phrase compréhensible par tous ? Un tutoriel en 3 étapes.


    1. Nommez QUI est concerné. Pas « la population » : des personnes réelles (des producteurs, des élèves, des patientes).


    2. Dites ce que vous avez TROUVÉ, pas ce que vous avez fait. « J''ai découvert que… » plutôt que « j''ai analysé… ».


    3. Dites à quoi cela SERT. Qu''est-ce qui peut changer grâce à ce résultat ?


    La formule :

    « J''ai découvert que [résultat] chez [public], ce qui permet de [utilité]. »


    Exemple fictif : « J''ai découvert que la fumée des fours traditionnels abîme les poumons des vendeuses de poisson fumé, ce qui permet de justifier le passage à des fours améliorés. »


    Le test : si une personne hors de votre discipline vous pose une question après votre phrase, elle fonctionne.


    Essayez avec votre propre sujet en commentaire.


    #Vulgarisation #CommunicationScientifique #Doctorat'
