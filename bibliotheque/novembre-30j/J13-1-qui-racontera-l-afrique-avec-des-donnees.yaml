texte: 'Une question qui m''empêche de dormir. 🌍


  Dans 10 ans, quand on parlera de l''agriculture africaine, de la santé de nos mamans, de l''éducation de nos enfants, de nos villes…

  Qui donnera les chiffres ? Qui fera les études ? Qui sera cité ?


  Nous ? Ou d''autres, à notre place ?


  Aujourd''hui, beaucoup d''études sur nos réalités sont faites par des gens qui ne vivent pas ici. Pas parce que nos chercheurs n''existent pas. Parce qu''on ne les voit pas.


  Chaque mémoire publié, chaque résultat partagé, chaque vidéo de vulgarisation, c''est une pièce de la réponse. C''est l''Afrique qui se raconte elle-même, avec ses propres données.


  Ta recherche n''est pas un petit document. C''est ta part de cette histoire.


  Si tu veux que ce soit NOUS, écris-le en commentaire. 💪🏾'
textes:
  linkedin: 'Dans dix ans, qui produira et portera les données sur les réalités africaines : l''agriculture, la santé, l''éducation, les villes ?


    Une part importante des études sur le continent est encore conduite et diffusée depuis l''extérieur. Non par manque de chercheurs africains, mais par manque de visibilité de leurs travaux.


    Chaque recherche diffusée, chaque résultat rendu accessible contribue à ce que le continent documente et raconte lui-même ses réalités.


    C''est le sens du Hub Scientifique Africain.


    #RechercheAfricaine #Données #Souveraineté'
