texte: 'Tu veux que ta recherche te rapporte un premier revenu ? Voici les 3 étapes. Pas de théorie, du concret.


  1️⃣ Fais une liste de 10 organisations qui travaillent sur ton sujet.

  ONG, entreprises, mairies, projets financés par des bailleurs. Tu les trouves sur LinkedIn, sur les sites des bailleurs, ou dans l''annuaire des organisations HSA.


  2️⃣ Prépare une fiche d''UNE page.

  Le problème, ton résultat, ce que tu proposes, ton contact. Pas ton mémoire de 120 pages. Une page.


  3️⃣ Demande 20 minutes, pas une mission.

  « Je vous propose 20 minutes pour vous présenter ce que j''ai trouvé sur [sujet] et voir si cela peut vous être utile. »


  Sur 10 messages, n''attends pas 10 réponses. Mais une seule bonne conversation peut suffire pour une première mission.


  Le plus dur, c''est l''étape 2 : savoir quoi proposer, à quel prix, et comment le dire.

  C''est exactement ce qu''on construit ensemble au Bootcamp de valorisation HSA :

  ✅ Jour 3 : ton offre, ton prix, ton mini business plan et ton pitch

  ✅ 12 livrables en 3 jours, en ligne

  ✅ 10 000 FCFA (valeur des livrables : 205 000 FCFA)


  Prochaine cohorte : [date], [nombre] places.

  Commente BOOTCAMP et je te réserve ta place. 🎯'
textes:
  linkedin: 'Comment obtenir une première mission rémunérée à partir de sa recherche ? Trois étapes.


    1. Identifiez 10 organisations actives sur votre sujet : ONG, entreprises, collectivités, projets financés.


    2. Rédigez une fiche d''une page : le problème, votre résultat, votre proposition, vos coordonnées. Personne ne lira un mémoire de 120 pages ; une page, oui.


    3. Sollicitez un échange de 20 minutes plutôt qu''une mission. « Je vous propose 20 minutes pour vous présenter mes résultats sur [sujet] et voir s''ils peuvent vous être utiles. »


    Le taux de réponse ne sera pas de 100 %. Mais une seule conversation peut ouvrir une première collaboration.


    L''étape la plus difficile est la deuxième : formuler une offre et fixer un prix. C''est l''objet du troisième jour du Bootcamp de valorisation HSA (3 jours en ligne, 12 livrables, 10 000 FCFA). Prochaine cohorte : [date]. Lien en commentaire.


    #ValorisationDeLaRecherche #Consulting #JeunesChercheurs'
