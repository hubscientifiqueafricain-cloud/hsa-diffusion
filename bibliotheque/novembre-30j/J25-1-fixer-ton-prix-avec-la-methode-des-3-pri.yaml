texte: '« Je ne sais pas combien demander. » C''est LA question qu''on me pose le plus. 💬

  Voici une méthode simple : la méthode des 3 prix.


  PRIX 1 · TON COÛT

  Combien de jours de travail ? Combien de transport, de données, d''impression ?

  Exemple : 5 jours de travail + 30 000 FCFA de frais.

  C''est ton plancher. En dessous, tu perds de l''argent.


  PRIX 2 · LE MARCHÉ

  Combien demandent les autres pour un travail similaire ? Un consultant junior, un cabinet, un formateur ?

  Renseigne-toi auprès d''anciens, de camarades, de professionnels.


  PRIX 3 · LA VALEUR

  Combien ce problème coûte-t-il à ton client ? Si ton étude lui évite de rater un projet de plusieurs millions, ton travail vaut plus que ton temps.


  Ton prix se situe entre le prix 1 et le prix 3. Le prix 2 t''aide à te placer.


  Et surtout : annonce ton prix avec assurance. Ton hésitation coûte plus cher qu''un « non ».


  Au Bootcamp de valorisation HSA, Jour 3, tu construis ton offre, ton prix et ton mini business plan, accompagné.

  3 jours · 12 livrables · 10 000 FCFA.

  👉 Commente BOOTCAMP.'
textes:
  linkedin: 'Fixer le prix d''une prestation issue de sa recherche est l''une des principales difficultés des jeunes experts. Une méthode en trois repères :


    1. Le coût : temps de travail et frais engagés. C''est le plancher.

    2. Le marché : les tarifs pratiqués pour des prestations comparables.

    3. La valeur : ce que le problème coûte au client. C''est le plafond.


    Le prix se situe entre le coût et la valeur ; le marché aide à se positionner.


    Le troisième jour du Bootcamp de valorisation HSA est consacré à l''offre, au prix et au mini business plan. 3 jours en ligne, 12 livrables, 10 000 FCFA. Lien en commentaire.


    #Pricing #Consulting #Entrepreneuriat'
