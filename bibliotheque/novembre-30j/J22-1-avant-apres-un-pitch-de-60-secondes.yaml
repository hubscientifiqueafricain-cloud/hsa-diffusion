texte: 'AVANT / APRÈS. Même chercheuse, même recherche. Deux pitchs de 60 secondes. 🎤


  AVANT :

  « Bonjour, je m''appelle Marie, je suis doctorante en sciences agronomiques. Mes travaux portent sur l''évaluation de l''efficacité des biopesticides à base de neem dans la lutte contre les ravageurs du chou en zone périurbaine… »


  (À ce stade, le jury regarde déjà son téléphone. 📱)


  APRÈS :

  « Chaque semaine, les maraîchers de [ville] aspergent leurs choux de pesticides chimiques. Ils les respirent. Nous les mangeons.

  J''ai testé une alternative à base de feuilles de neem, une plante qui pousse partout chez nous. Résultat : elle protège les choux, pour beaucoup moins cher.

  Je cherche aujourd''hui une coopérative de maraîchers pour la tester à grande échelle. »


  Ce qui a changé :

  ✅ elle commence par un problème qu''on voit

  ✅ elle donne UN résultat clair

  ✅ elle termine par une demande précise


  (Exemple fictif, construit pour la démonstration.)


  Au Jour 1 du Bootcamp HSA, tu construis TON pitch éclair de 60 secondes. Commente PITCH pour en savoir plus.'
textes:
  linkedin: 'Démonstration : un même pitch de 60 secondes, avant et après un travail de reformulation.


    Avant : « Mes travaux portent sur l''évaluation de l''efficacité des biopesticides à base de neem dans la lutte contre les ravageurs du chou en zone périurbaine. »


    Après : « Chaque semaine, des maraîchers aspergent leurs cultures de pesticides chimiques, que nous retrouvons ensuite dans nos assiettes. J''ai testé une alternative à base de neem, une plante locale. Elle protège les cultures pour un coût bien moindre. Je cherche une coopérative pour la tester à plus grande échelle. »


    Un problème visible, un résultat clair, une demande précise.


    (Exemple illustratif.) Le pitch éclair est le premier livrable du Bootcamp de valorisation HSA.


    #Pitch #Agronomie #ValorisationDeLaRecherche'
