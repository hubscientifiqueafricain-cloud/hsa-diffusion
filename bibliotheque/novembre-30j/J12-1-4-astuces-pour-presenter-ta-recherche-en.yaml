texte: 'Tu présentes ta recherche et… tu lis tes slides, dos au public. 😅 On l''a tous fait. Voici 4 astuces pour arrêter.


  1. UNE idée par slide.

  Si ta slide a 10 lignes, tu vas forcément les lire. Mets une phrase, un chiffre ou une image. Le reste, c''est toi qui le dis.


  2. Prépare des mots-clés, pas un texte.

  Sur un petit papier : 3 mots par slide. Ça suffit pour te souvenir, et ça t''oblige à parler naturellement.


  3. Répète à voix haute, debout, 3 fois.

  Pas dans ta tête. À voix haute. La 1re fois tu bloques, la 2e tu hésites, la 3e tu racontes.


  4. Regarde 3 personnes dans la salle.

  Une à gauche, une au centre, une à droite. Parle-leur à tour de rôle. Tout le monde aura l''impression que tu le regardes.


  Bonus : commence par une question au public. Ça te détend, et ça les réveille. 😄


  Enregistre ce post 📌 et envoie-le à quelqu''un qui soutient bientôt.'
textes:
  linkedin: 'Quatre conseils pour présenter ses travaux sans lire ses diapositives :


    1. Une idée par diapositive. Moins il y a de texte à l''écran, moins on est tenté de le lire.

    2. Des mots-clés plutôt qu''un texte rédigé.

    3. Trois répétitions à voix haute, debout, dans les conditions réelles.

    4. Un regard qui circule entre trois zones de la salle.


    Et pour commencer : une question au public, qui installe l''échange.


    Quelle est votre technique pour gérer une présentation importante ?


    #PriseDeParole #Soutenance #Doctorat'
