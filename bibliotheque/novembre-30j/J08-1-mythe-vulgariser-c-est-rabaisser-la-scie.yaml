texte: 'MYTHE : « Si je simplifie ma recherche, je la rabaisse. Un vrai chercheur parle comme un chercheur. »


  RÉALITÉ : expliquer simplement une chose compliquée, c''est la preuve que tu la maîtrises vraiment. 🎯


  Pense à ton meilleur prof. Celui que tu comprenais tout de suite. Il n''était pas moins savant que les autres. Il était meilleur pédagogue.


  Vulgariser, ce n''est pas :

  ❌ dire des choses fausses

  ❌ supprimer les nuances

  ❌ prendre les gens pour des idiots


  Vulgariser, c''est :

  ✅ choisir l''essentiel

  ✅ utiliser les mots de ton public

  ✅ montrer pourquoi ça le concerne


  Le jargon, c''est utile entre spécialistes. Mais si personne en dehors de ton labo ne te comprend, ta recherche ne sortira jamais du labo.


  D''accord ou pas d''accord ? Je veux ton avis en commentaire. 👇'
textes:
  linkedin: '« Simplifier, c''est appauvrir. »


    Cette conviction freine beaucoup de chercheurs dans leur communication. Pourtant, rendre accessible un sujet complexe demande une maîtrise approfondie de ce sujet.


    Vulgariser ne consiste pas à dire des choses inexactes ni à effacer les nuances. Cela consiste à hiérarchiser, à traduire dans le vocabulaire d''un public, et à montrer en quoi le sujet le concerne.


    Le langage spécialisé reste indispensable entre pairs. Mais une recherche qui n''est comprise que par ses pairs reste confinée à leur cercle.


    Partagez-vous ce point de vue ?


    #Vulgarisation #CommunicationScientifique #Science'
