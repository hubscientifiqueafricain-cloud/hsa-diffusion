texte: 'AVANT / APRÈS. On a pris un résumé de mémoire et on lui a appliqué la méthode HSA. Regarde. 👇


  AVANT (version jury) :

  « Cette étude analyse les facteurs explicatifs de la faible adoption des foyers améliorés par les transformatrices de poisson dans la commune de [ville], à partir d''une approche mixte combinant enquête par questionnaire et entretiens semi-directifs. »


  APRÈS (version grand public) :

  « Les femmes qui fument le poisson respirent de la fumée toute la journée. Des fours plus propres existent. Alors pourquoi presque personne ne les utilise ? J''ai posé la question à [nombre] transformatrices à [ville]. Leur réponse va te surprendre. »


  ET CE QUE ÇA DEVIENT :

  ✅ un article publié dans le magazine HSA

  ✅ un post qui fait réagir

  ✅ une offre : une étude d''adoption pour les ONG et les fabricants de fours


  Même recherche. Même rigueur. Mais cette fois, elle peut sortir de l''université.


  Tu veux qu''on fasse pareil avec la tienne ? Commente AVANT-APRÈS : je prends 3 résumés et on les transforme en direct pendant notre prochain live.'
textes:
  linkedin: 'Démonstration : un même résumé de mémoire, avant et après un travail de valorisation.


    Version académique :

    « Cette étude analyse les facteurs explicatifs de la faible adoption des foyers améliorés par les transformatrices de poisson dans la commune de [ville], à partir d''une approche mixte. »


    Version grand public :

    « Les femmes qui fument le poisson respirent de la fumée toute la journée. Des fours plus propres existent. Pourquoi si peu les adoptent-elles ? J''ai interrogé [nombre] transformatrices pour le comprendre. »


    Débouchés concrets :

    → un article de vulgarisation publié

    → une prise de parole sur les réseaux

    → une offre d''étude d''adoption pour les ONG et les fabricants d''équipements


    La rigueur est identique. Seuls le registre et le destinataire changent, et avec eux, l''impact possible.


    (Exemple illustratif.)


    #Vulgarisation #ValorisationDeLaRecherche #Impact'
