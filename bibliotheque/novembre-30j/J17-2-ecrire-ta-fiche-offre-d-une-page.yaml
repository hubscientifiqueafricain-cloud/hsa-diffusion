texte: 'Une ONG te demande : « Concrètement, vous proposez quoi ? »

  Si tu n''as pas de réponse claire en une page, tu perds l''opportunité. 😕


  Voici comment écrire ta fiche offre d''UNE page, en 6 blocs.


  1. LE PROBLÈME : en 2 lignes, le problème de ton client. Avec ses mots, pas les tiens.


  2. CE QUE TU AS TROUVÉ : ton résultat de recherche qui éclaire ce problème. 2 ou 3 lignes.


  3. CE QUE TU PROPOSES : un service clair. « Un diagnostic de… », « Une formation de 2 h sur… », « Une enquête auprès de… ».


  4. CE QUE LE CLIENT REÇOIT : le livrable précis. Un rapport de 10 pages, une carte, une session, un outil.


  5. POURQUOI TOI : ton diplôme, ton terrain, ta méthode. 3 lignes maximum.


  6. LE CONTACT : nom, numéro WhatsApp, e-mail, lien vers ton profil.


  Une page. Pas deux. Si c''est trop long, personne ne le lira.


  👉 Commente FICHE et je t''envoie le modèle utilisé au Bootcamp de valorisation HSA.'
textes:
  linkedin: 'Lorsqu''une organisation demande « concrètement, que proposez-vous ? », une fiche d''une page fait souvent la différence. Six blocs suffisent :


    1. Le problème du client, formulé dans ses termes.

    2. Le résultat de recherche qui éclaire ce problème.

    3. Le service proposé, nommé clairement.

    4. Le livrable concret.

    5. La légitimité : formation, terrain, méthode.

    6. Les coordonnées et le lien vers le profil.


    Une page, pas davantage. Commentez FICHE pour recevoir le modèle utilisé au Bootcamp de valorisation HSA.


    #Consulting #ValorisationDeLaRecherche #JeunesChercheurs'
