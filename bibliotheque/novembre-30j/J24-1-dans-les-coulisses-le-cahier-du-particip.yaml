texte: 'Je te montre ce qu''on prépare pour la prochaine cohorte du bootcamp. 👀📘


  Voici le cahier du participant. Celui que chaque participant reçoit.


  Dedans :

  ✅ les exercices des 3 jours, étape par étape

  ✅ les canvas à remplir (ta matrice des résultats, ton Research Valorization Canvas, ton Business Model Canvas)

  ✅ les modèles : ta fiche offre, ton article, ton pitch

  ✅ de la place pour écrire, réfléchir, raturer 😄


  Pourquoi je te montre ça ? Parce que je veux que tu saches que le bootcamp, ce n''est pas du blabla. C''est du travail concret, guidé, sur TA recherche. Tu ressors avec des documents que tu peux utiliser dès le lendemain.


  Tu veux voir le programme complet jour par jour ?

  👉 Commente CAHIER et je te l''envoie.'
textes:
  linkedin: 'En coulisses de la préparation du Bootcamp de valorisation HSA : le cahier du participant.


    Il rassemble les exercices des trois jours, les canevas de travail (matrice des résultats valorisables, Research Valorization Canvas, Business Model Canvas) et les modèles de livrables (fiche offre, article, pitch).


    Notre approche est volontairement concrète : chaque participant travaille sur sa propre recherche et repart avec des documents directement utilisables.


    Le programme détaillé est disponible sur demande en commentaire.


    #Formation #Pédagogie #ValorisationDeLaRecherche'
