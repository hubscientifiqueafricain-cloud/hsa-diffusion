texte: 'Imagine. C''est la fin du 3e jour. 🎬


  Tu as passé 3 jours à travailler sur ta recherche. Tu as ton pitch, ton offre, ton prix, ton article.


  Maintenant, c''est le DEMO DAY.


  Chaque participant présente son Research Impact Pitch. Quelques minutes pour dire : voici le problème, voici ce que j''ai trouvé, voici ce que je propose.


  Tu as été coaché. Tu as répété. Tu sais ce que tu veux dire.


  Les autres t''écoutent, t''applaudissent, te posent des questions. Tu repars avec des retours précis, ton certificat HSA et ton portfolio de livrables.


  Pour beaucoup, c''est la première fois qu''ils présentent leur recherche comme un projet. Pas comme un devoir. 🌟


  Ce moment peut être le tien.

  Bootcamp de valorisation HSA · 3 jours en ligne · 12 livrables · 10 000 FCFA.

  Prochaine cohorte : [date]. 👉 Lien en commentaire.'
textes:
  linkedin: 'Le Bootcamp de valorisation HSA se conclut par un Demo Day.


    Chaque participant y présente son Research Impact Pitch : le problème, le résultat, la proposition. Après trois jours de travail et de coaching, c''est souvent la première fois que la recherche est présentée comme un projet, et non comme un exercice académique.


    Les participants repartent avec des retours, un certificat HSA et un portfolio de livrables.


    Prochaine cohorte : [date]. Lien en commentaire.


    #DemoDay #Pitch #JeunesChercheurs'
