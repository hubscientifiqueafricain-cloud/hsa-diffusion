texte: '« 10 000 FCFA, pour quoi exactement ? » 🧐

  Bonne question. Voici le détail de ce que tu reçois au Bootcamp de valorisation HSA, et ce que ça coûterait si tu le commandais séparément.


  📰 Ton article de vulgarisation, rédigé avec toi et publié dans le magazine HSA : 50 000 FCFA

  📊 Ton Business Model Canvas et ton mini business plan, accompagnés : 40 000 FCFA

  🎨 Ton content pack : visuels et textes sur ta recherche : 30 000 FCFA

  🎤 Ton pitch éclair et ton Research Impact Pitch, coachés : 30 000 FCFA

  🪪 Ta bio 3.0, ta fiche d''identité et ta présence numérique : 20 000 FCFA

  🧭 Ta matrice des résultats et ton Research Valorization Canvas : 20 000 FCFA

  🏆 Le Demo Day, ton certificat HSA et ton portfolio : 15 000 FCFA


  Valeur totale estimée : 205 000 FCFA.

  Ton prix : 10 000 FCFA.


  Et la garantie : si tu suis les 3 jours, que tu rends les exercices et que tu ne reçois pas tes livrables, on te rembourse.


  Prochaine cohorte : [date]. 👉 Lien en commentaire.'
