texte: 'MYTHE : « Valoriser sa recherche, c''est publier dans une revue scientifique. »


  RÉALITÉ : publier, c''est faire LIRE ta recherche par d''autres chercheurs. Valoriser, c''est la faire UTILISER par ceux qui en ont besoin.


  Un article dans une revue, c''est très bien. Mais pose-toi la question : qui va le lire ?

  Un agriculteur à Daloa, une sage-femme à Thiès ou un maire à Bobo-Dioulasso ne lisent pas les revues scientifiques. 🙃


  Valoriser ta recherche, ça peut être :

  • une fiche pratique d''une page pour une coopérative

  • un atelier de 2 heures pour une ONG

  • un article simple dans un magazine

  • une étude rapide pour une entreprise

  • un outil tiré de ta méthode


  La publication est UNE façon de valoriser. Pas la seule. Et souvent ni celle qui change des vies, ni celle qui te fait vivre.


  Avant de lire ce post, tu croyais au mythe ? Réponds en commentaire : VRAI ou FAUX ? 👇'
textes:
  linkedin: 'Une idée reçue tenace dans nos universités : valoriser sa recherche, ce serait publier dans une revue scientifique.


    Publier, c''est faire lire vos résultats par vos pairs. C''est nécessaire.

    Valoriser, c''est les faire utiliser par ceux qui en ont besoin. C''est autre chose.


    L''agriculteur, la sage-femme, l''élu local ou le chef de projet d''une ONG ne lisent pas les revues à comité de lecture. Pourtant, ce sont eux qui peuvent transformer vos résultats en décisions.


    Valoriser peut prendre la forme :

    → d''une fiche pratique d''une page

    → d''un atelier de formation

    → d''un article de vulgarisation

    → d''une étude commandée par une organisation

    → d''un outil issu de votre méthode


    La publication est une voie de valorisation parmi d''autres. Rarement la plus utile au terrain, rarement la plus rémunératrice.


    Quelle forme de valorisation avez-vous déjà testée ?


    #ValorisationDeLaRecherche #ScienceOuverte #Afrique'
