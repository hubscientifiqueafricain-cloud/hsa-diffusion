texte: '« Je parlerai de ma recherche quand j''aurai fini. »

  « Quand j''aurai publié. »

  « Quand je serai docteur. »


  C''est l''erreur qui fait perdre le plus de temps aux jeunes chercheurs. ⏳


  Pendant que tu attends d''être « prêt », d''autres prennent la parole sur TON sujet. Les organisations, les journalistes et les décideurs retiennent ceux qu''ils voient. Pas forcément les meilleurs.


  Tu n''as pas besoin d''avoir fini pour partager :

  • la question que tu te poses et pourquoi elle compte

  • ce que tu as vu sur le terrain

  • une difficulté et comment tu l''as surmontée

  • un premier résultat (sans dévoiler ce qui doit rester confidentiel)


  Les gens ne suivent pas un résultat. Ils suivent quelqu''un qui cherche.


  Commence aujourd''hui : écris en commentaire ton sujet en 5 mots maximum. 👇'
textes:
  linkedin: 'Beaucoup de jeunes chercheurs attendent la fin de leur thèse, ou leur première publication, pour parler de leurs travaux.


    C''est compréhensible, et c''est souvent une erreur. Pendant ce temps, d''autres occupent l''espace sur ces sujets, et les organisations retiennent les personnes qu''elles voient.


    Il est possible de communiquer pendant la recherche, sans rien compromettre :

    → la question de recherche et son enjeu

    → des observations de terrain

    → des difficultés méthodologiques et leurs solutions

    → des résultats préliminaires, lorsque c''est possible


    On ne suit pas seulement un résultat. On suit une démarche.


    Votre sujet en 5 mots ?


    #Doctorat #CommunicationScientifique #JeunesChercheurs'
