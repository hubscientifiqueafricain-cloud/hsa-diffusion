texte: 'Le jour de ta soutenance, tout le monde te félicite. Les photos, le gâteau, la famille. 🎉

  Et le lendemain ? Le document part sur une étagère. Et toi, tu passes à autre chose.


  Et si on regardait ça autrement ?


  Ta soutenance, ce n''est pas la fin de ta recherche.

  C''est le jour où elle a été VALIDÉE. Elle est prête. Elle peut enfin sortir.


  Pendant des mois, tu as fait ce que peu de gens savent faire : poser une bonne question, aller chercher les réponses sur le terrain, et en tirer des conclusions solides.


  Pendant ce temps, dans nos pays, des décisions se prennent sans données. Des projets échouent parce que personne n''a étudié le terrain. Des solutions sont importées alors que des réponses dorment déjà dans les mémoires de nos universités.


  Ta recherche peut produire de l''impact, du revenu et de la notoriété.

  Mais seulement si elle sort de l''université.


  Si tu es d''accord, écris « ELLE SORT » en commentaire. 🔥

  Et partage à quelqu''un qui soutient bientôt.'
textes:
  linkedin: 'On célèbre la soutenance comme une ligne d''arrivée. C''est peut-être là que l''on se trompe.


    La soutenance est le moment où une recherche est validée par des pairs. Elle devient fiable, donc utilisable. C''est un point de départ.


    Pourtant, dans la plupart des cas, c''est précisément là qu''elle s''arrête.


    Pendant ce temps, beaucoup de décisions publiques et privées se prennent sur le continent sans données de terrain, et des solutions sont importées alors que des réponses existent déjà dans nos universités.


    Au Hub Scientifique Africain, nous défendons une idée simple : une recherche doit produire de l''impact, du revenu et de la notoriété. Pour cela, elle doit sortir de l''université.


    Qu''est devenue votre propre recherche après la soutenance ?


    #RechercheAfricaine #ValorisationDeLaRecherche #Impact'
