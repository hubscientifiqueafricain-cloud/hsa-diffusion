texte: 'Ton mémoire, c''est au moins 20 posts qui dorment. Je te montre comment en sortir un en 20 minutes. ⏱️


  Étape 1 (5 min) : choisis UN chapitre et trouve UNE phrase qui surprend. Un chiffre, une observation, un paradoxe.


  Étape 2 (5 min) : écris l''accroche. Transforme ta phrase en question ou en surprise.

  « Pourquoi les parents de [ville] préfèrent payer un répétiteur plutôt que d''acheter des livres ? »


  Étape 3 (5 min) : explique en 3 points courts ce que tu as trouvé. Sans jargon. Une idée par ligne.


  Étape 4 (3 min) : dis pourquoi ça compte. Qui devrait le savoir ? Qu''est-ce que ça change ?


  Étape 5 (2 min) : termine par une question à ton audience. « Et chez vous, c''est pareil ? »


  Et voilà. Un chapitre = un post. Ton mémoire en a combien ? 😉


  Enregistre ce tuto 📌 et abonne-toi : chaque semaine, une nouvelle méthode pour faire vivre ta recherche.'
textes:
  linkedin: 'Un mémoire de master contient souvent la matière de dizaines de publications. Voici une méthode en 20 minutes pour transformer un chapitre en post :


    1. Identifier une donnée ou une observation surprenante (5 min).

    2. La reformuler en accroche, sous forme de question ou de paradoxe (5 min).

    3. Présenter le résultat en trois points courts, sans jargon (5 min).

    4. Expliquer pourquoi il compte et pour qui (3 min).

    5. Conclure par une question au lecteur (2 min).


    Un chapitre, une publication. Une régularité qui construit, semaine après semaine, une expertise visible.


    #CommunicationScientifique #LinkedIn #Doctorat'
