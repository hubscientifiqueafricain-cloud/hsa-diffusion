texte: 'Une ONG cherche un expert de ton sujet sur Google.

  Un journaliste aussi. Un recruteur aussi.

  Est-ce qu''ils tombent sur toi ? 🔎


  5 astuces pour que ta recherche soit trouvée :


  1. Un titre avec les mots que les gens tapent.

  « Pourquoi le riz local coûte plus cher que le riz importé » sera trouvé. « Analyse de la compétitivité-prix de la filière rizicole » beaucoup moins.


  2. Un résumé de 5 lignes sans jargon, publié en ligne.


  3. Un profil de chercheur public, avec tes travaux, ta discipline et tes mots-clés. C''est ce que fait ton espace HSA, visible par les entreprises, ONG et institutions.


  4. Le même nom partout. « Kouassi A. Jean » sur un site et « Jean Kouassi » sur un autre, pour Google, ce sont deux personnes.


  5. Le lien vers ta recherche dans ta signature mail et dans ta bio Facebook et LinkedIn.


  Ta recherche existe déjà. Il faut juste qu''on puisse la trouver.


  👉 Crée ton espace sur hubscientifiqueafricain.com et dépose ton mémoire. Le lien est en commentaire.'
textes:
  linkedin: 'Si une organisation cherche aujourd''hui un expert de votre sujet, vous trouve-t-elle ?


    5 leviers simples pour rendre vos travaux trouvables :


    1. Un titre de diffusion formulé avec les mots du public (en plus du titre académique).

    2. Un résumé de quelques lignes, sans jargon, accessible en ligne.

    3. Un profil de chercheur public qui rassemble vos productions, vos domaines d''expertise et vos mots-clés.

    4. Une signature d''auteur identique partout, pour que vos travaux soient rattachés à une seule identité.

    5. Un lien vers vos travaux dans votre signature électronique et vos biographies.


    Le Hub Scientifique Africain permet de créer ce profil, d''y déposer mémoires, thèses et articles, et d''être visible par les entreprises, ONG et institutions. Lien en commentaire.


    #VisibilitéScientifique #ScienceOuverte #RechercheAfricaine'
