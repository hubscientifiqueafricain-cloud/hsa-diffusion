texte: '🎓 Série « Carrière de chercheur »


  Au-dessus de nos têtes, à des centaines de kilomètres, il y a une couche de l''atmosphère qui influence nos communications radio et nos GPS. 📡 Une chercheuse nigériane a consacré sa carrière à la comprendre : Francisca Nneka Okeke.


  🔭 Physicienne, professeure à l''Université du Nigeria à Nsukka, elle étudie l''ionosphère, cette couche de la haute atmosphère, et ses variations au-dessus de l''Afrique.


  🏆 En 2013, elle reçoit le prix L''Oréal-UNESCO « Pour les femmes et la science », qui récompense chaque année des chercheuses de chaque grande région du monde. Elle est la lauréate pour l''Afrique et les États arabes.


  🌍 Sa carrière montre plusieurs choses :

  • On peut faire une recherche de très haut niveau depuis une université africaine.

  • Les collaborations internationales et les communications en colloque font connaître un travail bien au-delà de son pays.

  • Les prix et les distinctions donnent une visibilité qui profite aussi aux plus jeunes, en particulier aux jeunes femmes.


  💡 Pour ta carrière : les prix ne tombent pas du ciel. Ils récompensent un travail publié, présenté, connu. C''est tout ce qu''on construit ensemble ce mois-ci.


  Le carrousel raconte son parcours. 👆


  HSA, le Hub Scientifique Africain.


  🎯 Pour construire ta carrière sans avancer seul : le Pass Valorisation HSA te donne une méthode certifiante (avec attestation pour ton CV), les opportunités chaque semaine et un groupe d''entraide. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'Francisca Nneka Okeke, physicienne et professeure à l''Université du Nigeria à Nsukka, consacre ses travaux à l''ionosphère et à ses variations au-dessus du continent africain.


    En 2013, elle a reçu le prix L''Oréal-UNESCO « Pour les femmes et la science » au titre de l''Afrique et des États arabes.


    Son parcours montre qu''une recherche de haut niveau peut être menée depuis une université africaine, et que les distinctions récompensent des travaux publiés, présentés et reconnus. Elles offrent aussi une visibilité précieuse aux jeunes chercheuses.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
