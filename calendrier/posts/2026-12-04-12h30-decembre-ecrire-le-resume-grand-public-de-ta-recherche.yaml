texte: '🗓️ Série « Prépare 2027 »


  Un outil à préparer avant janvier, parce qu''il te servira toute l''année 2027.


  Ton résumé de mémoire est écrit pour un jury. Pour valoriser, il te faut un autre résumé : celui que n''importe qui peut lire. ✍🏾


  Ce résumé grand public te servira partout : sur ton profil en ligne, dans un mail à une organisation, dans une candidature, dans un post. C''est un des outils les plus utiles quand tu veux faire connaître ta recherche.


  Voici un modèle en 5 phrases :


  1. LE CONTEXTE : une situation que tout le monde comprend.

  2. LE PROBLÈME : ce qui ne va pas, et pour qui.

  3. CE QUE TU AS FAIT : ta démarche en une phrase, sans jargon.

  4. CE QUE TU AS TROUVÉ : ton résultat principal, avec un chiffre si possible.

  5. CE QUE ÇA CHANGE : qui peut s''en servir, et comment.


  Trois règles :

  ✅ Des phrases de 20 mots maximum.

  ✅ Aucun mot que tu n''utiliserais pas avec ta famille.

  ✅ Le résultat avant la méthode.


  Le carrousel te donne le modèle et un exemple complet, avant et après. 👆

  Enregistre-le, écris ton résumé, et teste-le sur quelqu''un qui n''a jamais fait d''études dans ton domaine. S''il comprend, c''est gagné.


  On est HSA, le Hub Scientifique Africain.


  🚀 Tu veux qu''en 2027 ta recherche serve vraiment ? Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : méthode, opportunités, profil visible et entraide. Lien en commentaire.'
textes:
  linkedin: 'Le résumé d''un mémoire ou d''une thèse est rédigé pour des spécialistes. Toute démarche de valorisation suppose un second résumé, accessible à un lecteur non spécialiste : décideur, journaliste, partenaire, financeur.


    Un modèle en cinq phrases :

    1. Le contexte, compréhensible par tous.

    2. Le problème, et les personnes concernées.

    3. La démarche, sans jargon.

    4. Le résultat principal, chiffré si possible.

    5. Les usages possibles, et leurs bénéficiaires.


    Trois règles de rédaction : des phrases courtes ; aucun terme technique non expliqué ; le résultat avant la méthode.


    Ce texte sert ensuite dans de nombreux contextes : profil en ligne, prise de contact, candidature, communication. Un test simple consiste à le faire lire à une personne extérieure au domaine.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    #ValorisationDeLaRecherche #Vulgarisation #Doctorat'
