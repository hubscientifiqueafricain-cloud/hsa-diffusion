texte: '🗓️ Série « Prépare 2027 »


  Chaque année, c''est pareil. En janvier, on se promet de finir sa thèse, de publier, de se faire connaître, de gagner un peu d''argent avec sa recherche. En février, le carnet de résolutions est déjà rangé. 😅


  Ce n''est pas un manque de volonté. C''est qu''un objectif tient rarement seul. Il a besoin de 3 choses :


  1️⃣ UNE MÉTHODE

  Savoir quoi faire, dans quel ordre. Sans méthode, on tourne en rond et on se décourage.


  2️⃣ DES OCCASIONS

  Des bourses, des prix, des appels, des organisations qui cherchent des experts. Sans occasions, même le meilleur travail reste invisible.


  3️⃣ DES GENS AUTOUR DE TOI

  Pour poser tes questions, partager tes avancées, et te relever quand tu as envie de lâcher.


  Le Pass Valorisation HSA a été conçu exactement autour de ces trois besoins :

  🎓 la méthode : le programme certifiant « Initiation à la valorisation » (5 modules, attestation HSA) et le guide « 10 façons de gagner de l''argent avec ton mémoire ou ta thèse » ;

  📬 les occasions : les opportunités chaque semaine et ton profil de chercheur visible ;

  🤝 l''entourage : le groupe d''entraide et les lives mensuels.


  2 000 FCFA pour toute l''année 2027. Moins de 6 FCFA par jour.


  Le carrousel t''explique les 3 piliers. 👆 Le lien pour t''inscrire est en commentaire.


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Les objectifs fixés en début d''année, y compris pour sa recherche, sont souvent abandonnés au bout de quelques semaines. La cause tient moins à la volonté qu''à l''absence de trois conditions :

    1. une méthode, qui indique les étapes et leur ordre ;

    2. des occasions : financements, prix, appels, organisations à la recherche d''expertise ;

    3. un entourage, qui aide à maintenir l''effort.


    Le Pass Valorisation du Hub Scientifique Africain réunit ces trois éléments : programme certifiant « Initiation à la valorisation » et guide des dix voies de revenus ; veille hebdomadaire des opportunités et profil de chercheur visible ; groupe d''entraide et sessions mensuelles en direct.


    Tarif : 2 000 FCFA pour l''année.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
