texte: '🗓️ Série « Prépare 2027 »


  Pour te donner de l''élan avant 2027, une histoire vraie.


  En 1971, une Kényane obtient son doctorat. Elle est la première femme d''Afrique de l''Est et centrale à décrocher ce diplôme. 🎓 Elle s''appelle Wangari Maathai.


  Elle est biologiste, enseignante à l''université de Nairobi. Elle aurait pu rester dans son laboratoire. Mais en écoutant les femmes des campagnes, elle fait un lien entre ce qu''elle sait et ce qu''elles vivent : le bois de chauffe se fait rare, l''eau manque, les sols s''appauvrissent. La cause ? La déforestation.


  Sa réponse est simple : planter des arbres. En 1977, elle lance le Green Belt Movement (le Mouvement de la ceinture verte). Le principe : former des femmes à planter et entretenir des arbres, et les rémunérer pour ça.


  Le mouvement a planté des dizaines de millions d''arbres au Kenya, et a donné du travail et une voix à des milliers de femmes. En 2004, Wangari Maathai reçoit le prix Nobel de la paix. C''est la première femme africaine à le recevoir.


  Ce que son histoire nous apprend :

  🌱 Ton savoir prend tout son sens quand tu le relies à un problème réel.

  🌱 Une solution simple, fondée sur la science, peut changer la vie de milliers de personnes.

  🌱 La valorisation, ce n''est pas que l''argent : c''est aussi l''impact.


  La vidéo raconte son parcours en 50 secondes. 🎬 Partage cette histoire. 🔁


  HSA, le Hub Scientifique Africain.


  🚀 Tu veux qu''en 2027 ta recherche serve vraiment ? Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : méthode, opportunités, profil visible et entraide. Lien en commentaire.'
textes:
  linkedin: 'En 1971, Wangari Maathai obtient un doctorat à l''université de Nairobi : elle est la première femme d''Afrique de l''Est et centrale à obtenir ce diplôme.


    Biologiste et enseignante, elle relie ses connaissances aux difficultés exprimées par les femmes rurales : raréfaction du bois de chauffe, manque d''eau, appauvrissement des sols, liés à la déforestation.


    En 1977, elle fonde le Green Belt Movement, qui forme et rémunère des femmes pour planter et entretenir des arbres. Le mouvement a planté des dizaines de millions d''arbres au Kenya. En 2004, Wangari Maathai devient la première femme africaine lauréate du prix Nobel de la paix.


    Son parcours illustre une forme de valorisation fondée sur l''impact : relier une expertise scientifique à un problème réel, et la traduire en une solution simple et collective.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · #RechercheAfricaine #FemmesEnScience'
