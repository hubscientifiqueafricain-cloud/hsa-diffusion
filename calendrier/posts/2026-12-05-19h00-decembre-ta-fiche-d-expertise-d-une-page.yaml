texte: '🗓️ Série « Prépare 2027 »


  Si tu veux des missions en 2027, prépare ce document en décembre.


  Une ONG cherche quelqu''un qui connaît ton sujet. Tu as 2 minutes pour lui montrer ce que tu sais faire. Tu lui envoies quoi ? Ton mémoire de 120 pages ? 😅


  Il te faut une fiche d''expertise : une seule page qui dit clairement ce que tu sais, ce que tu as trouvé et ce que tu peux faire pour quelqu''un.


  Voici ce qu''elle contient :


  📌 EN HAUT : ton nom, ton titre clair (« Spécialiste de la gestion de l''eau en milieu rural »), ton contact.

  🔎 TON DOMAINE : 3 à 5 sujets que tu maîtrises vraiment.

  💡 TES RÉSULTATS CLÉS : 2 ou 3 résultats de ta recherche, en une phrase chacun, en langage simple.

  🛠️ CE QUE TU PEUX FAIRE : des services concrets. Exemples : enquête de terrain, analyse de données, formation d''équipes, note de synthèse, revue documentaire.

  🗂️ TES RÉFÉRENCES : ton mémoire ou ta thèse, tes publications, tes stages, une mission déjà réalisée.

  🌍 TES LANGUES ET TES ZONES : les langues que tu parles, les régions que tu connais.


  Une page, pas plus. Un PDF propre. Et tu l''envoies avec chaque prise de contact.


  Le carrousel te donne le plan complet. 👆 Enregistre-le et prépare ta fiche cette semaine.


  On est HSA, le Hub Scientifique Africain.


  🚀 Tu veux qu''en 2027 ta recherche serve vraiment ? Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : méthode, opportunités, profil visible et entraide. Lien en commentaire.'
textes:
  linkedin: 'Lorsqu''une organisation recherche une expertise, elle dispose de peu de temps pour évaluer un profil. Un mémoire ou une thèse ne peut pas jouer ce rôle.


    La fiche d''expertise, document d''une page, répond à ce besoin. Elle comprend :

    • l''identité, un titre explicite et les coordonnées ;

    • trois à cinq domaines de compétence ;

    • deux ou trois résultats de recherche, formulés simplement ;

    • les services proposés : enquête de terrain, analyse de données, formation, note de synthèse, revue documentaire ;

    • les références : travaux, publications, stages, missions ;

    • les langues parlées et les zones géographiques connues.


    Ce document accompagne chaque prise de contact et facilite la décision de l''interlocuteur.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    #ValorisationDeLaRecherche #Expertise #JeunesChercheurs'
