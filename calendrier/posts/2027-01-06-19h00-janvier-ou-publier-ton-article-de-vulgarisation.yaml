texte: '🎓 Série « Carrière de chercheur »


  Tu as écrit ton article de vulgarisation. 👏🏾 Maintenant, il faut qu''il soit lu. Voici 5 endroits où le proposer :


  📰 LES JOURNAUX ET MÉDIAS EN LIGNE

  Beaucoup acceptent des tribunes ou des articles d''experts. Repère la rubrique « opinions » ou « contributions » et écris à la rédaction.


  🌐 LES SITES DE VULGARISATION SCIENTIFIQUE

  Certains sont spécialement conçus pour que des chercheurs écrivent pour le grand public. Renseigne-toi sur ceux qui publient en français.


  🏛️ LE SITE ET LES RÉSEAUX DE TON UNIVERSITÉ OU DE TON LABORATOIRE

  Ils cherchent souvent du contenu. Propose ton texte au service communication.


  📻 LA RADIO

  Ton article peut devenir une intervention. Les radios locales et communautaires cherchent des experts qui parlent simplement.


  📱 TES PROPRES RÉSEAUX

  LinkedIn, Facebook, un blog. C''est le plus simple pour commencer, et ça construit ta visibilité.


  💡 Garde une trace de chaque publication : lien, date, capture. C''est une ligne de plus dans ton CV, rubrique « diffusion de la culture scientifique ».


  La vidéo résume les 5 pistes. 🎬 Et toi, où publierais-tu en premier ?


  HSA, le Hub Scientifique Africain.


  📈 Valoriser ta recherche et construire ta carrière, c''est le même chemin. Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : profil visible, opportunités, attestation et entraide. Lien en commentaire.'
textes:
  linkedin: 'Une fois rédigé, un article de vulgarisation peut être proposé à plusieurs types de supports :


    - les journaux et médias en ligne, via leurs rubriques de tribunes ou de contributions d''experts ;

    - les sites spécialisés dans la vulgarisation scientifique, qui accueillent des textes de chercheurs ;

    - les sites et réseaux des universités et laboratoires ;

    - les radios, notamment locales et communautaires, qui recherchent des experts ;

    - les réseaux professionnels et blogs personnels.


    Il est recommandé de conserver une trace de chaque publication, qui peut figurer dans le CV sous la rubrique « diffusion de la culture scientifique ».


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
