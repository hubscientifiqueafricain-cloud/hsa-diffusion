texte: 'Il y a 30 jours, beaucoup d''entre vous ne savaient pas ce que voulait dire « valoriser sa recherche ». 🌱

  Aujourd''hui, tu sais :

  ✅ ce qu''est la valorisation, et ce qu''elle n''est pas ;

  ✅ qu''elle se prépare dès le choix du sujet, et qu''il n''est jamais trop tard ;

  ✅ qu''il existe au moins 10 voies pour le faire ;

  ✅ qu''une méthode en 6 étapes permet de passer à l''action ;

  ✅ que des chercheurs africains ont déjà transformé leur thèse en entreprise ;

  ✅ et qu''il existe un endroit pour t''accompagner.


  Maintenant, imagine.

  Imagine des milliers de mémoires et de thèses africaines qui sortent des tiroirs.

  Des décideurs qui s''appuient sur des données d''ici.

  Des communautés qui profitent de solutions pensées pour elles.

  Des jeunes chercheurs qui vivent de leur expertise, et qu''on cite, qu''on invite, qu''on recrute.


  C''est ça, le mouvement qu''on construit à HSA. Une recherche africaine qui produit de l''impact, des revenus et de la notoriété.


  Et ce mouvement a besoin de toi.


  👉 Crée ton espace gratuit sur HSA (lien en commentaire).

  👉 Fais ta Boussole de valorisation.

  👉 Partage ce post à 3 chercheurs qui doivent nous rejoindre.


  Merci d''avoir suivi cette série avec nous. Ce n''est pas la fin. C''est le début. 💛


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'En trente jours, cette série a présenté ce qu''est la valorisation de la recherche, le moment de s''y engager, les dix voies possibles, une méthode en six étapes, des exemples d''entreprises africaines issues de thèses, et les outils proposés par le Hub Scientifique Africain.


    L''ambition est collective : que les mémoires et thèses africains sortent des tiroirs, que les décisions s''appuient sur des données locales, que les communautés bénéficient de solutions adaptées, et que les jeunes chercheurs puissent vivre de leur expertise.


    C''est le sens de notre mission : une recherche africaine qui produit de l''impact, des revenus et de la notoriété.


    Pour rejoindre ce mouvement : créer son espace gratuit sur la plateforme, réaliser la Boussole de valorisation, et partager cette série avec les chercheurs de son réseau.


    Merci de nous avoir suivis.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
