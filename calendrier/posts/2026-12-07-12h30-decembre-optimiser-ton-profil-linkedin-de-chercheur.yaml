texte: '🗓️ Série « Prépare 2027 »


  Avant le 1er janvier, mets ta vitrine à jour : ton profil LinkedIn.


  Quand une organisation cherche un expert, elle tape des mots-clés sur Google ou sur LinkedIn. Si ton profil dit seulement « Étudiant à l''université de… », tu es invisible. 👻


  LinkedIn est l''un des endroits où les ONG, les entreprises, les bailleurs et les recruteurs cherchent des profils. Voici 6 réglages simples pour que ta recherche y soit visible :


  1️⃣ LE TITRE : pas « Doctorant », mais ce que tu sais faire. « Doctorant en santé publique | Paludisme et prévention en milieu rural ».

  2️⃣ LA PHOTO : ton visage, net, souriant, sur un fond simple.

  3️⃣ LA SECTION « INFOS » : ton résumé grand public (celui de notre post du 4 décembre 😉) + ce que tu peux faire pour une organisation.

  4️⃣ LES COMPÉTENCES : celles que les gens cherchent : « analyse de données », « enquête de terrain », « évaluation de projet ».

  5️⃣ LA SECTION « SÉLECTION » : épingle ton article, ton mémoire, ta fiche d''expertise ou une vidéo.

  6️⃣ L''ACTIVITÉ : un post par semaine ou par quinzaine sur ton sujet suffit pour rester visible.


  Tout ça prend environ une heure. Et ça travaille pour toi pendant des années.


  Le carrousel te montre chaque réglage, avec des exemples. 👆 Enregistre-le et fais la mise à jour ce week-end.


  On est HSA, le Hub Scientifique Africain.


  🚀 Tu veux qu''en 2027 ta recherche serve vraiment ? Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : méthode, opportunités, profil visible et entraide. Lien en commentaire.'
textes:
  linkedin: 'Les organisations qui recherchent une expertise commencent souvent par une recherche par mots-clés, sur un moteur de recherche ou sur LinkedIn. Un profil qui se limite à « Doctorant à l''université de… » n''apparaît dans aucune de ces recherches.


    Six éléments rendent un profil de chercheur visible et lisible :

    1. Un titre qui associe le statut et l''expertise (« Doctorant en santé publique | Prévention du paludisme en milieu rural »).

    2. Une photo professionnelle.

    3. Une section « Infos » qui présente la recherche en langage courant et les services possibles.

    4. Des compétences recherchées : analyse de données, enquête de terrain, évaluation.

    5. Une section « Sélection » qui met en avant les travaux principaux.

    6. Une publication régulière, même modeste, sur le domaine.


    Une heure de mise à jour suffit pour un résultat durable.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    #ValorisationDeLaRecherche #LinkedIn #JeunesChercheurs'
