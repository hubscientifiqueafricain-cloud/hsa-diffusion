texte: 'Ce mois-ci, on t''a parlé d''identité numérique de chercheur. 🌐 Voici un outil gratuit pour en faire partie : ton profil de chercheur sur le Hub Scientifique Africain (HSA).


  🎯 À QUOI IL SERT POUR TA CARRIÈRE

  • Présenter qui tu es, ta discipline, ton domaine d''expertise et tes travaux, au même endroit.

  • Être visible dans un écosystème dédié à la recherche africaine, où des organisations cherchent des experts.

  • Avoir un lien simple à mettre dans ton CV, ta signature e-mail et ton profil LinkedIn.


  ✍🏾 COMMENT LE CRÉER, EN 3 ÉTAPES

  1. Va sur hubscientifiqueafricain.com et crée ton espace.

  2. Remplis ton profil : photo professionnelle, titre clair, discipline, mots-clés, résumé de ta recherche.

  3. Ajoute tes travaux : mémoire, thèse, articles, communications.


  💡 L''astuce : écris ton résumé comme on l''a vu ce mois-ci, avec des mots simples et le problème que ta recherche aide à résoudre. Un recruteur qui n''est pas de ta discipline doit comprendre en 10 secondes.


  C''est gratuit. Ça prend 15 minutes. Et c''est une trace de plus de ton travail en ligne.


  Le carrousel détaille les étapes. 👆 Le lien est en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le profil de chercheur sur le Hub Scientifique Africain (HSA) est gratuit. Il contribue à l''identité numérique professionnelle du chercheur.


    Il permet de présenter en un seul endroit sa discipline, son expertise et ses travaux ; d''être visible dans un écosystème dédié à la recherche africaine, consulté par des organisations à la recherche d''experts ; et de disposer d''un lien à intégrer à son CV et à ses profils professionnels.


    La création se fait en trois étapes sur hubscientifiqueafricain.com : ouverture de l''espace, renseignement du profil, ajout des travaux.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
