texte: 'Exercice du jour : les étapes 1 et 2 de la méthode. 📝 Prends 30 minutes, une feuille (ou un tableur), et ta recherche sous les yeux.


  ÉTAPE 1 : L''INVENTAIRE

  Fais un tableau avec une colonne « Ce que j''ai ». Remplis-la en passant par ces 7 catégories :

  • Données (enquêtes, mesures, bases)

  • Outils (questionnaires, protocoles, codes, modèles)

  • Cartes et schémas

  • Résultats et recommandations

  • Prototypes ou procédés

  • Compétences (sujets, méthodes, logiciels maîtrisés)

  • Réseau (personnes et structures rencontrées)

  Écris tout, même ce qui te semble banal. Tu feras le tri après.


  ÉTAPE 2 : LES BÉNÉFICIAIRES

  Ajoute une colonne « À qui ça sert ? ». Pour chaque ligne, cherche au moins un bénéficiaire concret. Pose-toi 3 questions :

  1. Qui a le problème que ma recherche éclaire ?

  2. Qui prend des décisions sur ce sujet ?

  3. Qui travaille déjà sur ce terrain et manque d''informations ?


  Exemple : « Enquête auprès de 300 ménages sur l''accès à l''eau » ➡️ ONG du secteur eau et assainissement, direction de l''hydraulique, mairie, bureaux d''études.


  Ajoute enfin une colonne « Ce que ça leur apporte ». C''est elle qui te servira à construire ton offre à l''étape 4.


  Le carrousel contient le modèle de tableau et un exemple rempli. 👆

  Fais l''exercice et partage ta première ligne en commentaire : je te dis ce que j''en pense. 👇


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Premier exercice de la méthode de valorisation : l''inventaire (étape 1) et l''identification des bénéficiaires (étape 2).


    Étape 1 : recenser dans un tableau tous les éléments de la recherche, selon sept catégories : données, outils méthodologiques, cartes et schémas, résultats et recommandations, prototypes ou procédés, compétences, réseau.


    Étape 2 : associer à chaque élément au moins un bénéficiaire, en se demandant qui rencontre le problème étudié, qui décide sur le sujet, et qui intervient sur le terrain sans disposer de l''information.


    Exemple : une enquête auprès de 300 ménages sur l''accès à l''eau intéresse les ONG du secteur, la direction de l''hydraulique, les communes et les bureaux d''études.


    Une troisième colonne, « ce que cela leur apporte », prépare la construction de l''offre.


    Le carrousel propose le modèle de tableau et un exemple complet.


    Hub Scientifique Africain (HSA)

    #ValorisationDeLaRecherche #Méthode #Doctorat'
