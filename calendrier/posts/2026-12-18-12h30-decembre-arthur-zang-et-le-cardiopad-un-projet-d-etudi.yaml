texte: '🗓️ Série « Prépare 2027 »


  Une histoire vraie pour t''inspirer avant 2027.


  Au Cameroun, il y a très peu de cardiologues, et ils travaillent surtout dans les grandes villes. Pour un patient du village, faire un examen du cœur peut vouloir dire des heures de route. 🫀


  Arthur Zang, jeune ingénieur camerounais formé à l''École polytechnique de Yaoundé, s''est posé une question : et si l''examen pouvait se faire sur place, et le cardiologue l''analyser à distance ?


  Il commence à travailler sur l''idée pendant ses études. Le résultat s''appelle le Cardiopad : une tablette médicale qui permet à un infirmier de réaliser un électrocardiogramme dans un centre de santé éloigné, et d''envoyer les résultats à un cardiologue, qui les interprète à distance.


  Le chemin n''a pas été simple : trouver des financements, tester l''appareil, convaincre. Mais en 2014, Arthur Zang reçoit un prix Rolex à l''esprit d''entreprise, qui fait connaître son invention dans le monde entier. Il crée son entreprise pour produire et diffuser le Cardiopad.


  Ce qu''on retient :

  💡 Tout part d''un problème réel, observé chez soi.

  💡 Un projet d''étudiant peut devenir une entreprise.

  💡 Les prix et concours peuvent changer l''échelle d''un projet.


  Le carrousel raconte son parcours étape par étape. 👆 Partage-le à un étudiant ingénieur. 🔁


  On est HSA, le Hub Scientifique Africain.


  🎯 Pour tenir tes objectifs 2027, ne reste pas seul : le Pass Valorisation HSA te donne la méthode (programme certifiant), les opportunités chaque semaine et un groupe pour avancer. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'Au Cameroun, les cardiologues sont peu nombreux et concentrés dans les grandes villes, ce qui complique l''accès aux examens cardiaques en zone rurale.


    Arthur Zang, ingénieur formé à l''École nationale supérieure polytechnique de Yaoundé, a développé à partir de ses travaux d''étudiant le Cardiopad : une tablette médicale qui permet de réaliser un électrocardiogramme dans un centre de santé éloigné et d''en transmettre les résultats à un cardiologue pour une interprétation à distance.


    Le projet a nécessité des années de développement, de tests et de recherche de financement. En 2014, Arthur Zang est distingué par un prix Rolex à l''esprit d''entreprise, qui accroît la visibilité internationale du dispositif, produit et diffusé par l''entreprise qu''il a fondée.


    Ce parcours illustre le passage d''un projet académique à une innovation au service des patients.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · #RechercheAfricaine #InnovationAfricaine'
