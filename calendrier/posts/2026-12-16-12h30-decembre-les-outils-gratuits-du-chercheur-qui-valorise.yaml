texte: '🗓️ Série « Prépare 2027 »


  Ta boîte à outils pour 2027, gratuite.


  Pas besoin d''un gros budget pour valoriser ta recherche. Voici des outils gratuits (ou avec une version gratuite) que tu peux utiliser dès aujourd''hui. 🧰


  🆔 ORCID : un identifiant unique de chercheur. Tous tes travaux sont reliés à toi, même si ton nom s''écrit de plusieurs façons.


  📚 GOOGLE SCHOLAR : un profil public qui rassemble tes publications et leurs citations.


  🗂️ ZOTERO : pour gérer tes références et ta bibliographie sans t''arracher les cheveux.


  💾 ZENODO : pour déposer tes données, tes posters ou tes rapports avec un identifiant permanent.


  🎨 CANVA : pour faire tes infographies, tes affiches et tes visuels de posts, même sur téléphone.


  📋 KOBOTOOLBOX : pour collecter des données d''enquête sur téléphone, même hors connexion.


  💼 LINKEDIN : pour être visible des organisations et partager ta recherche.


  🌍 TON PROFIL HSA : une page de chercheur sur une plateforme dédiée à la recherche africaine, où tu peux importer tes travaux depuis ORCID ou Google Scholar.


  Pas besoin de tout utiliser. Commence par ORCID et un profil public : c''est la base de ta visibilité.


  Le carrousel te donne la liste, avec à quoi sert chaque outil. 👆 Enregistre-le.


  On est HSA, le Hub Scientifique Africain.


  🚀 Tu veux qu''en 2027 ta recherche serve vraiment ? Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : méthode, opportunités, profil visible et entraide. Lien en commentaire.'
textes:
  linkedin: 'Plusieurs outils gratuits, ou disposant d''une version gratuite, soutiennent la visibilité et la valorisation des travaux de recherche :

    • ORCID : identifiant unique qui relie un chercheur à l''ensemble de ses travaux.

    • Google Scholar : profil public des publications et de leurs citations.

    • Zotero : gestion des références bibliographiques.

    • Zenodo : dépôt de données, posters et rapports, avec identifiant pérenne.

    • Canva : création d''infographies et de visuels.

    • KoboToolbox : collecte de données d''enquête sur mobile, y compris hors connexion.

    • LinkedIn : visibilité auprès des organisations.

    • Le profil de chercheur HSA, qui permet l''import des travaux depuis ORCID ou Google Scholar.


    ORCID et un profil public constituent un point de départ suffisant.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    #ValorisationDeLaRecherche #OutilsDuChercheur #ScienceOuverte'
