texte: '💰 Série « Gagner de l''argent avec ta recherche »


  L''accès à une eau potable reste un défi pour de nombreuses familles en Afrique. 💧 En Tanzanie, une recherche a donné naissance à un filtre à eau : le Nanofilter.


  🔬 LA RECHERCHE

  Le Nanofilter utilise des nanomatériaux pour filtrer l''eau. Il est issu des travaux menés à la Nelson Mandela African Institution of Science and Technology (NM-AIST), en Tanzanie.


  🏭 L''ENTREPRISE

  Une spin-off de l''institution produit le Nanofilter, pour le mettre à la disposition des familles et des communautés.


  🏆 LA RECONNAISSANCE

  Son inventeur, le chercheur tanzanien Askwar Hilonga, a remporté en 2015 le premier Africa Prize for Engineering Innovation, un prix qui récompense des innovations d''ingénierie en Afrique.


  💡 CE QUE CETTE HISTOIRE NOUS APPREND

  • Les meilleures innovations partent souvent d''un problème du quotidien.

  • Un prix peut donner à un projet la visibilité et les moyens de grandir.

  • Recherche, entreprise et impact social peuvent avancer ensemble.


  Et toi, quel problème de ton quartier, de ton village, de ton pays voudrais-tu régler avec ta recherche ? Dis-le en commentaire. 👇


  HSA, le Hub Scientifique Africain.


  📘 Tu veux les 10 façons dans un seul document ? Le guide HSA est gratuit. Et pour avancer toute l''année, il y a le Pass Valorisation à 2 000 FCFA. Liens en commentaire.'
textes:
  linkedin: 'Le Nanofilter, filtre à eau fondé sur des nanomatériaux, est issu de travaux menés à la Nelson Mandela African Institution of Science and Technology (NM-AIST) en Tanzanie, et produit par une spin-off de l''institution. Son inventeur, Askwar Hilonga, a reçu en 2015 le premier Africa Prize for Engineering Innovation.


    Ce parcours montre comment une recherche ancrée dans un problème local peut associer valorisation économique et impact social.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
