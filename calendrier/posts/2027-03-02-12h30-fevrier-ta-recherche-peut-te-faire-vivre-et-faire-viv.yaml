texte: 'Nous croyons qu''un chercheur africain ne devrait pas avoir à choisir entre sa recherche et sa survie. ✊🏾


  Nous croyons que ce qui se découvre dans nos laboratoires, nos terrains et nos bibliothèques peut servir nos entreprises, nos ONG, nos communautés.


  Nous croyons que faire payer son expertise n''est pas une honte. C''est une reconnaissance.


  Nous croyons que personne ne devrait avancer seul.


  C''est pour ça que le Hub Scientifique Africain existe. Et c''est pour ça qu''on a créé le Pass Valorisation, à 2 000 FCFA pour l''année : pour que chaque masterant, doctorant et jeune docteur puisse apprendre, être visible, saisir les opportunités, et avancer avec d''autres.


  Si tu y crois aussi, rejoins-nous. 👉 Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le Hub Scientifique Africain part d''une conviction : les chercheurs africains ne devraient pas avoir à choisir entre leur recherche et leur subsistance, et les savoirs produits sur le continent peuvent servir ses entreprises, ses organisations et ses communautés.


    Le Pass Valorisation (2 000 FCFA par an) traduit cette conviction en un accompagnement accessible : méthode, visibilité, opportunités et entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
