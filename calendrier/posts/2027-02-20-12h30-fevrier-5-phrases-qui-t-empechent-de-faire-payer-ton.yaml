texte: '💰 Série « Gagner de l''argent avec ta recherche »


  Il y a des phrases qu''on se répète et qui nous empêchent de gagner de l''argent avec ce qu''on sait. 💭 Voici les 5 plus fréquentes chez les chercheurs, et ce qu''on peut leur répondre.


  1️⃣ « Personne ne paiera pour ça. »

  As-tu demandé ? Beaucoup d''organisations paient déjà des consultants pour ce que tu sais faire.


  2️⃣ « Je ne suis pas assez expert. »

  Tu n''as pas besoin d''être le meilleur du monde. Juste d''en savoir plus que ton client sur son problème.


  3️⃣ « Je ne sais pas vendre. »

  Tu ne vends pas. Tu expliques comment tu peux aider. Et ça, tu sais le faire : tu l''as fait devant ton jury.


  4️⃣ « Ce n''est pas mon rôle de chercheur. »

  Ton rôle est aussi que ta recherche serve. Et elle sert mieux quand tu peux en vivre.


  5️⃣ « Je commencerai quand j''aurai fini ma thèse. »

  Tu peux commencer petit dès maintenant, avec un créneau par semaine.


  Le carrousel reprend les 5 phrases et leurs réponses. 👆 Laquelle tu te dis le plus souvent ? Dis-le en commentaire, sans honte. 👇


  HSA, le Hub Scientifique Africain.


  🎯 Pour passer de l''idée au premier revenu sans avancer seul : le Pass Valorisation HSA te donne la méthode (avec attestation), les financements chaque semaine, un profil visible et un groupe d''entraide. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'Cinq croyances freinent fréquemment la valorisation économique de l''expertise scientifique : l''idée que personne ne paiera, le sentiment d''expertise insuffisante, la crainte de « vendre », la perception d''un conflit avec le rôle de chercheur, et le report systématique après la thèse.


    Chacune peut être nuancée : la demande existe, l''expertise est relative au besoin du client, présenter son offre revient à expliquer comment on peut aider, et une activité modeste peut débuter dès le doctorat.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
