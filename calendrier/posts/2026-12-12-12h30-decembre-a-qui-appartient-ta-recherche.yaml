texte: '🗓️ Série « Prépare 2027 »


  Avant de lancer tes projets 2027, vérifie un point important : qui possède quoi.


  « Mon mémoire, c''est le mien, je fais ce que je veux avec. » 🤔 Pas si vite.


  Avant de valoriser ta recherche, tu dois savoir qui a des droits dessus. Ce n''est pas toujours aussi simple qu''on le pense, et une mauvaise surprise peut bloquer un projet. Voici les grandes règles, de façon générale :


  📝 LE TEXTE de ton mémoire ou de ta thèse : en général, tu en es l''auteur, donc tu as des droits dessus. Mais ton université peut avoir des règles sur le dépôt et la diffusion.


  💡 UNE INVENTION (un procédé, un appareil, une formule) : elle peut appartenir en partie ou en totalité à ton université, ton laboratoire ou ton employeur, surtout si elle a été faite avec leurs moyens. C''est souvent prévu dans un règlement ou un contrat.


  💰 UN PROJET FINANCÉ : le contrat avec le bailleur peut prévoir qui possède les résultats et les données.


  🤝 LES DONNÉES D''UN PARTENAIRE (une entreprise, un hôpital, une ONG) : leur usage dépend de la convention que vous avez signée.


  Que faire ? 3 réflexes :

  1. Lis le règlement de ton université et tes contrats (bourse, stage, projet).

  2. Parles-en avec ton encadreur, tôt.

  3. Pour un brevet en Afrique francophone, renseigne-toi auprès de ta structure nationale de liaison avec l''OAPI (Organisation africaine de la propriété intellectuelle).


  Ce post donne des repères généraux, pas un avis juridique : chaque situation dépend de tes textes.


  La vidéo résume tout en 45 secondes. 🎬


  HSA, le Hub Scientifique Africain.


  🎯 Pour tenir tes objectifs 2027, ne reste pas seul : le Pass Valorisation HSA te donne la méthode (programme certifiant), les opportunités chaque semaine et un groupe pour avancer. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'La valorisation d''un travail de recherche suppose de savoir qui détient des droits sur ses différentes composantes. Quelques repères généraux :

    • Le texte du mémoire ou de la thèse : l''étudiant en est généralement l''auteur, sous réserve des règles de dépôt et de diffusion de l''établissement.

    • Une invention : elle peut revenir, en tout ou partie, à l''université, au laboratoire ou à l''employeur, notamment lorsqu''elle a été réalisée avec leurs moyens.

    • Un projet financé : le contrat de financement peut fixer la propriété des résultats et des données.

    • Les données d''un partenaire : leur usage est encadré par la convention conclue.


    Trois réflexes : consulter le règlement de l''établissement et les contrats (bourse, stage, projet) ; en parler tôt avec l''encadrement ; pour un brevet en Afrique francophone, se renseigner auprès de la structure nationale de liaison avec l''OAPI.


    Ces repères ne constituent pas un avis juridique.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    #ValorisationDeLaRecherche #ProprieteIntellectuelle #OAPI'
