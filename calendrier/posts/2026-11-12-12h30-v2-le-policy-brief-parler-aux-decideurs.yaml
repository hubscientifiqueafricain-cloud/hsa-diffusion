texte: 'Ta recherche pourrait changer une politique publique. Mais aucun ministre ne lira ta thèse de 300 pages. 🏛️

  Par contre, il peut lire 2 pages en 5 minutes. Ce document s''appelle un policy brief, ou note de politique.


  C''est l''une des voies de valorisation sociale les plus puissantes, et elle marche dans toutes les disciplines : santé, éducation, agriculture, environnement, droit, économie.


  LA STRUCTURE D''UN POLICY BRIEF (2 pages maximum) :


  1️⃣ UN TITRE QUI DIT LE MESSAGE. Pas « Étude des déterminants… », mais « Former les relais communautaires réduirait les abandons de traitement ».

  2️⃣ LE RÉSUMÉ EN 3 LIGNES. Le problème, ce que tu as trouvé, ce que tu recommandes.

  3️⃣ LE PROBLÈME. Pourquoi c''est important maintenant, avec un ou deux chiffres clés.

  4️⃣ CE QUE DIT LA RECHERCHE. Tes résultats principaux, en langage simple, avec un graphique si possible.

  5️⃣ LES RECOMMANDATIONS. 3 actions concrètes, réalistes, qui disent QUI fait QUOI.

  6️⃣ TES COORDONNÉES et la référence de ton travail.


  À QUI L''ENVOYER ? Aux directions techniques des ministères, aux collectivités, aux agences publiques, aux ONG qui font du plaidoyer, aux parlementaires de la commission concernée. Mieux : demande un rendez-vous pour le présenter en 15 minutes.


  Le carrousel te donne le modèle complet. 👆 Enregistre-le pour le jour où tu en auras besoin.


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le policy brief, ou note de politique, est l''outil privilégié pour porter des résultats de recherche auprès des décideurs. Il tient en deux pages et se lit en cinq minutes.


    Structure recommandée :

    1. Un titre qui énonce le message principal.

    2. Un résumé en trois lignes : problème, résultat, recommandation.

    3. Le problème et son actualité, avec un ou deux chiffres clés.

    4. Les résultats de la recherche, en langage accessible, idéalement avec un graphique.

    5. Trois recommandations concrètes et réalistes, précisant qui fait quoi.

    6. Les coordonnées de l''auteur et la référence du travail.


    Destinataires : directions techniques des ministères, collectivités, agences publiques, ONG de plaidoyer, commissions parlementaires. Une présentation orale de quinze minutes renforce l''impact.


    Le carrousel présente le modèle complet.


    Hub Scientifique Africain (HSA)

    #PolicyBrief #PolitiquesPubliques #RechercheAfricaine'
