texte: "Plantes médicinales, techniques agricoles, savoir-faire artisanaux : la recherche africaine travaille souvent sur des savoirs locaux. Les valoriser demande des précautions.\n\nDans cette micro-formation :\n▶ Les 3 règles d'or\n   • 1. Le consentement\n   • 2. Le partage des avantages\n   • 3. La reconnaissance\n▶ Les formes possibles\n   • Produits, guides, formations\n\nÀ retenir : Valoriser les savoirs locaux, c'est créer de la valeur avec les communautés, jamais à leurs dépens.\n\n\U0001F4AC Tu as une question sur la valorisation de ta recherche ? Pose-la en commentaire : on y répondra dans une prochaine vidéo.\n\U0001F514 Abonne-toi pour ne rien manquer de la série « Valoriser ta recherche · 1 question, 2 minutes ».\n\n\U0001F310 HSA, le Hub Scientifique Africain : https://www.hubscientifiqueafricain.com\n\n#ValorisationDeLaRecherche #Doctorat #RechercheAfricaine"
