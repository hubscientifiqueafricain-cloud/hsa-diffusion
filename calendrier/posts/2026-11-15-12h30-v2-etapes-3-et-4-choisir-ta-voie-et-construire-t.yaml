texte: 'Tu as fait ton inventaire et trouvé tes bénéficiaires ? Bravo. 👏🏾 Maintenant, on passe aux étapes 3 et 4 : choisir ta voie et construire ton offre.


  ÉTAPE 3 : CHOISIR TA VOIE

  Réponds à 3 questions :

  1. Quel est mon objectif principal ? Impact, revenus ou carrière ?

  2. Quelle est la nature de mon résultat ? Un savoir, des données, un outil, une invention ?

  3. De combien de temps et de moyens je dispose ?


  Puis croise :

  ➡️ Objectif impact + savoir ou données : vulgarisation, policy brief, partenariat avec une ONG.

  ➡️ Objectif revenus + savoir : expertise, formation.

  ➡️ Objectif revenus + invention ou outil : produit, licence, startup.

  ➡️ Objectif carrière : publication en accès ouvert, prix et concours, communications.

  Choisis 1 ou 2 voies. Pas plus pour commencer.


  ÉTAPE 4 : CONSTRUIRE TON OFFRE

  Ton offre, c''est ce que tu proposes concrètement. Elle tient en 5 phrases, ton pitch :

  1. Le problème : « Beaucoup de [qui] ont du mal à [quoi]. »

  2. Ta solution : « J''ai étudié/développé [quoi]. »

  3. La preuve : « Ma recherche montre que [résultat]. »

  4. Ce que tu proposes : « Je propose [formation/étude/outil] pour [bénéfice]. »

  5. L''appel : « Est-ce qu''on peut en parler 15 minutes ? »


  Ce pitch, tu l''utiliseras partout : en message, en rendez-vous, en candidature, sur ton profil.


  Le carrousel contient la grille de choix et un exemple de pitch complet. 👆

  À toi : écris ton pitch en commentaire, on t''aide à l''améliorer. 👇


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Troisième et quatrième étapes de la méthode de valorisation.


    Étape 3, choisir sa voie, à partir de trois critères : l''objectif principal (impact, revenus ou carrière), la nature du résultat (savoir, données, outil, invention) et les moyens disponibles.

    • Impact et savoir ou données : vulgarisation, policy brief, partenariat.

    • Revenus et savoir : expertise, formation.

    • Revenus et invention : produit, licence, création d''entreprise.

    • Carrière : accès ouvert, prix, communications.

    Une ou deux voies suffisent pour commencer.


    Étape 4, construire son offre, résumée en un pitch de cinq phrases : le problème, la solution étudiée, la preuve apportée par la recherche, la proposition concrète, et l''invitation à échanger.


    Ce pitch sert ensuite dans tous les contextes : prise de contact, rendez-vous, candidature, profil professionnel.


    Hub Scientifique Africain (HSA)

    #Pitch #ValorisationDeLaRecherche #Méthode'
