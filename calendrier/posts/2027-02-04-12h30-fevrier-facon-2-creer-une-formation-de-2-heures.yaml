texte: '💰 Série « Gagner de l''argent avec ta recherche »


  Ce que tu as appris en 2 ou 3 ans de recherche, d''autres veulent l''apprendre en quelques heures. 👩🏾‍🏫 C''est la façon n°2 de gagner de l''argent avec ta recherche : former et animer des ateliers.


  🎯 POUR TOI SI…

  Ton sujet concerne des professionnels ou un public précis : agriculteurs, enseignants, agents de santé, commerçants, agents d''ONG…


  💡 PAR EXEMPLE

  Une masterante en nutrition pourrait former les agents communautaires d''un centre de santé au repérage de la malnutrition, avec les outils de son mémoire.


  🛠️ TA FORMATION DE 2 HEURES, EN 3 PARTIES

  1. Comprendre (30 minutes) : le problème et ce que dit la recherche, avec des mots simples.

  2. Pratiquer (1 heure) : un exercice, un cas, une mise en situation.

  3. Repartir avec un outil (30 minutes) : une fiche, une checklist, un modèle à utiliser dès le lendemain.


  📣 À QUI LA PROPOSER

  Une ONG, une coopérative, une association professionnelle, une entreprise, une école. Commence par une structure que tu connais déjà.


  ⚠️ Le secret d''une bonne formation : moins de théorie, plus de pratique. Les participants doivent repartir capables de faire quelque chose de nouveau.


  Le carrousel détaille la méthode. 👆 Ton premier pas : écris le programme de ta formation cette semaine.


  HSA, le Hub Scientifique Africain.


  📘 Tu veux les 10 façons dans un seul document ? Le guide HSA est gratuit. Et pour avancer toute l''année, il y a le Pass Valorisation à 2 000 FCFA. Liens en commentaire.'
textes:
  linkedin: 'La formation courte constitue une voie accessible de valorisation des connaissances issues de la recherche, notamment lorsque le sujet concerne des professionnels identifiés.


    Une formation de deux heures peut être structurée en trois temps : compréhension du problème (trente minutes), mise en pratique (une heure) et remise d''un outil opérationnel (trente minutes).


    Les premiers destinataires naturels sont les structures déjà connues du chercheur : ONG, coopératives, associations professionnelles, entreprises, établissements scolaires.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
