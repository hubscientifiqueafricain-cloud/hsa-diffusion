texte: 'Il y a le chercheur 1.0, le 2.0… et le 3.0. Tu es lequel ? 🧑🏾‍🔬


  📘 LE CHERCHEUR 1.0 cherche. Il produit des connaissances, rédige, soutient, publie dans des revues. Son travail est solide, mais il reste dans le monde académique. Peu de gens en dehors de son domaine savent ce qu''il fait.


  💻 LE CHERCHEUR 2.0 cherche et partage. Il a un profil en ligne, il présente ses travaux sur les réseaux, il vulgarise. On commence à le connaître au-delà de son université.


  🚀 LE CHERCHEUR 3.0 cherche, partage et fait servir. Il vulgarise, il collabore avec des entreprises, des ONG et des décideurs, il propose de l''expertise ou des formations, parfois il crée une entreprise. Sa recherche produit de l''impact, des revenus et de la notoriété.


  Le chercheur 3.0 n''est pas moins rigoureux que les autres. Il garde l''exigence scientifique. Il ajoute simplement une question à son travail : « Et maintenant, à qui ça sert ? »


  Bonne nouvelle : on ne naît pas chercheur 3.0. On le devient, avec une méthode et quelques habitudes. C''est exactement ce qu''on a vu ensemble dans cette série.


  Regarde la vidéo. Si c''est le chercheur que tu veux devenir, commente 3.0. 👇


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Trois profils de chercheurs coexistent aujourd''hui.


    Le chercheur 1.0 produit des connaissances et publie. Son travail est solide, mais reste dans la sphère académique.


    Le chercheur 2.0 y ajoute le partage : présence en ligne, vulgarisation, visibilité au-delà de son établissement.


    Le chercheur 3.0 va plus loin : il fait utiliser ses résultats. Il collabore avec les entreprises, les ONG et les décideurs, propose expertise et formation, et crée parfois une entreprise. Sa recherche produit de l''impact, des revenus et de la notoriété.


    Ce profil ne renonce en rien à la rigueur scientifique. Il ajoute une question : à qui ces résultats peuvent-ils servir ?


    Ces compétences s''acquièrent, avec une méthode.


    Hub Scientifique Africain (HSA)

    #Chercheur #Carrière #Innovation'
