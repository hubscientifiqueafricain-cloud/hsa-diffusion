texte: 'Tu as soutenu ta thèse. 🎉 Bravo ! Et maintenant ? Les postes sont rares, et on te dit d''attendre.


  Pendant que tu cherches un poste, ton expertise peut déjà travailler pour toi : études, conseil, formations, accompagnement, interventions. Ce sont des façons de gagner de l''argent, et aussi des lignes de plus sur ton CV.


  Ce que le Pass Valorisation t''apporte, après la thèse :

  ✅ un profil de chercheur visible par des entreprises, ONG et institutions ;

  ✅ les opportunités et financements chaque semaine ;

  ✅ la méthode pour transformer ton expertise en offre ;

  ✅ un groupe d''entraide avec d''autres chercheurs.


  Le Pass coûte 2 000 FCFA pour toute l''année. Le Pass ne fait pas le travail à ta place et ne garantit ni emploi ni revenu. Il te donne la méthode, les opportunités et l''entourage pour avancer.


  👉 Rejoins le Pass sur hubscientifiqueafricain.com. Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Après la soutenance, l''accès aux postes académiques est souvent long. L''expertise acquise peut cependant être mobilisée dès maintenant : études, conseil, formations, accompagnement, interventions.


    Le Pass Valorisation accompagne les jeunes docteurs dans cette démarche : profil de chercheur visible, veille des opportunités, méthode de valorisation et groupe d''entraide. Tarif : 2 000 FCFA par an. Le Pass ne se substitue pas au travail du chercheur et ne garantit ni emploi ni revenu ; il fournit une méthode, un accès aux opportunités et un environnement d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
