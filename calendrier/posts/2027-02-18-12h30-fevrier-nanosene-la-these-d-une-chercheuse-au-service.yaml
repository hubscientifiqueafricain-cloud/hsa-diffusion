texte: '💰 Série « Gagner de l''argent avec ta recherche »


  Comment trouve-t-on de nouveaux médicaments ? 💊 Souvent, en étudiant de très près les protéines sur lesquelles ils agissent. Une chercheuse sud-africaine a transformé sa thèse en outil pour ces chercheurs.


  🔬 LA THÈSE

  Pendant son doctorat, la cofondatrice de Nanosene a travaillé sur des polymères particuliers, appelés « polymères amphiphiles ». Ils permettent d''isoler des protéines membranaires, celles que ciblent de nombreux médicaments.


  🏭 L''ENTREPRISE

  Nanosene est une spin-off de l''Université de Stellenbosch. Elle commercialise ces polymères auprès des laboratoires qui en ont besoin.


  💡 CE QUE CETTE HISTOIRE NOUS APPREND

  • Ton client n''est pas toujours le grand public. Il peut être d''autres chercheurs, d''autres laboratoires.

  • Une recherche très fondamentale peut avoir un marché.

  • Des femmes scientifiques africaines créent des entreprises à partir de leur thèse.


  Si ta recherche te paraît trop technique pour être utile, demande-toi : à qui, dans le monde de la recherche, elle pourrait faire gagner du temps ?


  Le carrousel raconte l''histoire. 👆 Partage-le à une doctorante qui doute.


  HSA, le Hub Scientifique Africain.


  🧭 Pas sûr de la façon qui te correspond ? Fais la Boussole HSA, gratuite. Et pour te lancer accompagné, le Pass Valorisation coûte 2 000 FCFA pour l''année. Liens en commentaire.'
textes:
  linkedin: 'Nanosene, spin-off de l''Université de Stellenbosch, commercialise des polymères amphiphiles permettant d''isoler des protéines membranaires, cibles de nombreux médicaments. Cette technologie est issue de la thèse de doctorat de sa cofondatrice.


    Ce cas rappelle que les clients d''une innovation scientifique peuvent être d''autres laboratoires, et qu''une recherche fondamentale peut trouver un marché.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
