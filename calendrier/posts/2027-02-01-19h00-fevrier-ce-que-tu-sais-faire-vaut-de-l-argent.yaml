texte: '💰 Série « Gagner de l''argent avec ta recherche »


  « Je n''ai rien à vendre. Je n''ai qu''un mémoire. » 🤔 Vraiment ?


  Pendant ta recherche, tu as appris à :

  🔍 poser une question précise ;

  📋 construire un questionnaire ou un protocole ;

  🗣️ mener des entretiens et des enquêtes de terrain ;

  📊 analyser des données ;

  ✍🏾 rédiger un rapport clair et argumenté ;

  🎤 présenter tes résultats devant un jury.


  Ce ne sont pas des détails. Ce sont des compétences que des ONG, des entreprises, des bureaux d''études et des institutions recherchent, et paient.


  Une ONG qui lance un projet a besoin d''une enquête de départ. Une entreprise qui veut lancer un produit a besoin de comprendre son marché. Un projet de développement a besoin de quelqu''un qui sache analyser ses données.


  Le problème n''est presque jamais la qualité de ta recherche. C''est qu''elle n''est connue que de ton jury.


  Regarde la vidéo, puis dis-nous en commentaire : quelle compétence de ta recherche maîtrises-tu le mieux ? 👇


  HSA, le Hub Scientifique Africain.


  🧭 Pas sûr de la façon qui te correspond ? Fais la Boussole HSA, gratuite. Et pour te lancer accompagné, le Pass Valorisation coûte 2 000 FCFA pour l''année. Liens en commentaire.'
textes:
  linkedin: 'La formation à la recherche développe des compétences recherchées sur le marché : formulation de questions, conception d''outils de collecte, enquêtes de terrain, analyse de données, rédaction de rapports, restitution orale.


    Ces compétences répondent à des besoins concrets d''ONG, d''entreprises, de bureaux d''études et d''institutions : études de référence, analyses de marché, traitement de données.


    La principale difficulté pour les jeunes chercheurs tient moins à la qualité de leurs travaux qu''à leur faible visibilité.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
