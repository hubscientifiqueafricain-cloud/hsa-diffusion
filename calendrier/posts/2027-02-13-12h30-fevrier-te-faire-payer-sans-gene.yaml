texte: '💰 Série « Gagner de l''argent avec ta recherche »


  Tu as fait le travail. Le client est content. Mais le paiement tarde. 😬 Et tu n''oses pas relancer. C''est très fréquent chez les jeunes chercheurs. Voici comment éviter cette situation, et comment réagir.


  ✅ AVANT DE COMMENCER

  • Mets-vous d''accord par écrit sur le prix et les conditions : un devis signé, ou au minimum un message de confirmation.

  • Demande un acompte, par exemple une partie au démarrage. C''est une pratique normale, qui montre que le client est engagé.

  • Précise le mode de paiement : mobile money, virement.


  ✅ À LA LIVRAISON

  • Envoie ta facture en même temps que le travail final.

  • Rappelle la date de paiement prévue.


  ✅ SI LE PAIEMENT TARDE

  • Relance poliment, par écrit : « Je me permets de vous rappeler la facture n°003 du 10 mars. Merci de me confirmer la date de paiement. »

  • Relance une deuxième fois, une semaine plus tard.

  • Garde un ton professionnel, toujours.


  💡 Relancer un paiement n''est pas impoli. C''est professionnel. Les organisations le font entre elles tous les jours.


  Regarde la vidéo, et partage en commentaire ta technique pour te faire payer. 👇


  HSA, le Hub Scientifique Africain.


  📘 Tu veux les 10 façons dans un seul document ? Le guide HSA est gratuit. Et pour avancer toute l''année, il y a le Pass Valorisation à 2 000 FCFA. Liens en commentaire.'
textes:
  linkedin: 'Les retards de paiement sont fréquents pour les jeunes prestataires, souvent réticents à relancer.


    Quelques pratiques permettent de les limiter : formaliser par écrit le prix et les conditions, demander un acompte, préciser le mode de paiement, joindre la facture à la livraison et rappeler l''échéance. En cas de retard, une relance écrite et courtoise, renouvelée si nécessaire, relève d''une pratique professionnelle normale.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
