texte: 'Tu es en thèse ? 📚 Tu as une expertise pointue, mais souvent peu de financement. Et tu te demandes comment tenir jusqu''à la soutenance.


  Ta thèse peut t''ouvrir plusieurs des 10 façons : études, formations, accompagnement, prises de parole, prix et financements.


  Ce que le Pass Valorisation t''apporte, en doctorat :

  ✅ la veille hebdomadaire des financements, prix et concours ;

  ✅ un profil de chercheur visible par les organisations ;

  ✅ la méthode pour structurer une offre, avec une attestation ;

  ✅ un groupe d''entraide pour avancer sans t''isoler.


  Le but n''est pas d''abandonner ta thèse pour faire du business. C''est de trouver des revenus qui t''aident à la finir.


  Le Pass coûte 2 000 FCFA pour toute l''année. Le Pass ne fait pas le travail à ta place et ne garantit ni emploi ni revenu. Il te donne la méthode, les opportunités et l''entourage pour avancer.


  👉 Rejoins le Pass sur hubscientifiqueafricain.com. Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Les doctorants disposent d''une expertise pointue, souvent sans financement suffisant pour mener leur thèse à terme.


    Le Pass Valorisation leur donne accès à une veille hebdomadaire des financements, prix et concours, à un profil de chercheur visible, à une méthode certifiante pour structurer une offre et à un groupe d''entraide. L''objectif : des revenus complémentaires qui soutiennent la thèse, sans la remplacer. Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
