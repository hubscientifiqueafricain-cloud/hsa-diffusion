texte: 'Dans quelques heures, 2026 se termine. 🎆


  Merci. Merci d''avoir lu, enregistré, commenté, partagé nos posts ces deux derniers mois. Merci pour vos questions, vos pitchs en commentaire, vos vœux pour vos recherches. On a lu chacun d''entre eux.


  On a commencé en vous expliquant ce qu''est la valorisation de la recherche. On termine l''année avec une conviction encore plus forte : la recherche africaine a tout pour produire de l''impact, des revenus et de la notoriété. Il lui manque surtout de sortir des tiroirs.


  Pour 2027, on te souhaite :

  ✨ que ta recherche serve à au moins une personne qui en avait besoin ;

  ✨ qu''on te connaisse pour ce que tu sais ;

  ✨ que ton savoir te rapporte, enfin ;

  ✨ et que tu sois fier du chemin, pas seulement du diplôme.


  Si tu veux faire ce chemin avec nous, le Pass Valorisation t''attend : 2 000 FCFA pour toute l''année, avec la méthode, les opportunités chaque semaine et une communauté de chercheurs qui avancent ensemble. Le lien est en commentaire.


  Et si tu ne t''inscris pas, ce n''est pas grave : reste avec nous, on continue de partager gratuitement.


  Bonne année 2027 ! 🎉

  Partage ce post à un chercheur pour lui souhaiter une bonne année. 🔁


  L''équipe HSA, le Hub Scientifique Africain'
textes:
  linkedin: 'L''année 2026 s''achève. Merci aux lecteurs qui ont suivi, commenté et partagé cette série consacrée à la valorisation de la recherche.


    Ces deux mois de publications ont renforcé une conviction : la recherche africaine dispose de tous les atouts pour produire de l''impact, des revenus et de la notoriété. Il lui manque principalement d''être diffusée et utilisée.


    Nos vœux pour 2027 : que chaque travail de recherche trouve au moins un utilisateur, que l''expertise des chercheurs soit reconnue, et qu''elle leur ouvre de nouvelles perspectives.


    Le Pass Valorisation (2 000 FCFA par an) reste disponible pour celles et ceux qui souhaitent être accompagnés. Les publications gratuites se poursuivront.


    Bonne année 2027.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
