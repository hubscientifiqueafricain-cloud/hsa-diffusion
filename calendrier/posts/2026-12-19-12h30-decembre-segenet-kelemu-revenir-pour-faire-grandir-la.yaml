texte: '🗓️ Série « Prépare 2027 »


  Une dernière histoire vraie pour préparer 2027 avec ambition.


  Elle a grandi dans un village d''Éthiopie. Elle est devenue l''une des scientifiques africaines les plus reconnues. Et surtout, elle a choisi de revenir. 🌾 Voici l''histoire de Segenet Kelemu.


  Spécialiste des maladies des plantes, elle fait une grande partie de sa carrière à l''étranger, notamment en Colombie, dans un centre international de recherche agricole. Ses travaux portent sur les micro-organismes qui aident certaines plantes fourragères à mieux résister aux maladies et au manque d''eau. Des résultats très concrets pour les éleveurs et les agriculteurs.


  Elle aurait pu rester. Mais elle revient en Afrique, à Nairobi, pour diriger une plateforme de recherche en biosciences ouverte aux chercheurs du continent. Puis, en 2013, elle prend la direction de l''icipe, le Centre international sur la physiologie et l''écologie des insectes, basé au Kenya.


  En 2014, elle reçoit le prix L''Oréal-UNESCO pour les femmes et la science.


  Ce que son parcours nous dit :

  🌍 Une recherche utile part souvent des problèmes des agriculteurs, des éleveurs, des communautés.

  🌍 Valoriser, c''est aussi construire des institutions et ouvrir des portes aux jeunes chercheurs.

  🌍 Partir pour apprendre n''empêche pas de revenir pour transmettre.


  Le carrousel raconte son parcours. 👆 Partage-le à une chercheuse qui t''inspire. 🔁


  On est HSA, le Hub Scientifique Africain.


  🚀 Tu veux qu''en 2027 ta recherche serve vraiment ? Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : méthode, opportunités, profil visible et entraide. Lien en commentaire.'
textes:
  linkedin: 'Segenet Kelemu, née en Éthiopie dans un milieu rural, est phytopathologiste moléculaire.


    Après une partie importante de sa carrière à l''étranger, notamment au Centre international d''agriculture tropicale en Colombie, où ses travaux ont porté sur les micro-organismes renforçant la résistance de plantes fourragères aux maladies et à la sécheresse, elle revient en Afrique pour diriger à Nairobi une plateforme de recherche en biosciences ouverte aux chercheurs du continent.


    Elle dirige depuis 2013 l''icipe (Centre international sur la physiologie et l''écologie des insectes), au Kenya. Elle a reçu en 2014 le prix L''Oréal-UNESCO pour les femmes et la science.


    Son parcours rappelle que la valorisation de la recherche passe aussi par la construction d''institutions et par l''ouverture de possibilités pour les jeunes chercheurs africains.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · #FemmesEnScience #RechercheAfricaine'
