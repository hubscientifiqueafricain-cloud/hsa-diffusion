texte: "On en parle dans tous les colloques, mais personne ne l'explique simplement. La valorisation de la recherche, c'est quoi, concrètement ?\n\nDans cette micro-formation :\n▶ La définition simple\n   • Faire servir tes résultats\n   • à ceux qui peuvent les utiliser\n▶ Ce que ce n'est pas\n   • Pas seulement publier\n   • Pas forcément vendre\n   • Pas réservé aux sciences dures\n▶ Ce que ça produit\n   • De l'impact\n   • Des revenus\n   • De la notoriété\n\nÀ retenir : En une phrase : valoriser, c'est faire passer ta recherche du tiroir à la vraie vie.\n\n\U0001F4AC Tu as une question sur la valorisation de ta recherche ? Pose-la en commentaire : on y répondra dans une prochaine vidéo.\n\U0001F514 Abonne-toi pour ne rien manquer de la série « Valoriser ta recherche · 1 question, 2 minutes ».\n\n\U0001F310 HSA, le Hub Scientifique Africain : https://www.hubscientifiqueafricain.com\n\n#ValorisationDeLaRecherche #Doctorat #RechercheAfricaine"
