texte: '🎓 Série « Carrière de chercheur »


  Ton article est presque prêt. Mais où l''envoyer ? 📬 Beaucoup de jeunes chercheurs choisissent la première revue trouvée sur Internet. Et perdent des mois.


  Voici 4 critères pour bien choisir :


  1️⃣ LE SUJET

  La revue publie-t-elle des articles proches du tien ? Regarde ses derniers numéros. Si tu n''en trouves aucun, ce n''est probablement pas la bonne.


  2️⃣ LA RECONNAISSANCE

  La revue est-elle reconnue dans ta discipline et par les instances qui évalueront ton dossier ? Est-elle indexée dans des bases de données sérieuses ? Demande à ton encadreur et à tes aînés quelles revues comptent dans ta spécialité.


  3️⃣ LES CONDITIONS

  Délais habituels, langue, frais de publication éventuels, accès ouvert ou non. Lis la page « instructions aux auteurs ».


  4️⃣ TES RÉFÉRENCES

  Les revues que tu cites le plus dans ton article sont souvent de bonnes pistes.


  Et méfie-toi des revues qui te contactent d''elles-mêmes en promettant une publication rapide. On t''explique comment les repérer dans le prochain post.


  La vidéo résume les 4 critères. 🎬


  HSA, le Hub Scientifique Africain.


  🤝 Avec le Pass Valorisation HSA, fais d''une pierre deux coups : ta recherche gagne en visibilité, ton dossier de carrière se remplit. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'Le choix de la revue est une décision stratégique pour un article scientifique. Une soumission mal ciblée peut entraîner plusieurs mois de délai.


    Quatre critères aident à choisir :


    1. L''adéquation thématique : la revue publie-t-elle des travaux proches ?

    2. La reconnaissance : la revue est-elle reconnue dans la discipline et par les instances d''évaluation, et indexée dans des bases sérieuses ?

    3. Les conditions : délais, langue, éventuels frais de publication, modèle d''accès.

    4. Les références citées : les revues les plus présentes dans la bibliographie sont souvent pertinentes.


    L''avis de l''encadreur et des collègues de la spécialité reste précieux.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
