texte: '🎓 Série « Carrière de chercheur »


  Un jeune Malien qui rêve d''espace. 🚀 Des années plus tard, il guide des sondes vers d''autres planètes. Voici l''histoire de Cheick Modibo Diarra.


  🇲🇱 Né au Mali en 1952, il fait des études scientifiques en France, puis un doctorat aux États-Unis.


  🛰️ Il rejoint le Jet Propulsion Laboratory, le laboratoire de la NASA qui conçoit et pilote des missions spatiales. Il y travaille comme « navigateur interplanétaire » sur plusieurs missions d''exploration du système solaire.


  🎤 Mais ce qui l''a rendu célèbre en Afrique, ce n''est pas seulement son travail. C''est qu''il en a parlé. Dans les médias, dans les écoles, lors de conférences. Il est devenu une voix publique de la science africaine, et un modèle pour des milliers de jeunes.


  💡 Ce que son parcours nous apprend pour ta carrière :

  • L''excellence scientifique ouvre des portes très loin de chez soi.

  • Parler de son travail, simplement, en multiplie l''impact.

  • Être visible, c''est aussi donner envie aux autres de faire de la science.


  Tu n''as pas besoin d''aller sur Mars pour inspirer. Commence par parler de ta recherche à ceux qui t''entourent.


  Le carrousel raconte son parcours. 👆 Partage-le à un jeune passionné de sciences.


  HSA, le Hub Scientifique Africain.


  🤝 Avec le Pass Valorisation HSA, fais d''une pierre deux coups : ta recherche gagne en visibilité, ton dossier de carrière se remplit. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'Le parcours de Cheick Modibo Diarra illustre le lien entre excellence scientifique et communication publique.


    Né au Mali en 1952, il a poursuivi des études scientifiques en France puis un doctorat aux États-Unis. Il a ensuite travaillé au Jet Propulsion Laboratory de la NASA comme navigateur interplanétaire, sur plusieurs missions d''exploration du système solaire.


    Sa notoriété en Afrique tient aussi à sa présence publique : interventions dans les médias, conférences, rencontres avec les jeunes. Il est devenu une figure inspirante de la science africaine.


    Cet exemple rappelle que la communication démultiplie l''impact d''un parcours scientifique.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
