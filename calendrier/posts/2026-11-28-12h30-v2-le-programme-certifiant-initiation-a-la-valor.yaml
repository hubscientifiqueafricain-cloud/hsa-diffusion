texte: 'Pendant 30 jours, on t''a expliqué la valorisation post après post. 📚 Mais lire des posts, ce n''est pas la même chose que suivre une méthode structurée, jusqu''au bout, sur TA recherche.


  C''est le rôle du programme certifiant « Initiation à la valorisation », inclus dans le Pass Valorisation HSA.


  C''EST QUOI ?

  Un programme en ligne en 5 modules, qui te fait avancer pas à pas : comprendre la valorisation, identifier ce qui est valorisable dans ton travail, choisir ta voie et passer à l''action. Par exemple, au module 3, tu identifies concrètement les éléments valorisables de ta propre recherche.


  À LA FIN ?

  Tu reçois une attestation HSA. Tu peux l''ajouter à ton CV, à ton profil LinkedIn et à tes candidatures.


  POUR QUI ?

  Les masterants, doctorants et jeunes chercheurs, de toutes disciplines, qui veulent une méthode claire plutôt que des conseils dispersés.


  À TON RYTHME

  En ligne, accessible depuis ton téléphone, pendant les 12 mois de ton Pass.


  ET EN PLUS DU PROGRAMME, LE PASS TE DONNE :

  ✅ le guide « 10 façons de gagner de l''argent avec ton mémoire ou ta thèse » ;

  ✅ ton profil de chercheur visible ;

  ✅ les opportunités chaque semaine ;

  ✅ le groupe d''entraide et les lives mensuels.


  Tout ça pour 2 000 FCFA par an.


  Le carrousel détaille le programme. 👆 Inscris-toi : lien en commentaire.


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le programme certifiant « Initiation à la valorisation » est inclus dans le Pass Valorisation HSA.


    Il propose, en cinq modules en ligne, une progression structurée : comprendre la valorisation, identifier les éléments valorisables de ses propres travaux, choisir une voie et passer à l''action. Il est sanctionné par une attestation HSA.


    Il s''adresse aux masterants, doctorants et jeunes chercheurs de toutes disciplines, et se suit à son rythme pendant les douze mois du Pass.


    Le Pass comprend également le guide des dix voies de revenus, un profil de chercheur visible, une veille hebdomadaire des opportunités et un groupe d''entraide. Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
