texte: '« Les entreprises issues de la recherche, c''est en Europe et aux États-Unis. » Vraiment ? 🤔

  Voici 4 entreprises africaines nées dans des universités, toutes présentées dans l''annuaire des organisations de HSA.


  1️⃣ LUMKANI (Université du Cap)

  Le résultat de départ : un projet d''étudiants sur la détection des incendies dans les quartiers informels.

  Ce qu''il est devenu : une entreprise qui conçoit et commercialise un détecteur de chaleur en réseau.


  2️⃣ CAPE BIO PHARMS (Université du Cap)

  Le résultat de départ : les innovations de la Biopharming Research Unit.

  Ce qu''il est devenu : une entreprise qui produit dans des plantes des protéines, antigènes et anticorps pour réactifs, diagnostics et vaccins.


  3️⃣ STELLENBOSCH NANOFIBER COMPANY (Université de Stellenbosch)

  Le résultat de départ : la thèse de doctorat de son fondateur, et une technologie brevetée.

  Ce qu''il est devenu : une entreprise qui produit à grande échelle des nanofibres pour le médical et la cosmétique.


  4️⃣ NANOSENE (Université de Stellenbosch)

  Le résultat de départ : la thèse de doctorat de sa cofondatrice.

  Ce qu''il est devenu : une entreprise qui commercialise des polymères servant à isoler des protéines, cibles de médicaments.


  Remarque : deux de ces entreprises sont nées directement d''une thèse de doctorat. Une thèse. Comme la tienne. 📘


  Toutes viennent d''Afrique du Sud, où les universités ont des structures de transfert de technologie depuis longtemps. Le défi, c''est que l''Afrique francophone ait aussi ses histoires. Et elles commencent avec des chercheurs comme toi.


  Le carrousel présente chaque entreprise. 👆 Laquelle t''inspire le plus ? Dis-le en commentaire.


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Quatre exemples africains d''entreprises issues de la recherche, présentées dans l''annuaire des organisations du Hub Scientifique Africain :


    • Lumkani (Université du Cap) : né d''un projet étudiant, un détecteur de chaleur en réseau contre les incendies dans les quartiers informels.

    • Cape Bio Pharms (Université du Cap) : issue de la Biopharming Research Unit, la production dans des plantes de protéines, antigènes et anticorps.

    • Stellenbosch Nanofiber Company (Université de Stellenbosch) : issue de la thèse de son fondateur, la production de nanofibres pour le médical et la cosmétique, grâce à une technologie brevetée.

    • Nanosene (Université de Stellenbosch) : issue de la thèse de sa cofondatrice, des polymères permettant d''isoler des protéines cibles de médicaments.


    Deux de ces entreprises sont directement nées d''une thèse de doctorat.


    L''enjeu est désormais de faire émerger des trajectoires comparables dans l''ensemble du continent, notamment en Afrique francophone.


    #Spinoff #TransfertDeTechnologie #Afrique'
