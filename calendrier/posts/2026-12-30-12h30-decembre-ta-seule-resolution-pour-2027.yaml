texte: 'Demain, c''est le dernier jour de l''année. 🗓️ Les listes de résolutions vont fleurir : faire du sport, lire plus, finir la thèse, économiser…


  On te propose de n''en garder qu''une pour ta recherche. Une seule, mais tenue :


  👉 « En 2027, ma recherche va servir à quelqu''un. »


  Pas « je vais créer une startup ». Pas « je vais devenir célèbre ». Juste : une personne, une organisation, une communauté qui utilise ce que tu as trouvé. Ce sera ton premier pas. Les suivants viendront.


  Pour la tenir, trois conditions :

  1. UNE MÉTHODE, pour savoir quoi faire et dans quel ordre.

  2. DES OCCASIONS, pour trouver qui a besoin de toi.

  3. DES PERSONNES AUTOUR DE TOI, pour ne pas lâcher en février.


  C''est exactement ce que réunit le Pass Valorisation : le programme certifiant pour la méthode, les opportunités chaque semaine et ton profil visible pour les occasions, le groupe d''entraide et les lives mensuels pour l''entourage. Pour 2 000 FCFA, toute l''année.


  La vidéo en 35 secondes. 🎬 Et toi, quelle est ta résolution pour ta recherche ? Écris-la en commentaire : l''écrire, c''est déjà s''engager. ✍🏾


  Lien pour le Pass en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'À la veille de la nouvelle année, une résolution unique pour sa recherche : « En 2027, mes travaux serviront à quelqu''un. »


    Cet objectif, volontairement modeste, consiste à obtenir une première utilisation concrète des résultats par une personne, une organisation ou une communauté.


    Trois conditions favorisent sa réalisation : une méthode, des occasions de rencontrer les utilisateurs potentiels, et un entourage qui aide à maintenir l''effort.


    Le Pass Valorisation du Hub Scientifique Africain réunit ces trois éléments : programme certifiant, veille hebdomadaire des opportunités et profil visible, groupe d''entraide et sessions mensuelles en direct. Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
