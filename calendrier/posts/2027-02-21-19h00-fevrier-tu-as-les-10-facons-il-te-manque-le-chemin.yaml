texte: 'Depuis le début du mois, on t''a présenté les 10 façons de gagner de l''argent avec ton mémoire ou ta thèse. 🧭 Comment faire ton offre, trouver un client, envoyer un devis, te faire payer, rester éthique. Et un plan de 90 jours.


  Si tu as tout enregistré, bravo. Mais soyons honnêtes : entre savoir et faire, il y a souvent un grand écart.


  On ne sait pas laquelle des 10 façons choisir.

  On ne sait pas où trouver les financements et les prix à temps.

  On n''a personne à qui demander : « Mon offre est-elle claire ? Mon prix est-il correct ? »

  Et seul, on finit par remettre à plus tard.


  Ce qu''il te manque, ce n''est pas l''information. C''est un chemin, et des gens pour le parcourir avec toi.


  C''est exactement pour ça qu''existe le Hub Scientifique Africain (HSA). Dans les prochains jours, on te présente ce qu''on a construit pour t''aider à passer à l''action : des outils gratuits, et le Pass Valorisation.


  La vidéo résume l''idée. 🎬 Suis la page pour la suite.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Les publications de ce mois ont présenté dix voies de valorisation économique de la recherche, ainsi que les outils pratiques associés : offre, prospection, devis, paiement, éthique et planification.


    L''écart entre l''information et l''action reste cependant important : choix de la voie, accès aux opportunités, absence de retours, isolement. Les prochaines publications présenteront les outils gratuits et le Pass Valorisation du Hub Scientifique Africain, conçus pour accompagner ce passage à l''action.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
