texte: '🎓 Série « Carrière de chercheur »


  Dans beaucoup de colloques, on te demande de choisir : communication orale ou poster ? 🤔 Beaucoup de doctorants pensent que le poster est « moins bien ». Ce n''est pas si simple.


  🎤 LA COMMUNICATION ORALE

  ✅ Tu présentes à toute une salle, souvent 10 à 15 minutes.

  ✅ Elle a souvent plus de poids dans un dossier.

  ⚠️ Elle demande des résultats assez avancés, et un peu d''aisance à l''oral.


  🖼️ LE POSTER

  ✅ Tu échanges en petit comité, pendant une session dédiée.

  ✅ Les discussions sont souvent plus longues et plus riches.

  ✅ C''est idéal pour des résultats préliminaires, ou pour une première expérience.

  ⚠️ Il faut aller vers les gens.


  Notre conseil : pour un premier colloque, le poster est un excellent début. Tu rencontres des chercheurs, tu reçois des retours, et tu gagnes en confiance pour l''oral suivant.


  Les deux comptent dans ton CV. L''important, c''est de commencer.


  La vidéo compare les deux. 🎬 Et toi, tu préfères parler à une salle ou discuter devant ton poster ?


  HSA, le Hub Scientifique Africain.


  📈 Valoriser ta recherche et construire ta carrière, c''est le même chemin. Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : profil visible, opportunités, attestation et entraide. Lien en commentaire.'
textes:
  linkedin: 'Lors de la soumission à un colloque, les chercheurs doivent souvent choisir entre une communication orale et un poster.


    La communication orale permet de s''adresser à l''ensemble d''une session et a souvent davantage de poids dans un dossier ; elle suppose des résultats avancés. Le poster favorise des échanges approfondis en petit groupe et convient bien à des résultats préliminaires ou à une première expérience.


    Pour un premier colloque, le poster constitue une entrée en matière pertinente. Les deux formats sont valorisables dans un CV académique.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
