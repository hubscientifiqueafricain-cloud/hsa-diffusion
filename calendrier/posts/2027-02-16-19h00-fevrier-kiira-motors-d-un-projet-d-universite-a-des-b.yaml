texte: '💰 Série « Gagner de l''argent avec ta recherche »


  Un projet de recherche d''étudiants et d''enseignants dans une université africaine. 🎓 Quelques années plus tard, une entreprise qui construit des bus électriques et solaires. Voici l''histoire de Kiira Motors, en Ouganda.


  🔬 TOUT COMMENCE À L''UNIVERSITÉ

  À l''Université Makerere, à Kampala, un projet de recherche baptisé « Vehicle Design Project » travaille sur la conception de véhicules.


  🚌 LA RECHERCHE DEVIENT UNE ENTREPRISE

  De ce projet naît Kiira Motors Corporation, un constructeur ougandais de véhicules électriques et solaires. Parmi ses réalisations : le bus Kayoola.


  💡 CE QUE CETTE HISTOIRE NOUS APPREND

  • Une recherche universitaire africaine peut donner naissance à une véritable industrie.

  • Les projets d''étudiants ne sont pas « juste des exercices » : ils peuvent devenir des entreprises.

  • Le passage de la recherche à l''entreprise prend du temps, et demande des partenaires.


  Ta recherche n''a peut-être pas vocation à construire des bus. Mais elle peut, elle aussi, sortir de l''université et servir.


  Le carrousel raconte l''histoire. 👆 Partage-le à un étudiant ingénieur qui doute.


  HSA, le Hub Scientifique Africain.


  🧭 Pas sûr de la façon qui te correspond ? Fais la Boussole HSA, gratuite. Et pour te lancer accompagné, le Pass Valorisation coûte 2 000 FCFA pour l''année. Liens en commentaire.'
textes:
  linkedin: 'Kiira Motors Corporation, constructeur ougandais de véhicules électriques et solaires, est issu du Vehicle Design Project de l''Université Makerere à Kampala. L''entreprise a notamment développé le bus Kayoola.


    Ce parcours illustre la capacité de la recherche universitaire africaine à donner naissance à des activités industrielles, au terme d''un processus long et partenarial.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
