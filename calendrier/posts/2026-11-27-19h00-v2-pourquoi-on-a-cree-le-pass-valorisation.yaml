texte: 'En parlant avec des centaines de masterants et de doctorants, on a entendu les mêmes phrases revenir sans cesse. 💬

  « Je ne sais pas par où commencer. »

  « J''apprends les appels à candidatures quand la date limite est déjà passée. »

  « Je n''ai personne à qui poser mes questions. »

  « Les formations sont trop chères pour moi. »


  C''est pour répondre à ces 4 problèmes qu''on a créé le Pass Valorisation HSA.


  ❓ « Je ne sais pas par où commencer. »

  ➡️ Le programme certifiant « Initiation à la valorisation » te donne la méthode pas à pas, en 5 modules, avec une attestation. Et le guide « 10 façons de gagner de l''argent avec ton mémoire ou ta thèse » t''aide à choisir ta voie.


  ❓ « J''apprends les opportunités trop tard. »

  ➡️ Chaque semaine, tu reçois les financements, prix, concours et opportunités.


  ❓ « Je suis seul. »

  ➡️ Tu rejoins le groupe d''entraide des membres et les lives mensuels.


  ❓ « Je ne suis pas visible. »

  ➡️ Ton profil de chercheur sur HSA est visible par les entreprises, les ONG et les institutions.


  ❓ « C''est trop cher. »

  ➡️ 2 000 FCFA pour toute l''année. Moins de 6 FCFA par jour. On a fixé ce prix pour que l''argent ne soit plus une raison de laisser sa recherche dans un tiroir.


  Regarde la vidéo. Commente PASS et on t''envoie le lien pour t''inscrire. 👇


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le Pass Valorisation HSA est né de quatre difficultés exprimées de façon récurrente par les masterants et doctorants : ne pas savoir par où commencer, découvrir les opportunités trop tard, manquer d''interlocuteurs, et ne pas pouvoir financer une formation.


    Il y répond par :

    • le programme certifiant « Initiation à la valorisation » (cinq modules, avec attestation) et le guide des dix voies de revenus ;

    • une veille hebdomadaire des financements, prix, concours et opportunités ;

    • un groupe d''entraide et des sessions mensuelles en direct ;

    • un profil de chercheur visible par les entreprises, ONG et institutions.


    Son tarif, 2 000 FCFA par an, a été fixé pour lever l''obstacle financier.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
