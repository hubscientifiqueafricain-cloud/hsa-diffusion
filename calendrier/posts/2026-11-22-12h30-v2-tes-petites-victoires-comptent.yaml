texte: 'Dans la recherche, on attend souvent LA grande victoire : la soutenance, la publication, le poste. Et entre les deux, des mois où on a l''impression de ne rien accomplir. 😮‍💨


  Pourtant, chaque semaine, tu gagnes des petites batailles. Le problème, c''est que tu ne les vois pas.


  Voici des victoires qui comptent, et que tu devrais célébrer :

  🏅 Tu as fini de rédiger une section. Même petite.

  🏅 Ton questionnaire est validé.

  🏅 Tu as compris un concept qui te bloquait depuis des semaines.

  🏅 Tu as envoyé ce message que tu repoussais depuis un mois.

  🏅 Un encadreur ou un collègue t''a fait un retour positif.

  🏅 Tu as expliqué ta recherche à quelqu''un, et il a compris.

  🏅 Tu as reçu une réponse (même négative) à une candidature.

  🏅 Tu as repris le travail après une pause difficile.


  Pourquoi les célébrer ? Parce que la motivation ne vient pas avant l''action, elle vient après. Chaque petite victoire reconnue te donne l''énergie pour la suivante.


  Une astuce simple : chaque vendredi, note 3 choses que tu as faites dans la semaine. En quelques mois, tu auras un carnet qui te prouvera, les jours de doute, tout le chemin parcouru. 📓


  Et c''est pareil pour la valorisation : un premier post, un premier contact, un premier rendez-vous. Ce sont des victoires.


  Allez, commente ta petite victoire de la semaine. On applaudit ici. 👏🏾👇


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le parcours de recherche est rythmé par quelques grandes étapes (soutenance, publication, recrutement), séparées par de longues périodes où les progrès semblent invisibles.


    Ces périodes sont pourtant faites de nombreuses avancées : une section achevée, un instrument validé, un concept enfin maîtrisé, une prise de contact longtemps repoussée, un retour encourageant, une reprise après une période difficile.


    Les reconnaître entretient la motivation, qui naît davantage de l''action que l''inverse. Une pratique simple : noter chaque semaine trois avancées. Ce journal devient, dans les moments de doute, la preuve du chemin parcouru.


    La même logique vaut pour la valorisation : un premier post, un premier contact, un premier rendez-vous sont des étapes à reconnaître.


    Hub Scientifique Africain (HSA)

    #Doctorat #Motivation #Recherche'
