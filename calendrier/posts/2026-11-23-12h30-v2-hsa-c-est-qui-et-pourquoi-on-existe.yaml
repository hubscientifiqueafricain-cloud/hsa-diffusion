texte: 'Depuis plusieurs semaines, on te parle de valorisation de la recherche. Il est temps qu''on se présente vraiment. 👋🏾


  Nous, c''est HSA, le Hub Scientifique Africain.


  POURQUOI ON EXISTE ?

  Parce qu''on a fait un constat : la majorité des productions scientifiques africaines restent peu accessibles, faiblement valorisées, dispersées, et ne touchent ni le grand public ni les acteurs économiques. Des mémoires et des thèses utiles dorment dans les tiroirs, pendant que leurs auteurs peinent à se faire connaître et à vivre de leur expertise.


  NOTRE MISSION

  Que la recherche africaine produise de l''impact, des revenus et de la notoriété. Pour ceux qui la font, et pour ceux qui en ont besoin.


  POUR QUI ?

  Les masterants, doctorants, post-doctorants, jeunes chercheurs et praticiens. Et aussi les universités, centres de recherche et organisations qui veulent valoriser leurs travaux.


  CE QU''ON PROPOSE

  🌐 Une plateforme en ligne pour te créer un profil de chercheur, publier tes travaux, suivre ton impact, trouver des opportunités et te connecter à d''autres chercheurs et institutions.

  🧭 Des outils gratuits pour faire le point sur ta capacité à valoriser.

  🎓 Un programme certifiant pour apprendre à valoriser ta recherche, pas à pas.

  📅 Des événements : webinaires et rencontres.


  Tout ce que tu as appris dans cette série, c''est ce qu''on fait au quotidien avec les chercheurs.


  Dans les prochains jours, on te présente chaque outil en détail. Suis la page, et dis-nous bonjour en commentaire avec ta discipline et ton pays. 👇🏾'
textes:
  linkedin: 'Après plusieurs semaines consacrées à la valorisation de la recherche, voici qui nous sommes.


    Le Hub Scientifique Africain (HSA) part d''un constat : la majorité des productions scientifiques africaines restent peu accessibles, faiblement valorisées, dispersées, et touchent rarement le grand public et les acteurs économiques.


    Notre mission : une recherche africaine qui produit de l''impact, des revenus et de la notoriété.


    Nous nous adressons aux masterants, doctorants, post-doctorants, jeunes chercheurs et praticiens, ainsi qu''aux universités, centres de recherche et organisations.


    Nous proposons une plateforme (profil de chercheur, publications, suivi d''impact, opportunités, réseau), des outils de diagnostic gratuits, un programme certifiant à la valorisation, ainsi que des événements.


    Les prochaines publications présenteront chacun de ces services.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
