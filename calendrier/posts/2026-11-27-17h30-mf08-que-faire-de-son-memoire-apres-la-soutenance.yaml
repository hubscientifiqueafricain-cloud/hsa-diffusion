texte: "La soutenance est passée. Et maintenant, ton mémoire va finir dans un tiroir ? Voici cinq choses à faire dans les trois mois.\n\nDans cette micro-formation :\n▶ 5 actions après la soutenance\n   • 1. Un résumé grand public\n   • 2. Un article tiré d'un chapitre\n   • 3. Une fiche d'expertise\n   • 4. Trois organisations à contacter\n   • 5. Un post pour en parler\n\nÀ retenir : Ton diplôme marque la fin des études, pas la fin de ta recherche. C'est maintenant qu'elle peut commencer à servir.\n\n\U0001F4AC Tu as une question sur la valorisation de ta recherche ? Pose-la en commentaire : on y répondra dans une prochaine vidéo.\n\U0001F514 Abonne-toi pour ne rien manquer de la série « Valoriser ta recherche · 1 question, 2 minutes ».\n\n\U0001F310 HSA, le Hub Scientifique Africain : https://www.hubscientifiqueafricain.com\n\n#ValorisationDeLaRecherche #Doctorat #RechercheAfricaine"
