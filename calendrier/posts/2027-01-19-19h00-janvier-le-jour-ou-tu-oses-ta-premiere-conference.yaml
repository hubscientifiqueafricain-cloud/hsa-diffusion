texte: '🎓 Série « Carrière de chercheur »


  Imagine. 🎬 Tu as envoyé ton résumé un peu par hasard. Il a été accepté. Le jour J, tu as les mains moites. Tu montes sur l''estrade. Tu dis ta première phrase. Et puis, petit à petit, tu oublies la peur. Tu parles de ce que tu connais mieux que tout le monde dans la salle : ta recherche.


  À la fin, quelqu''un lève la main. Une vraie question, qui montre qu''on t''a écouté. À la pause, une chercheuse vient te voir : « Votre travail m''intéresse, on peut rester en contact ? »


  Ce n''est qu''une communication de 15 minutes. Mais elle laisse :

  ✅ une ligne de plus dans ton CV ;

  ✅ une attestation dans ton dossier ;

  ✅ deux ou trois contacts qui pourraient compter ;

  ✅ et surtout, la preuve que tu en es capable.


  La première est la plus difficile. Les suivantes sont plus faciles.


  Ce n''est pas une histoire réelle. C''est une histoire possible. La tienne, si tu oses envoyer ce premier résumé.


  Regarde la vidéo, puis écris en commentaire « Cette année, j''ose ». 👇


  HSA, le Hub Scientifique Africain.


  🎯 Pour construire ta carrière sans avancer seul : le Pass Valorisation HSA te donne une méthode certifiante (avec attestation pour ton CV), les opportunités chaque semaine et un groupe d''entraide. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'La première communication en colloque représente souvent une étape redoutée par les jeunes chercheurs.


    Pourtant, une intervention de quinze minutes produit des effets durables : un élément supplémentaire dans le CV, une attestation dans le dossier, des contacts professionnels, et surtout la confiance nécessaire pour les communications suivantes.


    La première est la plus difficile. Envoyer un premier résumé constitue le pas décisif.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
