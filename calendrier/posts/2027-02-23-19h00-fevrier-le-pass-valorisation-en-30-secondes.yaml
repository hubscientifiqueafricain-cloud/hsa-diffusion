texte: 'Le Pass Valorisation, en 30 secondes. ⏱️


  C''est l''abonnement annuel du Hub Scientifique Africain pour celles et ceux qui veulent faire rapporter leur recherche, sans avancer seuls.


  Ce qu''il contient :

  🎓 un programme certifiant « Initiation à la valorisation », en 5 modules, avec une attestation ;

  👤 un profil de chercheur visible par des entreprises, ONG et institutions ;

  📬 les financements, prix, concours et opportunités, chaque semaine ;

  🤝 un groupe d''entraide et des lives mensuels.


  Le prix : 2 000 FCFA pour toute l''année. Moins de 6 FCFA par jour. Paiement par mobile money.


  Le Pass ne fait pas le travail à ta place et ne garantit ni emploi ni revenu. Il te donne la méthode, les opportunités et l''entourage pour avancer.


  👉 Inscription sur hubscientifiqueafricain.com, ou par WhatsApp au +225 07 07 89 29 70. Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le Pass Valorisation est l''abonnement annuel du Hub Scientifique Africain. Il comprend un programme certifiant « Initiation à la valorisation » (5 modules, avec attestation), un profil de chercheur visible par les entreprises, ONG et institutions, une veille hebdomadaire des financements, prix et concours, ainsi qu''un groupe d''entraide et des sessions en direct mensuelles.


    Tarif : 2 000 FCFA par an, réglables par mobile money. Le Pass ne se substitue pas au travail du chercheur et ne garantit ni emploi ni revenu ; il fournit une méthode, un accès aux opportunités et un environnement d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
