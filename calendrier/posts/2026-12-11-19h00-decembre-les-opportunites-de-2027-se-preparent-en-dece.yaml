texte: '🗓️ Série « Prépare 2027 »


  Une bourse, un prix, un appel à projets, un concours : en 2027, il y en aura beaucoup. 🏆 La vraie question, c''est : est-ce que tu seras prêt quand ils sortiront ?


  La plupart des candidats perdent pour deux raisons : ils découvrent l''appel trop tard, ou ils n''ont pas de dossier prêt. Décembre est le meilleur moment pour régler ces deux problèmes.


  ✅ CE QUE TU PEUX FAIRE CE MOIS-CI

  • Mettre à jour ton CV (2 pages) et ton profil de chercheur.

  • Écrire ton résumé grand public (250 mots).

  • Préparer une courte vidéo où tu présentes ton projet.

  • Prévenir 2 ou 3 personnes qui pourront te recommander.

  • Créer un tableau de suivi : nom de l''appel, date limite, pièces demandées.


  📬 ET POUR NE PLUS RIEN RATER

  Avec le Pass Valorisation HSA, tu reçois chaque semaine les opportunités : financements, prix, concours, bourses, avec pour chacune le public visé, la date limite et le lien pour candidater. Tu n''as plus qu''à choisir celles qui te correspondent.


  Le Pass comprend aussi le programme certifiant, le guide des 10 façons de gagner de l''argent avec ta recherche, ton profil visible, le groupe d''entraide et les lives mensuels. 2 000 FCFA pour toute l''année.


  Le carrousel te donne la checklist de décembre. 👆 Lien pour le Pass en commentaire.


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Les bourses, prix, concours et appels à projets de 2027 récompenseront d''abord les candidats préparés. Deux facteurs expliquent la plupart des occasions manquées : la découverte tardive des appels et l''absence de dossier prêt.


    Le mois de décembre se prête à la préparation : CV à jour, résumé accessible, courte vidéo de présentation, recommandants informés, tableau de suivi des échéances.


    Pour le repérage, le Pass Valorisation du Hub Scientifique Africain comprend une veille hebdomadaire des opportunités (public visé, date limite, lien de candidature), ainsi qu''un programme certifiant, le guide des dix voies de revenus, un profil visible et un groupe d''entraide. Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
