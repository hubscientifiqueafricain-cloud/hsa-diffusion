texte: '« Le Pass Valorisation, c''est pour ceux qui ont déjà des résultats. Moi, je commence à peine. » 🤔 On entend souvent cette phrase. Et on comprend. Mais c''est justement quand on commence que le Pass est le plus utile.


  Pourquoi ?


  🧭 Parce que la valorisation se prépare dès le début. Quand tu sais tôt à qui ta recherche peut servir, tu peux orienter ton travail, choisir tes terrains, préparer tes partenaires.


  🏆 Parce que beaucoup d''opportunités ne demandent pas de résultats. Des bourses de mobilité, des formations, des programmes pour jeunes chercheurs. Encore faut-il les connaître à temps.


  🎓 Parce que l''attestation du programme certifiant compte dans ton CV dès maintenant, quels que soient tes résultats.


  🤝 Parce que le groupe d''entraide est encore plus précieux au début : c''est là que tu peux apprendre des erreurs des autres avant de les faire.


  Ceux qui ont des résultats aujourd''hui ont commencé un jour sans résultats. La différence, c''est souvent la préparation.


  2 000 FCFA pour toute l''année. 🎬 Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Une objection fréquente au Pass Valorisation tient à l''absence de résultats chez les chercheurs en début de parcours.


    Le Pass s''avère pourtant particulièrement utile à ce stade : la valorisation se prépare dès la conception d''un projet ; de nombreuses opportunités (mobilité, formation, programmes pour jeunes chercheurs) n''exigent pas de résultats ; l''attestation de formation est valorisable immédiatement ; et l''échange avec des pairs plus avancés permet d''anticiper les difficultés.


    Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
