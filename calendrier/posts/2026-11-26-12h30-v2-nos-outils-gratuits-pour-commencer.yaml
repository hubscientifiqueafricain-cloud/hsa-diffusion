texte: 'Tu veux commencer à valoriser ta recherche, mais sans dépenser un franc ? 🎁 On a créé deux outils gratuits pour toi.


  🧭 LA BOUSSOLE DE VALORISATION

  Un diagnostic de 14 questions, en 5 minutes. À la fin, tu reçois :

  ✅ ton statut de valorisation ;

  ✅ ta capacité à valoriser, dimension par dimension ;

  ✅ tes points forts ;

  ✅ tes recommandations prioritaires ;

  ✅ les façons de gagner de l''argent les plus adaptées à ta recherche ;

  ✅ ton plan d''action.

  Ton résultat est immédiat, et tu peux le télécharger en PDF.


  📘 LE GUIDE « 10 FAÇONS DE GAGNER DE L''ARGENT AVEC TON MÉMOIRE OU TA THÈSE »

  Un guide gratuit qui détaille les 10 voies de valorisation, avec des exemples concrets, pour que tu choisisses la tienne.


  Pourquoi commencer par là ? Parce qu''avant d''agir, il faut savoir où tu en es. La Boussole te le dit en 5 minutes, et le guide te montre les chemins possibles.


  Ces outils sont gratuits, sans engagement. Tes réponses servent uniquement à calculer ton résultat et à t''envoyer des conseils.


  Regarde la vidéo, puis commente BOUSSOLE : on t''envoie le lien. 👇


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le Hub Scientifique Africain met à disposition deux outils gratuits pour engager une démarche de valorisation.


    La Boussole de valorisation : un diagnostic en quatorze questions et cinq minutes, qui fournit un statut de valorisation, une analyse par dimension, les points forts, des recommandations prioritaires, les voies de revenus les plus adaptées et un plan d''action, téléchargeable en PDF.


    Le guide « 10 façons de gagner de l''argent avec son mémoire ou sa thèse », qui détaille les principales voies de valorisation à l''aide d''exemples.


    Ces outils permettent de faire le point avant d''agir. Le lien est en commentaire.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
