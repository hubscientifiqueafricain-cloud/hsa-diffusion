texte: 'Tu peux passer des années à faire de la recherche, d''un côté, et à essayer de construire ta carrière, de l''autre. 😮‍💨 Deux combats. Deux fois plus de fatigue.


  Ou tu peux faire d''une pierre deux coups.


  Chaque fois que tu fais connaître ta recherche, ton dossier se remplit.

  Chaque fois que tu présentes tes travaux, ton réseau s''agrandit.

  Chaque fois que tu expliques ce que tu as trouvé, quelqu''un, quelque part, peut s''en servir. Et peut-être te recruter.


  C''est la conviction du Hub Scientifique Africain (HSA) : valoriser ta recherche et construire ta carrière, c''est le même chemin. Et ce chemin, tu n''as pas à le faire seul.


  Avec le Pass Valorisation, pour 2 000 FCFA pour toute l''année :

  ✨ une méthode et une attestation ;

  ✨ ton profil visible ;

  ✨ les opportunités chaque semaine ;

  ✨ des chercheurs qui avancent avec toi.


  Ta recherche mérite d''être connue. Ta carrière mérite d''avancer. Les deux, en même temps.


  La vidéo est pour toi. 🎬 Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Pour de nombreux chercheurs, la recherche et la construction de la carrière sont vécues comme deux efforts distincts.


    La conviction du Hub Scientifique Africain est qu''il s''agit d''un même chemin : faire connaître ses travaux renforce son dossier, présenter ses résultats élargit son réseau, expliquer sa recherche la rend utile et attire l''attention des organisations.


    Le Pass Valorisation (2 000 FCFA par an) accompagne cette démarche avec une méthode certifiante, un profil visible, une veille des opportunités et un réseau de pairs.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
