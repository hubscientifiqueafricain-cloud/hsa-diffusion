texte: 'Le Pass Valorisation du Hub Scientifique Africain (HSA), en 30 secondes. ⏱️


  📌 C''est quoi ? Un abonnement d''un an pour apprendre à valoriser ta recherche et être accompagné. Et donc, faire avancer ta carrière en même temps.


  👥 Pour qui ? Les masterants, les doctorants, les jeunes chercheurs, de toutes les disciplines.


  🎁 Ce que tu reçois :

  • le programme certifiant « Initiation à la valorisation », avec une attestation HSA ;

  • le guide « 10 façons de gagner de l''argent avec ton mémoire ou ta thèse » ;

  • ton profil de chercheur visible par les entreprises, les ONG et les institutions ;

  • les opportunités chaque semaine : financements, prix, concours, bourses ;

  • le groupe d''entraide des membres ;

  • les lives mensuels avec l''équipe HSA.


  💰 Combien ? 2 000 FCFA pour toute l''année. Paiement par mobile money.


  Le Pass ne fait pas le travail à ta place, et ne garantit ni emploi ni revenu. Il te donne la méthode, les opportunités et l''entourage pour avancer.


  La vidéo résume tout. 🎬 Le lien est en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le Pass Valorisation du Hub Scientifique Africain est un abonnement annuel destiné aux masterants, doctorants et jeunes chercheurs.


    Il comprend : le programme certifiant « Initiation à la valorisation » avec attestation, le guide « 10 façons de gagner de l''argent avec son mémoire ou sa thèse », un profil de chercheur visible par les organisations, une veille hebdomadaire des opportunités (financements, prix, concours, bourses), un groupe d''entraide et des sessions mensuelles en direct.


    Tarif : 2 000 FCFA par an, payable par mobile money. Le Pass apporte méthode, opportunités et réseau ; il ne garantit ni emploi ni revenu.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
