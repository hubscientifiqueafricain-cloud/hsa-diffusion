texte: 'Dans les quartiers informels d''Afrique du Sud, les maisons sont faites de tôle et de bois, collées les unes aux autres. Quand un feu se déclare la nuit, il peut se propager à des dizaines d''habitations avant que les gens se réveillent. 🔥


  Un groupe d''étudiants de l''Université du Cap (UCT) s''est posé une question simple : comment prévenir ces incendies avec une solution adaptée à ces quartiers ?


  Le problème des détecteurs classiques : ils détectent la fumée. Or, dans ces maisons, on cuisine souvent au feu ou au réchaud à l''intérieur. Les détecteurs de fumée sonneraient tout le temps, et les gens finiraient par les débrancher.


  Leur idée : un détecteur qui réagit à la chaleur, pas à la fumée. Et surtout, des détecteurs connectés entre eux en réseau : quand l''un se déclenche, ceux des maisons voisines sonnent aussi. Tout le quartier est alerté en même temps, et peut réagir avant que le feu ne se propage.


  Ce projet d''étudiants est devenu une entreprise : Lumkani. Elle conçoit et commercialise ce détecteur de chaleur en réseau, aujourd''hui référencée dans l''annuaire des organisations de HSA comme entreprise issue de la recherche.


  Ce qu''on retient :

  ✅ Ils sont partis d''un problème réel, observé de près.

  ✅ Ils ont adapté la solution au contexte, au lieu de copier ce qui existait.

  ✅ Ils ont transformé un travail universitaire en entreprise.


  Ce qu''un étudiant du Cap a fait, un étudiant de Dakar, d''Abidjan, de Yaoundé ou de Cotonou peut le faire.


  Regarde la vidéo. Et dis-moi en commentaire : quel problème de ton pays un étudiant pourrait-il résoudre ? 👇


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Dans les quartiers informels d''Afrique du Sud, l''habitat dense en tôle et en bois favorise la propagation rapide des incendies.


    Des étudiants de l''Université du Cap (UCT) ont identifié une limite des détecteurs classiques : la cuisine à l''intérieur des habitations déclenche les détecteurs de fumée, qui finissent débranchés.


    Leur réponse : un détecteur qui réagit à la chaleur, relié en réseau aux détecteurs voisins. Lorsqu''un appareil se déclenche, tout le voisinage est alerté.


    Ce projet étudiant est devenu Lumkani, une entreprise qui conçoit et commercialise ce détecteur de chaleur en réseau.


    Trois enseignements : partir d''un problème observé de près, adapter la solution au contexte, et ne pas s''arrêter au cadre universitaire.


    Hub Scientifique Africain (HSA)

    #Innovation #Spinoff #Afrique'
