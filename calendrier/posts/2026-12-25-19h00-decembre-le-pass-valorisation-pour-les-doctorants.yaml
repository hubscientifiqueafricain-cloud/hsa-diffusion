texte: 'Doctorant, doctorante : ce post est pour toi. 🎓


  Tu as déjà passé des années sur ta thèse. Tu connais ton sujet mieux que presque tout le monde. Mais peut-être que :

  😓 ta bourse ne suffit pas, ou qu''elle est terminée ;

  😓 personne en dehors de ton labo ne connaît ton travail ;

  😓 tu ne sais pas ce que tu feras après la soutenance ;

  😓 tu découvres les appels à candidatures quand la date limite est passée.


  Le Pass Valorisation a été pensé pour ces situations :


  💰 TU APPRENDS À TIRER DES REVENUS DE TON EXPERTISE

  Le guide « 10 façons de gagner de l''argent avec ton mémoire ou ta thèse » et le programme certifiant t''aident à choisir ta voie : conseil, formation, produit, partenariat…


  📬 TU NE RATES PLUS LES OPPORTUNITÉS

  Chaque semaine : financements, prix, concours, bourses, avec leur date limite et le lien pour candidater.


  👤 TU DEVIENS VISIBLE

  Ton profil de chercheur est consultable par les entreprises, les ONG et les institutions qui cherchent des experts.


  🤝 TU AVANCES AVEC D''AUTRES

  Le groupe d''entraide réunit des doctorants de plusieurs pays et disciplines, et chaque mois, un live avec l''équipe HSA.


  📄 TU OBTIENS UNE ATTESTATION HSA à la fin du programme.


  2 000 FCFA pour toute l''année.


  Le carrousel détaille tout. 👆 Le lien pour t''inscrire est en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Les doctorants disposent d''une expertise approfondie, mais rencontrent fréquemment les mêmes difficultés : financement insuffisant, faible visibilité hors du laboratoire, incertitude sur l''après-thèse, appels à candidatures découverts trop tard.


    Le Pass Valorisation du Hub Scientifique Africain y répond par :

    • le guide des dix voies de revenus pour un mémoire ou une thèse et le programme certifiant « Initiation à la valorisation », pour choisir une voie : conseil, formation, produit, partenariat ;

    • une veille hebdomadaire des opportunités, avec dates limites et liens ;

    • un profil de chercheur visible des entreprises, ONG et institutions ;

    • un groupe d''entraide pluridisciplinaire et des sessions mensuelles en direct ;

    • une attestation HSA.


    Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
