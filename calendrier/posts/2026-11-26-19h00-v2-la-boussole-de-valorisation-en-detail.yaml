texte: '« Est-ce que mon mémoire peut vraiment me rapporter de l''argent et avoir de l''impact ? » 🤔

  C''est LA question que se posent la plupart des masterants et doctorants. La Boussole de valorisation HSA y répond en 5 minutes, gratuitement.


  COMMENT ÇA SE PASSE ?

  1️⃣ Tu te présentes : ton prénom, ton niveau (masterant, master soutenu, doctorant, docteur ou jeune chercheur), ta discipline et le titre de ton mémoire ou de ta thèse.

  2️⃣ Tu réponds à 14 questions sur ta recherche et ta situation.

  3️⃣ Tu reçois ton résultat immédiatement.


  CE QUE CONTIENT TON RÉSULTAT :

  📍 Ton statut de valorisation : où tu en es aujourd''hui.

  📊 Ta capacité à valoriser, dimension par dimension : ce qui est solide, ce qui manque.

  💪 Tes points forts.

  🎯 Tes recommandations prioritaires : par quoi commencer.

  💰 Les façons de gagner de l''argent les plus adaptées à ta recherche.

  🗺️ Ton plan d''action.


  Tu peux télécharger ton résultat en PDF, ou le recevoir sur WhatsApp.


  ET TES DONNÉES ?

  Tes réponses servent à calculer ton résultat et à t''envoyer des conseils. HSA ne les partage avec personne.


  5 minutes pour savoir enfin où tu en es, et quoi faire ensuite. Ça vaut le coup, non ? 😉


  Le carrousel te montre tout le parcours. 👆 Fais ta Boussole maintenant : lien en commentaire.


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'La Boussole de valorisation HSA répond en cinq minutes à une question fréquente : un mémoire ou une thèse peut-il générer des revenus et de l''impact ?


    Le parcours : une brève présentation (niveau, discipline, sujet), quatorze questions, puis un résultat immédiat.


    Le résultat comprend : le statut de valorisation, une analyse par dimension, les points forts, des recommandations prioritaires, les voies de revenus les plus adaptées et un plan d''action. Il est téléchargeable en PDF.


    Les réponses servent uniquement au calcul du résultat et à l''envoi de conseils ; elles ne sont pas partagées.


    L''outil est gratuit. Le lien est en commentaire.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
