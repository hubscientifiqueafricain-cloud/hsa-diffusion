texte: 'Le Pass Valorisation HSA, en 30 secondes chrono. ⏱️


  C''QUOI ? Un abonnement d''un an pour apprendre à valoriser ta recherche et être accompagné pendant 12 mois.


  POUR QUI ? Les masterants, les doctorants et les jeunes chercheurs, de toutes les disciplines.


  CE QU''IL CONTIENT :

  🎓 Le programme certifiant « Initiation à la valorisation » : 5 modules en ligne, à ton rythme, avec une attestation HSA à la fin.

  📘 Le guide « 10 façons de gagner de l''argent avec ton mémoire ou ta thèse ».

  👤 Ton profil de chercheur visible par les entreprises, les ONG et les institutions.

  📬 Les opportunités chaque semaine : financements, prix, concours, bourses.

  🤝 Le groupe d''entraide des membres et les lives mensuels avec l''équipe HSA.


  COMBIEN ? 2 000 FCFA pour toute l''année. Moins de 6 FCFA par jour.


  COMMENT PAYER ? Par mobile money.


  Voilà. Pas de surprise, pas de frais cachés.


  La vidéo te résume tout en 30 secondes. 🎬 Le lien pour t''inscrire est en commentaire.


  HSA, le Hub Scientifique Africain. Joyeux Noël ! 🎄'
textes:
  linkedin: 'Le Pass Valorisation du Hub Scientifique Africain en bref :


    • Nature : un abonnement annuel d''apprentissage et d''accompagnement à la valorisation de la recherche.

    • Public : masterants, doctorants et jeunes chercheurs de toutes disciplines.

    • Contenu : le programme certifiant « Initiation à la valorisation » (cinq modules en ligne, attestation HSA) ; le guide des dix voies de revenus pour un mémoire ou une thèse ; un profil de chercheur visible ; une veille hebdomadaire des opportunités ; un groupe d''entraide et des sessions mensuelles en direct.

    • Tarif : 2 000 FCFA pour douze mois.

    • Paiement : mobile money.


    Le lien d''inscription est en commentaire.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
