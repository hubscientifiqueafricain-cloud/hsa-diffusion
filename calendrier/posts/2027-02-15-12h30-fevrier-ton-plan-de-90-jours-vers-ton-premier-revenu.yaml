texte: '💰 Série « Gagner de l''argent avec ta recherche »


  On a vu ensemble les 10 façons de gagner de l''argent avec ta recherche, comment trouver des clients et comment te faire payer. 🗓️ Maintenant, on met tout ça dans un plan de 90 jours, vers ton premier revenu.


  🌱 JOURS 1 À 30 : CHOISIR ET PRÉPARER

  • Fais l''inventaire de ce qui se vend dans ta recherche.

  • Choisis UNE façon, celle qui te ressemble le plus.

  • Rédige ton offre d''une page.

  • Prépare 2 exemples de travaux.


  📣 JOURS 31 À 60 : TE FAIRE CONNAÎTRE

  • Liste 20 organisations ou personnes à contacter.

  • Contacte-en 5 par semaine.

  • Publie 2 posts sur ton sujet et ton offre.

  • Mets à jour ton profil de chercheur et ton LinkedIn.


  💰 JOURS 61 À 90 : CONCLURE

  • Relance les contacts intéressés.

  • Envoie tes devis.

  • Réalise ta première mission, même petite.

  • Demande une recommandation écrite à ton client.


  💡 Si au bout de 90 jours tu n''as pas encore de client, ce n''est pas un échec. Analyse ce qui a bloqué : l''offre, la cible, le message ? Et ajuste.


  Le carrousel contient le plan complet. 👆 Enregistre-le et commence lundi.


  HSA, le Hub Scientifique Africain.


  🧭 Pas sûr de la façon qui te correspond ? Fais la Boussole HSA, gratuite. Et pour te lancer accompagné, le Pass Valorisation coûte 2 000 FCFA pour l''année. Liens en commentaire.'
textes:
  linkedin: 'Un plan de quatre-vingt-dix jours peut structurer la démarche vers un premier revenu issu de la recherche.


    Jours 1 à 30 : inventaire, choix d''une voie, rédaction de l''offre et préparation d''exemples. Jours 31 à 60 : identification et contact de cibles, communication, mise à jour des profils. Jours 61 à 90 : relances, devis, première mission et recommandation.


    En l''absence de résultat, l''analyse des points de blocage (offre, cible, message) permet d''ajuster la démarche.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
