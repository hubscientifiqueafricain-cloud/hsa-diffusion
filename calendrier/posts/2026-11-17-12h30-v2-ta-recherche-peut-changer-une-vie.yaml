texte: 'Derrière chaque mémoire, il y a une question. Et derrière chaque question, il y a des gens. 🌍


  Ta recherche sur la malnutrition, c''est l''histoire d''enfants dans un village précis.

  Ta recherche sur le foncier, c''est des familles qui se disputent un champ.

  Ta recherche sur l''érosion côtière, c''est des maisons qui reculent devant la mer.

  Ta recherche sur l''entrepreneuriat féminin, c''est des femmes qui veulent agrandir leur commerce.


  Ces gens, tu les as peut-être rencontrés sur ton terrain. Ils ont répondu à tes questionnaires. Ils t''ont donné leur temps. Et souvent, ils t''ont demandé : « Et après, ça va changer quoi pour nous ? »


  La réponse dépend de toi.


  Si ton mémoire reste dans un tiroir, ça ne change rien. Si tu le valorises, même un peu, même avec une seule action, ça peut changer quelque chose. Une fiche pratique. Une restitution au village. Une note à la mairie. Une formation. Un produit.


  Tu n''as pas besoin de changer le monde entier. Changer une vie, c''est déjà énorme. Changer une pratique dans un quartier, c''est déjà énorme.


  Ta recherche a été faite pour servir. Alors fais-la servir. 💛


  Si tu connais quelqu''un qui doute de l''utilité de sa recherche, partage-lui cette vidéo.


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Derrière chaque mémoire et chaque thèse, il y a une question. Et derrière chaque question, des personnes concernées : des enfants exposés à la malnutrition, des familles en conflit foncier, des riverains menacés par l''érosion côtière, des entrepreneures qui cherchent à se développer.


    Ces personnes ont souvent participé à la recherche. Elles ont donné leur temps, répondu aux questionnaires, et parfois demandé ce que cela changerait pour elles.


    La réponse dépend de ce que le chercheur fait de ses résultats. Une fiche pratique, une restitution, une note aux autorités locales, une formation : une seule action suffit parfois à produire un effet réel.


    Changer une pratique dans une communauté est déjà un impact considérable.


    Hub Scientifique Africain (HSA)

    #Impact #RechercheAfricaine #Inspiration'
