texte: '🗓️ Série « Prépare 2027 »


  En 2027, tu vas écrire à des organisations. Voici le modèle à avoir sous la main dès janvier.


  Tu as identifié une ONG, une entreprise ou un service public à qui ta recherche pourrait servir. Maintenant, il faut leur écrire. Et c''est là que beaucoup bloquent. 📩


  Voici la structure d''un premier message qui obtient des réponses. Court, 6 à 8 lignes maximum.


  1️⃣ L''OBJET : précis et utile. « Résultats d''étude sur les pertes post-récolte du manioc à [région] ». Pas « Demande de collaboration ».

  2️⃣ QUI TU ES, en une ligne : « Je suis doctorant en agronomie à l''université de… »

  3️⃣ POURQUOI EUX : montre que tu connais leur travail. « J''ai vu que votre projet accompagne les transformatrices de manioc. »

  4️⃣ TON RÉSULTAT ET SON UTILITÉ : « Mon étude montre que… Ce résultat peut aider vos équipes à… »

  5️⃣ UNE DEMANDE SIMPLE : « Seriez-vous disponible pour un échange de 20 minutes ? »

  6️⃣ TA FICHE D''EXPERTISE EN PIÈCE JOINTE.


  Ce qu''il ne faut pas faire : envoyer le même message à 50 organisations, demander un emploi dès le premier message, ou joindre ton mémoire complet.


  Pas de réponse après 10 jours ? Une relance polie, une seule fois. C''est normal et ça marche souvent.


  Le carrousel te donne le modèle complet. 👆 Enregistre-le pour ton premier envoi.


  On est HSA, le Hub Scientifique Africain.


  🎯 Pour tenir tes objectifs 2027, ne reste pas seul : le Pass Valorisation HSA te donne la méthode (programme certifiant), les opportunités chaque semaine et un groupe pour avancer. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'La prise de contact avec une organisation susceptible d''utiliser des résultats de recherche suit quelques règles simples. Le message doit être court, de six à huit lignes.


    Structure recommandée :

    1. Un objet précis, qui mentionne le résultat et le terrain.

    2. Une présentation en une ligne.

    3. Une référence au travail de l''organisation, qui montre que le message lui est destiné.

    4. Le résultat principal et son utilité pour elle.

    5. Une demande limitée : un échange de vingt minutes.

    6. La fiche d''expertise en pièce jointe.


    À éviter : les envois identiques en nombre, la demande d''emploi dès le premier contact, l''envoi du mémoire complet.


    En l''absence de réponse après une dizaine de jours, une relance unique et courtoise est appropriée.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    #ValorisationDeLaRecherche #Partenariats #JeunesChercheurs'
