texte: '🗓️ Série « Prépare 2027 »


  Dans quelques jours, 2027 commence. Voici deux façons de la vivre.


  Imagine deux jeunes docteurs. Même discipline, même université, même année de soutenance. 👥


  📕 Le premier attend. Il se dit qu''il valorisera plus tard, quand il aura un poste, plus de temps, plus de moyens. Douze mois passent. Sa thèse est toujours dans un dossier. Il envoie des CV. Personne ne connaît vraiment son travail.


  📗 Le second avance, un peu chaque semaine. En janvier, il écrit son résumé grand public et met son profil à jour. En mars, il publie son premier post sur son sujet. En mai, il contacte cinq organisations ; deux lui répondent. En juillet, il anime un atelier. En septembre, il décroche une petite mission. En décembre, on l''invite à intervenir dans un webinaire.


  Rien de spectaculaire. Quelques heures par semaine. Mais au bout de douze mois, l''un est invisible, et l''autre commence à être connu comme « celui qui connaît ce sujet ».


  La différence entre eux n''est pas le talent. Ce n''est pas la chance. C''est la régularité.


  (Les deux personnages sont imaginés pour illustrer, mais ces deux trajectoires, tu les as sûrement déjà vues autour de toi.)


  2027 arrive. Laquelle des deux années veux-tu vivre ?


  La vidéo en 45 secondes. 🎬 Dis-nous en commentaire laquelle tu choisis. 👇


  HSA, le Hub Scientifique Africain.


  🎯 Pour tenir tes objectifs 2027, ne reste pas seul : le Pass Valorisation HSA te donne la méthode (programme certifiant), les opportunités chaque semaine et un groupe pour avancer. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'Deux jeunes docteurs, même discipline, même année de soutenance.


    Le premier reporte la valorisation de ses travaux à plus tard, dans l''attente d''un poste ou de moyens. Un an après, sa thèse reste peu connue.


    Le second consacre quelques heures par semaine à la valorisation : résumé accessible et profil à jour en janvier, premières publications au printemps, prises de contact, atelier, première mission, puis première invitation à intervenir en fin d''année.


    Aucune de ces étapes n''est spectaculaire. Leur accumulation produit pourtant, en douze mois, une différence nette de visibilité et d''opportunités.


    Cette différence tient moins au talent ou aux circonstances qu''à la régularité. (Cas imaginé à titre d''illustration.)


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · #ValorisationDeLaRecherche #JeunesChercheurs'
