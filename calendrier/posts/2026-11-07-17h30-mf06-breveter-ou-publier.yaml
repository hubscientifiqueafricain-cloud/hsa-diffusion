texte: "Tu as mis au point un procédé, un appareil, une formule. Faut-il publier tout de suite, ou d'abord breveter ?\n\nDans cette micro-formation :\n▶ Une invention est brevetable si…\n   • Elle est nouvelle\n   • Elle est inventive\n   • Elle a une application industrielle\n▶ Le piège à éviter\n   • Publier avant = perdre la nouveauté\n   • Soutenance, colloque, post : attention\n▶ Le bon ordre\n   • 1. Garder confidentiel\n   • 2. Déclarer à ton institution\n   • 3. Déposer, puis publier\n\nÀ retenir : Breveter et publier ne s'opposent pas. Il faut juste les faire dans le bon ordre.\n\n\U0001F4AC Tu as une question sur la valorisation de ta recherche ? Pose-la en commentaire : on y répondra dans une prochaine vidéo.\n\U0001F514 Abonne-toi pour ne rien manquer de la série « Valoriser ta recherche · 1 question, 2 minutes ».\n\n\U0001F310 HSA, le Hub Scientifique Africain : https://www.hubscientifiqueafricain.com\n\n#ValorisationDeLaRecherche #Doctorat #RechercheAfricaine"
question_youtube:
- Le brevet d'invention (définition, protection, dépôt de brevet)
- Quels sont les critères de brevetabilité d'une invention ?
- Comment déclarer son invention ?
