texte: "Dans un ascenseur, un ministre te demande : tu travailles sur quoi ? Tu as trente secondes. Voici la formule.\n\nDans cette micro-formation :\n▶ La formule en 4 phrases\n   • 1. Le problème\n   • 2. Ta question\n   • 3. Ce que tu as trouvé\n   • 4. Ce que tu proposes\n▶ Les règles\n   • Zéro jargon\n   • Entraîne-toi à voix haute\n\nÀ retenir : Si tu ne peux pas expliquer ta recherche en trente secondes, personne ne pourra la recommander à ta place.\n\n\U0001F4AC Tu as une question sur la valorisation de ta recherche ? Pose-la en commentaire : on y répondra dans une prochaine vidéo.\n\U0001F514 Abonne-toi pour ne rien manquer de la série « Valoriser ta recherche · 1 question, 2 minutes ».\n\n\U0001F310 HSA, le Hub Scientifique Africain : https://www.hubscientifiqueafricain.com\n\n#ValorisationDeLaRecherche #Doctorat #RechercheAfricaine"
question_youtube:
- Comment présenter son mémoire en 5 minutes ?
- Ma thèse en 180 secondes
- Pour vous, qu'est-ce que la vulgarisation scientifique ?
