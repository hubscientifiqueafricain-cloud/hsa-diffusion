texte: 'Combien de bourses, de prix ou d''appels à projets as-tu découverts… le lendemain de la date limite ? 😩

  Ce n''est pas un manque de talent. C''est un manque d''information. Les opportunités existent, mais elles sont éparpillées : sites d''universités, fondations, ambassades, organisations internationales, réseaux sociaux. Les suivre toutes prend des heures chaque semaine.


  Avec le Pass Valorisation HSA, ce travail est fait pour toi.


  CE QUE TU REÇOIS, CHAQUE SEMAINE :

  💰 des financements pour ta recherche ou ton projet ;

  🏆 des prix et des concours ;

  🎓 des bourses ;

  📢 d''autres opportunités utiles aux masterants, doctorants et jeunes chercheurs.


  Pour chacune : de quoi il s''agit, pour qui, la date limite et le lien pour postuler.


  POURQUOI C''EST IMPORTANT ?

  Souviens-toi : les prix et financements sont l''une des 10 voies de valorisation. Ils apportent de l''argent, de la visibilité, un réseau et une ligne forte sur ton CV. Mais seulement si tu les vois à temps.


  L''ASTUCE POUR EN PROFITER :

  1️⃣ Garde ton « kit candidature » toujours prêt (CV, résumé de 200 mots, résumé simple, photo).

  2️⃣ Chaque semaine, lis la liste et sélectionne 1 ou 2 opportunités qui te correspondent vraiment.

  3️⃣ Note les dates limites dans ton agenda, avec un rappel une semaine avant.


  Une seule opportunité décrochée peut rembourser le Pass des centaines de fois. Et le Pass, c''est 2 000 FCFA pour l''année.


  Commente PASS et on t''envoie le lien. 👇


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Bourses, prix, concours et appels à projets sont nombreux, mais dispersés entre universités, fondations, ambassades et organisations internationales. Les suivre demande un temps considérable, et beaucoup de candidats potentiels les découvrent trop tard.


    Le Pass Valorisation HSA comprend une veille hebdomadaire : financements, prix, concours, bourses et autres opportunités, avec pour chacune son objet, son public, sa date limite et le lien de candidature.


    Pour en tirer parti : tenir un dossier de candidature prêt, sélectionner chaque semaine une ou deux opportunités pertinentes, et planifier les échéances.


    Tarif du Pass : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
