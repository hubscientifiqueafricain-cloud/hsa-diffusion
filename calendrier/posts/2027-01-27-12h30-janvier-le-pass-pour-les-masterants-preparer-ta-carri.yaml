texte: 'Tu es en master et tu te demandes si c''est trop tôt pour penser à ta carrière de chercheur ? 🎓 Non. C''est même le meilleur moment.


  Pendant le master, tu décides si tu vas en thèse, sur quel sujet, avec qui. Et tu peux déjà poser les premières pierres de ton dossier.


  Voici ce que le Pass Valorisation du Hub Scientifique Africain (HSA) t''apporte dès le master :


  🎓 Une première ligne « Formations et certifications » dans ton CV, avec le programme certifiant et son attestation.

  🌍 Un profil de chercheur, pour commencer à être visible avant même ton premier article.

  🏆 Les opportunités chaque semaine, dont des bourses et des concours, pour préparer la suite : thèse, mobilité, financement.

  🤝 Un groupe où tu croises des doctorants et des jeunes docteurs qui peuvent te conseiller sur la thèse.

  💡 La méthode pour tirer de ton mémoire plus qu''une note : un article grand public, une première communication, une idée de projet.


  Commencer tôt, c''est arriver en thèse avec une longueur d''avance.


  2 000 FCFA pour toute l''année. Le carrousel détaille tout. 👆 Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le master constitue une étape déterminante pour préparer une carrière scientifique : choix de la thèse, du sujet, de l''encadrement.


    Le Pass Valorisation du Hub Scientifique Africain permet aux masterants de poser les premières bases d''un dossier : une certification, un profil de chercheur, une veille sur les bourses et concours, un réseau incluant des doctorants et jeunes docteurs, et une méthode pour valoriser le mémoire.


    Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
