texte: "Valoriser sa recherche, ce n'est pas forcément créer une entreprise. Il existe au moins trois grandes familles de valorisation.\n\nDans cette micro-formation :\n▶ La valorisation sociale\n   • Informer, former, éclairer\n   • Ex. : une note aux décideurs\n▶ La valorisation économique\n   • Vendre un savoir ou un produit\n   • Ex. : une étude pour une ONG\n▶ La valorisation académique\n   • Publier, communiquer, enseigner\n   • La base des deux autres\n\nÀ retenir : Social, économique, académique : une même recherche peut emprunter les trois chemins. Choisis celui qui correspond à ton objectif.\n\n\U0001F4AC Tu as une question sur la valorisation de ta recherche ? Pose-la en commentaire : on y répondra dans une prochaine vidéo.\n\U0001F514 Abonne-toi pour ne rien manquer de la série « Valoriser ta recherche · 1 question, 2 minutes ».\n\n\U0001F310 HSA, le Hub Scientifique Africain : https://www.hubscientifiqueafricain.com\n\n#ValorisationDeLaRecherche #Doctorat #RechercheAfricaine"
