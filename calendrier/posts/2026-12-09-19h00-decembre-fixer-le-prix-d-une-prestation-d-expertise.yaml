texte: '🗓️ Série « Prépare 2027 »


  En 2027, ne travaille plus au hasard sur tes tarifs. Fixe-les dès maintenant.


  « Combien je dois demander ? » 💰 C''est LA question qui bloque les jeunes chercheurs au moment de vendre leur expertise. Alors on travaille gratuitement, ou on donne un chiffre au hasard.


  Voici une méthode simple en 3 étapes pour fixer ton tarif journalier.


  1️⃣ TON PLANCHER

  Combien te faut-il pour vivre et travailler correctement chaque mois ? Divise par le nombre de jours que tu peux réellement facturer (souvent 10 à 12 par mois au début, pas 30). Tu obtiens le minimum en dessous duquel tu perds de l''argent.


  2️⃣ LE MARCHÉ

  Renseigne-toi : combien les ONG, les bureaux d''études et les projets paient-ils des consultants de ton niveau dans ton pays ? Demande à des aînés, regarde les termes de référence publiés.


  3️⃣ LA VALEUR

  Qu''est-ce que ton travail rapporte ou fait économiser au client ? Une étude qui évite une mauvaise décision vaut plus que le temps passé à la faire.


  Ton prix se situe entre le plancher et la valeur, en s''appuyant sur le marché.


  Et n''oublie pas : facture aussi la préparation, les déplacements, le rapport. Et demande un acompte.


  La vidéo résume la méthode en 50 secondes. 🎬 Enregistre-la avant ta prochaine proposition.


  HSA, le Hub Scientifique Africain.


  📅 Prépare 2027 avec le Pass Valorisation HSA : le programme certifiant, le guide des 10 façons de gagner de l''argent avec ta recherche, les opportunités chaque semaine et le groupe d''entraide. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'La fixation du tarif est une difficulté fréquente pour les jeunes chercheurs qui proposent leurs services d''expertise. Elle conduit souvent à travailler gratuitement ou à des tarifs arbitraires.


    Une méthode en trois étapes :

    1. Le plancher : charges mensuelles divisées par le nombre réaliste de jours facturables (souvent dix à douze par mois en début d''activité).

    2. Le marché : tarifs pratiqués par les ONG, bureaux d''études et projets pour des profils comparables, à partir des termes de référence publiés et de l''expérience de pairs.

    3. La valeur : gains ou économies que la prestation procure au client.


    Le tarif se situe entre le plancher et la valeur, en cohérence avec le marché. Le devis inclut la préparation, les déplacements et la rédaction, et prévoit un acompte.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    #ValorisationDeLaRecherche #Consulting #Expertise'
