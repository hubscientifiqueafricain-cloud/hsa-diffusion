texte: 'Tu veux rejoindre le Pass Valorisation mais tu ne sais pas comment faire ? 📲 C''est simple, et ça prend quelques minutes.


  1️⃣ CRÉE TON ESPACE GRATUIT

  Va sur hubscientifiqueafricain.com et clique sur « Créer mon espace ». Choisis ton profil (doctorant, chercheur…) et complète tes informations.


  2️⃣ CHOISIS LE PASS VALORISATION

  Depuis la plateforme, sélectionne le Pass Valorisation : 2 000 FCFA pour toute l''année.


  3️⃣ PAIE PAR MOBILE MONEY

  Tu paies 2 000 FCFA par mobile money, et tu reçois un reçu par e-mail.


  Ensuite, tu as accès à tout pendant 12 mois : le programme certifiant, le guide des 10 façons, la veille des opportunités, le groupe d''entraide et les lives mensuels.


  Un doute avant de payer ? Visite d''abord la plateforme, crée ton profil gratuitement et fais la Boussole de valorisation. Tu verras comment on travaille. Et si tu as une question, pose-la en commentaire : on te répond.


  La vidéo te montre les 3 étapes. 🎬 Le lien est en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Souscrire au Pass Valorisation du Hub Scientifique Africain se fait en trois étapes :


    1. Créer gratuitement son espace sur hubscientifiqueafricain.com et compléter son profil.

    2. Sélectionner le Pass Valorisation (2 000 FCFA pour douze mois).

    3. Régler par mobile money ; un reçu est adressé par e-mail.


    L''abonnement donne accès au programme certifiant, au guide des dix voies de revenus, à la veille hebdomadaire des opportunités, au groupe d''entraide et aux sessions mensuelles en direct.


    Il est possible de découvrir la plateforme au préalable, en créant un profil et en réalisant gratuitement la Boussole de valorisation.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
