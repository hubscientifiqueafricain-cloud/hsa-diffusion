texte: '💰 Série « Gagner de l''argent avec ta recherche »


  Tu commences à avoir des clients. 💼 Faut-il créer une entreprise ? Avoir un statut ? C''est une question qui revient souvent. Voici quelques repères, sans jargon.


  🟢 AU TOUT DÉBUT

  Quand tu testes ton offre avec quelques missions ponctuelles, l''essentiel est de bien documenter : devis, factures ou reçus, et copies de tout.


  🟡 QUAND ÇA DEVIENT RÉGULIER

  Si tu as des clients réguliers, ou si une organisation te demande une facture avec un numéro d''identification, c''est le moment de te renseigner sérieusement sur la formalisation.


  🔴 QUAND C''EST OBLIGATOIRE

  Certaines organisations, notamment les institutions et les grands projets, ne peuvent payer que des prestataires formalisés. Et la loi de ton pays fixe aussi des obligations.


  📍 OÙ TE RENSEIGNER

  • Le guichet unique de création d''entreprise de ton pays.

  • Les chambres de commerce.

  • Un comptable ou un conseiller juridique.

  • Les incubateurs et structures d''accompagnement des entrepreneurs.


  ⚠️ Les règles, les statuts possibles et les obligations fiscales sont différents dans chaque pays. Ne te fie pas aux conseils d''un ami : va à la source.


  💡 Si tu as une bourse ou un contrat avec ton université, vérifie aussi que tu as le droit d''exercer une activité à côté.


  Le carrousel résume les repères. 👆


  HSA, le Hub Scientifique Africain.


  🧭 Pas sûr de la façon qui te correspond ? Fais la Boussole HSA, gratuite. Et pour te lancer accompagné, le Pass Valorisation coûte 2 000 FCFA pour l''année. Liens en commentaire.'
textes:
  linkedin: 'La formalisation d''une activité de prestation se pose généralement lorsque celle-ci devient régulière, ou lorsque des clients exigent une facture émise par une structure identifiée. Certaines institutions ne peuvent rémunérer que des prestataires formalisés.


    Les guichets uniques de création d''entreprise, les chambres de commerce, les comptables, les conseillers juridiques et les incubateurs constituent les sources d''information de référence. Les règles variant selon les pays, il convient de s''y référer directement. Les boursiers et contractuels doivent également vérifier leurs propres conditions.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
