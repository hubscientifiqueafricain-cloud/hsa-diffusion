texte: '🗓️ Série « Prépare 2027 »


  Les prix et concours de 2027 se gagnent avec un dossier préparé avant l''appel. Décembre est le bon moment.


  Les prix et concours pour jeunes chercheurs existent : ma thèse en 180 secondes, prix de l''innovation, concours de startups, prix des fondations et des organisations internationales. 🏆 Le problème, c''est que beaucoup découvrent l''appel trop tard et bâclent leur dossier.


  La solution : avoir un dossier prêt AVANT l''appel. Voici ce qu''il doit contenir :


  📄 UN RÉSUMÉ GRAND PUBLIC de ta recherche (250 mots environ).

  🎯 LE PROBLÈME ET TON IMPACT : à qui sert ton travail, ce qu''il change, avec des chiffres si tu en as.

  💡 CE QUI EST NOUVEAU : ce que ta recherche apporte de différent.

  🧑🏾‍🎓 TON CV À JOUR, en 2 pages maximum.

  📸 UNE PHOTO PROFESSIONNELLE ET UNE COURTE VIDÉO (souvent demandée) où tu présentes ton projet en 1 à 3 minutes.

  ✉️ 2 OU 3 PERSONNES prêtes à écrire une lettre de recommandation. Préviens-les à l''avance.

  📅 UN TABLEAU DES ÉCHÉANCES pour suivre les appels.


  Quand l''appel sort, tu n''as plus qu''à adapter, pas à tout écrire.


  Et lis le règlement deux fois : beaucoup de dossiers sont éliminés pour un document manquant ou un critère d''âge non respecté.


  Le carrousel te donne la checklist complète. 👆 Enregistre-le et prépare ton dossier ce mois-ci.


  On est HSA, le Hub Scientifique Africain.


  🚀 Tu veux qu''en 2027 ta recherche serve vraiment ? Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : méthode, opportunités, profil visible et entraide. Lien en commentaire.'
textes:
  linkedin: 'Les prix et concours destinés aux jeunes chercheurs sont nombreux : concours de vulgarisation, prix d''innovation, concours d''entrepreneuriat, distinctions de fondations et d''organisations internationales. Les délais de candidature sont toutefois souvent courts.


    Un dossier préparé à l''avance permet de répondre dans de bonnes conditions. Il comprend :

    • un résumé accessible de la recherche (environ 250 mots) ;

    • une présentation du problème traité et de l''impact attendu ;

    • les éléments de nouveauté ;

    • un CV de deux pages ;

    • une photographie et une courte vidéo de présentation ;

    • deux ou trois recommandants informés ;

    • un tableau de suivi des échéances.


    Une lecture attentive du règlement reste indispensable : de nombreux dossiers sont écartés pour une pièce manquante ou un critère d''éligibilité non respecté.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    #ValorisationDeLaRecherche #PrixScientifiques #JeunesChercheurs'
