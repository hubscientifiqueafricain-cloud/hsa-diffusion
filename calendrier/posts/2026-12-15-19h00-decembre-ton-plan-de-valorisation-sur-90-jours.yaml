texte: '🗓️ Série « Prépare 2027 »


  Voici ton plan pour les trois premiers mois de 2027.


  Tu as maintenant tous les outils : ton pitch, ton résumé grand public, ta fiche d''expertise, ton profil, tes idées de posts. 🧰 Il te manque juste un plan.


  Voici un plan simple sur 90 jours, à démarrer en janvier :


  📅 MOIS 1 : PRÉPARER

  • Semaine 1 : choisis ta voie principale et ton objectif sur 90 jours.

  • Semaine 2 : écris ton pitch et ton résumé grand public.

  • Semaine 3 : prépare ta fiche d''expertise et mets ton profil à jour.

  • Semaine 4 : fais ta carte des utilisateurs, avec 10 noms réels.


  📅 MOIS 2 : SE MONTRER

  • 1 post par semaine sur ton sujet.

  • 5 messages à des organisations de ta carte.

  • 1 infographie ou 1 article grand public.

  • Repérer 2 appels (prix, concours, financements) et préparer ton dossier.


  📅 MOIS 3 : CONCRÉTISER

  • Les rendez-vous obtenus, avec un compte rendu et une proposition après chacun.

  • 1 candidature envoyée.

  • 1 action concrète réalisée : un atelier, une note, une mission, une intervention.

  • Le bilan : ce qui a marché, ce que tu changes pour les 90 jours suivants.


  Environ 2 à 3 heures par semaine. C''est tout.


  Le carrousel te donne le plan semaine par semaine. 👆 Enregistre-le pour le 1er janvier.


  On est HSA, le Hub Scientifique Africain.


  📅 Prépare 2027 avec le Pass Valorisation HSA : le programme certifiant, le guide des 10 façons de gagner de l''argent avec ta recherche, les opportunités chaque semaine et le groupe d''entraide. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'La valorisation de la recherche progresse davantage avec un plan régulier qu''avec des efforts ponctuels. Proposition de plan sur quatre-vingt-dix jours :


    Mois 1 : préparer. Choix de la voie et de l''objectif ; présentation courte et résumé accessible ; fiche d''expertise et profil à jour ; carte des utilisateurs avec dix noms identifiés.


    Mois 2 : se rendre visible. Une publication hebdomadaire ; cinq prises de contact ; une infographie ou un article de vulgarisation ; repérage de deux appels et préparation du dossier.


    Mois 3 : concrétiser. Rendez-vous et propositions de suivi ; une candidature déposée ; une action réalisée (atelier, note, mission, intervention) ; un bilan pour le cycle suivant.


    Le temps requis est de deux à trois heures par semaine.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    #ValorisationDeLaRecherche #Planification #JeunesChercheurs'
