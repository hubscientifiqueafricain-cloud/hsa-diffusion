texte: '💰 Série « Gagner de l''argent avec ta recherche »


  Tu veux accompagner d''autres étudiants, de façon éthique ? 🎓 Voici 4 formats simples à proposer :


  1️⃣ LA SÉANCE DE GROUPE

  Deux heures sur un point qui bloque souvent : la problématique, la revue de littérature, le plan, l''analyse. Petit prix par personne, plusieurs participants. C''est le format le plus facile pour commencer.


  2️⃣ LE COACHING INDIVIDUEL

  Des rendez-vous réguliers avec un étudiant, pour l''aider à avancer étape par étape. Tu expliques, il fait.


  3️⃣ LA RELECTURE COMMENTÉE

  Tu lis un chapitre et tu rends des commentaires : ce qui est clair, ce qui manque, ce qui peut être amélioré. Tu ne réécris pas.


  4️⃣ LA PRÉPARATION DE SOUTENANCE

  Répétitions, conseils sur les diapositives, simulation des questions du jury.


  💡 Pour démarrer : annonce une séance de groupe dans 3 groupes WhatsApp de promotion, sur un sujet précis. « Samedi, 2 heures pour structurer ta problématique. »


  Les étudiants qui ont été bien accompagnés en parlent autour d''eux. C''est le meilleur des bouches-à-oreilles.


  La vidéo résume les 4 formats. 🎬


  HSA, le Hub Scientifique Africain.


  📘 Tu veux les 10 façons dans un seul document ? Le guide HSA est gratuit. Et pour avancer toute l''année, il y a le Pass Valorisation à 2 000 FCFA. Liens en commentaire.'
textes:
  linkedin: 'Quatre formats d''accompagnement méthodologique peuvent être proposés aux étudiants : les séances collectives thématiques, le coaching individuel, la relecture commentée et la préparation de soutenance.


    Les séances collectives constituent le format le plus simple pour démarrer, en ciblant un point de difficulté fréquent. Dans tous les cas, l''accompagnateur explique et conseille ; l''étudiant reste l''auteur de son travail.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
