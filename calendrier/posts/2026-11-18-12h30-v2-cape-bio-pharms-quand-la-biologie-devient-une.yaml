texte: 'Et si des plantes pouvaient fabriquer des médicaments ? 🌿💉

  Ça ressemble à de la science-fiction. C''est pourtant le métier de Cape Bio Pharms, une entreprise sud-africaine née à l''Université du Cap (UCT).


  L''HISTOIRE, ÉTAPE PAR ÉTAPE :


  🔬 Au départ, il y a une équipe de recherche : la Biopharming Research Unit de l''UCT. Elle travaille sur une idée : utiliser des plantes comme « usines » pour produire des protéines utiles à la santé.


  💡 Le principe : on introduit dans une plante l''information génétique d''une protéine. La plante la fabrique en grande quantité. On la récupère ensuite pour l''utiliser.


  🏭 Ces innovations sortent du laboratoire et donnent naissance à une spin-off : Cape Bio Pharms. Elle produit dans des plantes des protéines, des antigènes et des anticorps.


  🧪 À quoi ça sert ? À fabriquer des réactifs de laboratoire, des tests de diagnostic et des composants de vaccins. Des produits dont l''Afrique a besoin, et qu''elle importe souvent.


  CE QUE ÇA NOUS APPREND :

  ✅ Une recherche fondamentale peut devenir une entreprise.

  ✅ Une unité de recherche universitaire peut être le point de départ d''une industrie.

  ✅ Produire en Afrique ce qu''on importe, c''est possible quand la recherche est valorisée.


  Cape Bio Pharms fait partie des entreprises issues de la recherche présentées dans l''annuaire des organisations de HSA.


  Le carrousel raconte l''histoire en détail. 👆 Partage-le à un biologiste qui doit le voir.


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Cape Bio Pharms illustre le passage de la recherche fondamentale à l''industrie.


    Cette spin-off de l''Université du Cap (UCT) est issue des travaux de la Biopharming Research Unit, qui utilise des plantes comme systèmes de production de protéines.


    L''entreprise produit dans des plantes des protéines, des antigènes et des anticorps destinés à la fabrication de réactifs, de tests de diagnostic et de composants vaccinaux.


    Trois enseignements pour les chercheurs africains :

    • la recherche fondamentale peut déboucher sur une activité économique ;

    • une unité de recherche universitaire peut être à l''origine d''une filière ;

    • la valorisation de la recherche peut réduire la dépendance aux importations.


    Hub Scientifique Africain (HSA)

    #Biotechnologie #Spinoff #RechercheAfricaine'
