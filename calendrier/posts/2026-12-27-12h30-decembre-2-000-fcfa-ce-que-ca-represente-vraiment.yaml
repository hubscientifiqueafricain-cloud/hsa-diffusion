texte: '2 000 FCFA. 💸 C''est quoi, pour toi ?


  C''est à peu près le prix d''un repas au maquis. D''une recharge de crédit. De quelques trajets en moto-taxi. Une somme qu''on dépense parfois sans même y penser.


  Le Pass Valorisation coûte exactement ça. Mais pas par semaine, pas par mois : pour toute l''année. Ça fait moins de 6 FCFA par jour.


  Pour ce prix, pendant 12 mois, tu as :

  🎓 le programme certifiant « Initiation à la valorisation » et son attestation ;

  📘 le guide « 10 façons de gagner de l''argent avec ton mémoire ou ta thèse » ;

  👤 ton profil de chercheur visible ;

  📬 les opportunités chaque semaine ;

  🤝 le groupe d''entraide et les lives mensuels.


  Et pense à ce que peut rapporter une seule opportunité saisie à temps, une seule mission obtenue, un seul prix gagné.


  On a choisi ce prix volontairement. Parce qu''on sait que beaucoup de masterants et de doctorants vivent avec peu. Et qu''on ne voulait pas que l''argent soit la raison pour laquelle ta recherche reste dans un tiroir.


  La vidéo en 30 secondes. 🎬 Le lien pour t''inscrire est en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le Pass Valorisation du Hub Scientifique Africain est proposé au tarif de 2 000 FCFA pour une année complète, soit moins de 6 FCFA par jour.


    Ce tarif donne accès, pendant douze mois, au programme certifiant « Initiation à la valorisation » et à son attestation, au guide des dix voies de revenus, à un profil de chercheur visible, à une veille hebdomadaire des opportunités, ainsi qu''à un groupe d''entraide et à des sessions mensuelles en direct.


    Ce niveau de prix a été retenu délibérément : de nombreux masterants et doctorants disposent de ressources limitées, et le coût ne doit pas constituer un obstacle à la valorisation de leurs travaux.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
