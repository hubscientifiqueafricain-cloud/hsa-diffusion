texte: 'Le Pass Valorisation est-il fait pour toi ? 🤔 Fais le test. Compte combien de phrases te correspondent :


  ☑️ Tu es masterant, doctorant ou jeune chercheur.

  ☑️ Ton mémoire ou ta thèse est terminé, ou presque, et tu ne sais pas quoi en faire.

  ☑️ Tu aimerais que ta recherche serve à quelque chose en dehors de l''université.

  ☑️ Tu aimerais en tirer un revenu, mais tu ne sais pas comment.

  ☑️ Tu découvres souvent les bourses et les prix après la date limite.

  ☑️ Personne en dehors de ton labo ne connaît vraiment ton travail.

  ☑️ Tu te sens parfois seul dans ton parcours de recherche.

  ☑️ Tu veux une méthode claire plutôt que de chercher au hasard.


  Tu as 3 oui ou plus ? Le Pass a été conçu pour toi.


  Ce qu''il t''apporte : le programme certifiant en 5 modules avec attestation, le guide des 10 façons de gagner de l''argent avec ta recherche, ton profil visible, les opportunités chaque semaine, le groupe d''entraide et les lives mensuels.


  Ce qu''il ne fait pas : il ne fait pas le travail à ta place, et il ne te promet pas un emploi ou un revenu. Il te donne la méthode, les opportunités et l''entourage. Le reste, c''est toi. 💪🏾


  2 000 FCFA pour toute l''année.


  La vidéo te fait passer le test. 🎬 Combien de oui ? Dis-le en commentaire. 👇 Lien d''inscription en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le Pass Valorisation du Hub Scientifique Africain s''adresse en particulier aux personnes qui se reconnaissent dans plusieurs des situations suivantes :

    • masterant, doctorant ou jeune chercheur ;

    • travail de recherche achevé ou en voie de l''être, sans projet de valorisation défini ;

    • souhait de voir ses résultats utilisés hors de l''université, ou d''en tirer un revenu ;

    • difficulté à repérer les opportunités dans les délais ;

    • faible visibilité hors du laboratoire ;

    • besoin d''une méthode et d''un collectif.


    Le Pass fournit une méthode, une veille, une visibilité et un réseau d''entraide. Il ne se substitue pas à l''engagement de chacun et ne garantit ni emploi ni revenu.


    Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
