texte: 'Tu as décidé de faire avancer ta carrière avec le Hub Scientifique Africain (HSA) ? 🙌🏾 Voici comment rejoindre le Pass Valorisation, en 3 étapes.


  1️⃣ CRÉE TON ESPACE

  Va sur hubscientifiqueafricain.com et crée ton espace gratuit. Si tu as déjà un profil, connecte-toi.


  2️⃣ CHOISIS LE PASS VALORISATION

  Dans ton espace, sélectionne le Pass Valorisation à 2 000 FCFA pour un an.


  3️⃣ PAIE PAR MOBILE MONEY

  Simple et rapide. Tu reçois ton reçu par e-mail.


  Et ensuite ?

  ✅ Tu accèdes au programme certifiant et au guide.

  ✅ Tu rejoins le groupe d''entraide.

  ✅ Tu reçois les opportunités chaque semaine.


  💡 Notre conseil : dès ton inscription, complète ton profil de chercheur. C''est lui que verront les organisations.


  Une question ou un souci pendant l''inscription ? Écris-nous en message privé, on te répond.


  La vidéo montre les 3 étapes. 🎬 Le lien est en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'L''inscription au Pass Valorisation du Hub Scientifique Africain s''effectue en trois étapes :


    1. Créer un espace gratuit sur hubscientifiqueafricain.com, ou se connecter à un espace existant.

    2. Sélectionner le Pass Valorisation (2 000 FCFA pour un an).

    3. Régler par mobile money ; un reçu est adressé par e-mail.


    L''accès au programme certifiant, au guide, au groupe d''entraide et à la veille des opportunités est ensuite ouvert. Il est recommandé de compléter son profil de chercheur dès l''inscription.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
