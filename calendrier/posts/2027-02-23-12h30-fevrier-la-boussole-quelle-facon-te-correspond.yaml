texte: '10 façons de gagner de l''argent avec ta recherche, c''est bien. Mais laquelle est faite pour toi ? 🧭


  C''est la question qu''on reçoit le plus. Alors on a créé la Boussole HSA : un diagnostic gratuit, en 5 minutes.


  Comment ça marche ?

  1️⃣ Tu réponds à quelques questions sur ta recherche, tes compétences et ton temps disponible.

  2️⃣ La Boussole te suggère les façons qui te correspondent le mieux.

  3️⃣ Tu télécharges un plan de 90 jours en PDF, pour passer à l''action.


  Pas besoin de tout faire. Il te faut juste la bonne première façon.


  👉 Fais le diagnostic gratuit sur hubscientifiqueafricain.com. Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Face aux différentes voies de valorisation économique de la recherche, le choix du point de départ est souvent la principale difficulté.


    La Boussole HSA est un diagnostic gratuit d''environ cinq minutes. À partir de quelques questions sur la recherche, les compétences et la disponibilité du chercheur, elle suggère les voies les plus adaptées et propose un plan d''action de 90 jours à télécharger.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
