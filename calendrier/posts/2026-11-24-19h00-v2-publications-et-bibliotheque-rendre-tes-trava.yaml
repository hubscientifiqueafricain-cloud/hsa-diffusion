texte: 'Ton mémoire est sur ton ordinateur. Ta thèse est à la bibliothèque de ton université. Ton article est derrière un abonnement payant. 📂 Résultat : presque personne ne peut les lire.


  Sur HSA, tu peux rassembler tous tes travaux au même endroit, et les rendre visibles.


  COMMENT ÇA MARCHE ?

  1️⃣ Tu déposes ton travail : un PDF, un lien ou un DOI.

  2️⃣ Tu choisis son type : mémoire, thèse, article, communication, rapport…

  3️⃣ Tu ajoutes un résumé et des mots-clés (astuce : ajoute aussi un résumé en langage simple 😉).

  4️⃣ Tu indiques tes co-auteurs : ils sont reliés automatiquement à ton travail.

  5️⃣ Tu le mets à jour quand tu veux. Les versions sont archivées.


  ET APRÈS ?

  📈 Ton travail devient trouvable par les autres membres : chercheurs, institutions, organisations.

  📈 Tu suis combien de fois il a été vu et téléchargé.

  📈 Tu peux le mettre en avant comme travail phare sur ton profil.


  LA BIBLIOTHÈQUE

  En plus de tes publications, la bibliothèque HSA rassemble des ressources partagées en libre accès par la communauté : documents, images, supports. Tu peux y contribuer et y puiser.


  ⚠️ Petit rappel : avant de déposer un travail, vérifie que tu en as le droit (accord de ton université, politique de la revue) et que rien ne doit être protégé avant diffusion.


  Le carrousel te guide étape par étape. 👆 Dépose ton premier travail aujourd''hui : lien en commentaire.


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Mémoires sur des disques durs, thèses en bibliothèque, articles sous abonnement : les travaux des jeunes chercheurs africains sont souvent difficiles d''accès.


    La plateforme HSA permet de les rassembler et de les rendre visibles :

    1. dépôt en PDF, par lien ou par DOI ;

    2. classification par type (mémoire, thèse, article, communication, rapport) ;

    3. résumé et mots-clés ;

    4. liaison avec les co-auteurs ;

    5. mise à jour et archivage des versions.


    Chaque travail devient consultable par la communauté, avec un suivi des vues et téléchargements, et peut être mis en avant sur le profil.


    La bibliothèque HSA rassemble également des ressources partagées en libre accès.


    Avant tout dépôt, il convient de vérifier les droits applicables et l''éventuelle nécessité de protéger les résultats.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
