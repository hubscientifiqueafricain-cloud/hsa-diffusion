texte: 'Les fêtes approchent. 🎄✨ Avant que tout le monde parte en famille, on voulait te dire quelque chose.


  Cette année, tu as cherché. Tu as lu, écrit, réécrit. Tu as douté. Tu as peut-être soutenu, ou tu t''en approches. Tu as continué malgré les coupures, les retards de bourse, les nuits courtes et les questions de la famille : « Alors, c''est fini, ces études ? » 😅


  Alors pour ces fêtes, on te souhaite :

  🌟 Du repos. Le vrai. Ta recherche peut attendre quelques jours.

  🌟 De la fierté. Pour tout le chemin parcouru, même s''il n''est pas terminé.

  🌟 Des proches qui te demandent « Et tu travailles sur quoi ? », et de pouvoir leur répondre avec ton pitch de 30 secondes. 😉

  🌟 Et pour 2027 : que ta recherche sorte du tiroir, qu''elle serve à quelqu''un, et qu''elle te le rende.


  Merci d''avoir suivi nos posts ce mois-ci. Et si tu veux être accompagné en 2027, le Pass Valorisation t''attend : 2 000 FCFA pour toute l''année (lien en commentaire).


  Et toi, quel est ton vœu pour ta recherche en 2027 ? Écris-le en commentaire. On les lira tous. 💬


  Joyeuses fêtes ! 🎉

  L''équipe HSA, le Hub Scientifique Africain'
textes:
  linkedin: 'À l''approche des fêtes, une pensée pour les masterants, doctorants et jeunes chercheurs qui ont poursuivi leurs travaux cette année, souvent dans des conditions exigeantes.


    Nos vœux pour cette période : un temps de repos, la reconnaissance du chemin parcouru, et des occasions de présenter simplement ses travaux à ses proches.


    Pour 2027, nous souhaitons à chacun que sa recherche trouve des utilisateurs, produise de l''impact et lui ouvre de nouvelles perspectives.


    Merci aux lecteurs qui ont suivi cette série consacrée à la valorisation de la recherche. Pour celles et ceux qui souhaitent être accompagnés en 2027, le Pass Valorisation est proposé à 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
