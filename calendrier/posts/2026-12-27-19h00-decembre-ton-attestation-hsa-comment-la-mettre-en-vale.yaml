texte: 'Le programme certifiant « Initiation à la valorisation », inclus dans le Pass, se termine par une attestation HSA. 📄 Encore faut-il savoir la mettre en valeur. Voici comment.


  📝 SUR TON CV

  Dans une rubrique « Formations complémentaires » ou « Certifications » :

  « Attestation – Initiation à la valorisation de la recherche, Hub Scientifique Africain (HSA), 2027 ».

  Et ajoute en dessous une ligne sur ce que tu sais faire : « Identification des résultats valorisables, choix d''une stratégie de valorisation, plan d''action. »


  💼 SUR LINKEDIN

  Ajoute-la dans la section « Licences et certifications ». Et publie un post : ce que tu as appris, et ce que tu vas en faire. C''est aussi une occasion de parler de ta recherche.


  🗣️ EN ENTRETIEN

  Ne te contente pas de la citer. Raconte : « J''ai suivi ce programme, et j''ai appliqué la méthode à ma thèse : j''ai identifié tel résultat, et j''ai fait telle action. » Une attestation + un exemple concret, c''est ce qui convainc.


  📁 DANS TON PORTFOLIO

  Avec ton plan d''action et les premières actions que tu as menées.


  L''attestation montre que tu as appris. Ce que tu en fais montre que tu sais agir.


  Le carrousel te donne les formulations. 👆 Le programme est inclus dans le Pass, à 2 000 FCFA par an. Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le programme certifiant « Initiation à la valorisation », inclus dans le Pass Valorisation du Hub Scientifique Africain, donne lieu à une attestation HSA. Quelques recommandations pour la mettre en valeur :


    • CV : rubrique « Formations complémentaires » ou « Certifications », avec l''intitulé, l''organisme et l''année, suivis des compétences acquises (identification des résultats valorisables, stratégie de valorisation, plan d''action).

    • LinkedIn : section « Licences et certifications », accompagnée d''une publication sur les enseignements tirés.

    • Entretien : associer l''attestation à un exemple d''application concrète à ses propres travaux.

    • Portfolio : y joindre le plan d''action et les premières réalisations.


    Tarif du Pass : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
