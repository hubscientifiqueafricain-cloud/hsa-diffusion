texte: 'Tu veux valoriser ta recherche, mais tu ne sais pas à qui t''adresser ? 🤔

  Tu n''es pas seul dans l''histoire. Voici les 8 acteurs de la valorisation et ce que chacun peut faire pour toi.


  👩🏾‍🔬 TOI, le chercheur : tu connais tes résultats mieux que personne. Tu es le point de départ.

  🏛️ TON UNIVERSITÉ ou ton laboratoire : elle peut t''aider à protéger tes résultats, signer des conventions, te mettre en relation. Renseigne-toi sur la direction de la recherche ou le service de valorisation.

  🏭 LES ENTREPRISES : elles cherchent des solutions à leurs problèmes et peuvent financer, acheter une expertise ou une licence.

  🤲🏾 LES ONG et organisations internationales : elles ont besoin de données et d''expertise pour leurs projets.

  🏢 L''ÉTAT et les collectivités : ministères, mairies, agences. Ils prennent des décisions et ont besoin d''éclairages.

  💶 LES BAILLEURS et fondations : ils financent des projets, des prix et des bourses.

  🚀 LES INCUBATEURS : ils accompagnent ceux qui veulent créer une entreprise à partir de leur recherche.

  📣 LES MÉDIAS : ils font connaître ta recherche au grand public.


  L''astuce : ne contacte pas tout le monde. Choisis les 2 ou 3 acteurs qui ont le plus besoin de ton résultat.


  Le carrousel te donne pour chacun : son rôle, ce qu''il attend et comment l''approcher. 👆 Enregistre-le.


  On est HSA, le Hub Scientifique Africain : on rassemble ces acteurs au même endroit.'
textes:
  linkedin: 'La valorisation de la recherche n''est jamais l''affaire du seul chercheur. Huit acteurs interviennent, chacun avec un rôle précis :


    • le chercheur, qui connaît ses résultats et porte la démarche ;

    • l''université et le laboratoire, qui protègent, contractualisent et mettent en relation ;

    • les entreprises, qui financent, achètent une expertise ou une licence ;

    • les ONG et organisations internationales, qui ont besoin de données et d''expertise ;

    • l''État et les collectivités, qui décident et ont besoin d''éclairages ;

    • les bailleurs et fondations, qui financent projets, prix et bourses ;

    • les incubateurs, qui accompagnent la création d''entreprise ;

    • les médias, qui donnent de la visibilité.


    Le conseil : identifier les deux ou trois acteurs qui ont le plus besoin de vos résultats, plutôt que de solliciter tout le monde.


    Le carrousel détaille le rôle de chacun et la manière de l''approcher.


    Hub Scientifique Africain (HSA)

    #ValorisationDeLaRecherche #Partenariats #Recherche'
