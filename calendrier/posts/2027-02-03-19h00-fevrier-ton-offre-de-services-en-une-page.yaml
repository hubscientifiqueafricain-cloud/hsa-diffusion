texte: '💰 Série « Gagner de l''argent avec ta recherche »


  Quand tu proposes tes services, personne ne lira ton mémoire de 80 pages. 📄 Il te faut une seule page, claire, qui donne envie de t''appeler.


  Voici la structure en 6 blocs :


  1️⃣ LE TITRE

  Ce que tu proposes, en une ligne. « Enquête de satisfaction auprès de vos bénéficiaires. »


  2️⃣ LE PROBLÈME

  Ce que vit ton client. « Vous avez besoin de savoir si votre projet répond vraiment aux attentes. »


  3️⃣ CE QUE TU FAIS

  Les étapes, simplement : questionnaire, collecte, analyse, rapport.


  4️⃣ CE QU''IL REÇOIT

  Le livrable concret : un rapport de 10 pages, une présentation, une base de données.


  5️⃣ LE DÉLAI

  « En 3 semaines. »


  6️⃣ QUI TU ES

  Trois lignes : ta formation, ton expérience sur le sujet, ton contact.


  💡 Ne mets pas forcément ton prix sur cette page. Il dépend de chaque demande. Tu le donneras dans un devis, après avoir échangé avec le client.


  Le carrousel contient le modèle complet. 👆 Enregistre-le et remplis-le pour ton premier service.


  HSA, le Hub Scientifique Africain.


  🎯 Pour passer de l''idée au premier revenu sans avancer seul : le Pass Valorisation HSA te donne la méthode (avec attestation), les financements chaque semaine, un profil visible et un groupe d''entraide. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'Une offre de services efficace tient sur une seule page. Elle comprend six éléments : un intitulé clair, le problème du client, la démarche proposée, les livrables, le délai et une courte présentation du prestataire.


    Le tarif peut être communiqué ultérieurement dans un devis, après un échange permettant de préciser le besoin.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
