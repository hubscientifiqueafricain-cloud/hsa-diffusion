texte: '🎓 Série « Carrière de chercheur »


  Pendant un colloque, ce qui se passe entre les sessions compte presque autant que les présentations. ☕ C''est là qu''on rencontre de futurs collaborateurs, des membres de jury, des recruteurs. Mais quand on est timide, aller vers les autres est difficile.


  Voici 5 astuces pour réseauter sans te forcer :


  1️⃣ FIXE-TOI UN PETIT OBJECTIF

  Trois nouvelles personnes par jour. Pas trente.


  2️⃣ PRÉPARE TA PRÉSENTATION EN UNE PHRASE

  « Je suis doctorant en économie à [université], je travaille sur l''accès au crédit des commerçantes. »


  3️⃣ COMMENCE PAR UNE QUESTION

  « Qu''avez-vous pensé de la dernière session ? » Les gens aiment parler de ce qu''ils ont vu.


  4️⃣ VA VOIR LES ORATEURS APRÈS LEUR PRÉSENTATION

  Une question précise sur leur travail est la meilleure entrée en matière.


  5️⃣ FAIS LE SUIVI DANS LA SEMAINE

  Un message court : « Ravi de vous avoir rencontré au colloque de… » C''est là que le contact devient une relation.


  💡 Garde la liste des personnes rencontrées, avec une note sur votre échange. Dans un an, tu seras content de l''avoir.


  La vidéo résume tout ça. 🎬


  HSA, le Hub Scientifique Africain.


  🎯 Pour construire ta carrière sans avancer seul : le Pass Valorisation HSA te donne une méthode certifiante (avec attestation pour ton CV), les opportunités chaque semaine et un groupe d''entraide. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'Les échanges informels pendant un colloque sont déterminants : ils permettent de rencontrer de futurs collaborateurs, des évaluateurs ou des recruteurs.


    Pour les profils plus réservés, quelques pratiques facilitent le réseautage : se fixer un objectif modeste de rencontres, préparer une présentation en une phrase, engager la conversation par une question, aborder les intervenants après leur communication, et assurer un suivi par message dans la semaine.


    Conserver une trace des personnes rencontrées et des sujets abordés facilite les collaborations futures.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
