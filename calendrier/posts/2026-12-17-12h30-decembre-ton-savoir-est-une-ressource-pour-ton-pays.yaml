texte: '🗓️ Série « Prépare 2027 »


  À l''approche de 2027, un rappel sur ce que vaut vraiment ton savoir.


  On parle souvent des ressources de l''Afrique : le pétrole, l''or, le cacao, le coton. 🌍

  On parle beaucoup moins d''une autre ressource, peut-être la plus précieuse : le savoir de ses chercheurs.


  Chaque mémoire soutenu, chaque thèse terminée, c''est des mois ou des années à étudier un problème de chez nous. Nos sols, nos maladies, nos langues, nos économies, nos villes, notre histoire.


  Ce savoir, personne d''autre ne l''a exactement. Pas avec ce terrain, pas avec cette connaissance des réalités locales.


  Et pourtant, une grande partie reste dans les tiroirs. Pendant que des décisions se prennent sans lui. Pendant que des solutions sont importées alors qu''elles existaient peut-être déjà dans une bibliothèque universitaire.


  Laisser dormir son mémoire, ce n''est pas seulement une occasion perdue pour soi. C''est une ressource qui ne sert pas à son pays.


  Alors cette fin d''année, on te pose une question simple : et si 2027 était l''année où ton savoir sort du tiroir ?


  La vidéo en 40 secondes. 🎬 Partage-la si tu y crois. 🔁


  On est HSA, le Hub Scientifique Africain. Notre conviction : la recherche africaine peut produire de l''impact, des revenus et de la notoriété.


  📅 Prépare 2027 avec le Pass Valorisation HSA : le programme certifiant, le guide des 10 façons de gagner de l''argent avec ta recherche, les opportunités chaque semaine et le groupe d''entraide. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'Les ressources naturelles de l''Afrique occupent une large place dans le débat public. Le savoir produit par ses chercheurs en occupe beaucoup moins.


    Chaque mémoire et chaque thèse représentent un investissement important dans la compréhension d''un problème local : sols, santé, langues, économies, territoires, histoire. Cette connaissance du terrain est difficilement remplaçable.


    Une partie importante de ces travaux reste pourtant peu diffusée, tandis que des décisions sont prises sans en tenir compte et que des solutions sont parfois importées alors que des réponses existent localement.


    Valoriser la recherche, c''est mobiliser une ressource nationale au service de ceux qui en ont besoin.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · #RechercheAfricaine #ValorisationDeLaRecherche'
