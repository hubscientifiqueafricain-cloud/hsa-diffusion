texte: 'Tu as soutenu il y a 2 ans, 5 ans, peut-être 10 ans. Et tu te dis que c''est trop tard pour valoriser ton mémoire. 😔

  Bonne nouvelle : ce n''est pas trop tard.


  Ce qui compte, ce n''est pas la date de ta soutenance. C''est la question : « Le problème que j''ai étudié existe-t-il encore ? » Si la réponse est oui, ton travail peut encore servir.


  Voici comment reprendre un ancien mémoire, en 4 étapes :


  1️⃣ RELIS-LE avec un œil neuf. Pas pour corriger : pour repérer ce qui reste utile. Données, méthode, recommandations, cartes.


  2️⃣ METS-LE À JOUR. Cherche ce qui a changé depuis : nouvelles données, nouvelles lois, nouvelles études. Une mise à jour de quelques pages suffit souvent.


  3️⃣ AJOUTE TON EXPÉRIENCE. Depuis ta soutenance, tu as travaillé, observé, appris. C''est une vraie valeur ajoutée : tu n''es plus seulement l''étudiant qui a étudié le sujet, tu es quelqu''un qui le connaît de l''intérieur.


  4️⃣ CHOISIS UNE PREMIÈRE ACTION SIMPLE. Un article de vulgarisation, une note à une structure concernée, une proposition de formation, un post qui raconte ce que tu as trouvé.


  Ton mémoire n''a pas de date d''expiration. Ton expertise non plus.


  Regarde la vidéo. Puis dis-moi en commentaire en quelle année tu as soutenu. Je suis curieux de voir jusqu''où on remonte. 😄


  On est HSA, le Hub Scientifique Africain.


  🌐 https://www.hubscientifiqueafricain.com'
