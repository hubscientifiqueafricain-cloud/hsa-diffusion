texte: 'Tu veux rejoindre HSA mais tu ne sais pas par où commencer ? 📱 C''est simple, et ça prend moins de 10 minutes. Voici les 3 étapes.


  1️⃣ CRÉE TON ESPACE

  Va sur hubscientifiqueafricain.com et clique sur « Créer mon espace ». Renseigne ton nom, ton e-mail et un mot de passe. C''est gratuit.


  2️⃣ CHOISIS TON PROFIL

  Doctorant, post-doctorant, chercheur ou praticien : chaque profil a un espace dédié et des outils adaptés. Les institutions ont aussi leur propre espace.


  3️⃣ COMPLÈTE TON PROFIL

  ✅ Ta photo et un titre clair (ta spécialité, pas seulement ton grade).

  ✅ Ta bio en langage simple.

  ✅ Tes domaines d''expertise et tes mots-clés.

  ✅ Tes travaux : importe-les depuis ORCID ou Google Scholar, ou dépose-les directement.


  Et c''est tout. Tu fais maintenant partie du réseau. 🎉


  ENSUITE, TU PEUX :

  ➡️ faire ta Boussole de valorisation (5 minutes, gratuit) ;

  ➡️ consulter les opportunités et les événements ;

  ➡️ prendre le Pass Valorisation (2 000 FCFA par an) pour la méthode, les opportunités chaque semaine et l''accompagnement.


  Regarde la vidéo, puis crée ton espace maintenant : lien en commentaire. Et dis-nous « c''est fait » quand tu es inscrit, on viendra te souhaiter la bienvenue. 👋🏾


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Rejoindre le Hub Scientifique Africain prend moins de dix minutes :


    1. Créer son espace gratuitement sur hubscientifiqueafricain.com (« Créer mon espace »).

    2. Choisir son profil : doctorant, post-doctorant, chercheur ou praticien. Les institutions disposent d''un espace dédié.

    3. Compléter son profil : photo, titre, biographie, domaines d''expertise, et travaux importés depuis ORCID ou Google Scholar.


    Il est ensuite possible de réaliser la Boussole de valorisation, de consulter les opportunités et événements, et de souscrire au Pass Valorisation (2 000 FCFA par an).


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
