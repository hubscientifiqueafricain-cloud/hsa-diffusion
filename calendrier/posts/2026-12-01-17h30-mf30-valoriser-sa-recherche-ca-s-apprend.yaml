texte: "Tu te dis peut-être : la valorisation, ce n'est pas pour moi, je ne suis pas commercial. Bonne nouvelle : ça s'apprend.\n\nDans cette micro-formation :\n▶ Les compétences à développer\n   • Communiquer simplement\n   • Comprendre les besoins\n   • Négocier et chiffrer\n   • Connaître tes droits\n▶ Comment apprendre\n   • Formations, mentors, pratique\n\nÀ retenir : Personne ne naît en sachant valoriser. Chaque chercheur qui y arrive a commencé un jour. Pourquoi pas toi, aujourd'hui ?\n\n\U0001F4AC Tu as une question sur la valorisation de ta recherche ? Pose-la en commentaire : on y répondra dans une prochaine vidéo.\n\U0001F514 Abonne-toi pour ne rien manquer de la série « Valoriser ta recherche · 1 question, 2 minutes ».\n\n\U0001F310 HSA, le Hub Scientifique Africain : https://www.hubscientifiqueafricain.com\n\n#ValorisationDeLaRecherche #Doctorat #RechercheAfricaine"
