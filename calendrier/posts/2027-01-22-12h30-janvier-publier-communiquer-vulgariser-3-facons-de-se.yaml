texte: '🎓 Série « Carrière de chercheur »


  On parle souvent de publier, communiquer et vulgariser comme de « cases à cocher » pour sa carrière. ✔️ C''est vrai, elles comptent dans ton dossier. Mais elles sont d''abord trois façons de rendre service.


  📝 PUBLIER, C''EST SERVIR LA SCIENCE

  Ton article permet à d''autres chercheurs, ici et ailleurs, de s''appuyer sur ce que tu as trouvé. Sans publication, ta découverte reste invisible pour la communauté.


  🎤 COMMUNIQUER, C''EST SERVIR TES PAIRS

  En colloque, tu partages tes résultats avant même qu''ils soient publiés. Tu fais gagner du temps aux autres, tu crées des discussions, des collaborations.


  📰 VULGARISER, C''EST SERVIR LA SOCIÉTÉ

  Les citoyens, les décideurs, les familles. Ceux pour qui la recherche est faite. Quand tu expliques ta recherche simplement, tu leur rends ce qui leur appartient.


  💡 Et quand tu vois les choses comme ça, une bonne nouvelle : être utile et construire sa carrière, c''est la même démarche. Ce qui sert les autres te fait aussi avancer.


  Le carrousel résume tout ça. 👆


  HSA, le Hub Scientifique Africain.


  🤝 Avec le Pass Valorisation HSA, fais d''une pierre deux coups : ta recherche gagne en visibilité, ton dossier de carrière se remplit. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'Publier, communiquer et vulgariser sont souvent abordés comme des exigences de carrière. Ils constituent avant tout trois formes de service.


    La publication sert la communauté scientifique, en rendant les résultats disponibles et vérifiables. La communication en colloque sert les pairs, en partageant les avancées et en suscitant des collaborations. La vulgarisation sert la société, en rendant la connaissance accessible à ceux qui en bénéficient.


    Ces activités utiles aux autres contribuent, dans le même mouvement, au développement de la carrière du chercheur.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
