texte: '🎓 Série « Carrière de chercheur »


  Et si la lumière pouvait aider à soigner le cancer ? 💡 C''est l''une des questions qui guident les travaux de Tebello Nyokong, chimiste sud-africaine.


  🔬 Professeure à l''Université Rhodes, en Afrique du Sud, elle travaille sur des molécules qui réagissent à la lumière, et sur leurs applications, notamment en thérapie photodynamique, une approche qui utilise la lumière pour traiter certains cancers.


  🏆 En 2016, elle reçoit le prix L''Oréal-UNESCO « Pour les femmes et la science », pour l''Afrique et les États arabes.


  👩🏾‍🔬 Mais elle est aussi connue pour une chose : le nombre de jeunes chercheurs qu''elle a formés. Encadrer, transmettre, faire grandir une équipe, c''est une partie essentielle d''une grande carrière scientifique.


  💡 Ce que son parcours t''apprend :

  • Une recherche fondamentale peut avoir des applications concrètes pour la santé.

  • La transmission et l''encadrement comptent autant que les publications.

  • Les distinctions internationales sont accessibles aux chercheurs africains, depuis l''Afrique.


  Le carrousel raconte son parcours. 👆 Partage-le à une chercheuse que tu admires.


  HSA, le Hub Scientifique Africain.


  🤝 Avec le Pass Valorisation HSA, fais d''une pierre deux coups : ta recherche gagne en visibilité, ton dossier de carrière se remplit. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'Tebello Nyokong, chimiste et professeure à l''Université Rhodes en Afrique du Sud, travaille sur des molécules photosensibles et leurs applications, notamment en thérapie photodynamique contre certains cancers.


    Elle a reçu en 2016 le prix L''Oréal-UNESCO « Pour les femmes et la science » au titre de l''Afrique et des États arabes.


    Elle est également reconnue pour son engagement dans la formation de jeunes chercheurs. Son parcours illustre l''importance de la transmission et de l''encadrement dans une carrière scientifique.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
