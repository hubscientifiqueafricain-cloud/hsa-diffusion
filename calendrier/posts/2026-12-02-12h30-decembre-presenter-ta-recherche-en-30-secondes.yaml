texte: '🗓️ Série « Prépare 2027 »


  Décembre, c''est le mois pour préparer 2027. Et la première chose à préparer, c''est ta façon de présenter ta recherche.


  « Et toi, tu travailles sur quoi ? » 😬

  Si cette question te fait paniquer, ce post est pour toi.


  La plupart des chercheurs répondent avec le titre de leur mémoire. Résultat : l''autre hoche la tête poliment… et passe à autre chose. Dommage, parce que cette personne aurait peut-être pu t''ouvrir une porte.


  Valoriser ta recherche commence par savoir la présenter simplement. Voici une structure en 4 phrases, qui tient en 30 secondes :


  1️⃣ LE PROBLÈME : « Dans [lieu], [qui] a du mal à [quoi]. »

  2️⃣ CE QUE TU AS CHERCHÉ : « J''ai étudié [ta question, en mots simples]. »

  3️⃣ CE QUE TU AS TROUVÉ : « J''ai découvert que [ton résultat principal]. »

  4️⃣ À QUOI ÇA SERT : « Ça peut aider [qui] à [faire quoi]. »


  Exemple : « Dans nos marchés, les vendeuses de poisson perdent une partie de leur stock faute de froid. J''ai comparé trois méthodes de fumage. La méthode au four amélioré conserve le poisson deux fois plus longtemps. Ça peut aider les coopératives à réduire leurs pertes. »


  Pas de jargon, pas de méthodologie, pas de « dans le cadre de mon mémoire ». Juste le problème, ta réponse et son utilité.


  Le carrousel te donne la structure et l''exemple complet. 👆

  À toi : écris ton pitch en commentaire, on te fait un retour. 💬


  On est HSA, le Hub Scientifique Africain. Ce mois-ci, on te donne les savoir-faire concrets pour faire sortir ta recherche du tiroir.


  📅 Prépare 2027 avec le Pass Valorisation HSA : le programme certifiant, le guide des 10 façons de gagner de l''argent avec ta recherche, les opportunités chaque semaine et le groupe d''entraide. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: '« Sur quoi travaillez-vous ? » La question revient dans chaque conférence, chaque entretien, chaque rencontre. La réponse la plus fréquente, le titre du mémoire ou de la thèse, est aussi la moins efficace.


    Une présentation en trente secondes peut suivre quatre étapes :

    1. Le problème : qui est concerné, où, et par quoi.

    2. La question étudiée, formulée simplement.

    3. Le résultat principal.

    4. L''utilité : à qui ce résultat peut servir, et pour faire quoi.


    Exemple : « Les vendeuses de poisson perdent une partie de leur stock faute de froid. J''ai comparé trois méthodes de fumage. Le four amélioré conserve le poisson deux fois plus longtemps. Ce résultat peut aider les coopératives à réduire leurs pertes. »


    Cette présentation est le premier outil de valorisation : sans elle, un partenaire potentiel ne peut pas comprendre ce que la recherche peut lui apporter.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    #ValorisationDeLaRecherche #Pitch #Doctorat'
