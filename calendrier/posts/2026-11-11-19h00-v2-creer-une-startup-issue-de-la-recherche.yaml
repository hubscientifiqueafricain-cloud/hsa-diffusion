texte: 'Une spin-off, tu connais ? 🚀

  C''est une entreprise créée à partir des résultats d''une recherche, souvent par le chercheur lui-même. Partout dans le monde, et de plus en plus en Afrique, des entreprises sont nées dans des laboratoires et des salles de thèse.


  MAIS ATTENTION : la startup n''est pas la voie à suivre pour tout le monde. C''est la bonne voie si :

  ✅ ton résultat peut devenir un produit ou un service que des clients paieront régulièrement ;

  ✅ il répond à un problème que beaucoup de gens ou d''entreprises ont ;

  ✅ tu as envie d''entreprendre, de vendre, de recruter (ou de t''associer avec quelqu''un qui aime ça) ;

  ✅ tu es prêt à y consacrer plusieurs années.


  Si ce n''est pas ton cas, l''expertise, la formation ou la licence sont souvent de meilleures options. Et c''est très bien comme ça.


  LES PREMIÈRES ÉTAPES, SI TU TE LANCES :

  1️⃣ Vérifie le besoin : parle à au moins 20 clients potentiels avant de construire quoi que ce soit.

  2️⃣ Clarifie la propriété de ton résultat avec ton université (qui possède quoi ?).

  3️⃣ Constitue une équipe complémentaire : toi pour la science, quelqu''un pour le commerce.

  4️⃣ Rejoins un incubateur ou un programme d''accompagnement.

  5️⃣ Cherche tes premiers financements : prix, concours, subventions d''amorçage.


  Regarde la vidéo. Si créer une entreprise à partir de ta recherche, c''est ton projet, commente STARTUP. 👇


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Une spin-off est une entreprise créée à partir de résultats de recherche, souvent par le chercheur lui-même.


    Ce n''est pas la voie de valorisation adaptée à tous. Elle est pertinente lorsque :

    • le résultat peut devenir un produit ou un service vendu de façon récurrente ;

    • il répond à un besoin partagé par un grand nombre de clients ;

    • le chercheur souhaite entreprendre, ou s''associer à un profil commercial ;

    • il est prêt à s''y consacrer plusieurs années.


    Dans le cas contraire, l''expertise, la formation ou la licence sont souvent plus adaptées.


    Premières étapes : valider le besoin auprès d''une vingtaine de clients potentiels, clarifier la propriété des résultats avec l''établissement, constituer une équipe complémentaire, rejoindre un incubateur, rechercher des financements d''amorçage.


    Hub Scientifique Africain (HSA)

    #Spinoff #Entrepreneuriat #DeepTech'
