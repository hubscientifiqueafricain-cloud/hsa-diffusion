texte: "Ton master ou ton doctorat t'a appris à enquêter, analyser et rédiger. Ce sont exactement les compétences d'un consultant.\n\nDans cette micro-formation :\n▶ Ce que tu sais déjà faire\n   • Enquêter sur le terrain\n   • Analyser des données\n   • Rédiger un rapport\n▶ Comment te lancer\n   • Choisis une niche\n   • Prépare ta fiche d'expertise\n   • Réponds aux appels d'offres\n\nÀ retenir : Tu n'as pas besoin d'attendre un poste. Ton expertise peut déjà être une activité.\n\n\U0001F4AC Tu as une question sur la valorisation de ta recherche ? Pose-la en commentaire : on y répondra dans une prochaine vidéo.\n\U0001F514 Abonne-toi pour ne rien manquer de la série « Valoriser ta recherche · 1 question, 2 minutes ».\n\n\U0001F310 HSA, le Hub Scientifique Africain : https://www.hubscientifiqueafricain.com\n\n#ValorisationDeLaRecherche #Doctorat #RechercheAfricaine"
