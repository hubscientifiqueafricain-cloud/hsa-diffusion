texte: '💰 Série « Gagner de l''argent avec ta recherche »


  « Je suis encore étudiant, je ne peux pas demander d''argent. » 🙅🏾‍♀️ C''est l''une des idées reçues les plus fréquentes chez les masterants et les doctorants. Et elle est fausse.


  Ce qui compte pour un client, ce n''est pas ton statut. C''est ce que tu sais faire pour lui.


  ✅ Un masterant qui maîtrise un logiciel d''analyse peut aider une petite structure à traiter ses données.

  ✅ Une doctorante qui connaît parfaitement une filière peut animer un atelier pour des producteurs.

  ✅ Un étudiant qui a réalisé une enquête de terrain peut en mener une autre, pour une association.


  Bien sûr, il faut être honnête :

  • Ne propose que ce que tu sais vraiment faire.

  • Présente-toi tel que tu es : « Masterant en… », « Doctorante en… ».

  • Adapte ton prix à ton expérience, et augmente-le avec le temps.

  • Vérifie les règles de ton université ou de ta bourse, si tu en as une.


  Le statut d''étudiant n''empêche pas de rendre un vrai service. Et un service rendu mérite d''être payé.


  Regarde la vidéo, puis dis-nous en commentaire : tu le pensais aussi ? 👇


  HSA, le Hub Scientifique Africain.


  🧭 Pas sûr de la façon qui te correspond ? Fais la Boussole HSA, gratuite. Et pour te lancer accompagné, le Pass Valorisation coûte 2 000 FCFA pour l''année. Liens en commentaire.'
textes:
  linkedin: 'Le statut d''étudiant n''empêche pas de proposer des services rémunérés, dès lors que les compétences sont réelles et présentées avec transparence.


    Quelques principes : ne proposer que ce que l''on maîtrise, présenter clairement son statut, adapter son tarif à son niveau d''expérience, et vérifier les règles de son établissement ou de sa bourse.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
