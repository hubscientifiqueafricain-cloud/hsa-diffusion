texte: '🎓 Série « Carrière de chercheur »


  Tu es convoqué à un entretien ou à une audition pour un poste. 🎯 Bravo, ton dossier a convaincu ! Maintenant, il faut convaincre en personne. Voici comment te préparer.


  📚 AVANT

  • Renseigne-toi sur l''institution : ses missions, ses projets récents, ses équipes.

  • Relis l''offre et repère les 3 compétences les plus attendues.

  • Prépare ta présentation de 3 à 5 minutes : qui tu es, ta recherche, ce que tu apportes.

  • Prépare un exemple concret pour chaque compétence attendue.

  • Si c''est une audition académique, prépare aussi ton projet de recherche et ton projet d''enseignement.


  🗣️ PENDANT

  • Réponds avec des exemples, pas avec des généralités.

  • Fais le lien entre ta recherche et les besoins de l''institution.

  • Prépare 2 questions à poser à la fin. Ça montre ton intérêt.


  ✉️ APRÈS

  • Un message de remerciement dans les 24 heures.


  💡 La question qui revient presque toujours : « Présentez-vous. » Ne la laisse pas au hasard. Chronomètre-toi.


  Le carrousel reprend la checklist. 👆


  HSA, le Hub Scientifique Africain.


  🎯 Pour construire ta carrière sans avancer seul : le Pass Valorisation HSA te donne une méthode certifiante (avec attestation pour ton CV), les opportunités chaque semaine et un groupe d''entraide. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'Un entretien ou une audition de recrutement se prépare en trois temps.


    Avant : étudier l''institution et ses projets, identifier les compétences clés de l''offre, préparer une présentation de trois à cinq minutes et des exemples concrets ; pour une audition académique, formaliser un projet de recherche et un projet d''enseignement.


    Pendant : illustrer chaque réponse par des exemples, relier ses travaux aux besoins de l''institution, poser des questions pertinentes.


    Après : adresser un message de remerciement dans les vingt-quatre heures.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
