texte: '🗓️ Série « Prépare 2027 »


  En 2027, que ta discipline ne soit plus une excuse.


  À tous ceux qui font de la sociologie, de l''histoire, du droit, de la géographie, de l''économie, des lettres, de l''anthropologie, des sciences de l''éducation, de la philosophie… 📚


  On vous a peut-être fait sentir que votre discipline « ne sert à rien ». Que la vraie recherche, c''était en laboratoire, en blouse blanche.


  Ce n''est pas vrai.


  Un vaccin ne sert à rien si la population refuse de se faire vacciner. Il faut quelqu''un qui comprend pourquoi.

  Une route ne sert à rien si elle crée un conflit entre deux villages. Il faut quelqu''un qui connaît l''histoire des terres.

  Une loi ne sert à rien si personne ne la comprend ni ne l''applique. Il faut quelqu''un qui sait l''expliquer.

  Une école ne sert à rien si les enfants n''y apprennent pas. Il faut quelqu''un qui étudie comment ils apprennent.


  Les sciences humaines et sociales expliquent comment vivent, pensent, décident et s''organisent les gens. Sans elles, beaucoup de solutions techniques échouent.


  Votre recherche a sa place dans la valorisation : en expertise, en formation, en conseil, dans les politiques publiques, dans la culture, dans les médias.


  La vidéo en 45 secondes. 🎬 Tague en commentaire un chercheur en sciences humaines. 👇


  HSA, le Hub Scientifique Africain.


  📅 Prépare 2027 avec le Pass Valorisation HSA : le programme certifiant, le guide des 10 façons de gagner de l''argent avec ta recherche, les opportunités chaque semaine et le groupe d''entraide. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'Les chercheurs en sciences humaines et sociales sont souvent confrontés à une perception de moindre utilité de leurs disciplines.


    Les exemples montrent l''inverse. Une campagne de vaccination dépend de l''acceptation par la population. Une infrastructure peut raviver des conflits fonciers. Une réforme juridique suppose d''être comprise pour être appliquée. Un investissement scolaire n''a d''effet que si les apprentissages progressent.


    Dans chacun de ces cas, la compréhension des comportements, des histoires, des institutions et des organisations sociales conditionne la réussite des solutions techniques.


    Les sciences humaines et sociales disposent de nombreuses voies de valorisation : expertise, formation, conseil, politiques publiques, culture, médias.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · #SciencesHumaines #SciencesSociales #RechercheAfricaine'
