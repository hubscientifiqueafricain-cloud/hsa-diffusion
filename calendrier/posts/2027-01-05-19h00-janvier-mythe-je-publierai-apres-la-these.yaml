texte: '🎓 Série « Carrière de chercheur »


  « Je me concentre sur ma thèse. Les articles, je verrai après la soutenance. » 🙅🏾 C''est l''une des idées reçues qui coûtent le plus cher aux jeunes chercheurs.


  Pourquoi c''est un piège ?


  ⏳ Après la soutenance, le temps manque encore plus. Nouveau travail, nouvelles responsabilités, la famille. Les articles prévus restent souvent dans un coin.


  📂 Beaucoup d''écoles doctorales demandent des publications avant la soutenance. Renseigne-toi sur les règles de la tienne.


  💼 Quand tu postules, juste après ta thèse, le recruteur veut voir des publications. Pas des projets d''articles.


  📝 Enfin, écrire un article pendant la thèse t''aide à écrire la thèse. Les deux se nourrissent.


  La réalité, c''est que la publication se prépare en même temps que la recherche. Un article par résultat solide, au fur et à mesure.


  Regarde la vidéo, puis dis-nous en commentaire : tu as déjà publié, tu es en train d''écrire, ou tu n''as pas encore commencé ? 👇 Aucune réponse n''est mauvaise.


  HSA, le Hub Scientifique Africain.


  🤝 Avec le Pass Valorisation HSA, fais d''une pierre deux coups : ta recherche gagne en visibilité, ton dossier de carrière se remplit. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'Une idée répandue chez les doctorants consiste à reporter la publication d''articles après la soutenance.


    Cette stratégie présente plusieurs risques : le temps disponible diminue souvent après la thèse ; de nombreuses écoles doctorales exigent des publications avant la soutenance ; les recruteurs examinent les publications effectives, non les projets ; enfin, la rédaction d''articles contribue à structurer la thèse elle-même.


    Il est donc préférable d''envisager la publication en parallèle de la recherche, à mesure que des résultats solides sont obtenus.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
