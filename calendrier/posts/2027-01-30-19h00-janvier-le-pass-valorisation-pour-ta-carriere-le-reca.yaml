texte: 'On t''a présenté le Pass Valorisation sous tous les angles. 📋 Voici le récapitulatif complet, à enregistrer.


  📌 C''EST QUOI ?

  Un abonnement d''un an proposé par le Hub Scientifique Africain (HSA), pour valoriser ta recherche et construire ta carrière en même temps.


  👥 POUR QUI ?

  Les masterants, les doctorants et les jeunes chercheurs, de toutes les disciplines.


  🎁 CE QUE TU REÇOIS, ET CE QUE ÇA APPORTE À TA CARRIÈRE

  1. Le programme certifiant « Initiation à la valorisation », avec une attestation HSA : une ligne dans ton CV.

  2. Le guide « 10 façons de gagner de l''argent avec ton mémoire ou ta thèse » : les débouchés de ton travail.

  3. Ton profil de chercheur visible par les entreprises, les ONG et les institutions : ta visibilité.

  4. Les opportunités chaque semaine (financements, prix, concours, bourses) : plus de candidatures, à temps.

  5. Le groupe d''entraide : ton réseau.

  6. Les lives mensuels avec l''équipe HSA : des réponses à tes questions.


  💰 COMBIEN ?

  2 000 FCFA pour toute l''année. Paiement par mobile money.


  ⚠️ CE QU''IL NE FAIT PAS

  Il ne fait pas le travail à ta place, et ne garantit ni emploi ni revenu. Il te donne la méthode, les opportunités et l''entourage pour avancer.


  Le carrousel récapitule tout. 👆 Enregistre-le, et inscris-toi : lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Récapitulatif du Pass Valorisation du Hub Scientifique Africain :


    - Objet : un abonnement annuel pour valoriser sa recherche et développer sa carrière.

    - Public : masterants, doctorants et jeunes chercheurs de toutes disciplines.

    - Contenu : programme certifiant avec attestation ; guide pratique ; profil de chercheur visible par les organisations ; veille hebdomadaire des opportunités ; groupe d''entraide ; sessions mensuelles en direct.

    - Tarif : 2 000 FCFA par an, par mobile money.

    - Limites : le Pass apporte méthode, opportunités et réseau ; il ne garantit ni emploi ni revenu.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
