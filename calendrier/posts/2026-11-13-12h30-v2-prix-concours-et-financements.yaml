texte: 'Chaque année, des prix, des concours et des financements sont ouverts aux jeunes chercheurs africains. 🏆 Et chaque année, beaucoup ne sont pas pourvus par manque de bons dossiers, ou parce que les gens ne savent même pas qu''ils existent.


  POURQUOI POSTULER ?

  💰 Pour financer ta recherche ou ton projet de valorisation.

  🌟 Pour la visibilité : un prix, même petit, te fait connaître et rassure les partenaires.

  🤝 Pour le réseau : jurys, autres lauréats, organisateurs.

  📄 Pour ton CV : c''est une preuve que ton travail a été reconnu.


  OÙ LES TROUVER ?

  • Ton université et ton école doctorale (affichages, e-mails).

  • Les fondations, les organisations internationales et les ambassades.

  • Les agences nationales de la recherche et de l''innovation.

  • Les plateformes qui publient les opportunités chaque semaine.

  • Les concours de pitch, comme « Ma thèse en 180 secondes ».


  COMMENT TE PRÉPARER ?

  1️⃣ Garde toujours prêts : un CV à jour, un résumé de ta recherche en 200 mots, un résumé en langage simple, une photo professionnelle.

  2️⃣ Lis les critères deux fois et réponds exactement à ce qui est demandé.

  3️⃣ Montre l''impact : à qui ton travail sert, et ce qu''il change.

  4️⃣ Fais relire ton dossier par quelqu''un d''extérieur.

  5️⃣ N''attends pas le dernier jour.


  Et surtout : un refus n''est pas un échec. Chaque dossier rend le suivant meilleur.


  Regarde la vidéo. Si tu veux recevoir les opportunités, commente PRIX. 👇


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Prix, concours et financements constituent une voie de valorisation souvent sous-exploitée par les jeunes chercheurs africains.


    Leurs bénéfices : financement, visibilité, réseau et reconnaissance attestée.


    Sources principales : établissements et écoles doctorales, fondations, organisations internationales, ambassades, agences nationales de la recherche, plateformes de veille, concours de pitch scientifique.


    Pour se préparer :

    1. Tenir prêts un CV à jour, un résumé scientifique de 200 mots, un résumé grand public et une photo professionnelle.

    2. Répondre précisément aux critères.

    3. Mettre en avant l''impact des travaux.

    4. Faire relire le dossier.

    5. Anticiper les échéances.


    Chaque candidature, retenue ou non, améliore la suivante.


    Hub Scientifique Africain (HSA)

    #Bourses #Financement #JeunesChercheurs'
