texte: '💰 Série « Gagner de l''argent avec ta recherche »


  « Fais-le gratuitement, ça te fera de l''expérience. » 😅 Tu l''as déjà entendu ? Au début, accepter quelques services gratuits peut avoir du sens. Mais beaucoup de jeunes chercheurs restent bloqués là pendant des années.


  Pourquoi c''est un piège :

  ❌ Ce qui est gratuit est souvent moins respecté.

  ❌ Tu t''épuises sans rien construire.

  ❌ Les gens s''habituent à ne pas te payer.


  ✅ LES RÈGLES POUR SORTIR DU GRATUIT

  1. Fixe-toi une limite : par exemple, 2 services gratuits maximum, choisis pour ce qu''ils t''apportent (une référence, un exemple, un contact).

  2. Demande toujours une contrepartie : une attestation, une recommandation écrite, l''autorisation de citer l''organisation.

  3. Annonce dès le départ : « Je le fais gratuitement cette fois, pour démarrer notre collaboration. »

  4. Pour la suite, propose un prix, même modeste. Tu l''augmenteras avec l''expérience.


  Ton temps et ton savoir ont de la valeur. Le premier à le reconnaître, c''est toi.


  Regarde la vidéo, et dis-nous en commentaire si tu as déjà vécu ça. 👇


  HSA, le Hub Scientifique Africain.


  🧭 Pas sûr de la façon qui te correspond ? Fais la Boussole HSA, gratuite. Et pour te lancer accompagné, le Pass Valorisation coûte 2 000 FCFA pour l''année. Liens en commentaire.'
textes:
  linkedin: 'Les prestations gratuites peuvent être utiles en début de parcours, mais leur prolongation constitue un piège fréquent : moindre considération, épuisement et habitude de non-rémunération.


    Quelques règles aident à en sortir : limiter le nombre de prestations gratuites, exiger une contrepartie (attestation, recommandation, référence), l''annoncer explicitement comme exceptionnelle, puis proposer un tarif, même modeste, pour les missions suivantes.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
