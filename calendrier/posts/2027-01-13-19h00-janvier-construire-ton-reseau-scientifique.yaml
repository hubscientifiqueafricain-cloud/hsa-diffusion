texte: '🎓 Série « Carrière de chercheur »


  Dans une carrière de chercheur, beaucoup d''opportunités arrivent par des personnes. 🤝 Une invitation à un projet, une recommandation, une information sur un poste avant sa publication. Ton réseau se construit dès maintenant.


  Voici les 5 cercles à développer :


  1️⃣ TON ENCADREUR ET TON LABORATOIRE

  Le premier cercle. Sois fiable, tiens tes délais, participe à la vie du labo.


  2️⃣ TES PAIRS

  Les autres doctorants, de ta promotion et d''ailleurs. Ce sont tes futurs collègues, co-auteurs et membres de jury.


  3️⃣ LES SOCIÉTÉS SAVANTES

  Les associations de chercheurs de ta discipline. Elles organisent des congrès et des formations.


  4️⃣ LES CHERCHEURS D''AUTRES PAYS

  Rencontrés en colloque, en ligne ou lors d''une mobilité. Ils ouvrent la porte aux collaborations internationales.


  5️⃣ LES ACTEURS HORS UNIVERSITÉ

  ONG, entreprises, administrations, médias. Ceux qui peuvent utiliser ta recherche ou te recruter.


  💡 Le réseau, ce n''est pas demander des faveurs. C''est donner d''abord : partager une opportunité, relire un texte, féliciter un collègue.


  Le carrousel détaille les 5 cercles. 👆


  HSA, le Hub Scientifique Africain.


  🎯 Pour construire ta carrière sans avancer seul : le Pass Valorisation HSA te donne une méthode certifiante (avec attestation pour ton CV), les opportunités chaque semaine et un groupe d''entraide. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'De nombreuses opportunités de carrière scientifique passent par le réseau professionnel : invitations à des projets, recommandations, informations sur des postes.


    Ce réseau peut être structuré en cinq cercles : l''encadreur et le laboratoire ; les pairs doctorants ; les sociétés savantes ; les chercheurs d''autres pays ; et les acteurs non académiques (ONG, entreprises, administrations, médias).


    Un réseau solide se construit dans la réciprocité : partager des informations, apporter son aide, valoriser le travail des autres.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
