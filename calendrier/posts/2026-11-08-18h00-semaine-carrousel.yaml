texte: 'Comment valoriser ta recherche, concrètement ? Il n''y a pas une seule façon de faire. Il y en a au moins 10. 🗺️


  1️⃣ Vulgariser : expliquer ta recherche au grand public (posts, vidéos, articles, radio).

  2️⃣ Publier en accès ouvert : rendre tes travaux lisibles gratuitement par tous.

  3️⃣ L''expertise et le conseil : réaliser des études, des diagnostics, des évaluations pour des structures.

  4️⃣ La formation : transformer ton savoir en modules pour des professionnels ou des étudiants.

  5️⃣ Le produit ou l''outil : créer une application, un guide, un dispositif, une recette.

  6️⃣ La startup issue de la recherche : créer une entreprise autour de ton résultat.

  7️⃣ La note aux décideurs (policy brief) : éclairer une politique publique.

  8️⃣ Le partenariat : travailler avec une entreprise, une ONG ou une collectivité sur un projet commun.

  9️⃣ Les prix, concours et financements : faire reconnaître et financer ton travail.

  🔟 La licence : céder à une entreprise le droit d''utiliser ton invention, contre rémunération.


  Tu n''as pas besoin de toutes les faire. La plupart des chercheurs commencent par 1 ou 2 voies, celles qui correspondent à leur résultat et à leur objectif.


  Dans le carrousel, chaque voie est expliquée avec un exemple. 👆 Et dans les prochains jours, on en détaille plusieurs, une par une.


  Enregistre ce post, puis commente le numéro de la voie qui te tente le plus. 👇


  On est HSA, le Hub Scientifique Africain.


  🌐 https://www.hubscientifiqueafricain.com'
