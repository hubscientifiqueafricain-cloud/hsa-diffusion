texte: '🎓 Série « Carrière de chercheur »


  Présenter tes travaux dans un colloque, c''est une ligne précieuse dans ton dossier. 🎤 Mais encore faut-il savoir qu''il existe ! Beaucoup de doctorants découvrent les appels à communication… après la date limite.


  D''abord, c''est quoi un appel à communication ? C''est l''annonce d''un colloque ou d''une conférence qui invite les chercheurs à proposer une présentation. On y répond en envoyant un résumé.


  Où les trouver :


  1️⃣ LES SOCIÉTÉS SAVANTES DE TA DISCIPLINE

  Elles organisent souvent des congrès réguliers. Adhère ou suis leurs pages.


  2️⃣ LES UNIVERSITÉS ET LES ÉCOLES DOCTORALES

  Elles organisent des journées scientifiques, souvent ouvertes aux doctorants.


  3️⃣ LES CENTRES DE RECHERCHE

  Ils annoncent leurs colloques sur leurs sites et leurs réseaux.


  4️⃣ LES LISTES DE DIFFUSION ET LES GROUPES

  Les groupes WhatsApp et les listes e-mail de ta discipline relaient beaucoup d''appels.


  5️⃣ LES PLATEFORMES QUI RASSEMBLENT LES OPPORTUNITÉS

  Comme la rubrique opportunités du Hub Scientifique Africain, où sont publiés des appels à communication, des conférences et des bourses.


  💡 Le réflexe : note chaque date limite dans ton agenda dès que tu vois un appel qui t''intéresse.


  Le carrousel reprend les 5 sources. 👆


  HSA, le Hub Scientifique Africain.


  🤝 Avec le Pass Valorisation HSA, fais d''une pierre deux coups : ta recherche gagne en visibilité, ton dossier de carrière se remplit. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'Présenter ses travaux en colloque constitue un élément important d''un dossier de chercheur. Encore faut-il identifier les appels à communication à temps.


    Plusieurs sources permettent de les repérer :


    1. Les sociétés savantes de la discipline.

    2. Les universités et écoles doctorales, qui organisent des journées scientifiques.

    3. Les centres de recherche.

    4. Les listes de diffusion et groupes professionnels.

    5. Les plateformes qui centralisent les opportunités, comme celle du Hub Scientifique Africain.


    Il est conseillé d''inscrire chaque date limite dans son agenda dès la découverte d''un appel pertinent.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
