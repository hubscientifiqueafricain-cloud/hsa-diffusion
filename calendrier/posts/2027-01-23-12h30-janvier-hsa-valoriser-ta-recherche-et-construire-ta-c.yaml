texte: 'Valoriser ta recherche. Construire ta carrière. 🎯 Ce mois-ci, on t''a montré que c''est le même chemin. Aujourd''hui, on te présente qui peut t''accompagner sur ce chemin.


  Le Hub Scientifique Africain (HSA) est une plateforme dédiée à la recherche africaine et à sa valorisation. Pour les masterants, les doctorants et les jeunes chercheurs de toutes les disciplines.


  Avec HSA, tu fais d''une pierre deux coups :


  🔹 Tu rends ta recherche visible, grâce à ton profil de chercheur, consultable par les organisations qui cherchent des experts.

  🔹 Tu repères les opportunités à temps : bourses, prix, concours, financements, événements.

  🔹 Tu apprends la méthode pour valoriser ta recherche, avec un programme certifiant et une attestation HSA à ajouter à ton CV.

  🔹 Tu avances avec d''autres chercheurs, dans un groupe d''entraide.


  Une partie est gratuite. Et pour aller plus loin, il y a le Pass Valorisation, à 2 000 FCFA pour toute l''année.


  Dans les prochains jours, on te présente chaque élément, et ce qu''il apporte concrètement à ta carrière.


  La vidéo résume tout en 40 secondes. 🎬 Suis la page pour ne rien rater.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le Hub Scientifique Africain (HSA) est une plateforme dédiée à la recherche africaine et à sa valorisation, destinée aux masterants, doctorants et jeunes chercheurs de toutes disciplines.


    Elle permet d''agir simultanément sur deux plans : la valorisation de la recherche et le développement de la carrière. Concrètement : un profil de chercheur visible par les organisations, un accès aux opportunités (bourses, prix, concours, financements, événements), un programme certifiant assorti d''une attestation, et un réseau d''entraide.


    Une partie des services est gratuite ; le Pass Valorisation, à 2 000 FCFA par an, donne accès à l''accompagnement complet. Les prochaines publications en détailleront chaque composante.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
