texte: '🗓️ Série « Prépare 2027 »


  Le jour où ton premier rendez-vous arrivera en 2027, tu seras prêt.


  Bonne nouvelle : l''organisation t''a répondu et accepte un échange de 20 minutes. 🎉 Et maintenant ?


  Ce premier rendez-vous ne sert pas à vendre. Il sert à comprendre leurs besoins et à voir si ta recherche peut y répondre. Voici comment le préparer :


  🔎 AVANT

  • Renseigne-toi sur l''organisation : ses projets, ses zones, ses rapports récents.

  • Prépare ton pitch de 30 secondes.

  • Note 3 questions à leur poser.


  💬 PENDANT

  • Écoute plus que tu ne parles. Laisse-les décrire leurs difficultés.

  • Pose tes questions : « Quel est votre plus gros défi sur ce sujet ? », « Comment prenez-vous vos décisions là-dessus ? », « Qu''est-ce qui vous aiderait ? ».

  • Montre en quoi ton résultat répond à ce qu''ils viennent de dire.

  • Ne parle pas d''argent au premier rendez-vous, sauf s''ils abordent le sujet.


  📩 APRÈS

  • Le jour même, un mail de remerciement avec un résumé de l''échange et une proposition concrète : une note, un atelier, une présentation à l''équipe.


  Un premier rendez-vous réussi, c''est quand vous convenez d''une prochaine étape. Même petite.


  La vidéo résume tout en 50 secondes. 🎬 Enregistre-la pour ton prochain rendez-vous.


  HSA, le Hub Scientifique Africain.


  📅 Prépare 2027 avec le Pass Valorisation HSA : le programme certifiant, le guide des 10 façons de gagner de l''argent avec ta recherche, les opportunités chaque semaine et le groupe d''entraide. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'Le premier échange avec un partenaire potentiel a un objectif précis : comprendre ses besoins et vérifier l''adéquation avec les résultats de recherche. Il ne s''agit pas encore de proposer une prestation.


    Avant : se renseigner sur l''organisation (projets, zones d''intervention, publications récentes), préparer une présentation de trente secondes et trois questions.


    Pendant : écouter davantage que parler ; interroger l''interlocuteur sur ses principales difficultés, son processus de décision et ses besoins ; relier les résultats de recherche à ce qui vient d''être exprimé. La question financière peut attendre, sauf si elle est abordée par l''interlocuteur.


    Après : adresser le jour même un message de remerciement, un résumé de l''échange et une proposition concrète (note, atelier, présentation à l''équipe).


    L''échange est réussi lorsqu''une prochaine étape est convenue.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    #ValorisationDeLaRecherche #Partenariats #Doctorat'
