texte: '💰 Série « Gagner de l''argent avec ta recherche »


  Cher chercheur, chère chercheuse, ✉️


  On sait que parler d''argent te met mal à l''aise. On t''a appris que la science, c''est noble. Que l''argent, c''est autre chose. Que demander à être payé, c''est presque honteux.


  Mais regarde autour de toi. Tes années d''études ont coûté cher : à toi, à ta famille, parfois à l''État. Tes connaissances ont une valeur. Et beaucoup de gens en profitent déjà, sans que tu en vives.


  Être payé pour ton expertise, ce n''est pas trahir la science. C''est lui permettre d''exister. C''est te donner les moyens de continuer à chercher, au lieu d''abandonner pour un travail qui n''a rien à voir.


  Tu peux être un chercheur rigoureux ET être payé pour ton travail. Tu peux aider gratuitement parfois ET facturer une mission. Tu peux être généreux ET savoir ce que tu vaux.


  Alors cette année, ose. Écris ton offre. Annonce ton prix. Envoie ta facture. La première fois sera difficile. La deuxième, un peu moins.


  Nous croyons en toi, et en la valeur de ce que tu sais.


  Avec toute notre amitié,

  L''équipe du Hub Scientifique Africain (HSA)


  Le carrousel reprend la lettre. 👆 Partage-la à un chercheur qui en a besoin.


  📘 Tu veux les 10 façons dans un seul document ? Le guide HSA est gratuit. Et pour avancer toute l''année, il y a le Pass Valorisation à 2 000 FCFA. Liens en commentaire.'
textes:
  linkedin: 'De nombreux chercheurs éprouvent une gêne à évoquer la rémunération de leur expertise, souvent perçue comme contraire à l''idéal scientifique.


    Pourtant, la formation d''un chercheur représente un investissement important, et ses connaissances bénéficient déjà à de nombreux acteurs. Être rémunéré pour son expertise permet de poursuivre une activité de recherche plutôt que de l''abandonner. Rigueur scientifique, générosité et juste rémunération ne s''excluent pas.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
