texte: 'On t''a présenté le Pass Valorisation sous tous les angles ces derniers jours. 📋 Voici le récapitulatif complet, à enregistrer.


  📌 C''EST QUOI ?

  Un abonnement d''un an pour apprendre à valoriser ta recherche et être accompagné, proposé par le Hub Scientifique Africain (HSA).


  👥 POUR QUI ?

  Les masterants, les doctorants et les jeunes chercheurs, de toutes les disciplines.


  🎁 CE QUE TU REÇOIS

  1. Le programme certifiant « Initiation à la valorisation » : 5 modules en ligne, à ton rythme, avec une attestation HSA.

  2. Le guide « 10 façons de gagner de l''argent avec ton mémoire ou ta thèse ».

  3. Ton profil de chercheur visible par les entreprises, les ONG et les institutions.

  4. Les opportunités chaque semaine : financements, prix, concours, bourses, avec leurs dates limites.

  5. Le groupe d''entraide des membres.

  6. Les lives mensuels avec l''équipe HSA.


  💰 COMBIEN ?

  2 000 FCFA pour toute l''année. Moins de 6 FCFA par jour. Pas de frais cachés.


  📲 COMMENT ?

  Crée ton espace sur hubscientifiqueafricain.com, choisis le Pass, paie par mobile money. Reçu par e-mail.


  ⚠️ CE QU''IL NE FAIT PAS

  Il ne fait pas le travail à ta place et ne garantit ni emploi ni revenu. Il te donne la méthode, les opportunités et l''entourage pour avancer.


  Le carrousel récapitule tout. 👆 Enregistre-le, et inscris-toi : lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Récapitulatif du Pass Valorisation du Hub Scientifique Africain :


    • Nature : abonnement annuel d''apprentissage et d''accompagnement à la valorisation de la recherche.

    • Public : masterants, doctorants et jeunes chercheurs de toutes disciplines.

    • Contenu : programme certifiant « Initiation à la valorisation » (cinq modules en ligne, attestation HSA) ; guide des dix voies de revenus ; profil de chercheur visible ; veille hebdomadaire des opportunités ; groupe d''entraide ; sessions mensuelles en direct.

    • Tarif : 2 000 FCFA pour douze mois, sans frais supplémentaires.

    • Souscription : création d''un espace sur hubscientifiqueafricain.com, choix du Pass, paiement par mobile money, reçu par e-mail.

    • Limites : le Pass fournit une méthode, une veille et un réseau ; il ne garantit ni emploi ni revenu.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
