texte: 'Joyeux Noël ! 🎄 Aujourd''hui, un post spécial pour les masterants.


  Tu es en master, tu prépares ton mémoire, ou tu viens de soutenir. Et tu te demandes : « La valorisation, c''est pour plus tard, non ? Quand j''aurai un doctorat ? »


  Non. C''est justement le meilleur moment pour commencer. Voici pourquoi le Pass Valorisation est fait pour toi :


  🎯 TU POSES LES BONNES BASES DÈS MAINTENANT

  Le programme certifiant « Initiation à la valorisation » t''apprend en 5 modules à repérer ce qui est valorisable dans ton travail. Si tu es encore en train d''écrire ton mémoire, tu peux l''orienter dès maintenant vers des résultats utiles.


  📄 TU AJOUTES UNE ATTESTATION À TON CV

  À la fin du programme, tu reçois une attestation HSA. Un plus quand tu cherches un stage, un emploi ou un doctorat.


  📬 TU DÉCOUVRES LES OPPORTUNITÉS À TEMPS

  Bourses de doctorat, prix, concours : chaque semaine, tu reçois les opportunités, avec leurs dates limites.


  👤 TU DEVIENS VISIBLE TÔT

  Ton profil est consultable par des organisations, avant même la fin de ton master.


  🤝 TU N''ES PLUS SEUL

  Le groupe d''entraide et les lives mensuels pour poser tes questions.


  Tout ça pour 2 000 FCFA pour toute l''année.


  Le carrousel détaille tout. 👆 Le lien pour t''inscrire est en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'La valorisation de la recherche est souvent perçue comme une préoccupation postérieure au doctorat. Le master constitue pourtant un moment favorable pour l''engager.


    Le Pass Valorisation du Hub Scientifique Africain apporte aux masterants :

    • le programme certifiant « Initiation à la valorisation », qui permet d''identifier les éléments valorisables de son mémoire, y compris en cours de rédaction ;

    • une attestation HSA, utile pour une candidature en stage, en emploi ou en doctorat ;

    • une veille hebdomadaire des opportunités : bourses, prix, concours ;

    • un profil de chercheur visible des organisations ;

    • un groupe d''entraide et des sessions mensuelles en direct.


    Tarif : 2 000 FCFA par an. Le lien d''inscription est en commentaire.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
