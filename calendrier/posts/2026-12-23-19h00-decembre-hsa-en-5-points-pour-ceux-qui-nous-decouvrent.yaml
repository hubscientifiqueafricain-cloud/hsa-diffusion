texte: 'Tu nous suis depuis quelques jours ou quelques semaines, mais tu ne sais pas encore vraiment qui on est ? 👋🏾 Voici HSA en 5 points.


  1️⃣ QUI ON EST

  Le Hub Scientifique Africain (HSA) est une plateforme dédiée à la recherche africaine et à sa valorisation.


  2️⃣ POURQUOI ON EXISTE

  Parce que trop de mémoires et de thèses utiles restent dans les tiroirs, pendant que leurs auteurs peinent à se faire connaître et à vivre de leur expertise.


  3️⃣ NOTRE CONVICTION

  La recherche africaine peut produire de l''impact, des revenus et de la notoriété. Pour ceux qui la font, et pour ceux qui en ont besoin.


  4️⃣ POUR QUI

  Les masterants, les doctorants, les jeunes chercheurs de toutes les disciplines, et les organisations qui cherchent des experts.


  5️⃣ CE QU''ON PROPOSE

  • Gratuitement : un profil de chercheur, la Boussole de valorisation (un diagnostic en 5 minutes), l''accès aux opportunités et aux événements de la plateforme, et des webinaires.

  • Et le Pass Valorisation, à 2 000 FCFA pour toute l''année, pour aller plus loin avec une méthode et un accompagnement.


  On te présente tout ça en détail dans les prochains posts.


  Le carrousel résume HSA en 5 slides. 👆 Et si tu nous découvres, dis bonjour en commentaire, avec ta discipline et ton pays ! 🌍


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Présentation du Hub Scientifique Africain (HSA) en cinq points :


    1. Une plateforme dédiée à la recherche africaine et à sa valorisation.

    2. Une raison d''être : de nombreux travaux de recherche restent peu diffusés, et leurs auteurs peinent à faire reconnaître leur expertise.

    3. Une conviction : la recherche africaine peut produire de l''impact, des revenus et de la notoriété.

    4. Des publics : masterants, doctorants, jeunes chercheurs de toutes disciplines, et organisations à la recherche d''expertise.

    5. Une offre : des services gratuits (profil de chercheur, Boussole de valorisation, opportunités, événements, webinaires) et le Pass Valorisation, à 2 000 FCFA par an.


    Les prochaines publications détaillent ces services.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
