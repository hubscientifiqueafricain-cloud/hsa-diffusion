texte: 'On a tous fait au moins une de ces erreurs. 😅 Voici les 5 erreurs qui bloquent la valorisation, et ce qu''il faut faire à la place.


  ❌ Parler de ta méthode avant de parler du problème.

  ✅ Commence par le problème de ton interlocuteur. La méthode, c''est pour plus tard, s''il la demande.


  ❌ Vouloir tout faire en même temps : article, startup, formation, livre…

  ✅ Choisis 1 ou 2 voies et va jusqu''au bout. Tu élargiras ensuite.


  ❌ Attendre que ton travail soit « parfait » pour le montrer.

  ✅ Partage une première version simple et améliore-la avec les retours.


  ❌ Envoyer le même message générique à 50 structures.

  ✅ Écris un message personnalisé à 5 structures bien choisies. Tu auras plus de réponses.


  ❌ Brader ton expertise, ou au contraire demander un prix sans rapport avec la réalité.

  ✅ Renseigne-toi sur les tarifs pratiqués, et chiffre en jours de travail.


  Et un bonus : ❌ abandonner après le premier « non ». ✅ Un refus est une information. Demande pourquoi, ajuste, et recommence.


  Regarde la vidéo. Puis dis-moi en commentaire laquelle de ces erreurs tu as déjà faite. Pas de jugement ici, on apprend ensemble. 🤝🏾


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Cinq erreurs fréquentes freinent la valorisation des travaux de recherche :


    1. Présenter sa méthode avant le problème de l''interlocuteur. Mieux vaut partir de son besoin.

    2. Multiplier les voies de valorisation simultanément. Mieux vaut en conduire une ou deux à leur terme.

    3. Attendre une version parfaite avant de partager. Une première version simple, améliorée par les retours, est plus efficace.

    4. Envoyer un message générique à un grand nombre de structures. Un message personnalisé à quelques destinataires bien choisis obtient davantage de réponses.

    5. Mal positionner son prix, trop bas ou sans rapport avec le marché. Il convient de se référer aux tarifs pratiqués et de raisonner en jours de travail.


    Enfin, un refus n''est pas une fin : c''est une information utile pour ajuster sa démarche.


    Hub Scientifique Africain (HSA)

    #ValorisationDeLaRecherche #Carrière #Recherche'
