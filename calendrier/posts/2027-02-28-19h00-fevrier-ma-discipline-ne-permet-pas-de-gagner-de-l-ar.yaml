texte: '« Je suis en histoire, en philosophie, en lettres… Ma discipline ne permet pas de gagner de l''argent. » 🤨 On l''entend souvent. Et ce n''est pas tout à fait vrai.


  Chaque discipline a des compétences utiles hors de l''université :

  📜 Lettres et langues : rédaction, relecture, traduction, formation.

  🏛️ Histoire et sociologie : enquêtes, études de terrain, mémoire des organisations.

  ⚖️ Droit : veille, formation, accompagnement d''associations.

  🌱 Agronomie, santé, environnement : études, formations, outils.


  Les façons ne sont pas les mêmes selon la discipline. Mais il y en a pour chacune.


  Pour trouver les tiennes, commence par la Boussole, gratuite. Et pour avancer toute l''année, avec la méthode et un groupe d''entraide, il y a le Pass Valorisation, à 2 000 FCFA. Le Pass ne fait pas le travail à ta place et ne garantit ni emploi ni revenu. Il te donne la méthode, les opportunités et l''entourage pour avancer.


  👉 Dis-nous ta discipline en commentaire. Lien du Pass en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'L''idée selon laquelle certaines disciplines ne permettraient aucune valorisation économique est répandue, notamment en lettres et sciences humaines. Pourtant, chaque discipline mobilise des compétences utiles hors de l''université : rédaction, traduction, enquêtes, veille, formation, études.


    La Boussole HSA, gratuite, aide à identifier les voies adaptées à chaque profil ; le Pass Valorisation (2 000 FCFA par an) accompagne leur mise en œuvre.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
