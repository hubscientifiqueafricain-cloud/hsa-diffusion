texte: '🗓️ Série « Prépare 2027 »


  Pour 2027, un savoir-faire qui rendra tes résultats partageables.


  Un tableau de résultats, personne ne le partage. Une bonne infographie, si. 📊


  Une infographie, c''est une image qui explique un résultat en quelques secondes. Elle se partage sur les réseaux, s''imprime pour un atelier, s''ajoute à une note pour un décideur. Et tu peux la faire gratuitement, sur ton téléphone, avec un outil comme Canva.


  Voici comment faire, en 5 étapes :


  1️⃣ UN SEUL MESSAGE. Écris-le en une phrase avant de dessiner quoi que ce soit. « Les filles qui habitent à plus de 5 km de l''école abandonnent plus souvent. »

  2️⃣ UN CHIFFRE CLÉ, en très gros. C''est lui qu''on retient.

  3️⃣ UN VISUEL SIMPLE : une barre, une icône, une carte. Pas 10 graphiques.

  4️⃣ 3 COULEURS MAXIMUM, et du texte lisible sur téléphone.

  5️⃣ LA SOURCE en bas : ton nom, ton université, l''année, l''enquête. C''est ce qui rend ton infographie crédible, et ce qui ramène les gens vers toi.


  L''erreur classique : vouloir tout mettre. Une infographie = un message. Tu as 5 résultats ? Fais 5 infographies.


  Le carrousel te montre les 5 étapes avec un exemple. 👆 Essaie avec ton résultat principal et montre-nous le résultat en commentaire !


  On est HSA, le Hub Scientifique Africain.


  🚀 Tu veux qu''en 2027 ta recherche serve vraiment ? Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : méthode, opportunités, profil visible et entraide. Lien en commentaire.'
textes:
  linkedin: 'L''infographie permet de communiquer un résultat de recherche en quelques secondes. Elle se diffuse sur les réseaux, s''intègre à une note de synthèse ou se présente lors d''un atelier. Des outils gratuits, comme Canva, suffisent à la réaliser.


    Cinq principes :

    1. Un message unique, formulé en une phrase avant toute mise en forme.

    2. Un chiffre clé, mis en valeur.

    3. Un visuel simple : barre, pictogramme ou carte.

    4. Trois couleurs au maximum et un texte lisible sur téléphone.

    5. La source : auteur, institution, année, nature des données.


    L''erreur la plus fréquente consiste à vouloir présenter l''ensemble des résultats. Plusieurs résultats appellent plusieurs infographies.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    #ValorisationDeLaRecherche #DataViz #CommunicationScientifique'
