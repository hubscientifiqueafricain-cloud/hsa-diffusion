texte: 'Tu as passé des mois, parfois des années, sur ton mémoire ou ta thèse. Et après la soutenance, il finit où ? Dans un tiroir, ou dans un dossier « Mémoire_final_v12 » sur ton ordinateur. 😅


  C''est là qu''intervient un mot que tu as peut-être déjà entendu sans trop savoir ce qu''il veut dire : la valorisation de la recherche.


  Valoriser ta recherche, c''est faire en sorte que tes résultats servent à quelqu''un en dehors du jury : une communauté, une entreprise, une administration, une ONG, d''autres chercheurs.


  👉 Ce n''est pas seulement publier un article. Publier, c''est parler aux chercheurs. Valoriser, c''est aussi parler à ceux qui vont utiliser ce que tu as trouvé.

  👉 Ce n''est pas forcément vendre. Une décision publique inspirée de ton travail, c''est aussi de la valorisation.

  👉 Ce n''est pas réservé aux sciences « dures ». Droit, sociologie, économie, lettres : tout résultat qui peut aider quelqu''un peut être valorisé.


  Bien faite, la valorisation produit trois choses : de l''impact (ta recherche change quelque chose), des revenus (ton savoir a un prix) et de la notoriété (on te connaît, on te cite, on te recrute).


  Dans le carrousel, je te montre un exemple complet, du mémoire jusqu''à son utilisation. 👆


  Nous, c''est HSA, le Hub Scientifique Africain. Pendant les prochaines semaines, on t''explique tout : c''est quoi, quand et comment valoriser. Suis la page et enregistre ce post pour le relire. 📌'
textes:
  linkedin: 'Après des mois de travail, la plupart des mémoires et des thèses finissent dans un tiroir. Pourtant, ils contiennent souvent des réponses utiles.


    Valoriser sa recherche, c''est organiser le passage de ces résultats vers ceux qui peuvent s''en servir : communautés, entreprises, administrations, ONG, autres chercheurs.


    Trois précisions :

    • Valoriser ne se limite pas à publier. La publication s''adresse aux pairs ; la valorisation s''adresse aussi aux utilisateurs.

    • Valoriser ne veut pas dire seulement vendre. Une politique publique éclairée par une thèse est une forme de valorisation.

    • Toutes les disciplines sont concernées, des sciences de l''ingénieur aux sciences humaines.


    Bien menée, la valorisation produit de l''impact, des revenus et de la notoriété pour le chercheur.


    Le carrousel présente un exemple complet. Le Hub Scientifique Africain (HSA) publie au cours des prochaines semaines une série sur le sujet : définition, bon moment, méthodes.


    #ValorisationDeLaRecherche #Doctorat #RechercheAfricaine'
