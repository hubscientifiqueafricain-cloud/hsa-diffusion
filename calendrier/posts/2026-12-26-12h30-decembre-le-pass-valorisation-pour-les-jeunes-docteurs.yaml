texte: 'Tu as soutenu ta thèse. Félicitations, docteur ! 🎉 Et maintenant ?


  Pour beaucoup de jeunes docteurs, l''après-soutenance est une période difficile : les postes sont rares, la bourse s''est arrêtée, et la thèse commence à prendre la poussière. On se sent parfois « trop qualifié » pour certains emplois et pas assez connu pour d''autres.


  Pourtant, ton expertise a de la valeur, à condition qu''elle soit visible et proposée aux bonnes personnes.


  Le Pass Valorisation t''aide à :

  🧭 choisir comment valoriser ta thèse, avec le programme certifiant et le guide des 10 façons de gagner de l''argent avec ta recherche ;

  👤 être trouvé par les organisations grâce à ton profil de chercheur visible ;

  📬 recevoir chaque semaine les financements, prix, concours et opportunités ;

  🤝 garder un réseau et une motivation, avec le groupe d''entraide et les lives mensuels.


  Ta thèse n''est pas un point final. C''est ton premier capital professionnel.


  2 000 FCFA pour toute l''année.


  La vidéo en 40 secondes. 🎬 Le lien pour t''inscrire est en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'La période qui suit la soutenance est souvent délicate pour les jeunes docteurs : postes académiques limités, fin des financements, risque de voir la thèse perdre en visibilité.


    L''expertise acquise conserve pourtant une valeur importante, à condition d''être rendue visible et proposée aux acteurs qui en ont besoin.


    Le Pass Valorisation du Hub Scientifique Africain accompagne cette étape : programme certifiant et guide des dix voies de revenus pour choisir une stratégie de valorisation ; profil de chercheur visible des organisations ; veille hebdomadaire des opportunités ; groupe d''entraide et sessions mensuelles en direct.


    Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
