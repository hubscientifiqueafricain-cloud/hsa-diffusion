texte: '🎓 Série « Carrière de chercheur »


  Ta communication est acceptée ! 🎉 Il te reste à préparer 15 minutes devant une salle de chercheurs. Voici le plan qui fonctionne.


  ⏱️ LE DÉCOUPAGE

  • 2 minutes : le problème et ta question.

  • 3 minutes : ta méthode, l''essentiel seulement.

  • 6 minutes : tes résultats, le cœur de ta présentation.

  • 2 minutes : ce que ça veut dire, et les limites.

  • 2 minutes : ton message à retenir et les remerciements.


  🖥️ LES DIAPOSITIVES

  • Environ une diapositive par minute.

  • Une idée par diapositive, avec un titre qui la résume.

  • Des figures lisibles depuis le fond de la salle.

  • Pas de paragraphes à lire.


  🗣️ LA RÉPÉTITION

  • Répète au moins trois fois à voix haute, avec un chronomètre.

  • Une fois devant des collègues ou ton labo.

  • Prépare une version de 10 minutes, au cas où la session prend du retard.


  💡 Le secret : ta dernière diapositive doit répéter ton message principal en une phrase. C''est elle qui reste affichée pendant les questions.


  Le carrousel détaille le plan. 👆 Enregistre-le avant ton prochain colloque.


  HSA, le Hub Scientifique Africain.


  🤝 Avec le Pass Valorisation HSA, fais d''une pierre deux coups : ta recherche gagne en visibilité, ton dossier de carrière se remplit. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'Une communication de quinze minutes se prépare avec méthode.


    Un découpage efficace consacre environ deux minutes au problème et à la question, trois minutes à la méthode, six minutes aux résultats, deux minutes à la discussion et aux limites, et deux minutes au message clé.


    Pour les diapositives : environ une par minute, une idée par diapositive, des figures lisibles et peu de texte. Il est recommandé de répéter plusieurs fois à voix haute avec un chronomètre, dont une fois devant des collègues, et de prévoir une version courte.


    La dernière diapositive, affichée pendant les questions, devrait reformuler le message principal.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
