texte: 'Ton offre est-elle claire ? Ton prix est-il correct ? Ton devis fait-il sérieux ? 🤔 Seul, impossible de savoir.


  Quand on se lance, on a besoin de quelqu''un pour relire, poser des questions, dire « ça, je ne comprends pas ». Pas un juge : quelqu''un qui est passé par là, ou qui y passe en même temps.


  C''est le rôle du groupe d''entraide du Pass Valorisation :

  🤝 tu partages ton offre ou ton projet ;

  💬 d''autres chercheurs te font des retours ;

  🎥 et chaque mois, un live pour poser tes questions.


  Mieux vaut corriger son offre avec ses pairs que la rater devant un client.


  Le Pass coûte 2 000 FCFA pour toute l''année. Le Pass ne fait pas le travail à ta place et ne garantit ni emploi ni revenu. Il te donne la méthode, les opportunités et l''entourage pour avancer.


  👉 Rejoins le Pass sur hubscientifiqueafricain.com. Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Avant de présenter une offre à un client, il est utile de la soumettre à des pairs : clarté, prix, présentation du devis.


    Le Pass Valorisation du Hub Scientifique Africain inclut un groupe d''entraide entre chercheurs et des sessions en direct mensuelles, propices à ce type de retours. Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
