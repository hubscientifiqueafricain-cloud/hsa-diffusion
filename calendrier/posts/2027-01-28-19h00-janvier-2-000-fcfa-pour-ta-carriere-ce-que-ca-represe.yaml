texte: '2 000 FCFA. 💰 C''est à peu près le prix de quelques trajets, d''une recharge de données, ou d''un repas à l''extérieur. Une dépense qu''on fait sans y penser.


  Avec le Pass Valorisation du Hub Scientifique Africain (HSA), ces 2 000 FCFA couvrent toute une année. Moins de 6 FCFA par jour.


  Pour ce prix, pendant 12 mois :

  🎓 un programme certifiant et son attestation pour ton CV ;

  📘 le guide « 10 façons de gagner de l''argent avec ton mémoire ou ta thèse » ;

  🌍 ton profil de chercheur visible par les organisations ;

  🏆 les opportunités chaque semaine, avec leurs dates limites ;

  🤝 le groupe d''entraide ;

  🎙️ les lives mensuels avec l''équipe HSA.


  Maintenant, pense à ce que coûte une opportunité ratée. Une bourse découverte trop tard. Un prix auquel tu n''as pas postulé. Un recruteur qui ne t''a jamais trouvé.


  On a fixé ce prix pour qu''il ne soit jamais un obstacle à ta carrière.


  Paiement par mobile money. 🎬 Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le Pass Valorisation du Hub Scientifique Africain est proposé à 2 000 FCFA pour une année complète, soit moins de 6 FCFA par jour.


    Il comprend un programme certifiant, un guide pratique, un profil de chercheur visible, une veille hebdomadaire des opportunités, un groupe d''entraide et des sessions mensuelles en direct.


    Ce tarif a été fixé pour rester accessible à l''ensemble des étudiants et jeunes chercheurs. Paiement par mobile money.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
