texte: '🎓 Série « Carrière de chercheur »


  Certains chercheurs font avancer la science. D''autres construisent les lieux où elle peut avancer. 🏗️ Thomas Odhiambo a fait les deux.


  🐛 Entomologiste kényan, spécialiste des insectes, il est convaincu que l''Afrique doit mener elle-même la recherche sur ses propres problèmes : les ravageurs des cultures, les insectes qui transmettent des maladies.


  🏛️ En 1970, il fonde à Nairobi l''ICIPE, le Centre international de physiologie et d''écologie des insectes. Un centre de recherche africain, qui deviendra une référence internationale.


  🌍 En 1985, il participe à la création de l''Académie africaine des sciences, dont il est le premier président. Un réseau pour rassembler et faire reconnaître les scientifiques du continent.


  💡 Ce que son parcours t''apprend :

  • Une carrière scientifique, ce n''est pas seulement des articles. C''est aussi bâtir des institutions, des réseaux, des opportunités pour les autres.

  • Le réseau scientifique se construit. Il ne tombe pas du ciel.

  • Les plus grands chercheurs sont souvent ceux qui ont fait grandir les autres.


  Et toi, qu''aimerais-tu bâtir un jour ? Un laboratoire, une association, un réseau, un programme pour les jeunes ? Dis-le en commentaire. 👇


  HSA, le Hub Scientifique Africain.


  📈 Valoriser ta recherche et construire ta carrière, c''est le même chemin. Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : profil visible, opportunités, attestation et entraide. Lien en commentaire.'
textes:
  linkedin: 'Thomas Odhiambo, entomologiste kényan, a marqué la science africaine autant par ses travaux que par les institutions qu''il a fondées.


    Convaincu que l''Afrique devait conduire elle-même la recherche sur ses défis, notamment les insectes ravageurs et vecteurs de maladies, il a fondé en 1970 à Nairobi le Centre international de physiologie et d''écologie des insectes (ICIPE). En 1985, il a contribué à la création de l''Académie africaine des sciences, dont il a été le premier président.


    Son parcours rappelle qu''une carrière scientifique comprend aussi la construction d''institutions et de réseaux au service des autres chercheurs.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
