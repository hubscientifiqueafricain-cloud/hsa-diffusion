texte: "Beaucoup de chercheurs se disent : je valoriserai après la soutenance. C'est souvent trop tard. Alors, quand commencer ?\n\nDans cette micro-formation :\n▶ Le bon moment : dès le début\n   • En choisissant ton sujet\n   • Pendant le terrain\n   • Pendant la rédaction\n▶ Pourquoi ne pas attendre\n   • Les contacts refroidissent\n   • Tu gagnes des mois\n\nÀ retenir : Valoriser n'est pas une étape qui vient après la recherche. C'est un réflexe à cultiver pendant toute la recherche.\n\n\U0001F4AC Tu as une question sur la valorisation de ta recherche ? Pose-la en commentaire : on y répondra dans une prochaine vidéo.\n\U0001F514 Abonne-toi pour ne rien manquer de la série « Valoriser ta recherche · 1 question, 2 minutes ».\n\n\U0001F310 HSA, le Hub Scientifique Africain : https://www.hubscientifiqueafricain.com\n\n#ValorisationDeLaRecherche #Doctorat #RechercheAfricaine"
question_youtube:
- 'Valorisation et carrière du chercheur : quels choix ?'
- Comment anticiper son projet professionnel pendant la thèse ?
