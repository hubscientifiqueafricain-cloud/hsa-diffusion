texte: 'Moins de 6 FCFA par jour. C''est le prix du Pass Valorisation HSA. 😮 Voici exactement ce qu''il contient, avantage par avantage.


  🎓 LE PROGRAMME CERTIFIANT « INITIATION À LA VALORISATION »

  5 modules pour apprendre la méthode pas à pas, avec une attestation à la fin.


  📘 LE GUIDE « 10 FAÇONS DE GAGNER DE L''ARGENT AVEC TON MÉMOIRE OU TA THÈSE »

  Pour choisir ta voie de valorisation.


  👤 TON PROFIL DE CHERCHEUR SUR HSA

  Visible par les entreprises, les ONG et les institutions.


  📬 LES OPPORTUNITÉS, CHAQUE SEMAINE

  Financements, prix, concours et opportunités, envoyés chaque semaine. Fini les dates limites découvertes trop tard.


  🤝 LE GROUPE D''ENTRAIDE DES MEMBRES ET LES LIVES MENSUELS

  Pour poser tes questions, partager tes avancées et rester motivé.


  💰 LE PRIX : 2 000 FCFA pour toute l''année.

  Pendant 12 mois, tu as la méthode et l''accompagnement. Paiement par mobile money.


  Pour comparer : 2 000 FCFA, c''est moins qu''un repas au restaurant. Et une seule opportunité trouvée grâce à la veille hebdomadaire peut te rapporter bien plus.


  Le carrousel détaille chaque avantage. 👆 Inscris-toi pour 2 000 FCFA : lien en commentaire.


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le Pass Valorisation HSA donne accès, pendant douze mois, à la méthode et à l''accompagnement nécessaires pour valoriser ses travaux :


    • le programme certifiant « Initiation à la valorisation », en cinq modules, avec attestation ;

    • le guide « 10 façons de gagner de l''argent avec son mémoire ou sa thèse » ;

    • un profil de chercheur visible par les entreprises, ONG et institutions ;

    • une veille hebdomadaire des financements, prix, concours et opportunités ;

    • le groupe d''entraide des membres et des sessions en direct mensuelles ;


    Tarif : 2 000 FCFA pour l''année, soit moins de 6 FCFA par jour. Paiement par mobile money.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
