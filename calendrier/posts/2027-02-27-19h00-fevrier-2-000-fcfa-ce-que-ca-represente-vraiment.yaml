texte: '2 000 FCFA. 💰 C''est le prix du Pass Valorisation. Pour toute l''année.


  Pour te donner une idée, c''est :

  🍽️ à peu près le prix d''un repas ;

  📱 ou d''un petit forfait internet ;

  📅 et moins de 6 FCFA par jour.


  Pour ce prix, pendant 12 mois : un programme certifiant avec attestation, un profil de chercheur visible, les opportunités chaque semaine, un groupe d''entraide et des lives.


  On ne va pas te promettre que le Pass « se rembourse tout seul ». Ce qui te fera gagner de l''argent, c''est ton travail : ton offre, tes clients, tes dossiers. Le Pass est là pour que ce travail soit mieux orienté, et que tu ne sois pas seul.


  On a voulu un prix que chaque étudiant puisse payer. Parce que valoriser sa recherche ne devrait pas être réservé à ceux qui ont déjà de l''argent.


  👉 Paiement par mobile money sur hubscientifiqueafricain.com, ou par WhatsApp au +225 07 07 89 29 70. Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le Pass Valorisation est proposé à 2 000 FCFA par an, soit moins de 6 FCFA par jour, réglables par mobile money.


    Ce tarif a été fixé pour rester accessible aux étudiants. Il ne constitue pas une promesse de rentabilité : les revenus éventuels dépendent du travail du chercheur. Le Pass vise à mieux orienter ce travail et à éviter l''isolement.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
