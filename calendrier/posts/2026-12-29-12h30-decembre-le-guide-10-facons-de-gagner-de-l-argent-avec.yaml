    3. l''expertise et le conseil ;

    4. la formation ;

    5. le produit ou l''outil ;

    6. la création d''entreprise ;

    7. la note aux décideurs ;

    8. le partenariat ;

    9. les prix, concours et financements ;

    10. la licence.


    Toutes ne génèrent pas de revenu direct, mais toutes contribuent à la valeur de l''expertise. Le guide aide à identifier les voies adaptées à chaque recherche et à chaque objectif.


    Tarif du Pass : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
