texte: 'Gagner de l''argent avec ton mémoire ou ta thèse. Et que ta recherche serve vraiment. 💡 Ce mois-ci, on t''a montré que les deux vont ensemble. Aujourd''hui, on te présente qui peut t''aider à passer à l''action.


  Le Hub Scientifique Africain (HSA) est une plateforme dédiée à la recherche africaine et à sa valorisation. Pour les masterants, les doctorants et les jeunes chercheurs de toutes les disciplines.


  Avec HSA :

  🔹 Tu sais par où commencer, grâce à des outils gratuits : le guide « 10 façons de gagner de l''argent avec ta recherche » et la Boussole.

  🔹 Tu apprends la méthode, avec un programme certifiant et une attestation.

  🔹 Tu repères chaque semaine les financements, prix et concours.

  🔹 Ton profil de chercheur est visible par des entreprises, ONG et institutions.

  🔹 Tu testes tes idées avec d''autres chercheurs, dans un groupe d''entraide.


  Les outils de départ sont gratuits. Pour aller plus loin, il y a le Pass Valorisation, à 2 000 FCFA pour toute l''année.


  La vidéo résume tout. 🎬 Suis la page : on te présente chaque élément dans les prochains jours.


  HSA, le Hub Scientifique Africain.'
