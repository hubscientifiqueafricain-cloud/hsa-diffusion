texte: 'C''est le dernier jour de janvier. 📅 Le premier mois de l''année se termine. Et toi, qu''as-tu fait pour ta carrière ?


  Si tu as suivi nos posts ce mois-ci, tu as maintenant :

  ✅ la carte des piliers d''une carrière de chercheur ;

  ✅ la méthode pour écrire un article et choisir ta revue ;

  ✅ les clés pour réussir une communication, un poster, un pitch de 3 minutes ;

  ✅ un CV académique à jour, et ton identité numérique ;

  ✅ un plan sur 12 mois.


  Il ne reste qu''une chose : passer à l''action. Et ne pas le faire seul.


  Voici ton prochain pas, au choix :

  1️⃣ Crée ton profil de chercheur gratuit sur HSA, si ce n''est pas encore fait.

  2️⃣ Rejoins le Pass Valorisation, à 2 000 FCFA pour toute l''année, pour avoir la méthode, les opportunités et l''entourage.


  Les deux sont sur hubscientifiqueafricain.com. Le lien est en commentaire.


  Merci d''avoir été avec nous tout ce mois. On te souhaite une année 2027 pleine de publications, de communications et de belles rencontres. 🌍


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le mois de janvier s''achève. Les publications de ce mois ont présenté les piliers d''une carrière scientifique : publications, communications, vulgarisation, CV académique, identité numérique, réseau et planification annuelle.


    Deux options permettent de poursuivre la démarche avec le Hub Scientifique Africain : créer un profil de chercheur gratuit, ou rejoindre le Pass Valorisation (2 000 FCFA par an), qui apporte méthode, opportunités et réseau.


    Nous remercions toutes celles et tous ceux qui ont suivi cette série, et leur souhaitons une année 2027 riche en publications, en communications et en collaborations.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
