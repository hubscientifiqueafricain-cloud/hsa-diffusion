texte: '🎓 Série « Carrière de chercheur »


  Publier, communiquer, vulgariser, réseauter, mettre son CV à jour… 😮‍💨 Quand on voit tout ce qu''il faudrait faire, on a envie de ne rien faire. Alors voici une règle simple : une action de visibilité par mois.


  Pas plus. Mais tous les mois.


  📅 Exemples d''actions :

  • Soumettre un résumé à un colloque.

  • Publier un post LinkedIn sur un résultat.

  • Écrire un article grand public.

  • Présenter tes travaux au séminaire du labo.

  • Mettre à jour ton profil Google Scholar.

  • Contacter un chercheur rencontré en colloque.


  En un an, ça fait 12 actions. 12 traces dans ton dossier. 12 occasions d''être repéré.


  C''est ça, la force de la régularité : de petites actions qui s''additionnent, sans t''épuiser à côté de ta thèse.


  Regarde la vidéo, puis dis-nous en commentaire : quelle sera ton action du mois de février ? 👇


  HSA, le Hub Scientifique Africain.


  📈 Valoriser ta recherche et construire ta carrière, c''est le même chemin. Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : profil visible, opportunités, attestation et entraide. Lien en commentaire.'
textes:
  linkedin: 'Face au nombre d''actions possibles pour développer sa visibilité scientifique, une règle simple aide à progresser : une action de visibilité par mois.


    Il peut s''agir de soumettre un résumé à un colloque, de publier un post professionnel sur un résultat, de rédiger un article de vulgarisation, de présenter ses travaux en séminaire, de mettre à jour ses profils ou de reprendre contact avec un chercheur rencontré.


    Sur une année, cette régularité produit douze traces concrètes dans un dossier, sans surcharge excessive.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
