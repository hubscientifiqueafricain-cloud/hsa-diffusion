texte: '🎓 Série « Carrière de chercheur »


  « K. Yao », « Yao Konan », « Konan Yao K. », « Yao K. J. »… 😵 Même personne, quatre signatures. Pour une base de données, ce sont peut-être quatre chercheurs différents.


  C''est une erreur très fréquente, surtout chez nous, où l''ordre du nom et des prénoms varie. Et elle a des conséquences :


  ❌ Tes publications sont éparpillées.

  ❌ Tes citations sont mal comptées.

  ❌ Un recruteur qui te cherche ne trouve qu''une partie de ton travail.


  ✅ LA SOLUTION

  1. Choisis une forme de nom unique dès ton premier article, et garde-la toute ta carrière.

  2. Utilise la même affiliation, écrite de la même façon.

  3. Associe ton identifiant ORCID à chaque publication.

  4. Si tu as déjà plusieurs formes, regroupe tes publications dans ton profil ORCID et Google Scholar.


  💡 Mets-toi d''accord avec ton encadreur et tes co-auteurs sur la façon d''écrire ton nom et le nom de ton laboratoire.


  La vidéo résume tout ça. 🎬 Vérifie tes signatures dès aujourd''hui.


  HSA, le Hub Scientifique Africain.


  🤝 Avec le Pass Valorisation HSA, fais d''une pierre deux coups : ta recherche gagne en visibilité, ton dossier de carrière se remplit. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'L''utilisation de plusieurs formes de nom d''auteur est une erreur fréquente, notamment lorsque l''ordre des noms et prénoms varie selon les usages.


    Elle entraîne une dispersion des publications, un décompte incomplet des citations et une visibilité réduite auprès des évaluateurs.


    Il est recommandé d''adopter une forme de nom unique dès la première publication, une affiliation normalisée, et d''associer systématiquement son identifiant ORCID à ses travaux. Les publications existantes peuvent être regroupées dans les profils ORCID et Google Scholar.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
