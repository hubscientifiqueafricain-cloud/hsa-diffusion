texte: 'À quoi ressemblerait ton année 2027 avec le Pass Valorisation ? 📅 Voici un exemple de parcours, mois par mois. (C''est un exemple : tu avances à ton rythme.)


  🗓️ JANVIER : tu t''inscris, tu complètes ton profil de chercheur et tu commences le programme certifiant. Tu rejoins le groupe d''entraide et tu te présentes.


  🗓️ FÉVRIER-MARS : tu suis les premiers modules. Tu repères ce qui est valorisable dans ton mémoire ou ta thèse. Tu lis le guide des 10 façons et tu choisis ta voie principale.


  🗓️ AVRIL : tu termines le programme et tu reçois ton attestation HSA. Tu l''ajoutes à ton CV et à ton profil LinkedIn.


  🗓️ MAI-JUIN : chaque semaine, tu regardes les opportunités envoyées. Tu choisis un prix ou un financement adapté et tu prépares ton dossier.


  🗓️ JUILLET-SEPTEMBRE : tu passes à l''action sur ta voie choisie : premier article grand public, premier contact avec une organisation, premier atelier. Tu partages tes avancées dans le groupe.


  🗓️ OCTOBRE-DÉCEMBRE : tu fais le bilan, tu mesures ce qui a changé, et tu prépares 2028.


  Et tout au long de l''année : un live chaque mois avec l''équipe HSA pour poser tes questions.


  Le carrousel te montre l''année entière. 👆 Le tout pour 2 000 FCFA. Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Exemple de parcours annuel avec le Pass Valorisation du Hub Scientifique Africain, à adapter au rythme de chacun :


    • Janvier : inscription, profil de chercheur complété, début du programme certifiant, intégration au groupe d''entraide.

    • Février-mars : suivi des modules, identification des éléments valorisables, choix d''une voie principale à l''aide du guide des dix voies.

    • Avril : fin du programme et obtention de l''attestation HSA.

    • Mai-juin : sélection d''opportunités dans la veille hebdomadaire et préparation d''une candidature.

    • Juillet-septembre : premières actions de valorisation.

    • Octobre-décembre : bilan et préparation de l''année suivante.


    Une session mensuelle en direct accompagne l''ensemble du parcours. Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
