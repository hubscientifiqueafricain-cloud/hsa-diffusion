texte: "Une entreprise ou une ONG s'intéresse à ta recherche. Bonne nouvelle. Mais quel contrat signer ? Voici les quatre principaux.\n\nDans cette micro-formation :\n▶ Les 4 contrats à connaître\n   • La prestation de service\n   • Le contrat de recherche\n   • La collaboration de recherche\n   • La licence\n▶ Ce qu'il faut vérifier\n   • À qui sont les résultats ?\n\nÀ retenir : Un bon contrat protège ta recherche et ta relation avec le partenaire. Fais-toi accompagner par le service juridique ou de valorisation de ton institution.\n\n\U0001F4AC Tu as une question sur la valorisation de ta recherche ? Pose-la en commentaire : on y répondra dans une prochaine vidéo.\n\U0001F514 Abonne-toi pour ne rien manquer de la série « Valoriser ta recherche · 1 question, 2 minutes ».\n\n\U0001F310 HSA, le Hub Scientifique Africain : https://www.hubscientifiqueafricain.com\n\n#ValorisationDeLaRecherche #Doctorat #RechercheAfricaine"
