texte: 'Tu es en thèse. 📚 Tu dois avancer ta recherche, écrire, publier, présenter en colloque, peut-être enseigner. Et en même temps, préparer l''après. C''est beaucoup.


  Le Pass Valorisation du Hub Scientifique Africain (HSA) t''aide à faire d''une pierre deux coups : valoriser ta thèse et construire ton dossier.


  🏆 Les opportunités chaque semaine : prix, concours, bourses, financements. Pour un séjour de recherche, un concours de thèse, un prix pour jeunes chercheurs.

  🌍 Ton profil de chercheur, visible par les organisations, pour que ton expertise soit connue avant même ta soutenance.

  🎓 Le programme certifiant, pour apprendre à faire servir ta recherche au-delà du jury, avec une attestation pour ton CV.

  🤝 Le groupe d''entraide, pour échanger avec d''autres doctorants sur l''écriture, les colloques, les revues.

  💡 Le guide « 10 façons de gagner de l''argent avec ton mémoire ou ta thèse », pour voir les débouchés concrets de ton travail.


  Ta soutenance arrivera vite. Le dossier que tu présenteras après se construit maintenant.


  2 000 FCFA pour toute l''année. Le carrousel détaille tout. 👆 Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le doctorat combine de nombreuses exigences : recherche, rédaction, publications, communications, parfois enseignement, et préparation de l''après-thèse.


    Le Pass Valorisation du Hub Scientifique Africain accompagne les doctorants sur ces deux fronts : valorisation des travaux et construction du dossier. Il comprend une veille hebdomadaire des opportunités, un profil de chercheur visible, un programme certifiant, un groupe d''entraide et un guide sur les débouchés de la recherche.


    Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
