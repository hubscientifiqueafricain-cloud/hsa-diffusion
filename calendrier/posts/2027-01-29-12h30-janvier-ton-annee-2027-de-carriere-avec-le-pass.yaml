texte: 'On t''a proposé ce mois-ci un plan de carrière sur 12 mois. 🗓️ Voici le même plan, avec ce que le Pass Valorisation du Hub Scientifique Africain (HSA) t''apporte à chaque étape.


  🌱 JANVIER À MARS : LES BASES

  • Tu mets à jour ton profil de chercheur HSA, en plus de ton ORCID et de ton LinkedIn.

  • Tu commences le programme certifiant, à ton rythme.

  • Tu repères les premières opportunités de l''année dans la sélection hebdomadaire.


  ✍🏾 AVRIL À JUIN : PRODUIRE

  • Tu termines le programme et tu reçois ton attestation : une ligne de plus dans ton CV.

  • Tu utilises la méthode pour faire connaître ta recherche au-delà du jury.

  • Tu demandes un avis au groupe d''entraide sur ton résumé ou ton texte.


  🎤 JUILLET À SEPTEMBRE : PRÉSENTER

  • Tu postules aux prix, concours ou bourses repérés.

  • Tu échanges avec d''autres membres pendant les lives mensuels.


  🎯 OCTOBRE À DÉCEMBRE : CONSOLIDER

  • Tu fais ton bilan, avec un dossier plus rempli qu''en janvier.

  • Tu prépares les candidatures de l''année suivante.


  Tout ça pour 2 000 FCFA pour l''année. Le carrousel détaille le plan. 👆 Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le plan de carrière annuel présenté ce mois-ci peut s''appuyer sur les services du Pass Valorisation du Hub Scientifique Africain.


    Premier trimestre : mise à jour du profil, début du programme certifiant, repérage des opportunités. Deuxième trimestre : obtention de l''attestation, application de la méthode de valorisation, échanges au sein du groupe. Troisième trimestre : candidatures aux prix, concours et bourses, participation aux sessions mensuelles. Quatrième trimestre : bilan et préparation des candidatures suivantes.


    Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
