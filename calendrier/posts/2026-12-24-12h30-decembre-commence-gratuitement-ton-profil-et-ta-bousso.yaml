texte: 'Joyeux réveillon ! 🎄 Si tu as 15 minutes de calme aujourd''hui ou demain, voici deux choses gratuites à faire pour bien commencer 2027.


  1️⃣ CRÉE TON PROFIL DE CHERCHEUR SUR HSA (10 minutes)

  • Va sur hubscientifiqueafricain.com et clique sur « Créer mon espace ».

  • Ajoute ta photo, un titre clair, ta biographie et tes domaines d''expertise.

  • Importe tes travaux depuis ORCID ou Google Scholar, si tu y es.

  Ton profil devient visible par d''autres chercheurs, des institutions et des organisations.


  2️⃣ FAIS TA BOUSSOLE DE VALORISATION (5 minutes)

  C''est un diagnostic gratuit : tu présentes ton niveau, ta discipline et ton sujet, puis tu réponds à 14 questions. Tu reçois tout de suite :

  ✅ ton statut de valorisation ;

  ✅ une analyse par dimension ;

  ✅ tes points forts ;

  ✅ des recommandations prioritaires ;

  ✅ les voies de revenus les plus adaptées à ta recherche ;

  ✅ un plan d''action, à télécharger en PDF.


  Tes réponses servent uniquement à calculer ton résultat et à t''envoyer des conseils. Elles ne sont pas partagées.


  C''est gratuit, et ça te dit exactement par où commencer.


  Le carrousel te guide étape par étape. 👆 Le lien est en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Deux démarches gratuites permettent d''engager une démarche de valorisation avec le Hub Scientifique Africain :


    1. Créer son profil de chercheur (environ dix minutes) sur hubscientifiqueafricain.com : photo, titre, biographie, domaines d''expertise, et import des travaux depuis ORCID ou Google Scholar. Le profil est consultable par des chercheurs, des institutions et des organisations.


    2. Réaliser la Boussole de valorisation (environ cinq minutes) : une brève présentation, quatorze questions, et un résultat immédiat comprenant le statut de valorisation, une analyse par dimension, les points forts, des recommandations prioritaires, les voies de revenus adaptées et un plan d''action téléchargeable en PDF. Les réponses ne sont pas partagées.


    Le lien est en commentaire.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
