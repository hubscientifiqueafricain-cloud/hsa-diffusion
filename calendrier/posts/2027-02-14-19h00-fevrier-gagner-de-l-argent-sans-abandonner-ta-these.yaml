texte: '💰 Série « Gagner de l''argent avec ta recherche »


  « Si je commence à faire des missions, je ne finirai jamais ma thèse. » 😰 C''est une vraie inquiétude. Et elle est légitime : beaucoup de doctorants se sont perdus dans des missions qui ont repoussé leur soutenance de plusieurs années.


  Voici comment trouver l''équilibre :


  📅 FIXE UN CRÉNEAU PRÉCIS

  Par exemple, un après-midi par semaine, ou le samedi matin. Pas plus, au début.


  🎯 CHOISIS DES MISSIONS LIÉES À TON SUJET

  Elles te font avancer deux fois : tu gagnes de l''argent, et tu enrichis ta recherche, ton terrain, ton réseau.


  🚫 APPRENDS À DIRE NON

  À une mission trop longue, mal payée ou hors de ton sujet, surtout pendant les périodes clés de ta thèse.


  🗓️ PROTÈGE TES PÉRIODES CRITIQUES

  Rédaction finale, préparation de soutenance : réduis ou suspends les missions.


  💬 PARLES-EN À TON ENCADREUR

  Il vaut mieux qu''il l''apprenne de toi. Et il peut te conseiller.


  La thèse reste la priorité. Mais une activité bien choisie peut t''aider à la financer, et à préparer l''après.


  Regarde la vidéo, puis dis-nous en commentaire : quel créneau pourrais-tu réserver chaque semaine ? 👇


  HSA, le Hub Scientifique Africain.


  📘 Tu veux les 10 façons dans un seul document ? Le guide HSA est gratuit. Et pour avancer toute l''année, il y a le Pass Valorisation à 2 000 FCFA. Liens en commentaire.'
textes:
  linkedin: 'L''exercice d''une activité rémunérée pendant le doctorat comporte un risque réel de retarder la soutenance.


    Quelques principes permettent de préserver l''équilibre : réserver un créneau hebdomadaire limité, privilégier les missions en lien avec le sujet de thèse, refuser les missions inadaptées, protéger les périodes critiques (rédaction, soutenance) et en informer son encadreur. La thèse demeure la priorité.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
