texte: '🎓 Série « Carrière de chercheur »


  Tu postules à l''université et à une ONG avec le même CV ? 🤔 C''est une erreur fréquente. Les deux recruteurs ne cherchent pas la même chose.


  🎓 LE CV ACADÉMIQUE

  • Plusieurs pages, c''est normal.

  • Les publications et les communications sont au centre.

  • On liste tout, de façon complète.


  🌍 LE CV POUR UNE ONG, UNE ENTREPRISE OU UNE ORGANISATION INTERNATIONALE

  • Deux pages maximum, en général.

  • Les compétences et les résultats concrets sont au centre.

  • On traduit la recherche en savoir-faire : « conçu et mené une enquête auprès de 300 ménages », « analysé des données avec tel logiciel », « rédigé des rapports pour des partenaires ».

  • Les publications sont résumées : les plus pertinentes pour le poste.


  💡 Dans les deux cas : adapte ton CV à chaque offre. Relis l''annonce, repère les mots-clés, et mets en avant ce qui y répond.


  Ta thèse t''a donné des compétences que beaucoup d''employeurs recherchent : gestion de projet, analyse, rédaction, autonomie. Il faut juste les nommer.


  La vidéo compare les deux. 🎬


  HSA, le Hub Scientifique Africain.


  🎯 Pour construire ta carrière sans avancer seul : le Pass Valorisation HSA te donne une méthode certifiante (avec attestation pour ton CV), les opportunités chaque semaine et un groupe d''entraide. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'Le CV académique et le CV destiné à une ONG, une entreprise ou une organisation internationale répondent à des attentes différentes.


    Le CV académique est détaillé et centré sur les publications et communications. Le CV non académique est plus court, généralement deux pages, et met en avant des compétences et des réalisations concrètes. Les activités de recherche y sont traduites en savoir-faire opérationnels : conception d''enquêtes, analyse de données, rédaction de rapports, gestion de projet.


    Dans tous les cas, l''adaptation à chaque offre reste essentielle.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
