texte: '« Je verrai la valorisation après la soutenance. Là, je dois d''abord finir. » 😓

  C''est l''erreur la plus fréquente. Et c''est compréhensible : tu es sous pression, tu as un encadreur à satisfaire, des délais à tenir.


  Mais voici ce qui se passe quand tu attends :

  ❌ Après la soutenance, tu es épuisé. Tu veux juste souffler, puis chercher du travail.

  ❌ Les contacts du terrain se sont perdus. Tu ne sais plus qui appeler.

  ❌ Ton sujet n''est plus « frais ». L''élan est retombé.

  ❌ Tu te retrouves avec un document de 120 pages que personne d''autre ne lira.


  Et voici ce qui se passe quand tu commences tôt :

  ✅ Tu choisis des angles de recherche qui répondent à de vrais besoins.

  ✅ Tu gardes le lien avec les personnes concernées, qui attendent tes résultats.

  ✅ Tu te fais connaître pendant ta recherche, pas après.

  ✅ Le jour de la soutenance, tu as déjà un plan, et parfois déjà une opportunité.


  Penser à l''impact tôt ne veut pas dire faire deux fois plus de travail. Ça veut dire se poser 3 questions dès maintenant :

  1. À qui mes résultats peuvent-ils servir ?

  2. Qui dois-je rencontrer pendant ma recherche ?

  3. Sous quelle forme vais-je partager mes résultats ?


  Regarde la vidéo, puis réponds à ces 3 questions dans ton carnet. ✍🏾

  Si tu t''y mets dès maintenant, commente « je commence ». 💪🏾


  On est HSA, le Hub Scientifique Africain.


  🌐 https://www.hubscientifiqueafricain.com'
