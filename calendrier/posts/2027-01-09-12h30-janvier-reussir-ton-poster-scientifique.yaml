texte: '🎓 Série « Carrière de chercheur »


  Pendant une session poster, les gens passent devant ton travail en marchant. 🚶🏾‍♀️ Tu as quelques secondes pour qu''ils s''arrêtent. Voici comment faire.


  ✅ À FAIRE

  • Un titre court, lisible à plusieurs mètres, qui dit ton résultat.

  • Ton message principal en gros, au centre ou en haut.

  • Plus de figures que de texte.

  • Un parcours de lecture évident : de gauche à droite, ou de haut en bas.

  • Tes coordonnées et un code QR vers ton profil ou ton article.


  ❌ À ÉVITER

  • Copier-coller ton article sur une grande feuille.

  • Des paragraphes en petits caractères.

  • Trop de couleurs et de polices différentes.

  • Rester assis, ou sur ton téléphone, pendant la session.


  🗣️ ET LE JOUR J

  Prépare un « pitch » de 30 secondes pour présenter ton poster à chaque personne qui s''arrête. Puis pose-lui une question : « Vous travaillez sur quoi ? » C''est comme ça qu''on crée des contacts.


  Le carrousel résume les règles. 👆


  HSA, le Hub Scientifique Africain.


  🎯 Pour construire ta carrière sans avancer seul : le Pass Valorisation HSA te donne une méthode certifiante (avec attestation pour ton CV), les opportunités chaque semaine et un groupe d''entraide. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'Lors d''une session poster, les participants circulent rapidement. Le poster doit capter leur attention en quelques secondes.


    Bonnes pratiques : un titre court et lisible à distance, qui énonce le résultat ; un message principal mis en évidence ; une place importante pour les figures ; un sens de lecture clair ; des coordonnées et un code QR.


    À éviter : la reproduction intégrale de l''article, les paragraphes denses, la multiplication des couleurs et des polices.


    Une présentation orale de trente secondes, suivie d''une question à l''interlocuteur, favorise les échanges et la création de contacts.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
