texte: 'Deux étudiants. Même université, même promotion, même sujet : la gestion des déchets plastiques dans leur ville. Même note à la soutenance. ♻️

  (Exemple imaginé pour illustrer.)


  👤 ÉTUDIANT A

  Il soutient, il fête, il range son mémoire. Il envoie des CV partout pendant un an. Dans son CV, une ligne : « Mémoire sur la gestion des déchets plastiques. » Personne ne lui pose de questions dessus.


  👤 ÉTUDIANT B

  Il soutient, il fête. Puis :

  📌 Semaine 1 : il écrit un post simple qui résume ce qu''il a trouvé sur les dépôts sauvages de son quartier.

  📌 Mois 1 : il envoie une note de 2 pages à la mairie et à deux ONG de l''environnement.

  📌 Mois 2 : une ONG l''invite à présenter ses résultats. Elle cherche quelqu''un pour une enquête dans un autre quartier.

  📌 Mois 4 : il réalise cette enquête, rémunérée. Il a sa première référence professionnelle.

  📌 Mois 8 : une radio locale l''invite pour parler de la pollution plastique. On commence à le citer.


  Même mémoire. Même talent. La seule différence : B a décidé de faire servir sa recherche.


  Ça ne demande pas d''être un génie. Ça demande de faire une première action, puis une deuxième.


  Regarde la vidéo. Et toi, aujourd''hui, tu es plutôt A ou B ? Réponds en commentaire, sans honte. On est tous passés par A. 👇


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Deux diplômés, un même mémoire sur la gestion des déchets plastiques, une même note. (Exemple fictif.)


    Le premier archive son travail et l''évoque en une ligne dans son CV.


    Le second publie une synthèse accessible de ses résultats, adresse une note de deux pages à la mairie et à deux ONG, présente ses travaux à l''une d''elles, réalise une enquête rémunérée pour son compte, puis intervient dans un média local.


    À compétences égales, la différence tient à la décision de faire circuler ses résultats, et à une succession d''actions simples.


    Hub Scientifique Africain (HSA)

    #Carrière #ValorisationDeLaRecherche #JeunesDiplômés'
