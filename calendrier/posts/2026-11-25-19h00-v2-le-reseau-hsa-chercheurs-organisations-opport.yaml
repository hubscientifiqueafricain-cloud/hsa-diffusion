texte: 'On l''a dit dans cette série : on ne valorise jamais seul. 🤝 Il faut des partenaires, des financements, des collègues, des occasions de se montrer. Sur HSA, tout ça est au même endroit.


  🔍 TROUVER DES CHERCHEURS

  Cherche par domaine, par pays, par mots-clés. Trouve un co-auteur, un expert pour une mission, quelqu''un qui travaille sur le même sujet dans un autre pays. Crée un groupe de recherche ou réponds à un appel à collaboration.


  🏛️ TROUVER DES ORGANISATIONS

  L''annuaire des organisations rassemble des universités, des centres de recherche, des ONG, des organisations internationales et des entreprises issues de la recherche. Tu peux filtrer par type, par pays, et découvrir avec qui travailler.


  💼 TROUVER DES OPPORTUNITÉS

  Bourses, programmes, appels à projets, appels à communication, postes, financements. Avec la date limite et le lien pour postuler. Et la plateforme peut te signaler celles qui correspondent à ton profil.


  📅 TROUVER DES ÉVÉNEMENTS

  Webinaires, conférences, hackathons. Pour apprendre et pour rencontrer.


  Comment l''utiliser concrètement ? Chaque semaine, prends 20 minutes : consulte les nouvelles opportunités, contacte un chercheur ou une organisation, inscris-toi à un événement. En quelques mois, ton réseau aura complètement changé. 🌍


  Le carrousel détaille chaque rubrique. 👆 Rejoins le réseau gratuitement : lien en commentaire.


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'La valorisation de la recherche repose sur un réseau : partenaires, financeurs, pairs, occasions de visibilité.


    La plateforme HSA réunit :

    • des chercheurs, consultables par domaine, pays et mots-clés, avec des groupes de recherche et des appels à collaboration ;

    • un annuaire d''organisations : universités, centres de recherche, ONG, organisations internationales, entreprises issues de la recherche ;

    • des opportunités : bourses, programmes, appels à projets et à communication, postes, financements, avec correspondance selon le profil ;

    • des événements : webinaires, conférences, hackathons.


    Une routine de vingt minutes par semaine suffit pour en tirer parti.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
