texte: '🎓 Série « Carrière de chercheur »


  Tape ton nom sur Internet. 🔎 Qu''est-ce qui apparaît ? Si c''est rien, ou ton compte Facebook personnel, il est temps de construire ton identité numérique de chercheur.


  Quand un jury, un recruteur ou un journaliste entend parler de toi, il te cherche en ligne. Voici les 4 profils à avoir :


  1️⃣ ORCID

  Un identifiant unique et gratuit pour les chercheurs. Il évite les confusions avec d''autres personnes du même nom, et beaucoup de revues le demandent. Crée-le sur orcid.org.


  2️⃣ GOOGLE SCHOLAR

  Un profil qui rassemble tes publications et leurs citations. Gratuit, il se crée avec un compte Google.


  3️⃣ LINKEDIN

  Pour être trouvé par les organisations, les ONG, les entreprises. Avec une photo professionnelle et un titre clair.


  4️⃣ UN PROFIL DE CHERCHEUR SUR UNE PLATEFORME SPÉCIALISÉE

  Par exemple, un profil sur le Hub Scientifique Africain, gratuit, pour être visible dans l''écosystème scientifique africain.


  💡 La règle d''or : les mêmes informations partout. Même nom, même photo, même affiliation, même titre.


  Le carrousel détaille chaque profil. 👆 Ton défi de la semaine : crée ton ORCID.


  HSA, le Hub Scientifique Africain.


  📈 Valoriser ta recherche et construire ta carrière, c''est le même chemin. Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : profil visible, opportunités, attestation et entraide. Lien en commentaire.'
textes:
  linkedin: 'Les jurys, recruteurs et journalistes consultent généralement la présence en ligne d''un chercheur avant de le contacter.


    Quatre profils constituent une base solide : un identifiant ORCID, gratuit et souvent demandé par les revues ; un profil Google Scholar, qui rassemble publications et citations ; un profil LinkedIn, utile auprès des organisations ; et un profil sur une plateforme scientifique spécialisée, comme le Hub Scientifique Africain.


    La cohérence des informations (nom, affiliation, photo, intitulé) entre ces profils renforce la crédibilité.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
