texte: '🗓️ Série « Prépare 2027 »


  Commence 2027 avec un dossier qui montre ce que tu sais faire.


  Un CV dit ce que tu as étudié. Un portfolio montre ce que tu sais faire. 📁 Et quand tu veux valoriser ta recherche, c''est le portfolio qui convainc.


  Un portfolio de chercheur, c''est un dossier (en ligne ou en PDF) qui rassemble les preuves concrètes de ton travail. Voici ce que tu peux y mettre :


  📚 TES TRAVAUX : mémoire, thèse, articles, communications, avec un résumé grand public pour chacun.

  📊 TES PRODUCTIONS : infographies, fiches pratiques, notes de synthèse, guides, outils.

  🎤 TES INTERVENTIONS : conférences, ateliers, interviews radio, vidéos, posts qui ont marché.

  🤝 TES COLLABORATIONS : missions, stages, partenariats, avec ce que tu as apporté.

  🏆 TES DISTINCTIONS : prix, bourses, sélections.

  💬 LES RETOURS : un mail de remerciement d''une organisation, une attestation de mission (avec leur accord pour les partager).


  Pour chaque élément, 3 lignes : le contexte, ce que tu as fait, le résultat.


  Pas grand-chose pour l''instant ? C''est normal. Commence avec ce que tu as, et ajoute chaque nouvelle production. Dans un an, tu seras surpris de tout ce que tu as accumulé.


  Le carrousel te montre comment l''organiser. 👆 Enregistre-le et crée ton dossier aujourd''hui.


  On est HSA, le Hub Scientifique Africain.


  📅 Prépare 2027 avec le Pass Valorisation HSA : le programme certifiant, le guide des 10 façons de gagner de l''argent avec ta recherche, les opportunités chaque semaine et le groupe d''entraide. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'Le CV présente un parcours ; le portfolio en apporte les preuves. Pour un chercheur qui souhaite valoriser ses travaux, il constitue un outil de conviction déterminant.


    Contenu possible d''un portfolio de chercheur :

    • travaux scientifiques, chacun accompagné d''un résumé accessible ;

    • productions dérivées : infographies, fiches pratiques, notes de synthèse, guides ;

    • interventions : conférences, ateliers, entretiens, vidéos ;

    • collaborations : missions, stages, partenariats, et contribution apportée ;

    • distinctions : prix, bourses, sélections ;

    • retours de partenaires, avec leur accord.


    Chaque élément gagne à être présenté en trois lignes : contexte, contribution, résultat.


    Le portfolio se construit progressivement ; l''essentiel est de le commencer et de l''alimenter à chaque nouvelle réalisation.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    #ValorisationDeLaRecherche #Portfolio #JeunesChercheurs'
