texte: 'Tu nous découvres ce mois-ci ? 👋🏾 Bienvenue ! Voici le Hub Scientifique Africain (HSA) en 5 points.


  1️⃣ QUI ON EST

  Une plateforme dédiée à la recherche africaine et à sa valorisation.


  2️⃣ POURQUOI ON EXISTE

  Parce que trop de chercheurs africains brillants restent invisibles. Leurs travaux dorment dans les tiroirs, et leurs carrières avancent moins vite qu''elles le pourraient.


  3️⃣ NOTRE CONVICTION

  Valoriser sa recherche et construire sa carrière, c''est le même chemin. Ce qui fait connaître tes travaux renforce aussi ton dossier.


  4️⃣ POUR QUI

  Les masterants, les doctorants, les jeunes chercheurs, de toutes les disciplines. Et les organisations qui cherchent des experts.


  5️⃣ CE QU''ON PROPOSE

  • Gratuitement : un profil de chercheur, la Boussole de valorisation (un diagnostic en 5 minutes), l''accès aux opportunités et aux événements de la plateforme, et des webinaires.

  • Le Pass Valorisation, à 2 000 FCFA pour toute l''année, pour aller plus loin avec une méthode certifiante et un accompagnement.


  Le carrousel résume tout ça. 👆 Et dis bonjour en commentaire, avec ta discipline et ton pays ! 🌍


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Présentation du Hub Scientifique Africain (HSA) en cinq points :


    1. Une plateforme dédiée à la recherche africaine et à sa valorisation.

    2. Une raison d''être : de nombreux chercheurs africains restent peu visibles, ce qui freine la diffusion de leurs travaux et leur progression professionnelle.

    3. Une conviction : valoriser sa recherche et construire sa carrière relèvent d''une même démarche.

    4. Des publics : masterants, doctorants, jeunes chercheurs, et organisations à la recherche d''expertise.

    5. Une offre : des services gratuits (profil de chercheur, Boussole de valorisation, opportunités, événements, webinaires) et le Pass Valorisation, à 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
