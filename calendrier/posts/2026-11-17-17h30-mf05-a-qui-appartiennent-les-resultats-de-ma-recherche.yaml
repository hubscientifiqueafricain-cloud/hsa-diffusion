texte: "Avant de valoriser ta recherche, une question à régler : à qui appartiennent tes résultats ? La réponse est souvent : ça dépend.\n\nDans cette micro-formation :\n▶ Ça dépend de 3 choses\n   • Ton statut\n   • Tes contrats\n   • Le règlement de ton institution\n▶ Les repères généraux\n   • Ton texte : droit d'auteur\n   • Invention : souvent à l'employeur\n   • Les données d'un projet : vérifie\n▶ Le bon réflexe\n   • Lis tes textes, demande\n\nÀ retenir : Ces règles varient selon les pays et les institutions. Clarifie la propriété avant de valoriser : tu éviteras bien des conflits.\n\n\U0001F4AC Tu as une question sur la valorisation de ta recherche ? Pose-la en commentaire : on y répondra dans une prochaine vidéo.\n\U0001F514 Abonne-toi pour ne rien manquer de la série « Valoriser ta recherche · 1 question, 2 minutes ».\n\n\U0001F310 HSA, le Hub Scientifique Africain : https://www.hubscientifiqueafricain.com\n\n#ValorisationDeLaRecherche #Doctorat #RechercheAfricaine"
question_youtube:
- Qui détient la propriété intellectuelle sur les innovations ?
- Le droit de la propriété intellectuelle est-il adapté à la recherche scientifique ?
- 'Recherche scientifique : la propriété intellectuelle expliquée aux enseignants'
