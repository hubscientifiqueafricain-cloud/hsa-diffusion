texte: '🎓 Série « Carrière de chercheur »


  « Je n''aime pas me mettre en avant. » « Mon travail parlera pour moi. » 🤐 Tu as déjà pensé ça ? Beaucoup de chercheurs brillants le pensent. Et beaucoup restent invisibles.


  Mais voilà la vérité : un travail que personne ne connaît ne peut parler pour personne.


  Être visible, ce n''est pas se vanter. C''est :

  🔹 permettre à ceux qui ont besoin de ton expertise de te trouver ;

  🔹 permettre à ta recherche d''être utilisée ;

  🔹 permettre à un jury, un recruteur ou un bailleur de voir ce que tu fais vraiment ;

  🔹 montrer aux plus jeunes qu''on peut faire de la science ici, chez nous.


  Quand tu présentes tes travaux dans un colloque, tu ne parles pas de toi. Tu parles d''un problème et de ce que tu as trouvé pour le résoudre.


  Quand tu écris un article grand public, tu ne te mets pas en avant. Tu rends la science accessible à ceux qui la financent : les citoyens.


  L''humilité, c''est une qualité. L''invisibilité, c''est un risque pour ta carrière.


  Regarde la vidéo, et partage-la à un chercheur trop discret. 🎬


  HSA, le Hub Scientifique Africain.


  📈 Valoriser ta recherche et construire ta carrière, c''est le même chemin. Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : profil visible, opportunités, attestation et entraide. Lien en commentaire.'
textes:
  linkedin: 'De nombreux chercheurs hésitent à promouvoir leurs travaux, par crainte de paraître prétentieux.


    Pourtant, la visibilité scientifique ne relève pas de la vanité. Elle permet aux organisations de trouver l''expertise dont elles ont besoin, aux résultats d''être utilisés, aux évaluateurs d''apprécier un parcours, et aux plus jeunes de trouver des modèles.


    Présenter ses travaux, c''est parler d''un problème et des réponses apportées, non de soi. L''humilité reste une qualité ; l''invisibilité constitue en revanche un risque professionnel.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
