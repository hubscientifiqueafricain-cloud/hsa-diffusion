texte: '🗓️ Série « Prépare 2027 »


  Avant 2027, une histoire qui montre qu''on peut valoriser sans créer de produit.


  Certaines recherches ne créent pas de produit. Elles changent la façon dont un peuple se voit. 📜 C''est le cas de celle de Cheikh Anta Diop.


  Né au Sénégal en 1923, il étudie à Paris la physique, la chimie, l''histoire, l''égyptologie, la linguistique. Sa recherche défend une idée qui dérange à l''époque : l''Afrique a une histoire ancienne riche, et elle doit être étudiée par des Africains, avec les méthodes de la science.


  Son parcours n''a rien de facile. Sa thèse fait débat. Il obtient finalement son doctorat en 1960. Ses idées sont discutées, contestées, défendues, encore aujourd''hui.


  Mais regarde ce qu''il fait de sa recherche :

  📚 Il écrit des livres lus bien au-delà des universités, comme « Nations nègres et culture ».

  🔬 De retour à Dakar, il crée en 1966 un laboratoire de datation au carbone 14 à l''IFAN, l''un des premiers du genre en Afrique.

  🎓 Il forme des générations de chercheurs.

  🗣️ Il s''engage dans le débat public.


  En 1987, après sa mort, l''université de Dakar prend son nom : Université Cheikh Anta Diop.


  Ce qu''on retient : valoriser, c''est aussi partager ses idées avec le plus grand nombre, construire des outils de recherche chez soi, et former ceux qui viendront après.


  Le carrousel raconte son parcours. 👆 Et toi, quel chercheur africain t''inspire ? Dis-le en commentaire. 👇


  On est HSA, le Hub Scientifique Africain.


  📅 Prépare 2027 avec le Pass Valorisation HSA : le programme certifiant, le guide des 10 façons de gagner de l''argent avec ta recherche, les opportunités chaque semaine et le groupe d''entraide. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'Certaines recherches se valorisent moins par des produits que par leur influence sur les idées.


    Cheikh Anta Diop (1923-1986), chercheur sénégalais formé à Paris en physique, en chimie, en histoire et en linguistique, a consacré ses travaux à l''histoire ancienne de l''Afrique et à la nécessité de l''étudier avec les méthodes scientifiques, depuis le continent. Ses thèses ont suscité, et suscitent encore, d''importants débats.


    Son œuvre a largement dépassé le cadre universitaire : ouvrages destinés à un large public, dont « Nations nègres et culture » ; création en 1966 d''un laboratoire de datation au carbone 14 à l''IFAN de Dakar ; formation de chercheurs ; engagement dans le débat public. L''université de Dakar porte son nom depuis 1987.


    Ce parcours illustre plusieurs dimensions de la valorisation : diffusion des idées, construction d''infrastructures de recherche et transmission.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · #RechercheAfricaine #HistoireAfricaine'
