texte: "« Je fais de la sociologie, du droit ou de l'histoire. Mon sujet ne se valorise pas. » C'est faux, et voici pourquoi.\n\nDans cette micro-formation :\n▶ Les SHS produisent de l'utile\n   • Comprendre les gens\n   • = ce que cherchent les décideurs\n▶ Ce que tu peux proposer\n   • Études et diagnostics\n   • Formations\n   • Évaluations de projets\n   • Contenus grand public\n\nÀ retenir : En SHS, on valorise moins des brevets que des méthodes, des analyses et des compétences. Et c'est très demandé.\n\n\U0001F4AC Tu as une question sur la valorisation de ta recherche ? Pose-la en commentaire : on y répondra dans une prochaine vidéo.\n\U0001F514 Abonne-toi pour ne rien manquer de la série « Valoriser ta recherche · 1 question, 2 minutes ».\n\n\U0001F310 HSA, le Hub Scientifique Africain : https://www.hubscientifiqueafricain.com\n\n#ValorisationDeLaRecherche #Doctorat #RechercheAfricaine"
