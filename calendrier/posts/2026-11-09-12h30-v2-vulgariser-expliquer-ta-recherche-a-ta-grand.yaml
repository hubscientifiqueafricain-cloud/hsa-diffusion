texte: 'Si ta grand-mère te demande « Tu cherches quoi, exactement ? », tu lui réponds quoi ? 👵🏾

  Si ta réponse commence par « Alors, en fait, c''est une analyse multivariée des déterminants… », on a du travail. 😄


  Vulgariser, c''est expliquer ta recherche avec des mots simples, pour que n''importe qui comprenne. C''est la première porte de la valorisation : personne n''utilise ce qu''il ne comprend pas.


  Voici la méthode en 5 étapes :


  1️⃣ PARS DU PROBLÈME, pas du titre. « Dans nos villages, beaucoup de récoltes pourrissent avant d''être vendues. »

  2️⃣ DIS CE QUE TU AS FAIT, en une phrase. « J''ai testé trois façons de sécher les mangues. »

  3️⃣ DIS CE QUE TU AS TROUVÉ. « Le séchoir solaire en bois garde les mangues deux fois plus longtemps. »

  4️⃣ DIS POURQUOI ÇA COMPTE. « Les femmes qui transforment les mangues pourraient vendre toute l''année. »

  5️⃣ REMPLACE CHAQUE MOT TECHNIQUE par un mot de tous les jours, ou par une comparaison.


  Le test final : relis ta phrase à voix haute à quelqu''un qui n''est pas de ton domaine. S''il peut la répéter avec ses mots, c''est gagné. ✅


  Dans le carrousel, tu as un avant / après complet. 👆


  À toi : écris ta recherche en 2 ou 3 phrases simples en commentaire. Je lis et je réagis. 👇


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Vulgariser consiste à rendre sa recherche compréhensible par un public non spécialiste. C''est la première étape de la valorisation : on n''utilise pas ce que l''on ne comprend pas.


    Une méthode en cinq étapes :

    1. Partir du problème concret, et non du titre de la thèse.

    2. Décrire ce qui a été fait, en une phrase.

    3. Énoncer le principal résultat.

    4. Expliquer pourquoi il compte, et pour qui.

    5. Remplacer chaque terme technique par un mot courant ou une comparaison.


    Le test : faire lire le texte à une personne extérieure au domaine. Si elle peut le reformuler, l''objectif est atteint.


    Le carrousel présente un exemple avant / après. Comment résumeriez-vous vos travaux en trois phrases ?


    Hub Scientifique Africain (HSA)

    #Vulgarisation #CommunicationScientifique #Recherche'
