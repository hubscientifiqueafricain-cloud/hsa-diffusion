texte: 'Dernier jour de l''année ! 🎆 Pour que 2027 commence bien, voici ta première semaine de valorisation, jour par jour. 15 à 20 minutes par jour, pas plus.


  📅 VENDREDI 1ER JANVIER : repose-toi. 😄 Et écris sur un papier ta résolution : « En 2027, ma recherche va servir à quelqu''un. »


  📅 SAMEDI 2 : fais ta Boussole de valorisation (gratuite, 5 minutes) pour savoir où tu en es.


  📅 DIMANCHE 3 : crée ou complète ton profil de chercheur sur HSA, et ton profil LinkedIn.


  📅 LUNDI 4 : écris ton pitch de 30 secondes, et dis-le à voix haute trois fois.


  📅 MARDI 5 : écris ton résumé grand public en 5 phrases.


  📅 MERCREDI 6 : fais ta carte des utilisateurs, avec au moins 5 noms réels.


  📅 JEUDI 7 : choisis ta voie principale et ton objectif pour les 90 prochains jours.


  En 7 jours, tu as posé toutes les bases. Et si tu veux être accompagné pour la suite, le Pass Valorisation te donne la méthode complète, les opportunités chaque semaine et un groupe pour avancer avec d''autres, pour 2 000 FCFA toute l''année.


  La vidéo te donne le programme de la semaine. 🎬 Enregistre-la et commence demain. Lien pour le Pass en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Proposition de première semaine de valorisation pour janvier 2027, à raison de quinze à vingt minutes par jour :


    • 1er janvier : formuler une résolution pour sa recherche.

    • 2 janvier : réaliser la Boussole de valorisation (gratuite).

    • 3 janvier : compléter son profil de chercheur HSA et son profil LinkedIn.

    • 4 janvier : rédiger une présentation de trente secondes.

    • 5 janvier : rédiger un résumé accessible en cinq phrases.

    • 6 janvier : établir la carte des utilisateurs, avec au moins cinq noms.

    • 7 janvier : choisir une voie principale et un objectif à quatre-vingt-dix jours.


    Pour poursuivre avec un accompagnement, le Pass Valorisation (2 000 FCFA par an) réunit la méthode complète, la veille des opportunités et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
