texte: '💰 Série « Gagner de l''argent avec ta recherche »


  Un client te demande : « Vous avez des exemples de travaux ? » 🤔 Tu ne veux pas envoyer ton mémoire entier, et certaines données sont confidentielles. Comment faire ?


  Voici comment préparer des exemples, sans rien dévoiler de sensible :


  1️⃣ CHOISIS 2 OU 3 EXTRAITS

  Une carte, un tableau d''analyse, un graphique, une page de rapport, un questionnaire. Ce qui montre le mieux ton savoir-faire.


  2️⃣ ANONYMISE

  Retire les noms de personnes, de villages si nécessaire, et toute information qui permettrait d''identifier quelqu''un.


  3️⃣ AJOUTE UNE LIGNE D''EXPLICATION

  « Analyse de l''effet du prix sur les ventes, sur 200 commerçants, réalisée avec Stata. »


  4️⃣ METS-LES EN FORME

  Une page par exemple, propre, avec un titre. Un PDF de 3 pages suffit.


  5️⃣ DEMANDE L''ACCORD SI NÉCESSAIRE

  Si tes données appartiennent à un projet ou à ton laboratoire, demande l''autorisation avant de les montrer.


  💡 Tu peux aussi refaire un exemple avec des données publiques ou fictives, clairement présentées comme telles. C''est une bonne façon de montrer une compétence sans risque.


  Le carrousel détaille la méthode. 👆 Prépare tes 2 exemples cette semaine.


  HSA, le Hub Scientifique Africain.


  🎯 Pour passer de l''idée au premier revenu sans avancer seul : le Pass Valorisation HSA te donne la méthode (avec attestation), les financements chaque semaine, un profil visible et un groupe d''entraide. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'Présenter des exemples de travaux à un client potentiel est souvent nécessaire, sans pour autant diffuser l''intégralité d''un mémoire ou des données confidentielles.


    Une méthode simple : sélectionner deux ou trois extraits représentatifs, les anonymiser, les accompagner d''une ligne d''explication, les mettre en forme dans un court document, et obtenir les autorisations requises lorsque les données appartiennent à un projet ou à un laboratoire. Des exemples construits à partir de données publiques ou fictives, clairement signalées, constituent une alternative.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
