texte: '🎓 Série « Carrière de chercheur »


  Il y a des phrases qu''on se répète, sans s''en rendre compte, et qui nous gardent dans l''ombre. 🌑 Voici les 5 plus fréquentes chez les chercheurs, et ce qu''on peut leur répondre.


  1️⃣ « Mon sujet n''intéresse personne. »

  Chaque sujet intéresse quelqu''un. Il faut juste trouver qui, et le dire avec ses mots.


  2️⃣ « Les autres sont meilleurs que moi. »

  Peut-être sur certains points. Mais personne n''a ton terrain, tes données, ton regard.


  3️⃣ « Je n''ai pas le temps. »

  Une action par mois suffit. Une heure, pas une semaine.


  4️⃣ « On va me critiquer. »

  Oui, parfois. C''est comme ça qu''on progresse. Une critique sur ton travail n''est pas une critique sur ta personne.


  5️⃣ « Ce n''est pas la culture chez nous. »

  Les choses changent. Et les chercheurs qui osent aujourd''hui ouvrent la voie à ceux de demain.


  Le carrousel reprend les 5 phrases et leurs réponses. 👆 Et toi, laquelle tu te dis le plus souvent ? Dis-le en commentaire, sans honte. 👇


  HSA, le Hub Scientifique Africain.


  🎯 Pour construire ta carrière sans avancer seul : le Pass Valorisation HSA te donne une méthode certifiante (avec attestation pour ton CV), les opportunités chaque semaine et un groupe d''entraide. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'Certaines croyances freinent la visibilité des chercheurs : « Mon sujet n''intéresse personne », « D''autres sont meilleurs », « Je n''ai pas le temps », « On va me critiquer », « Ce n''est pas dans notre culture ».


    Chacune peut être nuancée : tout sujet intéresse un public, chaque chercheur dispose d''un terrain et d''un regard propres, une action mensuelle demande peu de temps, la critique fait progresser, et les pratiques évoluent grâce à ceux qui s''engagent.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
