texte: '🎓 Série « Carrière de chercheur »


  Ton CV de chercheur n''est pas un CV comme les autres. 📄 Il doit montrer tout ton parcours scientifique, de façon claire et vérifiable. Voici les rubriques qui comptent :


  1️⃣ IDENTITÉ ET CONTACTS

  Avec ton identifiant ORCID et le lien vers ton profil de chercheur.


  2️⃣ FORMATION

  Diplômes, établissements, années. Pour la thèse : le titre, l''encadreur, la date (ou la date prévue).


  3️⃣ PUBLICATIONS

  Séparées par type : articles dans des revues à comité de lecture, chapitres d''ouvrage, actes de colloque. Toujours au même format de citation.


  4️⃣ COMMUNICATIONS

  Orales et posters, avec le nom du colloque, le lieu et la date.


  5️⃣ ENSEIGNEMENT ET ENCADREMENT

  Cours, TD, travaux pratiques, mémoires encadrés ou co-encadrés.


  6️⃣ PROJETS, BOURSES ET PRIX

  Même les petits financements comptent.


  7️⃣ DIFFUSION DE LA CULTURE SCIENTIFIQUE

  Articles grand public, interventions radio, conférences publiques.


  8️⃣ FORMATIONS ET CERTIFICATIONS

  Les formations complémentaires que tu as suivies, avec leurs attestations.


  9️⃣ RESPONSABILITÉS ET ENGAGEMENT

  Comité d''organisation, association de doctorants, relecture d''articles.


  💡 Mets ton CV à jour à chaque nouvelle ligne, pas une fois par an.


  Le carrousel reprend la checklist. 👆


  HSA, le Hub Scientifique Africain.


  🤝 Avec le Pass Valorisation HSA, fais d''une pierre deux coups : ta recherche gagne en visibilité, ton dossier de carrière se remplit. 2 000 FCFA pour l''année. Lien en commentaire.'
textes:
  linkedin: 'Le CV académique présente l''ensemble du parcours scientifique de manière structurée et vérifiable.


    Les rubriques généralement attendues : identité et identifiants (dont ORCID), formation, publications classées par type, communications, enseignement et encadrement, projets, bourses et prix, diffusion de la culture scientifique, formations et certifications, responsabilités collectives.


    Une mise à jour régulière, à chaque nouvel élément, évite les oublis et facilite les candidatures.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
