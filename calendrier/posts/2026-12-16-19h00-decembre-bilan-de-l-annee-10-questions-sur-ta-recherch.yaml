texte: '🗓️ Série « Prépare 2027 »


  Pour bien préparer 2027, commence par regarder 2026.


  L''année se termine. 🎄 Avant de faire tes résolutions pour 2027, prends 30 minutes pour faire le bilan de ta recherche. Pas le bilan de ton jury : le tien.


  Voici 10 questions. Prends un carnet et réponds honnêtement.


  📍 CE QUE TU AS FAIT

  1. Qu''est-ce que j''ai produit cette année (chapitres, articles, données, présentations) ?

  2. De quoi suis-je le plus fier ?

  3. Qu''est-ce que j''ai appris de nouveau, en dehors de mon sujet ?


  🌍 CE QUE TA RECHERCHE A DONNÉ

  4. Qui, en dehors de mon jury ou de mon encadreur, connaît mon travail ?

  5. Ma recherche a-t-elle servi à quelqu''un, même un peu ?

  6. Qui m''a contacté ou proposé quelque chose grâce à ma recherche ?


  🚧 CE QUI T''A FREINÉ

  7. Qu''est-ce que je voulais faire et que je n''ai pas fait ? Pourquoi ?

  8. De quoi ai-je eu peur ?


  🚀 CE QUE TU VEUX POUR 2027

  9. Quelle est LA chose qui changerait tout pour ma recherche l''an prochain ?

  10. Quelle est la première action, toute petite, que je peux faire dès janvier ?


  Garde tes réponses. Relis-les en juin.


  Le carrousel te donne les 10 questions. 👆 Et si tu veux, partage ta réponse à la question 10 en commentaire : on t''encourage. 💪🏾


  On est HSA, le Hub Scientifique Africain.


  🎯 Pour tenir tes objectifs 2027, ne reste pas seul : le Pass Valorisation HSA te donne la méthode (programme certifiant), les opportunités chaque semaine et un groupe pour avancer. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'La fin d''année est un moment propice pour dresser le bilan de son activité de recherche, au-delà des évaluations formelles. Dix questions pour structurer cet exercice :


    Réalisations : 1. Qu''ai-je produit cette année ? 2. De quoi suis-je le plus satisfait ? 3. Qu''ai-je appris en dehors de mon sujet ?


    Portée : 4. Qui, hors de mon jury et de mon encadrement, connaît mon travail ? 5. A-t-il servi à quelqu''un ? 6. Quelles sollicitations ai-je reçues ?


    Freins : 7. Quels projets n''ai-je pas menés, et pourquoi ? 8. Quelles appréhensions m''ont retenu ?


    Perspectives : 9. Quelle avancée serait décisive l''an prochain ? 10. Quelle première action puis-je engager dès janvier ?


    Conserver ces réponses permet d''en mesurer l''évolution au cours de l''année suivante.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    #ValorisationDeLaRecherche #Bilan #JeunesChercheurs'
