texte: '💰 Série « Gagner de l''argent avec ta recherche »


  Ton client t''a payé. 🎉 Il te demande une facture, ou un reçu. Ne panique pas : voici ce qu''il doit contenir.


  🧾 LA FACTURE (avant ou au moment du paiement)

  • Le mot « Facture » et un numéro (001, 002…).

  • La date.

  • Tes nom, adresse et contacts. Si tu as un statut d''entreprise, ton numéro d''identification.

  • Le nom et l''adresse du client.

  • La description de la prestation.

  • Le montant, et le total à payer.

  • Les modalités de paiement : mobile money, virement, et le numéro ou les coordonnées.


  🧾 LE REÇU (après le paiement)

  • Le mot « Reçu » et un numéro.

  • La date du paiement.

  • Le nom de celui qui a payé.

  • Le montant reçu et le mode de paiement.

  • L''objet du paiement.

  • Ta signature.


  💡 Garde une copie de chaque facture et de chaque reçu, dans un dossier et sur ton téléphone. C''est utile pour ta propre organisation, et pour le jour où tu formaliseras ton activité.


  ⚠️ Les obligations varient selon les pays et selon ton statut. Renseigne-toi auprès des services compétents de ton pays.


  Le carrousel contient les deux modèles. 👆


  HSA, le Hub Scientifique Africain.


  🎯 Pour passer de l''idée au premier revenu sans avancer seul : le Pass Valorisation HSA te donne la méthode (avec attestation), les financements chaque semaine, un profil visible et un groupe d''entraide. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'La facture et le reçu sont des documents essentiels dès les premières prestations.


    La facture comporte un numéro, une date, l''identité du prestataire (et son identifiant s''il dispose d''un statut d''entreprise), celle du client, la description de la prestation, le montant et les modalités de paiement. Le reçu atteste un paiement effectué : numéro, date, payeur, montant, mode de paiement, objet et signature.


    La conservation de ces documents facilite la gestion et la formalisation ultérieure de l''activité. Les obligations varient selon les pays et les statuts.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
