texte: 'La recherche, c''est souvent un parcours solitaire. 😔 Tu bloques sur une question, et tu n''as personne à qui la poser. Tu as une idée de valorisation, et personne pour te dire si elle tient la route. Tu doutes, et tu penses être le seul.


  Avec le Pass Valorisation HSA, tu n''es plus seul.


  🤝 LE GROUPE D''ENTRAIDE DES MEMBRES

  Un espace où les membres du Pass échangent entre eux : masterants, doctorants et jeunes chercheurs de plusieurs pays et de toutes les disciplines.

  ✅ Tu poses tes questions, et d''autres qui sont passés par là te répondent.

  ✅ Tu partages tes avancées : ton premier post, ton premier contact, ta première mission.

  ✅ Tu trouves des partenaires, des co-auteurs, des idées.

  ✅ Tu restes motivé, parce que tu vois les autres avancer.


  🎙️ LES LIVES MENSUELS

  Chaque mois, un rendez-vous en direct avec l''équipe HSA pour approfondir un sujet de valorisation et répondre à vos questions.


  Avant : seul devant ton mémoire, avec tes doutes.

  Après : une communauté qui avance avec toi, et un rendez-vous chaque mois pour garder le cap.


  Tout ça est inclus dans le Pass Valorisation, avec le programme certifiant, le guide, les opportunités chaque semaine et ton profil visible. 2 000 FCFA pour toute l''année.


  Regarde la vidéo. Commente PASS et on t''envoie le lien pour nous rejoindre. 👇


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le parcours de recherche est souvent solitaire : questions sans interlocuteur, idées sans retour, doutes sans partage.


    Le Pass Valorisation HSA donne accès à un groupe d''entraide réunissant masterants, doctorants et jeunes chercheurs de plusieurs pays et disciplines, pour échanger des conseils, partager ses avancées, trouver des partenaires et rester motivé.


    Il comprend également des sessions mensuelles en direct avec l''équipe HSA, consacrées à un thème de valorisation et aux questions des membres.


    Le Pass inclut aussi le programme certifiant, le guide des dix voies de revenus, la veille hebdomadaire des opportunités et un profil visible. Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
