texte: '🎓 Série « Carrière de chercheur »


  Trois minutes pour présenter des années de recherche. ⏱️ C''est le principe de concours comme « Ma thèse en 180 secondes », où des doctorants présentent leur sujet à un public non spécialiste. Même sans concours, c''est un exercice précieux : tu en auras besoin en entretien, à la radio, devant un bailleur ou lors d''un événement.


  Voici une structure en 4 temps :


  1️⃣ L''ACCROCHE (20 secondes)

  Une image, une situation, une question qui touche tout le monde.


  2️⃣ LE PROBLÈME (40 secondes)

  Pourquoi c''est important, pour qui.


  3️⃣ CE QUE TU FAIS (1 minute 20)

  Ta démarche, avec des mots simples et une comparaison parlante.


  4️⃣ CE QUE ÇA CHANGE (40 secondes)

  Ton résultat ou ton ambition, et l''image finale qu''on retiendra.


  💡 Les règles d''or :

  • Zéro jargon.

  • Une seule idée principale.

  • Une comparaison avec la vie de tous les jours.

  • Une fin qui revient à l''accroche du début.


  Le carrousel détaille la structure. 👆 Et pour t''entraîner, écris en commentaire la première phrase de ta présentation de 3 minutes. On lit tout !


  HSA, le Hub Scientifique Africain.


  📈 Valoriser ta recherche et construire ta carrière, c''est le même chemin. Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : profil visible, opportunités, attestation et entraide. Lien en commentaire.'
textes:
  linkedin: 'Présenter sa thèse en trois minutes à un public non spécialiste est un exercice popularisé par des concours tels que « Ma thèse en 180 secondes ». Il prépare à de nombreuses situations professionnelles : entretien, média, rencontre avec un financeur, événement public.


    Une structure en quatre temps est efficace : une accroche (environ 20 secondes), le problème (40 secondes), la démarche (1 minute 20) et l''apport (40 secondes).


    Les principes clés : absence de jargon, une idée principale, une comparaison accessible, et une conclusion qui fait écho à l''accroche.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
