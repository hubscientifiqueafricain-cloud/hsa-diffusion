texte: '💰 Série « Gagner de l''argent avec ta recherche »


  Ton questionnaire, ton protocole, ton indicateur, ta base de données ou ton petit logiciel pourrait servir à d''autres. 🧰 C''est la façon n°7 de gagner de l''argent avec ta recherche : céder ou partager une méthode ou un outil.


  🎯 POUR TOI SI…

  Tu as créé quelque chose de réutilisable pendant ta recherche.


  💡 PAR EXEMPLE

  Une équipe qui a mis au point un outil d''évaluation des sols pourrait le mettre à disposition d''un bureau d''études, en échange d''une rémunération et d''une mention dans ses rapports.


  🛠️ LES FORMES POSSIBLES

  • Une licence : tu autorises une organisation à utiliser ton outil, contre paiement.

  • Un partenariat : tu adaptes l''outil pour elle et tu forme ses équipes.

  • Une prestation : tu utilises toi-même l''outil pour elle.


  ⚠️ AVANT TOUT, PROTÈGE ET CLARIFIE

  1. Qui est propriétaire ? Toi, ton université, ton laboratoire, le projet qui a financé la recherche ? Vérifie avant de proposer quoi que ce soit.

  2. Comment protéger ? Selon les cas : droit d''auteur, dépôt auprès de l''OAPI (l''Organisation africaine de la propriété intellectuelle) pour une invention, ou un simple contrat.

  3. Ne publie pas tout ton outil en ligne avant d''avoir réfléchi à ces questions.


  La vidéo résume l''essentiel. 🎬 Ton premier pas : fais la liste de tes outils réutilisables.


  HSA, le Hub Scientifique Africain.


  📘 Tu veux les 10 façons dans un seul document ? Le guide HSA est gratuit. Et pour avancer toute l''année, il y a le Pass Valorisation à 2 000 FCFA. Liens en commentaire.'
textes:
  linkedin: 'Les outils créés au cours d''une recherche (questionnaires, protocoles, indicateurs, bases de données, logiciels) peuvent être valorisés par licence, partenariat ou prestation.


    Deux préalables sont essentiels : clarifier la propriété (chercheur, université, laboratoire, financeur) et choisir le mode de protection adapté (droit d''auteur, dépôt auprès de l''OAPI pour une invention, contrat). Une diffusion intégrale avant cette réflexion est à éviter.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
