texte: '🗓️ Série « Prépare 2027 »


  Ta résolution 2027 : parler de ta recherche une fois par semaine. Voici de quoi tenir.


  « Je voudrais parler de ma recherche sur les réseaux, mais je ne sais pas quoi poster. » 🤷🏾‍♀️

  Voici 5 idées de posts, faciles à faire, même si tu n''as jamais publié de ta vie.


  1️⃣ LE CHIFFRE QUI SURPREND

  Un résultat de ta recherche, en une phrase, avec ce qu''il veut dire. « 6 vendeuses sur 10 que j''ai interrogées n''ont jamais eu accès à un crédit. Voici pourquoi. »


  2️⃣ LA QUESTION QU''ON TE POSE

  « On me demande souvent à quoi sert ma thèse. Voici ma réponse. » Les gens adorent les coulisses.


  3️⃣ L''IDÉE REÇUE

  « On pense que… En réalité, ma recherche montre que… »


  4️⃣ LE TERRAIN

  Une photo de ton terrain, de ton labo, de tes carnets (avec l''accord des personnes photographiées), et ce que tu as appris ce jour-là.


  5️⃣ LA LECTURE

  Un article ou un livre de ton domaine qui t''a marqué, résumé en 3 points, et ce que tu en penses.


  Une règle d''or : chaque post se termine par une question ou une utilité. « Et chez vous, c''est pareil ? » ou « Ce résultat peut aider les… ».


  Pas besoin de publier tous les jours. Un post par semaine, pendant trois mois, et tu deviens « la personne qui connaît ce sujet ».


  Le carrousel détaille chaque idée avec un exemple. 👆 Choisis-en une et publie cette semaine !


  On est HSA, le Hub Scientifique Africain.


  🎯 Pour tenir tes objectifs 2027, ne reste pas seul : le Pass Valorisation HSA te donne la méthode (programme certifiant), les opportunités chaque semaine et un groupe pour avancer. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'La communication régulière sur les réseaux professionnels contribue à la visibilité d''un chercheur et de ses travaux. Le manque d''idées est souvent l''obstacle principal.


    Cinq formats simples :

    1. Le chiffre marquant : un résultat, accompagné de sa signification.

    2. La question récurrente : la réponse à une question souvent posée sur la recherche.

    3. L''idée reçue : ce que la recherche confirme ou contredit.

    4. Le terrain : une scène, une image (avec l''accord des personnes), un enseignement.

    5. La lecture : un ouvrage ou un article du domaine, résumé et commenté.


    Chaque publication gagne à se conclure par une question au lecteur ou par l''utilité concrète du résultat.


    Une publication hebdomadaire pendant trois mois suffit pour être identifié comme une référence sur un sujet.


    Pour structurer cette démarche en 2027, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités et un groupe d''entraide.


    #ValorisationDeLaRecherche #CommunicationScientifique #LinkedIn'
