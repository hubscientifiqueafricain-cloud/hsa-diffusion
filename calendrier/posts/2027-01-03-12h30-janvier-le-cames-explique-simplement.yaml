texte: '🎓 Série « Carrière de chercheur »


  Si tu veux faire carrière comme enseignant-chercheur en Côte d''Ivoire ou dans un autre pays d''Afrique francophone, tu vas entendre parler du CAMES. Très souvent. 📚 Voici l''essentiel, simplement.


  🏛️ C''EST QUOI ?

  Le CAMES, c''est le Conseil Africain et Malgache pour l''Enseignement Supérieur. Une institution créée en 1968, qui regroupe plusieurs pays africains, dont la Côte d''Ivoire.


  🎯 À QUOI IL SERT POUR TA CARRIÈRE ?

  Entre autres, il évalue les enseignants-chercheurs pour leur inscription sur des listes d''aptitude aux grades universitaires : maître-assistant, maître de conférences, professeur titulaire. Certaines disciplines passent aussi par des concours d''agrégation.


  📂 SUR QUOI TU ES ÉVALUÉ ?

  Sur un dossier. Il comporte notamment tes travaux scientifiques (publications, communications), tes activités d''enseignement et ton parcours.


  💡 CE QUE ÇA CHANGE POUR TOI, DÈS MAINTENANT

  Chaque article publié, chaque communication présentée compte. Et il faut garder des preuves : tirés à part, attestations, programmes de colloques.


  ⚠️ Les critères précis dépendent de ta spécialité et évoluent. Consulte toujours les textes officiels du CAMES et demande conseil à tes aînés.


  Le carrousel résume tout ça. 👆 Partage-le à un doctorant qui vise l''enseignement supérieur.


  HSA, le Hub Scientifique Africain.


  🎯 Pour construire ta carrière sans avancer seul : le Pass Valorisation HSA te donne une méthode certifiante (avec attestation pour ton CV), les opportunités chaque semaine et un groupe d''entraide. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'Pour les doctorants qui envisagent une carrière d''enseignant-chercheur en Afrique francophone, le CAMES (Conseil Africain et Malgache pour l''Enseignement Supérieur) est un acteur central.


    Créé en 1968, il regroupe plusieurs États africains, dont la Côte d''Ivoire. Il évalue notamment les enseignants-chercheurs en vue de leur inscription sur les listes d''aptitude aux grades de maître-assistant, de maître de conférences et de professeur titulaire. Certaines disciplines relèvent également de concours d''agrégation.


    L''évaluation repose sur un dossier comprenant, entre autres, les travaux scientifiques et les activités d''enseignement. Il est donc utile de conserver dès le doctorat les preuves de chaque publication et communication.


    Les critères variant selon les spécialités, il convient de se référer aux textes officiels en vigueur.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
