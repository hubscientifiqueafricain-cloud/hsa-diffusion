texte: 'Combien de fois as-tu découvert un prix, un concours ou un financement… le lendemain de la date limite ? 😩


  Les financements et les prix pour jeunes chercheurs existent. C''est même l''une des 10 façons de gagner de l''argent avec ta recherche. Le problème, c''est qu''ils sont éparpillés partout, et qu''on les découvre trop tard.


  Avec le Pass Valorisation, HSA fait la veille pour toi. Chaque semaine, tu reçois une sélection de financements, prix, concours et opportunités pour les chercheurs africains.


  Tu n''as plus qu''à choisir ceux qui te correspondent, et à préparer ton dossier à temps.


  Le Pass coûte 2 000 FCFA pour toute l''année. Il ne garantit pas que tu gagneras un prix : ça dépend de ton dossier. Mais il t''aide à ne plus rater ta chance.


  👉 Rejoins le Pass sur hubscientifiqueafricain.com. Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Les financements, prix et concours destinés aux jeunes chercheurs sont nombreux mais dispersés, et souvent repérés trop tard.


    Le Pass Valorisation du Hub Scientifique Africain inclut une veille hebdomadaire de ces opportunités. Il ne garantit pas leur obtention, qui dépend de la qualité des candidatures, mais permet de les identifier à temps. Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
