texte: 'Cher doctorant, chère doctorante, 💛


  Je sais que tu es fatigué. Les nuits courtes, les relectures qui n''en finissent pas, les financements qui ne viennent pas, l''encadreur qui ne répond pas, la famille qui demande « Tu finis quand ? ». Et parfois, cette petite voix qui dit : « À quoi bon ? »


  Je voulais te dire quelques choses.


  Ta fatigue ne veut pas dire que tu n''es pas fait pour ça. Elle veut dire que tu fais quelque chose de difficile.


  Les jours où tu n''avances pas ne sont pas des jours perdus. Réfléchir, douter, lire, ça fait partie du travail.


  Tu n''es pas seul. Des milliers de chercheurs, partout en Afrique, vivent la même chose que toi en ce moment même.


  Ce que tu construis a de la valeur. Pas seulement pour ton diplôme. Pour des gens que tu ne connais pas encore, et qui un jour profiteront de ce que tu as trouvé.


  Alors repose-toi quand il le faut. Demande de l''aide quand tu en as besoin. Et rappelle-toi pourquoi tu as commencé.


  Tu vas y arriver. Et le jour où tu soutiendras, ce ne sera pas la fin. Ce sera le début.


  Avec toute notre admiration,

  L''équipe HSA, le Hub Scientifique Africain


  Si tu connais un doctorant qui a besoin de lire ça aujourd''hui, partage-lui ce post. 🙏🏾'
textes:
  linkedin: 'Une pensée pour les doctorantes et doctorants qui traversent une période difficile.


    La fatigue, les relectures sans fin, les financements incertains, les attentes de l''entourage et le doute font partie de nombreux parcours doctoraux.


    Quelques rappels :

    • la difficulté ne signifie pas l''inaptitude ;

    • les périodes sans avancée visible font partie du travail de recherche ;

    • ces difficultés sont largement partagées ;

    • le travail accompli a une valeur qui dépasse le diplôme.


    Se reposer, demander de l''aide et se souvenir de ses motivations initiales sont des leviers essentiels.


    Le jour de la soutenance ne sera pas une fin, mais un commencement.


    L''équipe du Hub Scientifique Africain (HSA)

    #Doctorat #SantéMentale #Recherche'
