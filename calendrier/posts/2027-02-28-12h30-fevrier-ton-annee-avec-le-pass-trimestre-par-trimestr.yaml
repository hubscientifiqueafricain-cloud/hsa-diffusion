texte: 'Et si tu voyais ton année avec le Pass Valorisation ? 🗓️ Voici un plan possible, trimestre par trimestre.


  1️⃣ MOIS 1 À 3 : CHOISIR ET APPRENDRE

  Tu fais la Boussole, tu choisis ta façon, et tu suis le programme certifiant. Tu crées ton profil.


  2️⃣ MOIS 4 À 6 : CONSTRUIRE TON OFFRE

  Tu rédiges ton offre d''une page, tu la testes dans le groupe d''entraide, tu prépares ton modèle de devis.


  3️⃣ MOIS 7 À 9 : PROPOSER

  Tu contactes tes premiers clients potentiels, tu postules aux prix et financements repérés dans la veille.


  4️⃣ MOIS 10 À 12 : AJUSTER

  Tu fais le bilan : ce qui a marché, ce qui reste à changer. Et tu prépares l''année suivante.


  C''est un exemple, pas une promesse : chacun avance à son rythme, à côté de sa thèse. Le Pass ne fait pas le travail à ta place et ne garantit ni emploi ni revenu. Il te donne la méthode, les opportunités et l''entourage pour avancer.


  👉 Enregistre ce plan, et rejoins le Pass sur hubscientifiqueafricain.com. Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Exemple de parcours annuel avec le Pass Valorisation : choix de la voie et formation (mois 1 à 3), construction et test de l''offre (mois 4 à 6), prospection et candidatures (mois 7 à 9), bilan et ajustements (mois 10 à 12).


    Ce calendrier est indicatif ; chaque chercheur avance à son rythme. Le Pass ne se substitue pas au travail du chercheur et ne garantit ni emploi ni revenu ; il fournit une méthode, un accès aux opportunités et un environnement d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
