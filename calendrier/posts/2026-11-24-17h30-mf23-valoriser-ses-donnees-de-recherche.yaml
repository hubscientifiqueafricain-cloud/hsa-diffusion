texte: "Tes questionnaires, tes mesures, tes cartes : ces données ont souvent plus de valeur que tu ne le penses.\n\nDans cette micro-formation :\n▶ 3 façons de valoriser tes données\n   • Les publier dans un entrepôt\n   • En faire une carte ou un tableau de bord\n   • Les réutiliser pour des études\n▶ Avant de partager\n   • Anonymise\n   • Vérifie tes droits\n\nÀ retenir : Des données bien rangées, documentées et partagées travaillent pour toi bien après ta soutenance.\n\n\U0001F4AC Tu as une question sur la valorisation de ta recherche ? Pose-la en commentaire : on y répondra dans une prochaine vidéo.\n\U0001F514 Abonne-toi pour ne rien manquer de la série « Valoriser ta recherche · 1 question, 2 minutes ».\n\n\U0001F310 HSA, le Hub Scientifique Africain : https://www.hubscientifiqueafricain.com\n\n#ValorisationDeLaRecherche #Doctorat #RechercheAfricaine"
