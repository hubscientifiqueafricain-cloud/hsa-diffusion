texte: 'Tu as publié un article. Bravo ! 🎉 Mais combien de personnes peuvent vraiment le lire ?

  Si ton article est derrière un abonnement payant, la réponse est souvent : très peu. Surtout en Afrique, où beaucoup d''universités n''ont pas les moyens de payer ces abonnements.


  L''accès ouvert (open access), c''est publier ou déposer tes travaux de façon à ce que tout le monde puisse les lire gratuitement. Résultat : plus de lecteurs, plus de citations, plus de visibilité.


  Comment faire ? 3 possibilités :


  1️⃣ PUBLIER DANS UNE REVUE EN ACCÈS OUVERT. Vérifie qu''elle est sérieuse : elle doit être référencée dans le DOAJ (Directory of Open Access Journals), avoir un vrai comité de lecture, et des frais clairs (beaucoup de revues sérieuses sont même gratuites pour l''auteur).


  2️⃣ DÉPOSER DANS UNE ARCHIVE OUVERTE. Même si ton article est publié dans une revue payante, tu peux souvent déposer une version (souvent la version acceptée) dans une archive : HAL, Zenodo, le dépôt de ton université, ou AfricArXiv pour la recherche africaine. Vérifie la politique de la revue.


  3️⃣ METTRE TON MÉMOIRE OU TA THÈSE EN LIGNE, avec l''accord de ton université. Il devient trouvable et citable.


  ⚠️ Attention aux revues prédatrices : elles t''écrivent par e-mail, promettent une publication en quelques jours contre paiement, sans vraie évaluation. Publier chez elles abîme ta réputation.


  Le carrousel te donne la checklist pour reconnaître une revue sérieuse. 👆 Enregistre-le.


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Un article accessible uniquement sur abonnement touche un lectorat limité, en particulier dans les institutions africaines.


    L''accès ouvert permet une lecture gratuite par tous, et améliore la visibilité et la citation des travaux. Trois possibilités :


    1. Publier dans une revue en accès ouvert reconnue, référencée dans le DOAJ, dotée d''un comité de lecture et de frais transparents.

    2. Déposer une version de l''article dans une archive ouverte (HAL, Zenodo, dépôt institutionnel, AfricArXiv), en respectant la politique de l''éditeur.

    3. Mettre en ligne son mémoire ou sa thèse, avec l''accord de l''établissement.


    Vigilance sur les revues prédatrices : sollicitations par e-mail, délais de publication très courts, frais élevés et absence d''évaluation réelle.


    Le carrousel propose une liste de contrôle pour identifier une revue sérieuse.


    Hub Scientifique Africain (HSA)

    #OpenAccess #ScienceOuverte #Publication'
