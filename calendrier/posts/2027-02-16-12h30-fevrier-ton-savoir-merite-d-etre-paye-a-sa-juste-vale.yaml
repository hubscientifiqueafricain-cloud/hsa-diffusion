texte: '💰 Série « Gagner de l''argent avec ta recherche »


  Des années d''études. Des nuits à lire, à analyser, à écrire. Des terrains sous le soleil ou sous la pluie. 📚 Et au bout, souvent, la même phrase : « Tu ne peux pas faire ça gratuitement, pour nous aider ? »


  On veut te dire une chose : ton savoir a de la valeur.


  Quand une ONG te demande une enquête, elle paie un chauffeur, un loyer, du matériel. Pourquoi ne paierait-elle pas l''expertise qui donne du sens à tout le reste ?


  Quand une entreprise utilise ton analyse pour décider, elle gagne du temps et de l''argent. Pourquoi ne t''en reviendrait-il rien ?


  Faire payer ton expertise, ce n''est pas de la cupidité. C''est :

  🔹 reconnaître le travail que tu as fourni ;

  🔹 te permettre de continuer à chercher ;

  🔹 montrer aux plus jeunes que la recherche est un vrai métier ;

  🔹 et faire en sorte que la science africaine soit financée par ceux qui en profitent.


  Rends service, oui. Sois généreux, parfois. Mais n''oublie jamais ce que ton savoir vaut.


  Regarde la vidéo, et partage-la à un chercheur qui travaille trop souvent gratuitement. 🎬


  HSA, le Hub Scientifique Africain.


  📘 Tu veux les 10 façons dans un seul document ? Le guide HSA est gratuit. Et pour avancer toute l''année, il y a le Pass Valorisation à 2 000 FCFA. Liens en commentaire.'
textes:
  linkedin: 'Les jeunes chercheurs sont fréquemment sollicités pour des travaux non rémunérés, alors même que leur expertise contribue directement aux décisions et aux résultats des organisations qui les sollicitent.


    Rémunérer l''expertise scientifique, c''est reconnaître le travail fourni, permettre la poursuite de la recherche, affirmer la recherche comme métier et associer au financement de la science ceux qui en bénéficient. La générosité reste compatible avec la juste valorisation de son savoir.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
