texte: '🎓 Série « Carrière de chercheur »


  « Cher Docteur, nous avons lu votre excellent travail et serions honorés de le publier sous 7 jours. » 📧 Tu as déjà reçu ce genre d''e-mail ? Attention.


  Les revues prédatrices sont des revues qui font payer la publication sans faire un vrai travail d''évaluation. Publier chez elles peut abîmer ton dossier, car ces articles sont souvent peu ou pas reconnus.


  Voici 7 signes qui doivent t''alerter :


  🚩 Elle te sollicite par e-mail, avec beaucoup de compliments.

  🚩 Elle promet une acceptation ou une publication très rapide.

  🚩 Elle couvre des sujets très larges, sans lien entre eux.

  🚩 Les frais de publication ne sont annoncés qu''après acceptation.

  🚩 Le comité de rédaction est introuvable ou invérifiable.

  🚩 Elle affiche des indicateurs d''impact que tu ne retrouves nulle part.

  🚩 Le site contient beaucoup de fautes et peu d''informations claires.


  ✅ Le réflexe : vérifie si la revue est indexée dans des bases reconnues, et demande l''avis de ton encadreur avant toute soumission.


  Le carrousel reprend les 7 signes. 👆 Partage-le à un collègue qui vient de recevoir « une invitation ».


  HSA, le Hub Scientifique Africain.


  🎯 Pour construire ta carrière sans avancer seul : le Pass Valorisation HSA te donne une méthode certifiante (avec attestation pour ton CV), les opportunités chaque semaine et un groupe d''entraide. 2 000 FCFA pour toute l''année. Lien en commentaire.'
textes:
  linkedin: 'Les revues dites prédatrices facturent la publication sans assurer une évaluation scientifique rigoureuse. Une publication dans ce type de revue peut affaiblir un dossier de carrière.


    Plusieurs signes doivent alerter : une sollicitation spontanée et flatteuse par e-mail, une promesse de publication très rapide, un périmètre thématique très large, des frais annoncés tardivement, un comité de rédaction invérifiable, des indicateurs d''impact introuvables ailleurs, et un site peu professionnel.


    Avant toute soumission, il est recommandé de vérifier l''indexation de la revue dans des bases reconnues et de solliciter l''avis de son encadreur.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
