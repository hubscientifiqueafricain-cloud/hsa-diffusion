texte: '💰 Série « Gagner de l''argent avec ta recherche »


  Un client est intéressé et te demande un devis. 🧾 Bravo ! Maintenant, il faut un document clair, qui évite les malentendus. Voici ce qu''il doit contenir :


  📌 TES COORDONNÉES ET CELLES DU CLIENT

  Noms, contacts, date du devis.


  📌 L''OBJET

  Ce que tu vas faire, en une phrase.


  📌 LE DÉTAIL DES PRESTATIONS

  Chaque étape, avec ce qu''elle comprend. Par exemple : élaboration du questionnaire, collecte, analyse, rapport.


  📌 LES LIVRABLES

  Ce que le client recevra, et sous quelle forme.


  📌 LE DÉLAI

  Les dates de début et de fin, ou la durée.


  📌 LE PRIX

  Le montant total, et éventuellement le détail par étape.


  📌 LES CONDITIONS DE PAIEMENT

  Par exemple, une partie au début et le reste à la livraison. Le mode de paiement.


  📌 LA DURÉE DE VALIDITÉ

  « Devis valable 30 jours. »


  💡 Le devis protège les deux parties. Si le client demande plus que ce qui est prévu, tu peux t''y référer calmement et proposer un complément.


  La vidéo résume la checklist. 🎬


  HSA, le Hub Scientifique Africain.


  📘 Tu veux les 10 façons dans un seul document ? Le guide HSA est gratuit. Et pour avancer toute l''année, il y a le Pass Valorisation à 2 000 FCFA. Liens en commentaire.'
textes:
  linkedin: 'Un devis clair prévient les malentendus et protège les deux parties. Il précise : les coordonnées des parties, l''objet de la prestation, le détail des étapes, les livrables, le délai, le prix, les conditions et modalités de paiement, et la durée de validité.


    En cas de demande supplémentaire du client, le devis sert de référence pour proposer un complément.


    Pour accompagner cette démarche, le Hub Scientifique Africain propose un guide gratuit, « 10 façons de gagner de l''argent avec sa recherche », et le Pass Valorisation (2 000 FCFA par an) : programme certifiant, veille hebdomadaire des opportunités, profil de chercheur visible et groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
