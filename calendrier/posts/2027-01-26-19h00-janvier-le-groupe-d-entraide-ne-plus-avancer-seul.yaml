texte: 'Ton résumé de communication, qui le relit avant l''envoi ? 🤔 Ta présentation, devant qui la répètes-tu ? Ta question sur une revue, à qui la poses-tu ?


  Beaucoup de jeunes chercheurs avancent seuls. L''encadreur est occupé, les collègues sont loin, et on n''ose pas demander.


  Avec le Pass Valorisation du Hub Scientifique Africain (HSA), tu rejoins le groupe d''entraide des membres. Des masterants, des doctorants et des jeunes chercheurs, de plusieurs disciplines et plusieurs pays, qui avancent comme toi.


  Tu peux y :

  💬 poser tes questions ;

  📝 demander un avis sur un texte ;

  📢 partager une opportunité ou une bonne nouvelle ;

  🤝 rencontrer de futurs collaborateurs.


  Et chaque mois, un live avec l''équipe HSA pour poser tes questions directement.


  On a dit ce mois-ci que le réseau se construit en donnant d''abord. Le groupe, c''est l''endroit idéal pour le faire.


  Le Pass, c''est 2 000 FCFA pour toute l''année. 🎬 Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'L''isolement est une difficulté fréquente des parcours de recherche : encadrants très sollicités, collègues éloignés, réticence à demander de l''aide.


    Le Pass Valorisation du Hub Scientifique Africain donne accès à un groupe d''entraide réunissant masterants, doctorants et jeunes chercheurs de plusieurs disciplines et pays. Les membres peuvent y échanger des conseils, solliciter des avis, partager des opportunités et nouer des collaborations. Des sessions mensuelles en direct avec l''équipe complètent ce dispositif.


    Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
