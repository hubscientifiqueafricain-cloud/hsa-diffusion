texte: 'Quand un rapport international parle de l''agriculture, de la santé ou de l''économie de ton pays, d''où viennent les données ? 🌍

  Très souvent, d''études menées par des équipes extérieures. Pendant ce temps, des chercheurs d''ici ont collecté des données sur les mêmes sujets, mais elles ne sont ni visibles, ni citées, ni utilisées.


  Résultat :

  ❌ des décisions prises sur la base d''informations incomplètes ;

  ❌ une image de l''Afrique racontée par d''autres ;

  ❌ des chercheurs africains invisibles dans leur propre pays.


  Ce n''est pas une fatalité. C''est un problème de visibilité et de valorisation.


  Quand les chercheurs africains rendent leurs travaux accessibles, les publient en accès ouvert, les présentent aux décideurs, les partagent sur des plateformes africaines :

  ✅ les décideurs disposent de données locales ;

  ✅ les journalistes ont des experts d''ici à interroger ;

  ✅ les étudiants trouvent des références sur leur propre contexte ;

  ✅ l''Afrique raconte sa propre histoire, avec ses propres chiffres.


  Chaque mémoire mis en ligne, chaque résultat partagé, chaque note envoyée à un décideur, c''est une pierre de plus.


  Ton travail fait partie de cette histoire. Ne le laisse pas invisible.


  Si tu es d''accord, partage cette vidéo. 🔁


  On est HSA, le Hub Scientifique Africain. C''est précisément pour ça qu''on existe.'
textes:
  linkedin: 'Les analyses internationales sur l''agriculture, la santé ou l''économie africaines s''appuient souvent sur des données produites par des équipes extérieures, alors que des chercheurs locaux ont travaillé sur les mêmes questions.


    Faute de visibilité, ces travaux sont peu cités et peu utilisés. Les décisions reposent sur des informations incomplètes, et la représentation du continent est façonnée ailleurs.


    Rendre la recherche africaine accessible (accès ouvert, plateformes, notes aux décideurs) permet aux décideurs de disposer de données locales, aux médias d''interroger des experts du continent, et aux étudiants de trouver des références sur leur propre contexte.


    Chaque travail rendu visible contribue à ce que l''Afrique raconte sa propre histoire, avec ses propres données. C''est la raison d''être du Hub Scientifique Africain.


    #RechercheAfricaine #ScienceOuverte #Données'
