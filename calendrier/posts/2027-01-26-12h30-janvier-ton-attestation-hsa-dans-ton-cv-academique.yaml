texte: 'Dans le post sur le CV académique, on t''a parlé d''une rubrique que beaucoup oublient : « Formations et certifications ». 📜 Voici comment la remplir avec le programme certifiant du Pass Valorisation.


  🎓 LE PROGRAMME

  « Initiation à la valorisation », proposé par le Hub Scientifique Africain (HSA) : 5 modules en ligne, à suivre à ton rythme. À la fin, tu reçois une attestation HSA.


  📄 COMMENT L''ÉCRIRE DANS TON CV

  Rubrique « Formations et certifications » :

  « 2027 · Initiation à la valorisation de la recherche, programme certifiant en ligne, Hub Scientifique Africain (HSA). »


  💼 COMMENT EN PARLER EN ENTRETIEN

  Ne dis pas seulement « j''ai une attestation ». Dis ce que tu en as fait :

  « J''ai appliqué la méthode à ma thèse : j''ai identifié à qui mes résultats pouvaient servir, et j''ai rédigé un résumé grand public. »


  C''est la combinaison qui fait la différence : une attestation, plus une action concrète.


  Le programme est inclus dans le Pass Valorisation, à 2 000 FCFA pour toute l''année.


  Le carrousel détaille tout. 👆 Lien en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le programme certifiant « Initiation à la valorisation » du Hub Scientifique Africain comprend cinq modules en ligne et donne lieu à une attestation.


    Dans un CV académique, il peut figurer dans la rubrique « Formations et certifications ». En entretien, il gagne à être présenté avec une application concrète : identification des bénéficiaires potentiels de ses travaux, rédaction d''un résumé accessible, ou toute autre action de valorisation.


    Le programme est inclus dans le Pass Valorisation, au tarif de 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
