texte: 'Avant de t''inscrire au Pass Valorisation, tu as sûrement des questions. Voici les réponses, franchement. 💬


  ❓ C''est combien, exactement ?

  2 000 FCFA pour toute l''année. Pas d''abonnement caché, pas de frais en plus. Ça fait moins de 6 FCFA par jour.


  ❓ Comment je paie ?

  Par mobile money. Tu reçois un reçu officiel par e-mail.


  ❓ C''est une arnaque ?

  Bonne question à te poser sur Internet ! 😉 HSA est une plateforme que tu peux consulter avant de payer : hubscientifiqueafricain.com. Tu peux aussi commencer gratuitement (profil, Boussole) pour voir comment on travaille.


  ❓ Je n''ai pas encore soutenu. C''est pour moi ?

  Oui. On l''a vu dans cette série : la valorisation se prépare dès le choix du sujet. Plus tu commences tôt, plus tu gagnes de temps.


  ❓ J''ai soutenu il y a longtemps. C''est trop tard ?

  Non. Si le problème que tu as étudié existe encore, ton travail peut encore servir.


  ❓ Je suis en droit, en lettres ou en sciences sociales. C''est pour moi ?

  Oui. Toutes les disciplines se valorisent : expertise, formation, conseil, politiques publiques, culture.


  ❓ Je n''ai pas le temps.

  Le programme se suit en ligne, à ton rythme, pendant 12 mois. Quelques minutes par semaine suffisent pour avancer et suivre les opportunités.


  ❓ Qu''est-ce que je reçois concrètement ?

  Le programme certifiant en 5 modules avec attestation, le guide « 10 façons de gagner de l''argent avec ton mémoire ou ta thèse », ton profil visible, les opportunités chaque semaine, le groupe d''entraide et les lives mensuels.


  Une autre question ? Pose-la en commentaire, on te répond. 👇 Le lien pour t''inscrire est en commentaire.


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Questions fréquentes sur le Pass Valorisation HSA.


    Tarif : 2 000 FCFA par an, sans frais supplémentaires.

    Paiement : par mobile money, avec reçu officiel par e-mail.

    Fiabilité : la plateforme est consultable avant tout paiement, et une inscription gratuite permet de découvrir les services.

    Avant la soutenance : oui, la valorisation se prépare dès le choix du sujet.

    Longtemps après la soutenance : oui, tant que le problème étudié demeure.

    Sciences humaines et sociales : oui, toutes les disciplines sont concernées.

    Disponibilité : le programme se suit en ligne, à son rythme, pendant douze mois.

    Contenu : programme certifiant en cinq modules, guide des dix voies de revenus, profil visible, veille hebdomadaire des opportunités, groupe d''entraide et sessions mensuelles.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
