texte: '🎓 Série « Carrière de chercheur »


  Bourses, postdoc, postes, programmes internationaux : beaucoup de candidatures demandent une ou plusieurs lettres de recommandation. ✉️ Et beaucoup de candidats les demandent mal. Trop tard, sans informations, sans relance.


  Voici la bonne méthode :


  1️⃣ CHOISIS LA BONNE PERSONNE

  Quelqu''un qui te connaît vraiment et qui a vu ton travail : encadreur, responsable de stage, chercheur avec qui tu as collaboré.


  2️⃣ DEMANDE TÔT

  Au moins trois semaines avant la date limite. Ces personnes sont très occupées.


  3️⃣ FACILITE-LUI LA TÂCHE

  Envoie dans un seul message : l''offre, la date limite, ton CV à jour, et 3 ou 4 points que tu aimerais qu''elle souligne.


  4️⃣ RELANCE POLIMENT

  Une semaine avant la date limite : « Je me permets de vous rappeler… »


  5️⃣ REMERCIE ET DONNE DES NOUVELLES

  Qu''importe le résultat. C''est ce qui donne envie de t''aider la prochaine fois.


  💡 Ces lettres ne s''improvisent pas : elles se méritent sur des mois de travail sérieux et de relations de confiance.


  La vidéo résume la méthode. 🎬


  HSA, le Hub Scientifique Africain.


  📈 Valoriser ta recherche et construire ta carrière, c''est le même chemin. Le Pass Valorisation HSA t''accompagne toute l''année, pour 2 000 FCFA : profil visible, opportunités, attestation et entraide. Lien en commentaire.'
textes:
  linkedin: 'Les lettres de recommandation sont exigées dans de nombreuses candidatures académiques : bourses, postdoctorats, postes, programmes internationaux.


    Quelques bonnes pratiques : solliciter une personne qui connaît réellement le travail du candidat ; formuler la demande au moins trois semaines avant l''échéance ; fournir dans un même message l''offre, la date limite, un CV à jour et les points à souligner ; relancer courtoisement ; remercier et informer du résultat.


    Ces recommandations reposent avant tout sur une relation de confiance construite dans la durée.


    Pour accompagner cette démarche, le Pass Valorisation du Hub Scientifique Africain (2 000 FCFA par an) propose un programme certifiant, une veille hebdomadaire des opportunités, un profil de chercheur visible et un groupe d''entraide.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
