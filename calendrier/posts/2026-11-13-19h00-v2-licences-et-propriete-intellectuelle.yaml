texte: 'Tu as inventé quelque chose, mais tu n''as ni l''envie ni les moyens de créer une entreprise pour le produire ? 🤔

  Il existe une solution que beaucoup de chercheurs ignorent : la licence.


  LA LICENCE, C''EST QUOI ?

  C''est un contrat par lequel tu (ou ton université) autorises une entreprise à utiliser ton invention, en échange d''une rémunération. Tu ne vends pas ton invention : tu loues le droit de l''utiliser.


  COMMENT ON EST PAYÉ ?

  Souvent par une somme à la signature, puis des redevances : un pourcentage sur chaque produit vendu. Les montants se négocient au cas par cas.


  QUE PEUT-ON LICENCIER ?

  🔹 Une invention brevetée (procédé, formulation, dispositif).

  🔹 Un logiciel.

  🔹 Un savoir-faire, un protocole, une base de données.

  🔹 Une variété végétale, une marque.


  LES ÉTAPES :

  1️⃣ Protège ton résultat (brevet, droit d''auteur…) avec l''aide de ton université.

  2️⃣ Identifie les entreprises qui pourraient l''exploiter.

  3️⃣ Présente-leur ce que ton invention fait, sans dévoiler le « comment » avant un accord de confidentialité.

  4️⃣ Négocie le contrat avec un accompagnement : durée, territoire, exclusivité, rémunération.


  Point important : si ton invention a été faite dans le cadre de ton université, elle en est souvent copropriétaire. Renseigne-toi sur le règlement de ton établissement avant toute démarche.


  Le carrousel résume tout. 👆 Enregistre-le.


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'La licence est un mode de valorisation adapté aux chercheurs qui ne souhaitent pas créer d''entreprise.


    Il s''agit d''un contrat par lequel le titulaire des droits (chercheur ou établissement) autorise une entreprise à exploiter une invention en contrepartie d''une rémunération, généralement composée d''un versement initial et de redevances sur les ventes.


    Peuvent faire l''objet d''une licence : inventions brevetées, logiciels, savoir-faire, protocoles, bases de données, variétés végétales, marques.


    Étapes :

    1. Protéger le résultat avec l''appui de l''établissement.

    2. Identifier les entreprises susceptibles de l''exploiter.

    3. Présenter l''invention sous accord de confidentialité.

    4. Négocier le contrat (durée, territoire, exclusivité, rémunération) avec un accompagnement.


    Les résultats obtenus dans le cadre d''un établissement relèvent souvent de sa copropriété : il convient de consulter son règlement en amont.


    Hub Scientifique Africain (HSA)

    #ProprieteIntellectuelle #Licence #TransfertDeTechnologie'
