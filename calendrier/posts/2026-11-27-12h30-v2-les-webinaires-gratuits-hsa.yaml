texte: 'Apprendre la valorisation, gratuitement, depuis ton téléphone, avec d''autres chercheurs africains ? 🎙️ C''est le principe des webinaires HSA.


  C''EST QUOI ?

  Des sessions en ligne, en direct, animées par l''équipe HSA et des intervenants, sur la valorisation des résultats de la recherche en Afrique. Le dernier en date, le Webinaire HSA #02, portait sur « Valorisation des résultats de la recherche en Afrique : stratégies et opportunités ».


  POURQUOI Y PARTICIPER ?

  ✅ Tu apprends des méthodes concrètes, directement applicables à ta recherche.

  ✅ Tu poses tes questions en direct.

  ✅ Tu rencontres d''autres masterants, doctorants et jeunes chercheurs du continent.

  ✅ Tu découvres des opportunités et des programmes.

  ✅ C''est gratuit.


  COMMENT S''INSCRIRE ?

  Les prochains webinaires sont annoncés dans la rubrique Événements de la plateforme HSA et sur cette page. Il suffit de cliquer sur l''événement et de t''inscrire. Tu reçois ensuite le lien de connexion.


  Le conseil : viens avec une question précise sur ta propre recherche. C''est là que tu en tireras le plus. 💡


  Regarde la vidéo. Puis commente WEBINAIRE : on te prévient dès que le prochain est annoncé. 👇


  On est HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le Hub Scientifique Africain organise des webinaires gratuits consacrés à la valorisation des résultats de la recherche en Afrique. Le Webinaire HSA #02 portait sur les stratégies et opportunités de valorisation.


    Ces sessions en direct permettent d''acquérir des méthodes applicables, de poser des questions, d''échanger avec des chercheurs du continent et de découvrir des opportunités.


    Les prochaines dates sont publiées dans la rubrique Événements de la plateforme. L''inscription se fait en ligne, et le lien de connexion est adressé aux participants.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
