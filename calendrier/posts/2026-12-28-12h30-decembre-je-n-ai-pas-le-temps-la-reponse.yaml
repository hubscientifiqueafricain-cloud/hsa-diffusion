texte: '« Le Pass a l''air bien, mais je n''ai pas le temps. » ⏳


  On comprend. Entre le mémoire ou la thèse, les cours, le travail, la famille, les déplacements, les coupures d''électricité… les journées sont pleines.


  Mais regardons de près ce que le Pass te demande vraiment :


  🎓 Le programme certifiant est en ligne, à ton rythme. Pas d''horaire fixe. Tu as 12 mois pour le suivre.

  📬 Les opportunités arrivent chaque semaine. Les parcourir prend quelques minutes, et ça t''évite des heures de recherche sur Internet.

  🤝 Le groupe d''entraide, tu y vas quand tu veux.

  🎥 Le live mensuel, c''est une fois par mois.


  En réalité, le Pass ne te prend pas de temps : il t''en fait gagner. Au lieu de chercher seul les bonnes infos, les bonnes méthodes, les bonnes opportunités, tu les reçois.


  Et puis, posons la vraie question : si tu n''as jamais le temps de t''occuper de ta recherche après l''avoir terminée, qui va le faire à ta place ?


  Quelques minutes par semaine. C''est tout ce qu''il faut pour commencer.


  La vidéo en 35 secondes. 🎬 Le lien pour t''inscrire (2 000 FCFA pour l''année) est en commentaire.


  HSA, le Hub Scientifique Africain.'
textes:
  linkedin: 'Le manque de temps est l''une des principales objections à l''engagement dans une démarche de valorisation.


    Le Pass Valorisation du Hub Scientifique Africain a été conçu en tenant compte de cette contrainte :

    • le programme certifiant se suit en ligne, sans horaire imposé, sur douze mois ;

    • la veille hebdomadaire des opportunités se consulte en quelques minutes et évite des recherches dispersées ;

    • le groupe d''entraide est accessible librement ;

    • les sessions en direct ont lieu une fois par mois.


    L''objectif est de réduire le temps consacré à la recherche d''informations et de méthodes, plutôt que d''ajouter une charge. Quelques minutes par semaine suffisent pour engager la démarche.


    Tarif : 2 000 FCFA par an.


    Hub Scientifique Africain (HSA) · hubscientifiqueafricain.com'
