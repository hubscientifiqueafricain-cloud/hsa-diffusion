<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSA · Poste de publication</title>
<style>
:root{--fond:#f6f5f2;--carte:#fff;--texte:#1d1d1b;--doux:#6b6a66;--bord:#e3e1dc;--accent:#0b6e4f;--accent-doux:#e3f2ec;--alerte:#9a6700}
@media (prefers-color-scheme:dark){:root{--fond:#151514;--carte:#1f1f1d;--texte:#ecebe7;--doux:#a3a29d;--bord:#34332f;--accent:#4cc596;--accent-doux:#1d3a2f;--alerte:#e0b44a}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fond);color:var(--texte)}
header{position:sticky;top:0;z-index:5;background:var(--carte);border-bottom:1px solid var(--bord);padding:10px 16px}
h1{font-size:17px;margin:0 0 8px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.filtres select,.filtres input{font:inherit;border:1px solid var(--bord);background:var(--carte);color:var(--texte);border-radius:999px;padding:6px 12px}
nav button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.filtres{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.filtres input{flex:1;min-width:140px}
.filtres select{max-width:100%;min-width:0;flex:1 1 140px}
main{max-width:860px;margin:0 auto;padding:12px 16px 80px}
.jour{margin:22px 0 8px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.jour small{font-weight:400;color:var(--doux)}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:12px;margin:10px 0;overflow:hidden}
.haut{display:flex;gap:12px;padding:12px}
.vignette{width:92px;height:115px;flex:none;border-radius:8px;object-fit:cover;background:var(--bord)}
.meta{font-size:13px;color:var(--doux)}
.titre{font-weight:650;margin:2px 0 4px}
.puce{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-doux);color:var(--accent);margin-right:4px}
.deja{color:var(--alerte);font-size:13px}
details{border-top:1px solid var(--bord)}
summary{cursor:pointer;padding:10px 12px;font-size:14px}
.medias{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px}
.medias a img,.medias a .vid{width:64px;height:80px;object-fit:cover;border-radius:6px;display:block;background:var(--bord)}
.medias .vid{display:flex;align-items:center;justify-content:center;font-size:22px}
.reseau{border-top:1px solid var(--bord);padding:10px 12px}
.reseau-tete{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.reseau-tete b{min-width:84px}
.btn{font:inherit;font-size:13px;border:1px solid var(--bord);background:var(--fond);color:var(--texte);border-radius:8px;padding:5px 10px;cursor:pointer}
.btn.principal{background:var(--accent);border-color:var(--accent);color:#fff}
label.fait{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px}
.carte.toutfait{opacity:.55}
pre{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--fond);border-radius:8px;padding:10px;margin:8px 0 0;max-height:260px;overflow:auto}
.vide{color:var(--doux);text-align:center;padding:40px 0}
.plus{display:block;margin:16px auto;font:inherit}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--texte);color:var(--fond);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
</style>
</head>
<body>
<header>
  <h1>Hub Scientifique Africain · poste de publication</h1>
  <nav>
    <button data-vue="jour" aria-pressed="true">Aujourd'hui</button>
    <button data-vue="calendrier" aria-pressed="false">Calendrier</button>
    <button data-vue="bibliotheque" aria-pressed="false">Bibliothèque</button>
  </nav>
  <div class="filtres">
    <select id="f-reseau"><option value="">Tous les réseaux</option></select>
    <select id="f-source"><option value="">Toutes les séries</option></select>
    <input id="f-texte" type="search" placeholder="Rechercher…">
  </div>
</header>
<main id="contenu"><p class="vide">Chargement…</p></main>
<div id="toast"></div>
<script>
const NOMS={facebook:"Facebook",instagram:"Instagram",linkedin:"LinkedIn",tiktok:"TikTok",youtube:"YouTube",whatsapp:"WhatsApp",x:"X",telegram:"Telegram",threads:"Threads"};
const CONSEILS={instagram:"Carrousel ou Reel, lien dans la bio",tiktok:"Mode photo pour un carrousel, vidéo sinon",youtube:"En Short pour les vidéos",linkedin:"Carrousel : ajoutez les images. PDF : bouton « Ajouter un document »",whatsapp:"Chaîne ou statut : bouton Partager depuis le téléphone"};
let POSTS=[],vue="jour",limite=40;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lire=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const ecrire=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};
const fait=(p,r)=>!!lire("fait:"+p.id+":"+r)||!!(p.resultats[r]&&p.resultats[r].statut==="publie");
function toast(t){const e=$("#toast");e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1800)}
async function copier(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}toast("Texte copié")}
const url=m=>m.startsWith("http")?m:m;
const auj=()=>{const d=new Date();return d.toISOString().slice(0,10)};
function dateLisible(q){const d=new Date(q.slice(0,10)+"T12:00:00");return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
async function partager(p,r){
  const texte=p.textes[r]||"";
  try{
    const fichiers=[];
    for(const m of p.media.slice(0,10)){const b=await (await fetch(url(m))).blob();fichiers.push(new File([b],m.split("/").pop().split("?")[0],{type:b.type}))}
    if(navigator.canShare&&navigator.canShare({files:fichiers})){await copier(texte);await navigator.share({files:fichiers,text:texte});return}
  }catch(e){if(e.name==="AbortError")return}
  if(navigator.share){try{await navigator.share({text:texte});return}catch(e){return}}
  copier(texte);toast("Texte copié : téléchargez les visuels puis collez le texte")
}
function toutTelecharger(p){p.media.forEach((m,i)=>setTimeout(()=>{const a=document.createElement("a");a.href=url(m);a.download=m.split("/").pop().split("?")[0];a.target="_blank";document.body.appendChild(a);a.click();a.remove()},i*400))}
function carte(p){
  const rf=$("#f-reseau").value;
  const reseaux=Object.keys(p.textes).filter(r=>!rf||r===rf);
  const tout=reseaux.length&&reseaux.every(r=>fait(p,r));
  const apercu=p.apercu?`<img class="vignette" loading="lazy" src="${esc(url(p.apercu))}" alt="">`:`<div class="vignette"></div>`;
  const heure=p.quand?p.quand.slice(11,16).replace(":","h"):"";
  const medias=p.media.map(m=>/\.pdf/i.test(m)?`<a href="${esc(url(m))}" download target="_blank"><span class="vid">📄</span></a>`:/\.mp4/i.test(m)?`<a href="${esc(url(m))}" download target="_blank"><span class="vid">▶</span></a>`:`<a href="${esc(url(m))}" download target="_blank"><img loading="lazy" src="${esc(url(m))}" alt=""></a>`).join("");
  const lignes=reseaux.map(r=>`<div class="reseau"><div class="reseau-tete"><b>${NOMS[r]||r}</b>
      <button class="btn principal" data-act="partager" data-id="${p.id}" data-r="${r}">Partager</button>
      <button class="btn" data-act="copier" data-id="${p.id}" data-r="${r}">Copier le texte</button>
      <label class="fait"><input type="checkbox" data-act="fait" data-id="${p.id}" data-r="${r}" ${fait(p,r)?"checked":""}> Publié</label></div>
      ${p.deja[r]?`<div class="deja">⚠ ${esc(p.deja[r])} : vérifiez avant de republier.</div>`:""}
      ${CONSEILS[r]?`<div class="meta">${CONSEILS[r]}</div>`:""}
      <details><summary>Voir le texte ${NOMS[r]||r}</summary><pre>${esc(p.textes[r])}</pre></details></div>`).join("");
  return `<article class="carte ${tout?"toutfait":""}"><div class="haut">${apercu}<div>
    <div class="meta">${heure?`<b>${heure}</b> · `:""}<span class="puce">${esc(p.source)}</span>${esc(p.type)}</div>
    <div class="titre">${esc(p.titre)}</div>
    ${p.details?`<div class="meta">${esc(p.details)}</div>`:""}</div></div>
    ${p.media.length?`<details><summary>Visuels (${p.media.length}) · <a href="#" data-act="tout" data-id="${p.id}">tout télécharger</a></summary><div class="medias">${medias}</div></details>`:""}
    ${p.premier_commentaire?`<div class="reseau"><div class="reseau-tete"><b>1er commentaire</b><button class="btn" data-act="comm" data-id="${p.id}">Copier</button></div><div class="meta">${esc(p.premier_commentaire)}</div></div>`:""}
    ${lignes}</article>`;
}
function filtrer(){
  const rf=$("#f-reseau").value,sf=$("#f-source").value,q=$("#f-texte").value.toLowerCase();
  return POSTS.filter(p=>(vue==="bibliotheque")===(p.rubrique==="bibliotheque"))
    .filter(p=>!rf||p.textes[rf]!==undefined).filter(p=>!sf||p.source===sf)
    .filter(p=>!q||(p.titre+" "+Object.values(p.textes).join(" ")).toLowerCase().includes(q))
    .filter(p=>vue!=="jour"||p.quand.slice(0,10)===auj());
}
function rendu(){
  const liste=filtrer();let html="";
  if(vue==="bibliotheque"){
    html=`<p class="meta">${liste.length} créas prêtes à publier quand vous voulez.</p>`+liste.slice(0,limite).map(carte).join("");
  }else{
    const futurs=vue==="calendrier"?liste.filter(p=>p.quand.slice(0,10)>=auj()):liste;
    const parJour={};futurs.forEach(p=>(parJour[p.quand.slice(0,10)]??=[]).push(p));
    let n=0;
    for(const [j,ps] of Object.entries(parJour).sort()){
      if(n>=limite)break;
      const faits=ps.filter(p=>Object.keys(p.textes).every(r=>fait(p,r))).length;
      html+=`<div class="jour">${dateLisible(j)}<small>${faits}/${ps.length} publiés</small></div>`+ps.sort((a,b)=>a.quand.localeCompare(b.quand)).map(carte).join("");
      n+=ps.length;
    }
    if(!futurs.length)html=`<p class="vide">${vue==="jour"?"Rien de prévu aujourd'hui.":"Aucune publication."}</p>`;
    if(futurs.length>n)html+=`<button class="btn plus" data-act="plus">Afficher la suite</button>`;
  }
  if(vue==="bibliotheque"&&liste.length>limite)html+=`<button class="btn plus" data-act="plus">Afficher la suite</button>`;
  $("#contenu").innerHTML=html||`<p class="vide">Aucun résultat.</p>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.dataset.act==="fait")return;
  const p=POSTS.find(x=>x.id===b.dataset.id);
  if(b.dataset.act==="copier")copier(p.textes[b.dataset.r]);
  if(b.dataset.act==="partager")partager(p,b.dataset.r);
  if(b.dataset.act==="comm")copier(p.premier_commentaire);
  if(b.dataset.act==="tout"){e.preventDefault();toutTelecharger(p)}
  if(b.dataset.act==="plus"){limite+=40;rendu()}
});
document.addEventListener("change",e=>{
  const c=e.target;if(c.dataset.act==="fait"){ecrire("fait:"+c.dataset.id+":"+c.dataset.r,c.checked?"1":"");rendu();return}
  limite=40;rendu();
});
$("#f-texte").addEventListener("input",()=>{limite=40;rendu()});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{vue=b.dataset.vue;limite=40;document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-pressed",x===b));rendu()});
fetch("donnees.json").then(r=>r.json()).then(d=>{
  POSTS=d;
  const rs=[...new Set(d.flatMap(p=>Object.keys(p.textes)))];rs.forEach(r=>$("#f-reseau").insertAdjacentHTML("beforeend",`<option value="${r}">${NOMS[r]||r}</option>`));
  [...new Set(d.map(p=>p.source))].sort().forEach(s=>$("#f-source").insertAdjacentHTML("beforeend",`<option>${esc(s)}</option>`));
  rendu();
}).catch(()=>$("#contenu").innerHTML='<p class="vide">Impossible de charger les données.</p>');
</script>
</body>
</html>
